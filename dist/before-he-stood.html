<script>/* js/engine.js */
/*
 * js/engine.js - pure game logic for "Before He Stood".
 * No DOM access anywhere in this file. Loadable in Node with `globalThis.window = globalThis`.
 *
 * Public API (BHS.engine):
 *   computeLens(routeOrId, choices)      -> { lens, scores: {1,2,3}, c10Lens, mismatch }   (SPEC 5.1)
 *   evalCond(cond, state)                -> boolean                                         (SPEC 4.5)
 *   resolveText(t, lang, state)          -> string, tokens resolved, *emphasis* markers kept
 *   plainText(t, lang, state)            -> string, tokens resolved, emphasis markers removed
 *   resolveSegments(t, lang, state)      -> [{ text, em, kind?, key? }] for renderers
 *   quoteVerse(text)                     -> “text” with inner double quotes turned into ‘ ’
 *   verseText(key, lang) / verseRef(key, lang) / verseSpeaker(key)
 *   createGame(routeId, opts)            -> Game   (routeId may be "prologue")
 *   createSequence(beats, opts)          -> Game   (plays an arbitrary beat list, for tests)
 *   restoreGame(savedState)              -> Game
 *
 * Game (driven by the UI):
 *   game.step                 current blocking step (see STEP KINDS below)
 *   game.view()               { step, now: {hush, echo}, stage, actions, ending, routeId }
 *   game.next()               advance from line / verse / endingTitle / last / final
 *   game.choose(optionId)     answer the current choice
 *   game.press()              answer the current press beat
 *   game.tapAction(actionId)  tap a persistent action (Asher); returns { id, text, count } or null
 *   game.serialize()          JSON-safe snapshot; restore with restoreGame(snapshot)
 *   game.lens()               computeLens on the choices so far
 *   game.fastForward(opts)    debug helper: auto-play until a predicate holds
 *
 * STEP KINDS: line {speaker, text} | verse {key, speaker} | choice {id, prompt, options:[{id,text}]}
 *   | press {action?, label?, hint?} | endingTitle {lens, lensLabel, title} | last {text}
 *   | final {routeId, lens} | routeSelect {} | end {}
 * Choice steps never expose lens tags, so the UI cannot leak them (SPEC 7.2-7.3).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var BHS = (root.BHS = root.BHS || {});

  var LENSES = [1, 2, 3];
  var LIGHT_LEVELS = { off: true, soft: true, bright: true };
  var POVS = { normal: true, lying: true, standing: true };
  var TIMES = { day: true, evening: true, night: true };
  // Speakers that may appear as portraits (never Jesus; the protagonist is excluded per route).
  var PORTRAIT_IDS = { menahem: true, hanan: true, yonah: true, asher: true, mother: true, brother: true, neighbor: true, passerby: true, partners: true, scribes: true };
  var MAX_CAST = 2;
  var STATE_VERSION = 1;

  var warnings = [];

  function warn(msg) {
    if (warnings.length < 200) warnings.push(String(msg));
    if (api.debug && root.console && root.console.warn) root.console.warn("[BHS.engine] " + msg);
  }

  function own(o, k) {
    return o != null && Object.prototype.hasOwnProperty.call(o, k);
  }

  function clone(x) {
    return x == null ? x : JSON.parse(JSON.stringify(x));
  }

  function normLens(v) {
    var n = typeof v === "string" ? parseInt(v, 10) : v;
    return n === 1 || n === 2 || n === 3 ? n : null;
  }

  // ---------------------------------------------------------------------------
  // Data access
  // ---------------------------------------------------------------------------

  function getRoute(routeOrId) {
    if (routeOrId && typeof routeOrId === "object") return routeOrId;
    return (BHS.routes && BHS.routes[routeOrId]) || null;
  }

  function choiceBeats(route) {
    var out = [];
    var seen = {};
    if (!route || !route.beats) return out;
    for (var i = 0; i < route.beats.length; i++) {
      var b = route.beats[i];
      if (b && b.type === "choice") {
        if (seen[b.id]) {
          warn("duplicate choice id " + b.id + " in route " + route.id + "; only the first counts for scoring");
          continue;
        }
        seen[b.id] = true;
        out.push(b);
      }
    }
    return out;
  }

  function findChoice(route, id) {
    var list = choiceBeats(route);
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function findOption(choiceBeat, optId) {
    if (!choiceBeat || !choiceBeat.options) return null;
    for (var i = 0; i < choiceBeat.options.length; i++) {
      if (choiceBeat.options[i] && choiceBeat.options[i].id === optId) return choiceBeat.options[i];
    }
    return null;
  }

  function scriptureEntry(key) {
    return (BHS.scripture && own(BHS.scripture, key) && BHS.scripture[key]) || null;
  }

  function verseText(key, lang) {
    var s = scriptureEntry(key);
    if (!s || s.refOnly) return null;
    var txt = s[lang === "en" ? "en" : "ko"];
    return typeof txt === "string" && txt.length ? txt : null;
  }

  function verseRef(key, lang) {
    var s = scriptureEntry(key);
    if (!s || !s.ref) return null;
    var r = s.ref[lang === "en" ? "en" : "ko"];
    return typeof r === "string" && r.length ? r : null;
  }

  function verseSpeaker(key) {
    var s = scriptureEntry(key);
    return (s && s.speaker) || "narrator";
  }

  // ---------------------------------------------------------------------------
  // Lens scoring (SPEC 5.1)
  // ---------------------------------------------------------------------------

  function computeLens(routeOrId, choices) {
    var route = getRoute(routeOrId);
    var scores = { 1: 0, 2: 0, 3: 0 };
    var c10Lens = null;
    choices = choices || {};
    var list = choiceBeats(route);
    for (var i = 0; i < list.length; i++) {
      var cb = list[i];
      var pick = choices[cb.id];
      if (pick == null) continue;
      var opt = findOption(cb, pick);
      if (!opt) continue;
      var lens = normLens(opt.lens);
      if (cb.id === "c10") c10Lens = lens;
      if (lens === null) continue;
      scores[lens] += cb.id === "c10" ? 2 : 1;
    }
    var max = Math.max(scores[1], scores[2], scores[3]);
    var tied = LENSES.filter(function (l) {
      return scores[l] === max;
    });
    var lensOut = c10Lens !== null && tied.indexOf(c10Lens) >= 0 ? c10Lens : tied[0];
    return {
      lens: lensOut,
      scores: scores,
      c10Lens: c10Lens,
      mismatch: c10Lens !== null && lensOut !== c10Lens
    };
  }

  // ---------------------------------------------------------------------------
  // Conditions (SPEC 4.5)
  // ---------------------------------------------------------------------------

  function looseEq(v, x) {
    if (v === undefined) v = null;
    // An unset flag or choice counts as `false` so `{ flag: "far", is: false }` reads naturally.
    if (x === false && v === null) return true;
    if (x === null) return v === null;
    return v === x;
  }

  function matchValue(v, cond) {
    if (own(cond, "is")) return looseEq(v, cond.is);
    if (own(cond, "in")) {
      var arr = Array.isArray(cond["in"]) ? cond["in"] : [];
      for (var i = 0; i < arr.length; i++) if (looseEq(v, arr[i])) return true;
      return false;
    }
    // A bare `{ flag: "x" }` tests truthiness.
    return v !== undefined && v !== null && v !== false;
  }

  function c10LensOf(state) {
    if (state && state.c10Lens !== undefined && state.c10Lens !== null) return state.c10Lens;
    if (state && state.routeId && state.choices && state.choices.c10) {
      var cb = findChoice(getRoute(state.routeId), "c10");
      var opt = findOption(cb, state.choices.c10);
      return opt ? normLens(opt.lens) : null;
    }
    return null;
  }

  function evalCond(cond, state) {
    if (cond == null) return true;
    state = state || {};
    if (Array.isArray(cond)) {
      for (var i = 0; i < cond.length; i++) if (!evalCond(cond[i], state)) return false;
      return true;
    }
    if (typeof cond !== "object") return !!cond;
    if (own(cond, "all")) {
      var all = cond.all || [];
      for (var a = 0; a < all.length; a++) if (!evalCond(all[a], state)) return false;
      return true;
    }
    if (own(cond, "any")) {
      var any = cond.any || [];
      for (var b = 0; b < any.length; b++) if (evalCond(any[b], state)) return true;
      return false;
    }
    if (own(cond, "not")) return !evalCond(cond.not, state);
    if (own(cond, "choice")) return matchValue((state.choices || {})[cond.choice], cond);
    if (own(cond, "flag")) return matchValue((state.flags || {})[cond.flag], cond);
    if (own(cond, "c10lens")) return c10LensOf(state) === normLens(cond.c10lens);
    if (own(cond, "var")) {
      // Extension (not in SPEC 4.5): numeric test on a runtime variable.
      var n = Number((state.vars || {})[cond["var"]] || 0);
      if (own(cond, "is")) return n === Number(cond.is);
      if (own(cond, "gte")) return n >= Number(cond.gte);
      if (own(cond, "gt")) return n > Number(cond.gt);
      if (own(cond, "lte")) return n <= Number(cond.lte);
      if (own(cond, "lt")) return n < Number(cond.lt);
      return n !== 0;
    }
    warn("unknown condition " + JSON.stringify(cond));
    return false;
  }

  // ---------------------------------------------------------------------------
  // Text and tokens (SPEC 3.1-3.2)
  // ---------------------------------------------------------------------------

  var TOKEN_SRC = "\\{\\{\\s*(v|r|var)\\s*:\\s*([A-Za-z0-9_]+)\\s*\\}\\}";
  var OPEN_Q = "“";
  var CLOSE_Q = "”";

  function isDebug(state) {
    return !!((state && state.debug) || api.debug);
  }

  function pickLang(t, lang) {
    if (t == null) return "";
    if (typeof t === "string") return t;
    var l = lang === "en" ? "en" : "ko";
    if (typeof t[l] === "string") return t[l];
    var other = l === "en" ? "ko" : "en";
    return typeof t[other] === "string" ? t[other] : "";
  }

  // Inside our curly double quotes, any double quote in the verse becomes a single curly quote,
  // so quotes never nest double-in-double. Straight quotes open after whitespace or an opening
  // bracket/dash, and close otherwise.
  function nestQuotes(text) {
    var out = "";
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (ch === "“") out += "‘";
      else if (ch === "”") out += "’";
      else if (ch === '"') {
        var prev = i > 0 ? text.charAt(i - 1) : "";
        out += prev === "" || /[\s(\[{—–]/.test(prev) ? "‘" : "’";
      } else out += ch;
    }
    return out;
  }

  function quoteVerse(text) {
    return OPEN_Q + nestQuotes(String(text)) + CLOSE_Q;
  }

  function tokenValue(kind, key, lang, state) {
    if (kind === "v") {
      var v = verseText(key, lang);
      if (v == null) {
        warn("missing verse text for " + key);
        return isDebug(state) ? "[" + key + "]" : OPEN_Q + "…" + CLOSE_Q;
      }
      return quoteVerse(v);
    }
    if (kind === "r") {
      var r = verseRef(key, lang);
      if (r == null) {
        warn("missing verse reference for " + key);
        return isDebug(state) ? "[" + key + "]" : "…";
      }
      return r;
    }
    if (kind === "var") {
      var vars = (state && state.vars) || {};
      var n = Number(vars[key]);
      return String(isFinite(n) ? Math.round(n) : 0);
    }
    return "";
  }

  function resolveText(t, lang, state) {
    var str = pickLang(t, lang);
    return str.replace(new RegExp(TOKEN_SRC, "g"), function (m, kind, key) {
      return tokenValue(kind, key, lang, state);
    });
  }

  function resolveSegments(t, lang, state) {
    var str = pickLang(t, lang);
    var re = new RegExp(TOKEN_SRC, "g");
    var out = [];
    var em = false;
    var last = 0;
    var m;

    function pushLiteral(s) {
      var parts = s.split("*");
      for (var i = 0; i < parts.length; i++) {
        if (i > 0) em = !em;
        if (parts[i]) out.push({ text: parts[i], em: em });
      }
    }

    while ((m = re.exec(str))) {
      pushLiteral(str.slice(last, m.index));
      out.push({ text: tokenValue(m[1], m[2], lang, state), em: em, kind: m[1], key: m[2] });
      last = re.lastIndex;
    }
    pushLiteral(str.slice(last));
    return out;
  }

  function plainText(t, lang, state) {
    return resolveSegments(t, lang, state)
      .map(function (s) {
        return s.text;
      })
      .join("");
  }

  // ---------------------------------------------------------------------------
  // Game state machine
  // ---------------------------------------------------------------------------

  function routeActions(route) {
    return (route && Array.isArray(route.actions) && route.actions) || [];
  }

  function initialState(routeId, route, custom) {
    var segs;
    if (custom) segs = ["custom", "@end"];
    else if (routeId === "prologue") segs = ["prologue", "@routeSelect"];
    else segs = ["beats", "@ending"];
    return {
      v: STATE_VERSION,
      routeId: routeId,
      segs: segs,
      seg: 0,
      stack: [{ list: segs[0], i: 0 }],
      choices: {},
      flags: {},
      vars: {},
      picks: [],
      c10Lens: null,
      stage: {
        bg: null,
        caption: null,
        time: "day",
        pov: "normal",
        light: "off",
        pinned: null,
        actionsVisible: routeActions(route).length > 0,
        actionReplies: {},
        actionCounts: {},
        sceneSeq: 0,
        cast: [],
        speaking: null,
        castSeq: 0,
        risen: false
      },
      pending: { hush: false, echo: null },
      now: { hush: false, echo: null },
      step: null,
      at: { list: segs[0], index: -1 },
      ending: null,
      steps: 0,
      done: false
    };
  }

  function Game(routeId, opts) {
    opts = opts || {};
    this.routeId = routeId;
    this.custom = Array.isArray(opts.beats) ? opts.beats : null;
    this.route = routeId === "prologue" || this.custom ? opts.route || null : getRoute(routeId);
    if (!this.route && routeId !== "prologue" && !this.custom) throw new Error("Unknown route: " + routeId);
    this.debug = !!opts.debug;
    if (opts.state) {
      this.state = clone(opts.state);
      if (!this.state || this.state.v !== STATE_VERSION || this.state.routeId !== routeId) {
        throw new Error("Incompatible saved state");
      }
    } else {
      this.state = initialState(routeId, this.route, !!this.custom);
      this._run();
    }
  }

  Object.defineProperty(Game.prototype, "step", {
    get: function () {
      return this.state.step;
    }
  });

  Game.prototype.condState = function () {
    var st = this.state;
    return {
      routeId: this.route ? st.routeId : null,
      choices: st.choices,
      flags: st.flags,
      vars: st.vars,
      c10Lens: st.c10Lens,
      debug: this.debug
    };
  };

  Game.prototype._list = function (name) {
    var route = this.route;
    if (name === "custom") return this.custom || [];
    if (name === "prologue") return (BHS.common && BHS.common.prologue) || [];
    if (!route) return [];
    if (name === "beats") return route.beats || [];
    if (name === "endingPreface") return route.endingPreface || [];
    if (name === "endingCoda") return route.endingCoda || [];
    if (name.indexOf("ending:") === 0) {
      var e = route.endings && route.endings[name.slice(7)];
      return (e && e.beats) || [];
    }
    if (name.indexOf("react:") === 0) {
      var parts = name.split(":");
      var opt = findOption(findChoice(route, parts[1]), parts[2]);
      return (opt && opt.reaction) || [];
    }
    return [];
  };

  Game.prototype._run = function () {
    var st = this.state;
    var guard = 0;
    for (;;) {
      if (++guard > 20000) throw new Error("engine loop guard tripped");
      var frame = st.stack[st.stack.length - 1];
      if (!frame) {
        st.seg++;
        if (st.seg >= st.segs.length) {
          this._setStep({ kind: "end" });
          st.done = true;
          return;
        }
        var seg = st.segs[st.seg];
        if (seg.charAt(0) === "@") {
          if (this._synthetic(seg)) return;
          continue;
        }
        st.stack.push({ list: seg, i: 0 });
        continue;
      }
      var list = this._list(frame.list);
      if (frame.i >= list.length) {
        st.stack.pop();
        continue;
      }
      var index = frame.i;
      var beat = list[index];
      frame.i++;
      if (!beat || typeof beat !== "object") continue;
      if (beat.when && !evalCond(beat.when, this.condState())) continue;
      st.at = { list: frame.list, index: index };
      if (this._apply(beat)) return;
    }
  };

  Game.prototype._synthetic = function (seg) {
    var st = this.state;
    var route = this.route;
    var meta = BHS.meta || {};
    switch (seg) {
      case "@routeSelect":
        this._setStep({ kind: "routeSelect" });
        return true;
      case "@ending": {
        var res = computeLens(route, st.choices);
        st.ending = {
          routeId: st.routeId,
          lens: res.lens,
          scores: res.scores,
          c10Lens: res.c10Lens,
          mismatch: res.mismatch,
          id: st.routeId + "-" + res.lens
        };
        var tail = [];
        var hasEnding = !!(route && route.endings && route.endings[String(res.lens)]);
        if (res.mismatch && BHS.common && BHS.common.mismatchLine) tail.push("@mismatch");
        tail.push("endingPreface", "@title");
        if (hasEnding) tail.push("ending:" + res.lens, "@last");
        tail.push("endingCoda", "@final", "@end");
        Array.prototype.splice.apply(st.segs, [st.seg + 1, 0].concat(tail));
        return false;
      }
      case "@mismatch":
        st.at = { list: "@mismatch", index: 0 };
        st.stage.speaking = null;
        this._setStep({ kind: "line", speaker: "narrator", text: BHS.common.mismatchLine, mismatch: true });
        return true;
      case "@title": {
        var lens = st.ending.lens;
        this._castClear();
        var lensMeta = (meta.lenses && meta.lenses[lens]) || {};
        var titles = (meta.endings && meta.endings[st.routeId]) || {};
        st.at = { list: "@title", index: 0 };
        this._setStep({
          kind: "endingTitle",
          routeId: st.routeId,
          lens: lens,
          lensLabel: lensMeta.label || { ko: String(lens), en: String(lens) },
          lensDesc: lensMeta.desc || null,
          title: titles[lens] || { ko: "", en: "" }
        });
        return true;
      }
      case "@last": {
        var e = route.endings[String(st.ending.lens)];
        if (!e || !e.last) return false;
        st.at = { list: "@last", index: 0 };
        this._castClear();
        this._setStep({ kind: "last", text: e.last });
        return true;
      }
      case "@final":
        st.at = { list: "@final", index: 0 };
        this._castClear();
        this._setStep({ kind: "final", routeId: st.routeId, lens: st.ending ? st.ending.lens : null });
        return true;
      case "@end":
        this._setStep({ kind: "end" });
        st.done = true;
        return true;
      default:
        warn("unknown synthetic segment " + seg);
        return false;
    }
  };

  // ---- portrait cast (who stands on stage)

  Game.prototype._protagonist = function () {
    var meta = BHS.meta || {};
    var r = meta.routes && meta.routes[this.state.routeId];
    return (r && r.protagonist) || null;
  };

  Game.prototype._castClear = function () {
    this.state.stage.cast = [];
    this.state.stage.speaking = null;
  };

  // A character line puts the speaker on stage (most recent two, stable left/right slots).
  Game.prototype._castLine = function (speaker) {
    var stage = this.state.stage;
    if (!stage.cast) stage.cast = [];

    for (var i = 0; i < cast.length; i++) if (cast[i].id === speaker) found = cast[i];

      found.pose = pose;

      cast.push({ id: speaker, slot: cast.length ? 1 - used : 0, pose: pose, t: t });

      case "echoVerse":

        break;
      case "pinThought":

      case "unpinThought":

        break;

    var st = this.state;
    var route = this.route;
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var raw = String(items[i]);
      var cut = raw.indexOf(":");
      var kind = raw.slice(0, cut);
      var ref = raw.slice(cut + 1);
      if (kind === "verse") {
        out.push({ type: "verse", key: ref });
      } else if (kind === "choice") {
        var optId = st.choices[ref];
        var opt = findOption(findChoice(route, ref), optId);

  Game.prototype.press = function () {

    if (step.action) st.stage.actionsVisible = false;

  Game.prototype._action = function (id) {

  };

  Game.prototype.tapAction = function (id) {
    var st = this.state;
    var step = st.step;

      this.press();

    }
    var act = this._action(id);
    if (!act || !st.stage.actionsVisible || !step || step.kind === "end") return null;
    var n = (st.stage.actionCounts[id] || 0) + 1;
    st.stage.actionCounts[id] = n;
    if (act.counter) st.vars[act.counter] = (Number(st.vars[act.counter]) || 0) + 1;

  };

  Game.prototype.actions = function () {
    var st = this.state;
    var step = st.step;
    var litId = step && step.kind === "press" ? step.action : null;
    return routeActions(this.route)
      .map(function (a) {
        var lit = a.id === litId;
        return {
          id: a.id,
          label: a.label,
          lit: lit,
          visible: lit || (st.stage.actionsVisible && !(litId && !st.stage.actionsVisible))

        return a.visible;

  };

  Game.prototype.view = function () {
    var st = this.state;
    return {
      routeId: st.routeId,
      step: st.step,
      now: st.now,
      stage: st.stage,
      actions: this.actions(),
      ending: st.ending,
      vars: st.vars,
      done: st.done

  };

  Game.prototype.lens = function () {
    return computeLens(this.route, this.state.choices);
  };

  Game.prototype.position = function () {
    var st = this.state;
    return { seg: st.segs[st.seg], list: st.at.list, index: st.at.index, steps: st.steps };
  };

  Game.prototype.serialize = function () {
    return clone(this.state);
  };

  // Auto-play for debug and tests. `until(step, game)` stops the run; `pick(step, game)` picks an option id.
  Game.prototype.fastForward = function (opts) {
    opts = opts || {};
    var until =
      opts.until ||
      function () {
        return false;
      };
    var pick =
      opts.pick ||
      function (step) {
        return step.options[0].id;
      };
    var max = opts.maxSteps || 5000;
    for (var i = 0; i < max; i++) {
      var step = this.state.step;
      if (!step || step.kind === "end" || step.kind === "routeSelect") return step;
      if (until(step, this)) return step;
      if (step.kind === "choice") this.choose(pick(step, this));
      else if (step.kind === "press") this.press();
      else this.next();
    }
    return this.state.step;
  };

  // ---------------------------------------------------------------------------
  // Factories
  // ---------------------------------------------------------------------------

  function createGame(routeId, opts) {
    return new Game(routeId, opts);
  }

  function createSequence(beats, opts) {
    opts = opts || {};
    return new Game(opts.routeId || "custom", { beats: beats, route: opts.route || null, debug: opts.debug });
  }

  function restoreGame(saved, opts) {
    if (!saved || !saved.routeId) throw new Error("No saved state");
    opts = opts || {};
    return new Game(saved.routeId, { state: saved, debug: opts.debug });
  }

  var api = {
    version: "1.0.0",
    debug: false,
    warnings: warnings,
    LENSES: LENSES,
    PORTRAIT_IDS: PORTRAIT_IDS,
    getRoute: getRoute,
    choiceBeats: choiceBeats,
    findChoice: findChoice,
    findOption: findOption,
    computeLens: computeLens,
    evalCond: evalCond,
    resolveText: resolveText,
    resolveSegments: resolveSegments,
    plainText: plainText,
    pickLang: pickLang,
    quoteVerse: quoteVerse,
    nestQuotes: nestQuotes,
    verseText: verseText,
    verseRef: verseRef,
    verseSpeaker: verseSpeaker,
    createGame: createGame,
    createSequence: createSequence,
    restoreGame: restoreGame,
    Game: Game
  };

  BHS.engine = api;
})();

     scenery sideways for landscape and upward for portrait.

          for (i = 0; i < pts.length; i++) {

            pts[i] = p;
            if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];

          if (skip && maxX - minX < (o.skipMaxW || 1e9)) visible = false;
          if (visible) {
            var ti = o.tone((minX + maxX) / 2, (minY + maxY) / 2, rnd, u, v);

  // Herodian-style oil lamp seen from the side, nozzle to the left, flame at the nozzle tip.
  // (x, y) is the wick point, k the lamp scale, fh the flame height in canvas units
  // (0 = unlit). Returns { body, flame } strings so light can be layered between them.
  function oilLamp(c, x, y, fh, k, name) {
    var w = fh * 0.24, b = y, t = y - fh;
    var body = '<g transform="translate(' + x + " " + y + ")scale(" + k + ')">' +
      ell(61, 25, 52, 6, "#000", op(0.5)) +
      path("M30 4L7-3Q-4-4-3 3Q-2 9 8 10L33 15Z", c.lin(name + "n", 0, 0, 40, 0, [[0, "#c88a57"], [1, "#7a4b2f"]])) +
      path("M27 13C29-9 93-11 98 11C91 23 35 24 27 13Z", c.lin(name + "b", 25, 0, 99, 0, [[0, "#c98a56"], [0.45, "#94603c"], [1, "#4f3020"]])) +
      ell(61, -2, 8, 2.6, "#2a180e") +
      path("M96 6q9-2 10 4q-1 6-9 5z", "#5a3824") + "</g>";
    if (!fh) return { body: body, flame: "" };

      path("M" + x + " " + b + "C" + r1(x - w) + " " + r1(b - fh * 0.2) + " " + r1(x - w * 0.85) + " " + r1(b - fh * 0.56) + " " + x + " " + t +
        "C" + r1(x + w * 0.85) + " " + r1(b - fh * 0.56) + " " + r1(x + w) + " " + r1(b - fh * 0.2) + " " + x + " " + b + "Z",
        c.lin(name + "f", 0, b, 0, t, [[0, "#fff7df"], [0.35, "#ffd47e"], [1, "#f2902f", 0.85]])) +
      path("M" + x + " " + (b - 1) + "C" + r1(x - w * 0.5) + " " + r1(b - fh * 0.15) + " " + r1(x - w * 0.45) + " " + r1(b - fh * 0.38) + " " + x + " " + r1(b - fh * 0.6) +
        "C" + r1(x + w * 0.45) + " " + r1(b - fh * 0.38) + " " + r1(x + w * 0.5) + " " + r1(b - fh * 0.15) + " " + x + " " + (b - 1) + "Z", "#fffdf4") +
      ell(x, b - 1, r1(w * 0.55), r1(w * 0.3), "#6f8fd0", op(0.45));
    return { body: body, flame: flame };
  }

  // Menahem's room. Shared by dawn_lamp and lamp_night so both read as the same place.

  function room(c, night) {
    var rnd = c.rnd, i;
    var wx = 990, wy = 828;                  // wick point of the lamp on the table
    var fh = night ? 30 : 46;                // flame height ("lower" at night)
    var gx = wx, gy = wy - fh * 0.5;         // light center
    var reach = night ? 470 : 620;

    c.add(full(night ? "#0a0b0d" : "#0e0f12"));

    // Back wall: fieldstones that only show where lamp or window light reaches them.
    var tones = night
      ? ["#141517", "#1b1b1c", "#25221f", "#302a24", "#3d342b", "#151a22", "#1a2029"]
      : ["#17181b", "#211f1f", "#2d2824", "#3c332b", "#4f4133", "#1c222c", "#26303c"];
    addStones(c, stones(rnd, flat, {
      u0: 0, u1: W, v0: 150, v1: 852, ch: [46, 70], sw: [72, 138], gap: 4, jit: 5, n: 7,
      tone: function (x, y, r) {
        var dx = x - gx, dy = (y - gy) * 1.2;

        var wdx = x - 590, wdy = (y - 600) * 1.25, wd = Math.sqrt(wdx * wdx + wdy * wdy);
        if (L < 0.16 && wd < 250 && r() < 0.85) return wd < 150 ? 6 : 5;

    // Ceiling: dark reeds above a heavy wall-plate beam (portrait only).
    c.add(rect(0, 0, W, 104, "#09090a"));
    c.add(path("M0 100L1600 92V140L0 148Z", night ? "#211913" : "#291f18"));
    c.add(path("M0 141L1600 133V144L0 152Z", night ? "#2b2118" : "#3a2b1f"));

    // Small high window: deep basalt reveal; its sky is drawn after the lamplight.
    c.add(path("M486 498L682 494V522L486 526Z", night ? "#221a13" : "#2b2018"));
    c.add(path("M486 518L682 514V522L486 526Z", night ? "#302419" : "#463428"));

    c.add(path(poly([[500, 522], [668, 520], [668, 527], [536, 527]]), night ? "#11151c" : "#28303b"));

    c.add(rect(1026, 558, 106, 124, "#09090a"));
    c.add(rect(1042, 620, 78, 20, night ? "#56462f" : "#6f5c41", ' rx="9"'));
    c.add(rect(1036, 640, 86, 22, night ? "#625138" : "#7f6a4c", ' rx="10"'));
    c.add(ell(1047, 630, 5, 9, night ? "#94805c" : "#b9a27a"));
    c.add(ell(1041, 651, 5, 10, night ? "#a08a64" : "#c8b088"));

    c.add(rect(1320, 562, 152, 286, "#050506"));
    c.add(path("M232 852C204 790 214 726 252 700C246 690 250 682 262 680H318C330 682 334 690 328 700C366 726 376 790 348 852Z",
      c.lin("sjar", 214, 0, 376, 0, [[0, "#141313"], [0.75, night ? "#1d2029" : "#262c38"], [1, "#151517"]])));

    // Floor.
    c.add(rect(0, 846, W, 754, c.lin("floor", 0, 846, 0, 1400, [[0, night ? "#14110f" : "#191511"], [1, "#090807"]])));

    c.add(path(poly([[576, 796], [1144, 796], [1202, 902], [518, 902]]),
      c.lin("top", 518, 0, 1202, 0, [[0, night ? "#20170f" : "#271c13"], [0.68, night ? "#4a3523" : "#5e432a"], [1, night ? "#33251a" : "#3e2c1d"]])));
    c.add(rect(518, 902, 684, 26, "#1c130c"));
    c.add(rect(536, 928, 28, 78, "#130d08"));
    c.add(rect(1156, 928, 28, 78, "#130d08"));

    var ln = "";
    if (!night) {

      c.add(path(poly([[684, 808], [916, 808], [944, 884], [654, 884]]),
        c.lin("sheet", 654, 0, 944, 0, [[0, "#bfa47a"], [0.7, "#ead6ab"], [1, "#f3e2b9"]])));
      for (i = 0; i < 8; i++) {

        var xl = lerp(684, 654, f) + 18, xr = lerp(916, 944, f) - 18, mid = (xl + xr) / 2;

      ? [[0, "#ffbf72", 0.42], [0.12, "#f0a050", 0.24], [0.4, "#b86a2c", 0.08], [1, "#6a3d18", 0]]
      : [[0, "#ffd08c", 0.5], [0.12, "#f5ae5e", 0.3], [0.4, "#c77a33", 0.11], [1, "#7a4a1f", 0]], reach * 0.9)));

      ? [[0, "#04070d"], [0.6, "#0b1222"], [1, "#141d31"]]

    c.add(lamp.flame);

  // Narrow lane of black basalt houses sloping down to the lake, late morning.
  // Drawn with a simple pinhole camera so stones, steps and shadows share one perspective.
  scenes.lane = function (c) {
    var rnd = c.rnd;
    var F = 900, CY = 600, EYE = 1.6, G = 0.11;
    var XL = -1.55, XR = 1.5, ZN = 1.0, ZEND = 13.5;
    function fl(z) { return -G * z; }
    function P(x, y, z) { return [MX + (F * x) / z, CY - (F * (y - EYE)) / z]; }
    function Pf(x, z) { return P(x, fl(z), z); }
    var i, z;

    // Sky, far hills, lake.
    c.add(rect(0, 0, W, 606, c.lin("sky", 0, 0, 0, 600, [[0, "#6894b9"], [0.55, "#a6c3d4"], [1, "#e1e8e3"]])));
    c.add(path(ridge(rnd, 586, 6, 9, 606), "#b3bfc2"));
    c.add(path(ridge(rnd, 594, 4, 12, 606), "#95a5ad"));
    var shoreY = Pf(0, 26)[1];
    c.add(rect(0, 600, W, ri(shoreY - 596), c.lin("lake", 0, 600, 0, ri(shoreY), [[0, "#b4cad0"], [0.18, "#86abbb"], [1, "#4f7f97"]])));
    var gl = "";
    for (i = 0; i < 18; i++) {
      var gy = 606 + Math.pow(rnd(), 1.4) * (shoreY - 616), gw = 6 + (rnd() * 26 * (gy - 590)) / 100;
      gl += "M" + ri(690 + rnd() * 210) + " " + ri(gy) + "h" + ri(gw);
    }
    c.add(line(gl, "#f6f3e8", 2.2, op(0.7)));

    // Open shore at the bottom of the slope and a beached boat (no mast).
    c.add(path(poly([Pf(-30, 26), Pf(30, 26), Pf(30, ZEND), Pf(-30, ZEND)]), "#dccba7"));
    c.add(rect(0, ri(shoreY) - 1, W, 3, "#f2f0e6", op(0.8)));
    var b0 = P(-0.7, fl(22) + 0.75, 22), b1 = P(1.0, fl(22) + 0.75, 22), bb = Pf(0.15, 22);
    c.add(path("M" + ri(b0[0] - 6) + " " + ri(b0[1] - 5) + "Q" + ri(bb[0]) + " " + ri(b0[1] + 6) + " " + ri(b1[0] + 6) + " " + ri(b1[1] - 7) +
      "L" + ri(b1[0] - 4) + " " + ri(bb[1] - 6) + "Q" + ri(bb[0]) + " " + ri(bb[1] + 3) + " " + ri(b0[0] + 6) + " " + ri(bb[1] - 5) + "Z", "#3e3129"));
    c.add(path(poly([[b0[0] - 5, b0[1] - 5], [b1[0] + 5, b1[1] - 7], [b1[0] + 3, b1[1] - 2], [b0[0] - 3, b0[1]]]), "#7a6450"));

    // Houses: [z0, z1, height]. Roofs step down with the slope.
    var left = [[1.0, 5.6, 3.55], [5.6, 9.8, 3.3], [9.8, ZEND, 2.3]];
    var right = [[1.0, 4.9, 3.6], [4.9, 9.2, 3.25], [9.2, ZEND, 2.35]];

    function wall(x, houses, lit) {
      var tones = lit ? ["#4b4944", "#58554f", "#66625a", "#747066", "#848075"] : ["#24272c", "#2a2e33", "#30353b", "#383d43"];
      for (var h = 0; h < houses.length; h++) {
        var z0 = houses[h][0], z1 = houses[h][1], top = fl(z0) + houses[h][2];
        c.add(path(poly([P(x, top, z0), P(x, top, z1), Pf(x, z1), Pf(x, z0)]), lit ? "#3a3733" : "#1c1f23"));
        (function (topY) {
          addStones(c, stones(rnd, function (u, v) { return P(x, topY - v, u); }, {
            u0: z0, u1: z1, v0: 0.26, v1: houses[h][2] + G * (z1 - z0) + 0.2, ch: [0.26, 0.4], sw: [0.45, 0.9],
            gap: 0.035, jit: 0.05, n: tones.length, skip: lit ? 0.14 : 0.42, skipMaxW: 70, minW: 5,
            keep: function (u, v) { return topY - v > fl(u) - 0.1; },
            tone: function (cx, cy, r, u, v) {

        c.add(path(poly([P(x, top + 0.04, z0), P(x, top + 0.04, z1), P(x, top - 0.26, z1), P(x, top - 0.26, z0)]), lit ? "#6f6253" : "#2a2927"));
        if (z0 < 9.5) {

            bl += poly([P(x + dx, top - 0.1, z), P(x + dx, top - 0.1, z + 0.12), P(x + dx, top - 0.22, z + 0.12), P(x + dx, top - 0.22, z)]);

    var dz0 = 3.9, dz1 = 4.65, dtop = fl(dz0) + 1.62;
    c.add(path(poly([P(XR, dtop, dz0), P(XR, dtop, dz1), Pf(XR, dz1), Pf(XR, dz0)]),
      c.lin("door", 0, 620, 0, 1000, [[0, "#191817"], [1, "#2b2926"]])));
    c.add(path(poly([P(XR, dtop + 0.16, dz0 - 0.15), P(XR, dtop + 0.16, dz1 + 0.12), P(XR, dtop, dz1 + 0.12), P(XR, dtop, dz0 - 0.15)]), "#5b4733"));
    var jz = 3.45, jx = 1.22, jb = Pf(jx, jz), jt = P(jx, fl(jz) + 0.62, jz), jw = (F * 0.19) / jz;
    c.add(path("M" + ri(jb[0] - jw * 0.55) + " " + ri(jb[1]) + "C" + ri(jb[0] - jw * 1.25) + " " + ri(lerp(jb[1], jt[1], 0.5)) + " " +
      ri(jb[0] - jw * 0.9) + " " + ri(jt[1] + 8) + " " + ri(jb[0] - jw * 0.32) + " " + ri(jt[1]) + "H" + ri(jb[0] + jw * 0.32) + "C" +
      ri(jb[0] + jw * 0.9) + " " + ri(jt[1] + 8) + " " + ri(jb[0] + jw * 1.25) + " " + ri(lerp(jb[1], jt[1], 0.5)) + " " + ri(jb[0] + jw * 0.55) + " " + ri(jb[1]) + "Z",
    c.lin("jar", jb[0] - jw, 0, jb[0] + jw, 0, [[0, "#c27a4e"], [0.5, "#9a5c3a"], [1, "#5e3622"]])));

    c.add(path(poly([Pf(XL, ZN), Pf(XL, ZEND), Pf(XR, ZEND), Pf(XR, ZN)]),
      c.lin("lanef", 0, 800, 0, 1500, [[0, "#e2d3b2"], [1, "#c9b48c"]])));
    var cob = "";
    for (i = 0; i < 26; i++) {
      z = 1.6 + Math.pow(rnd(), 1.5) * 7;
      var cx0 = lerp(XL + 0.15, XR - 0.15, rnd()), a = 0.04 + rnd() * 0.06, b2 = 0.03 + rnd() * 0.05;
      cob += poly([Pf(cx0 - a, z), Pf(cx0, z - b2), Pf(cx0 + a, z), Pf(cx0 + a * 0.6, z + b2), Pf(cx0 - a * 0.7, z + b2)]);
    }
    c.add(path(cob, "#bfae8c"));
    var stepD = "", stepL = "";
    for (z = 2.6; z < 13; z += 1.05) {
      stepD += poly([Pf(XL, z), Pf(XR, z), P(XR, fl(z) - 0.08, z), P(XL, fl(z) - 0.08, z)]);
      stepL += poly([P(XL, fl(z) + 0.01, z - 0.03), P(XR, fl(z) + 0.01, z - 0.03), Pf(XR, z), Pf(XL, z)]);

    c.add(path(stepD, "#b7a586"));
    c.add(path(stepL, "#f1e7cf", op(0.55)));
    var sh = [Pf(XL, ZN)];
    for (i = 0; i < left.length; i++) {
      var hh = left[i][2], e = 0.26 * hh, d = 0.5 * hh;
      if (i === 0) sh.push(Pf(XL + e, ZN));
      sh.push(Pf(XL + e, Math.max(ZN, left[i][0] - d)), Pf(XL + e, left[i][1] - d));
    }
    sh.push(Pf(XL, ZEND));
    c.add(path(poly(sh), "#58606a", op(0.5)));

    // Haze that makes the bottom of the slope glow, light vignette and grain.
    c.glow("haze", 805, 660, 420, "#fffaf0", 0.34, 300);
    c.vignette("#1a1c20", 0.35, MX, 700, 1300);
    c.grain(0.3, 0.5);
    return c.svg();
  };

  // ---------------------------------------------------------------- crowd figures

  var CLOTH = ["#b7a785", "#6e5642", "#45506a", "#7b4536", "#a3824e", "#5d6243", "#3d3b38", "#c9bea6", "#8a6f55", "#5a4c5e", "#94846a"];

  scenes.crowd = function (c) {

    var gl = "";

  // ---------------------------------------------------------------- Asher's house

  // Reeds laid across the beams: a pattern tile is far cheaper than hundreds of strokes.
  function reedDef(c, colors) {

  }

  // Lying POV inside Asher's house, looking straight up at the beams, reeds and mud.

  function circ(x, y, r) {

    var people = [], rows = [[780, 780, 52, [150, 180, 210, 238, 262]], [560, 600, 64, [88, 115, 142, 170, 198, 226, 254, 282, 308]],
      [360, 400, 80, [72, 102, 132, 162, 192, 222, 252, 282, 311]]];
    // Everyone wears a head covering against the noon sun, which also frames each face.
    var kinds = ["lc", "lc"], q = 0;
    for (var rw = 0; rw < rows.length; rw++) {
      for (var k = 0; k < rows[rw][3].length; k++, q++) {
        var a = (rows[rw][3][k] * Math.PI) / 180;
        people.push([ri(760 + rows[rw][0] * Math.cos(a)), ri(740 + rows[rw][1] * Math.sin(a)), rows[rw][2], kinds[(q * 7) % 3 === 0 ? 1 : q % 2], q % 6, (q * 5) % 4]);
      }
    }
    CXc = 760; CYc = 740;
    for (var i = 0; i < people.length; i++) {
      var p = people[i], x = p[0], y = p[1], r = p[2];
      var ang = ri((Math.atan2(CXc - x, -(CYc - y)) * 180) / Math.PI);
      var lx = LX - x, ly = LY - y, ln = Math.sqrt(lx * lx + ly * ly), off = r * 0.08;
      var warm = ln < 760;
      var haze = r < 60 ? 0.3 : r < 70 ? 0.12 : 0;
      var rim = warm ? "#ffd9a0" : "#e2edf2";
      c.add('<use href="#' + c.id(p[3]) + '" transform="translate(' + ri(x + (lx / ln) * off) + " " + ri(y + (ly / ln) * off) + ")rotate(" + ang + ")scale(" + r + ')" fill="' +
        rim + '" color="' + rim + '" opacity="' + (warm ? 0.9 : 0.6) + '"/>');
      c.add('<use href="#' + c.id(p[3]) + '" transform="translate(' + x + " " + y + ")rotate(" + ang + ")scale(" + r + ')" fill="' +
        mix(garments[p[4]], "#a9c0cf", haze) + '" color="' + mix(skins[p[5]], "#a9c0cf", haze) + '"/>');
    }
    c.vignette("#3a4a58", 0.25, MX, 760, 1300);
    c.grain(0.2, 0.6);
    return c.svg();
  };

  // ---------------------------------------------------------------- afternoon and dusk

  // The road home in warm afternoon light: olive trees cast long shadows across the dust,
  // the town of basalt houses waits at the end of the road.
  scenes.road_home = function (c) {
    var rnd = c.rnd, i, k;
    var F = 900, CY = 600, EYE = 1.6;
    function P(x, y, z) { return [MX + (F * x) / z, CY - (F * (y - EYE)) / z]; }
    function G(x, z) { return P(x, 0, z); }

    c.add(rect(0, 0, W, 612, c.lin("sky", 0, 0, 0, 600, [[0, "#84a7c1"], [0.55, "#cbd4cd"], [0.85, "#efd7a9"], [1, "#f4cd92"]])));
    c.glow("sun", 100, 470, 780, "#fff0c4", 0.62, 560);
    c.add(path(ridge(rnd, 520, 24, 7, 612), "#b9a87c"));
    c.add(path(ridge(rnd, 562, 16, 9, 612), "#a19566"));
    c.add(rect(0, 600, W, 1000, c.lin("field", 0, 600, 0, 1300, [[0, "#c9b27b"], [1, "#9a7f4e"]])));

    // The town at the end of the road: sunlit west faces, cooler south fronts.
    var houses = [[-1.2, 1.5, 38, 3.6], [-12, -8.2, 34, 3.4], [9.4, 13, 34, 3.2], [-3.4, -1.0, 33, 3.0], [4.8, 8.6, 31.5, 3.0], [-7.6, -3.8, 30, 3.2], [1.1, 4.4, 29, 3.3]];
    for (i = 0; i < houses.length; i++) {
      var hx0 = houses[i][0], hx1 = houses[i][1], hz = houses[i][2], hh = houses[i][3], dep = 5;
      if (hx0 > 0) c.add(path(poly([P(hx0, hh, hz), P(hx0, hh, hz + dep), G(hx0, hz + dep), G(hx0, hz)]), "#a48a6c"));
      else c.add(path(poly([P(hx1, hh, hz), P(hx1, hh, hz + dep), G(hx1, hz + dep), G(hx1, hz)]), "#4d4553"));
      c.add(path(poly([P(hx0, hh, hz), P(hx1, hh, hz), G(hx1, hz), G(hx0, hz)]), "#6f6159"));
      c.add(path(poly([P(hx0, hh + 0.12, hz), P(hx1, hh + 0.12, hz), P(hx1, hh, hz), P(hx0, hh, hz)]), "#d2b286"));
      var dx = lerp(hx0, hx1, 0.3 + rnd() * 0.3);
      c.add(path(poly([G(dx, hz), P(dx, 1.5, hz), P(dx + 0.7, 1.5, hz), G(dx + 0.7, hz)]), "#2c2522"));
    }

    // The road of packed dust narrowing toward the town, with worn tracks.
    c.add(path(poly([G(-2.2, 1.1), G(-1.5, 29), G(1.5, 29), G(2.2, 1.1)]), c.lin("road", 0, 640, 0, 1500, [[0, "#e6cb98"], [1, "#d1ae78"]])));
    c.add(path(poly([G(-0.75, 1.3), G(-0.62, 28), G(-0.5, 28), G(-0.55, 1.3)]) + poly([G(0.55, 1.3), G(0.5, 28), G(0.62, 28), G(0.75, 1.3)]), "#c29f6c", op(0.6)));

    // Olive trees: [x, z]. Long shadows fall to the right and away from the low western sun,
    // so the canopies of the left-hand trees lay bands of shade across the road.
    var trees = [[-3.9, 17], [4.6, 14], [-4.4, 10.5], [3.8, 7.5], [-3.6, 5.0]];
    var shade = "";
    for (i = 0; i < trees.length; i++) {
      var tx = trees[i][0], tz = trees[i][1], pts = [];
      for (k = 0; k < 14; k++) {
        var a = (k / 14) * Math.PI * 2, along = 5.6 + Math.cos(a) * 2.5, across = Math.sin(a) * 1.5;
        pts.push(G(tx + along * 0.92 - across * 0.38, tz + along * 0.38 + across * 0.92));
      }
      shade += poly(pts) + poly([G(tx - 0.1, tz), G(tx + 3.2 * 0.92 - 0.1, tz + 3.2 * 0.38 + 0.22), G(tx + 3.2 * 0.92 + 0.1, tz + 3.2 * 0.38 - 0.22), G(tx + 0.1, tz)]);
    }
    c.add(path(shade, "#6f5446", op(0.4)));

    // Stones and dry tufts along the roadside.
    var rs = "", tf = "";
    for (i = 0; i < 26; i++) {
      var sz = 3 + Math.pow(rnd(), 1.4) * 20, sx = (rnd() < 0.5 ? -1 : 1) * (2.3 + rnd() * 1.6), ss = 0.12 + rnd() * 0.18;
      var sp = G(sx, sz), sw = (F * ss) / sz;
      rs += "M" + ri(sp[0] - sw) + " " + ri(sp[1]) + "q" + ri(sw) + " " + ri(-sw * 0.9) + " " + ri(sw * 2) + " 0z";
      if (i % 2) tf += "M" + ri(sp[0] + sw * 2) + " " + ri(sp[1]) + "l" + ri(-sw * 0.4) + " " + ri(-sw * 1.6) + "M" + ri(sp[0] + sw * 2.2) + " " + ri(sp[1]) + "l" + ri(sw * 0.5) + " " + ri(-sw * 1.4);
    }
    c.add(path(rs, "#7d6b55"));
    c.add(line(tf, "#8f7c4c", 2.4, op(0.8)));

    // Olive trees: gnarled, forked trunks and wide, broken, silver-green crowns (local units = meters).
    var trunk = "M-.28 0C-.1-.6-.42-1-.16-1.6L-.82-2.3L-.66-2.42L-.04-1.86L.04-1.9L.72-2.56L.86-2.42L.24-1.55C.42-1 .14-.5.34 0Z";
    for (i = 0; i < trees.length; i++) {
      var bx = trees[i][0], bz = trees[i][1], s = r2(F / bz), base = G(bx, bz);
      var g = '<g transform="translate(' + ri(base[0]) + " " + ri(base[1]) + ")scale(" + s + ')">';
      g += path(trunk, "#4a3a2c") + path("M-.28 0C-.1-.6-.42-1-.16-1.6L-.82-2.3L-.74-2.36L-.08-1.62C-.3-1-.02-.6-.12 0Z", "#8a7458", op(0.6));
      var cd = "", cs = "", cl = "";
      for (k = 0; k < 13; k++) {
        // Clumps sit around a connected, flattened crown (outer ring) plus a few inside.
        var ca = (k / 9) * Math.PI * 2 + rnd() * 0.4, cr = k < 9 ? 0.85 + rnd() * 0.15 : rnd() * 0.5;
        var px = Math.cos(ca) * cr * 1.45, py = -2.95 + Math.sin(ca) * cr * 0.55, pr = 0.4 + rnd() * 0.22;
        var arc = "M" + r2(px - pr) + " " + r2(py) + "a" + r2(pr) + " " + r2(pr * 0.8) + " 0 1 0 " + r2(2 * pr) + " 0a" + r2(pr) + " " + r2(pr * 0.8) + " 0 1 0 " + r2(-2 * pr) + " 0z";
        cd += arc;
        cs += "M" + r2(px - pr) + " " + r2(py + 0.16) + "a" + r2(pr) + " " + r2(pr * 0.8) + " 0 1 0 " + r2(2 * pr) + " 0a" + r2(pr) + " " + r2(pr * 0.8) + " 0 1 0 " + r2(-2 * pr) + " 0z";
        if (px < 0.3) cl += "M" + r2(px - pr * 0.9) + " " + r2(py - 0.08) + "a" + r2(pr * 0.6) + " " + r2(pr * 0.45) + " 0 1 0 " + r2(pr * 1.2) + " 0a" + r2(pr * 0.6) + " " + r2(pr * 0.45) + " 0 1 0 " + r2(-pr * 1.2) + " 0z";
      }
      g += path(cs, "#545a3c") + path(cd, "#7c8462") + path(cl, "#b6b98e", op(0.85));
      c.add(g + "</g>");
    }

    c.glow("haze", MX, 610, 980, "#ffe9bf", 0.3, 420);
    c.vignette("#5a3a1e", 0.4, MX, 700, 1300);
    c.grain(0.25, 0.6);
    return c.svg();
  };

  // Asher's doorway at dusk: amber lamplight inside, the sky turning violet; landscape also sees
  // down the lane to the lake, where one other window is lit.
  scenes.doorway_evening = function (c) {
    var rnd = c.rnd, i;
    var DL = 728, DR = 872, DT = 612, DB = 902;
    c.add(rect(0, 0, W, 720, c.lin("sky", 0, 0, 0, 660, [[0, "#1f1a35"], [0.35, "#3b3157"], [0.62, "#77587a"], [0.82, "#c07e79"], [1, "#e5a473"]])));
    c.add(path("M520 120h3v3h-3zM980 210h3v3h-3zM1262 80h3v3h-3zM300 260h2v2h-2z", "#f4f1ea", op(0.85)));

    // View down the lane (left, landscape): dusk lake, far hills, rooftops with one lit window.
    c.add(path(ridge(rnd, 612, 8, 5, 650), "#3d3350"));
    c.add(rect(0, 642, 420, 70, c.lin("lake", 0, 642, 0, 712, [[0, "#c28a86"], [1, "#4c3d5b"]])));
    c.add(path("M-10 700L80 690V662H170V700L240 694V676H330V712L400 706V1000H-10Z", "#1b1622"));
    c.add(rect(120, 676, 12, 10, "#f2b45a"));
    c.add(rect(0, 820, 400, 780, "#221c24"));

    // House front of black basalt, warmed only near the doorway.
    c.add(rect(380, 430, 1220, 1170, "#1d1922"));
    var tones = ["#2d2833", "#36303c", "#403846", "#5a4434", "#7a5534"];
    c.add('<g clip-path="' + c.clip("front", "M380 430H1600V920H380Z") + '">');
    addStones(c, stones(rnd, flat, {
      u0: 380, u1: W, v0: 448, v1: 920, ch: [46, 68], sw: [74, 136], gap: 4, jit: 5, n: 5,
      keep: function (u, v) { return !(u > DL - 24 && u < DR + 24 && v > DT - 30); },
      tone: function (x, y, r) {
        var d = Math.sqrt((x - 800) * (x - 800) + (y - 760) * (y - 760) * 1.3);
        if (d < 300) return 3 + (r() < 0.5 && d < 200 ? 1 : 0);
        return Math.floor(r() * 3);
      }
    }), tones);
    // Corner stones at the left edge of the house.
    var q = "";
    for (i = 0; i < 7; i++) q += poly([[380, 452 + i * 66], [380 + (i % 2 ? 60 : 96), 452 + i * 66], [380 + (i % 2 ? 60 : 96), 512 + i * 66], [380, 512 + i * 66]]);
    c.add(path(q, "#3c3644"));
    c.add("</g>");
    // Roof edge of packed mud over reeds, with beam ends under it.
    c.add(path("M370 414L1600 406V446L370 452Z", "#2b232a"));
    var fr = "M370 418";
    for (var fx = 370; fx < W; fx += 22 + rnd() * 26) fr += "L" + ri(fx) + " " + ri(400 + rnd() * 12);
    c.add(path(fr + "L1600 404V414L370 418Z", "#4a3a2c"));
    var be = "";
    for (i = 0; i < 11; i++) be += "M" + (430 + i * 112) + " 448h22v18h-22z";
    c.add(path(be, "#2a1e15"));

    // Doorway: amber interior with a lit lamp niche, the door leaf swung inward.
    c.add(rect(DL, DT, DR - DL, DB - DT, c.rad("inside", 815, 770, 220, [[0, "#ffd284"], [0.45, "#d98a3a"], [1, "#6e3714"]], 260)));
    c.add(rect(790, 712, 46, 40, "#ffe3a8", op(0.7)));
    c.add(path("M802 744h22l-4-10h-14z", "#7a4a2a"));
    c.add(path(poly([[DL, DT], [DL + 34, DT + 14], [DL + 34, DB - 8], [DL, DB]]), "#3a2414"));
    c.add(path(poly([[DR, DT], [DR, DB], [DR - 14, DB - 10], [DR - 14, DT + 8]]), "#c98446"));
    c.add(path(poly([[706, 588], [894, 586], [894, 614], [706, 616]]), "#3a2a1d"));
    c.add(path(poly([[716, 902], [884, 902], [892, 920], [708, 920]]), "#5e4a40"));

    // Water jar by the door, lit on the door side.
    c.add(path("M612 912C590 868 596 822 620 806C616 798 620 792 628 790H660C668 792 672 798 668 806C692 822 698 868 676 912Z",
      c.lin("jar", 594, 0, 700, 0, [[0, "#1e1418"], [0.7, "#4a2c22"], [1, "#c27a3c"]])));

    // Ground in front of the house and the warm spill from the door.
    c.add(rect(380, 918, 1220, 682, c.lin("ground", 0, 918, 0, 1400, [[0, "#3b3037"], [1, "#1c171c"]])));
    c.add(path(poly([[DL, 920], [DR, 920], [1010, 1300], [590, 1300]]), c.lin("spill", 0, 920, 0, 1300, [[0, "#f3a24a", 0.5], [1, "#f3a24a", 0]])));
    c.glow("door", 800, 760, 420, "#f2a24c", 0.38, 380);

    c.vignette("#0e0b16", 0.6, MX, 720, 1300);
    c.grain(0.28, 0.35);
    return c.svg();
  };

  // Calm neutral gradient for unknown ids.
  function fallback(c) {
    c.add(full(c.lin("bg", 0, 0, 0, 1600, [[0, "#3b3e44"], [0.6, "#5a5751"], [1, "#2c2b29"]])));
    c.vignette("#000", 0.4);
    return c.svg();
  }

  // ---------------------------------------------------------------- public API

  // Point of view can swap a scene for its lying or eye-level counterpart, so a camera
  // change (fx "pov") can simply re-render the current background with the new pov.
  var LYING = { asher_home: "asher_ceiling", lane: "sky_carried", crowd: "crowd_lying" };
  var STANDING = { asher_ceiling: "asher_home", sky_carried: "lane", crowd_lying: "crowd" };
  var TIMES = { day: 1, evening: 1, night: 1 };

  function resolve(bgId, pov) {
    var id = typeof bgId === "string" ? bgId : "";
    if (pov === "lying" && LYING[id]) return LYING[id];
    if (pov === "standing" && STANDING[id]) return STANDING[id];
    return id;
  }

  BHS.art = {
    ids: IDS.slice(),
    // Canvas size of every scene (viewBox), rendered with preserveAspectRatio "xMidYMid slice".
    viewBox: [W, H],
    // Where the luminous space sits in each crowd scene, in canvas units, so the UI can
    // anchor its presence light there. Map to the screen with the slice math:
    // s = max(stageW / 1600, stageH / 1600); x = stageW / 2 + (cx - 800) * s; y = stageH / 2 + (cy - 800) * s.
    lightAt: { crowd: [800, 650], crowd_lying: [1380, 720] },
    // Returns the bg id that render() will actually draw for this pov.
    resolve: resolve,
    // opts: { pov?: "normal"|"lying"|"standing", time?: "day"|"evening"|"night", uid?: string }
    render: function (bgId, opts) {
      var o = opts || {};
      var id = resolve(bgId, o.pov);
      var known = Object.prototype.hasOwnProperty.call(scenes, id);
      var uid = typeof o.uid === "string" && /^[A-Za-z0-9_-]{1,24}$/.test(o.uid) ? o.uid : (++renderCount).toString(36);
      var so = { pov: o.pov, time: TIMES[o.time] ? o.time : "day" };
      try {
        return known ? scenes[id](new Ctx(id, uid), so) : fallback(new Ctx("unknown", uid));
      } catch (err) {
        try { return fallback(new Ctx("unknown", uid)); } catch (e2) {
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true"><rect width="1600" height="1600" fill="#3b3e44"/></svg>';
        }
      }
    }
  };
})();

</script>
<script>/* js/portraits.js */
/* Character portraits for "Before He Stood", drawn as inline SVG strings.
   Owner: portrait agent. See docs/SPEC.md §5.6 (look), §6.1 (fixed facts), §7 (guardrails).
   - Classic script, no modules, no fetch, no external assets, no SVG filters.
   - Each portrait is a half-body bust on a transparent background, viewBox 0 0 600 900,
     bottom edge cut by the frame. Faces sit above y ~560 because the text panel covers
     the lower part of the stage. The root <svg> uses preserveAspectRatio="xMidYMax meet",
     so a container of any size keeps the figure standing on its bottom edge.
   - FACING: every figure faces screen-LEFT (three-quarter view, gaze to the left).
     BHS.portraits.facing[id] says so too; the UI can mirror a portrait with CSS
     transform: scaleX(-1) when it stands on the left of the stage (the art has no text).
   - Style: cut-paper relief. Flat color planes in natural dyes, one warm shadow color and
     one warm light color laid over them as planes, no outlines. Light comes from the upper
     left (the side they face): a thin warm rim catches the upper-left edges and the figure
     casts a soft offset shadow, so it separates from dark interiors and bright noon scenes.
   - Jesus is never drawn: render("jesus") returns null. No crosses, halos or text.
   - Ids inside each SVG are prefixed with the character id plus a per-render counter. */
(function () {
  "use strict";
  var BHS = (window.BHS = window.BHS || {});

  var IDS = ["menahem", "hanan", "yonah", "asher", "mother", "brother", "neighbor", "passerby", "partners", "scribes"];
  var renderCount = 0;

  var SH = "#2a1409";   // shadow overlay (warm umber), used at a few fixed strengths
  var HI = "#fff1d6";   // light overlay
  var INK = "#1d130d";  // lash lines and pupils

  // ---------------------------------------------------------------- utilities

  var PREC = 1;         // path number precision: 1 = integers, 10 = one decimal (faces)
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rn(v) { var n = Math.round(v * PREC) / PREC; return n === 0 ? 0 : n; }
  function r1(v) { var n = Math.round(v * 10) / 10; return n === 0 ? 0 : n; }
  function op(o) { return o !== undefined && o !== 1 ? ' opacity="' + o + '"' : ""; }

  // Number without a leading zero (0.5 -> .5, -0.5 -> -.5).
  function fmt(n) {
    var s = String(n);
    if (s.length > 1 && s.charAt(0) === "0") return s.slice(1);
    if (s.length > 2 && s.slice(0, 2) === "-0") return "-" + s.slice(2);
    return s;
  }
  // Joins numbers for path data with the fewest separators.
  function nums(arr) {
    var s = "", prev = "";
    for (var i = 0; i < arr.length; i++) {
      var t = fmt(rn(arr[i]));
      if (i > 0 && t.charAt(0) !== "-" && !(t.charAt(0) === "." && prev.indexOf(".") >= 0)) s += " ";
      s += t;
      prev = t;
    }
    return s;
  }

  function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function mix(a, b, t) {
    var x = hexRgb(a), y = hexRgb(b), o = "#";
    for (var i = 0; i < 3; i++) {
      var v = Math.round(lerp(x[i], y[i], t));
      o += (v < 16 ? "0" : "") + v.toString(16);
    }
    return o;
  }

  // A frame maps local units (u right, v down) to viewBox coordinates: origin (x, y),
  // scale s, optional rotation in radians. Heads use 1 unit = half the head height.
  function frame(x, y, s, rot, flip) {
    var c = Math.cos(rot || 0), n = Math.sin(rot || 0), m = flip ? -1 : 1;
    var f = function (u, v) { v *= m; return [x + s * (u * c - v * n), y + s * (u * n + v * c)]; };
    f.s = s;
    f.x = x;
    f.y = y;
    return f;
  }
  // Local v of the frame bottom (plus a margin), so garments always reach the cut edge.
  function bot(b) { return Math.max(5.7, (912 - b.y) / b.s); }
  var V = frame(0, 0, 1, 0);  // plain viewBox coordinates

  function mapPts(f, list) {
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var p = list[i], q = f(p[0], p[1]);
      if (p[2]) q.push(1);
      out.push(q);
    }
    return out;
  }

  // Smooth path through points (Catmull-Rom as cubic Beziers). A point with a third entry
  // is a corner: its tangents point along the chords to its neighbours. Written with
  // relative commands; offsets come from rounded absolute points, so nothing drifts.
  function curve(p, closed) {
    var n = p.length, last = closed ? n : n - 1;
    var cx = rn(p[0][0]), cy = rn(p[0][1]), out = [];
    for (var i = 0; i < last; i++) {
      var p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
      if (!closed) { if (i === 0) p0 = p1; if (i + 2 >= n) p3 = p2; }
      var a = p1[2] ? [lerp(p1[0], p2[0], 0.3), lerp(p1[1], p2[1], 0.3)] : [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];

  // One member of a group: neck, tunic, head, beard, mouth, hair or head cloth.

    if (m.net) {
      var nd = c.shape(b, [[0.9, 1.3], [1.6, 1.42], [2.02, 1.86], [2.1, 3.6], [1.5, 3.8], [1.2, 2.6]], "#bca77f", 0.92, true);
      c.inside(nd);

      for (var i = -6; i < 12; i++) {
        var p0 = b(0.8 + i * 0.16, 1.2), p1 = b(0.8 + i * 0.16 + 1.4, 3.9), p2 = b(0.8 + i * 0.16 + 1.4, 1.2), p3 = b(0.8 + i * 0.16, 3.9);

  // Yonah's net partners, together in one image (number deliberately not emphasized).
  draw.partners = function (c) {
    member(c, 300, 214, 80, {
      face: { skin: "#9a6943", lip: "#80463a", brow: "#2b231e", open: 0.9, smile: 0.3, crinkle: 0.5, gaze: -0.2, age: 0.7, jaw: 1.04 },
      tunic: "#c4b494", cloth: { color: "#b9a682" }, hair: { color: "#2c241e" },
      beard: { color: "#3a322b", e: 0.03, len: 0.1, hi: "#a59d92", locks: [[[-0.5, 0.6], [-0.44, 0.8], [-0.34, 0.98], 0.05, 0.7], [[0.1, 0.7], [0.14, 0.9], [0.1, 1.04], 0.05, 0.6]] }
    });
    member(c, 172, 322, 88, {
      face: { skin: "#7c5034", lip: "#6c392b", brow: "#1d1611", open: 0.95, smile: 0.5, crinkle: 0.6, gaze: -0.18, jaw: 1.05, browT: 1.1 },

    });
  };

  // Some of the scribes: mantles over their heads like Menahem's, composed and stern, not evil.
  draw.scribes = function (c) {
    var M1 = { cloth: "#e0d6be", dark: "#b8aa8d", inner: "#90836c", band: "#2f3442" };
    var M2 = { cloth: "#d6cbb0", dark: "#ae9f81", inner: "#867963", band: "#2f3442" };
    member(c, 304, 212, 80, {

    });
    member(c, 430, 328, 88, {

      tunic: "#5e5444", hood: M2, k: 0.84,

  // ---------------------------------------------------------------- public API

  var FACING = {};
  for (var fi = 0; fi < IDS.length; fi++) FACING[IDS[fi]] = "left";

  BHS.portraits = {
    ids: IDS.slice(),

    facing: FACING,

  };
})();
