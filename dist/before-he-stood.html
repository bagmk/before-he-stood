  };

  // Asher's house at eye level: basalt back wall, low doorway, water jar, his bed on the floor.
  // Portrait sees the back wall; landscape adds the side walls, a shelf niche and a hand mill.
  // time: day (bright morning doorway), evening (amber dusk outside, lamp lit), night (dark doorway, lamp lit).
  scenes.asher_home = function (c, o) {
    var rnd = c.rnd, t = o.time, i;
    var day = t === "day", eve = t === "evening";
    var night = !day && !eve;
    var BL = 420, BR = 1180, BT = 380, BB = 900;   // back wall
    var DL = 830, DR = 990, DT = 590;              // doorway
    var LX = 1078, LY = 704;                       // lamp wick in its niche
    function lit(x, y) {
      var dd = Math.sqrt((x - 910) * (x - 910) + (y - 750) * (y - 750) * 1.4);
      var dl = Math.sqrt((x - LX) * (x - LX) + (y - LY) * (y - LY) * 1.4);
      var a = day ? clamp(1 - dd / 520, 0, 1) : eve ? 0.45 * clamp(1 - dd / 360, 0, 1) : 0;
      var b = day ? 0 : clamp(1 - dl / (night ? 560 : 460), 0, 1);
      return Math.max(a, b);
    }

    // Ceiling with beams running toward us (portrait only).
    c.add(full(night ? "#0c0a09" : "#16120f"));
    reedDef(c, night ? ["#1a140f", "#211912"] : eve ? ["#2e231a", "#3a2c20", "#241b14"] : ["#2c241c", "#3a2f24", "#231c16"]);
    c.add(path("M0 0H1600V93L1180 380H420L0 93Z", c.url("reed")));
    var bm = "";
    for (i = 0; i < 6; i++) {
      var bx = 470 + i * 132, k = 2.615;
      bm += poly([[bx - 15, BT], [bx + 15, BT], [800 + (bx + 15 - 800) * k, -40], [800 + (bx - 15 - 800) * k, -40]]);
    }
    c.add(path(bm, night ? "#1d1610" : "#2f241a"));
    c.add(path("M0 0H1600V93L1180 380H420L0 93Z", "#000", op(night ? 0.45 : 0.3)));

    // Side walls (landscape): plastered mud in shadow.
    c.add(path(poly([[BL, BT], [0, 93], [0, 1187], [BL, BB]]), c.lin("lwall", 0, 0, BL, 0, [[0, "#15110e"], [1, night ? "#1e1915" : "#2b241e"]])));
    c.add(path(poly([[BR, BT], [1600, 93], [1600, 1187], [BR, BB]]), c.lin("rwall", BR, 0, 1600, 0, night || eve
      ? [[0, "#3a2a1e"], [1, "#130f0c"]] : [[0, "#2e2620"], [1, "#15110e"]])));
    // Back wall stones lit by the doorway (day) or the lamp (evening, night).
    c.add(rect(BL, BT, BR - BL, BB - BT, night ? "#14110f" : eve ? "#211b18" : "#272320"));
    var tones = day ? ["#2f2b28", "#3b3631", "#48413a", "#584f46", "#6b6056"]
      : eve ? ["#2a2321", "#362b25", "#46362b", "#5a4331", "#6e5036"] : ["#1b1715", "#261f1a", "#33291f", "#453424", "#5a412b"];
    c.add('<g clip-path="' + c.clip("bw", "M" + BL + " " + BT + "H" + BR + "V" + BB + "H" + BL + "Z") + '">');
    addStones(c, stones(rnd, flat, {
      u0: BL, u1: BR, v0: BT, v1: BB, ch: [44, 66], sw: [70, 130], gap: 4, jit: 5, n: 5,
      keep: function (u, v) { return !(u > DL - 10 && u < DR + 10 && v > DT - 10); },
      tone: function (x, y, r) {
        var L = lit(x, y);
        if (L < 0.06 && r() < 0.6) return -1;
        return clamp(Math.floor(L * 4.6 + (r() - 0.5) * 1.2), 0, 4);
      }
    }), tones);
    c.add("</g>");

    // Lamp niche.
    c.add(path(poly([[1052, 628], [1152, 626], [1152, 640], [1052, 642]]), night ? "#2a2119" : "#3b3229"));
    c.add(rect(1060, 640, 86, 82, "#0b0908"));
    var lamp = oilLamp(c, LX, LY, day ? 0 : eve ? 20 : 24, 0.6, "lamp");
    c.add(lamp.body);

    // Doorway: what lies outside depends on the time of day.
    var out = day ? ["#eaf1f2", "#cfc6b5", "#efe2c2"] : eve ? ["#e9a56f", "#5b4d58", "#6e5a52"] : ["#0d1426", "#151824", "#1b1d26"];
    c.add(rect(DL, DT, DR - DL, BB - DT, out[1]));
    c.add(rect(DL, DT, DR - DL, 44, c.lin("osky", 0, DT, 0, DT + 44, [[0, out[0]], [1, mix(out[0], out[1], 0.5)]])));
    c.add(rect(DL, 836, DR - DL, BB - 836, out[2]));
    var os = "";
    for (i = 0; i < 6; i++) os += poly([[DL + 6 + (i % 3) * 52, 660 + Math.floor(i / 3) * 70], [DL + 50 + (i % 3) * 52, 662 + Math.floor(i / 3) * 70], [DL + 48 + (i % 3) * 52, 712 + Math.floor(i / 3) * 70], [DL + 8 + (i % 3) * 52, 710 + Math.floor(i / 3) * 70]]);
    c.add(path(os, day ? "#bdb3a1" : eve ? "#4e424d" : "#11141e"));
    if (night) c.add(ell(940, 606, 2, 2, "#e8eef8", op(0.8)));
    if (day) c.add(rect(DL, DT, DR - DL, BB - DT, "#fff6e2", op(0.42)));
    // Deep basalt reveal and threshold, then the wooden lintel.
    c.add(path(poly([[DR, DT], [DR, BB], [971, 874], [971, 595]]), day ? "#d8c6a6" : eve ? "#7a5a4c" : "#17161a"));
    c.add(path(poly([[DL, BB], [DR, BB], [971, 874], [817, 874]]), day ? "#e9d7b5" : eve ? "#8a6a55" : "#1b1a1e"));
    c.add(path(poly([[812, 566], [1008, 564], [1008, 592], [812, 594]]), night ? "#21180f" : "#3b2a1d"));

    // Floor of packed earth.
    c.add(path(poly([[BL, BB], [BR, BB], [1600, 1187], [1600, 1600], [0, 1600], [0, 1187]]),
      c.lin("floor", 0, BB, 0, 1500, [[0, night ? "#1c1713" : eve ? "#2c231c" : "#3a3129"], [1, "#120f0c"]])));
    if (day) {
      c.add(path(poly([[DL, BB], [DR, BB], [1150, 1600], [610, 1600]]),
        c.lin("spill", 0, BB, 0, 1500, [[0, "#ffe9c2", 0.55], [1, "#ffe9c2", 0]])));
    } else if (eve) {
      c.add(path(poly([[DL, BB], [DR, BB], [1100, 1400], [650, 1400]]),
        c.lin("spill", 0, BB, 0, 1400, [[0, "#f0a15c", 0.3], [1, "#f0a15c", 0]])));
    }

    // Water jar beside the door, catching light on the door side.
    c.add(path("M708 902C676 846 684 782 718 760C712 750 716 742 726 740H770C780 742 784 750 778 760C812 782 818 846 788 902Z",
      c.lin("jar", 684, 0, 818, 0, day ? [[0, "#3a2418"], [0.62, "#7a4a30"], [1, "#d39a6a"]]
        : eve ? [[0, "#2e1d14"], [0.7, "#6a3e28"], [1, "#b2723e"]] : [[0, "#1c120d"], [0.7, "#4a2c1c"], [1, "#9a5a2e"]])));
    c.add(ell(748, 742, 24, 5, "#1a100a"));

    // Asher's bed: a light wooden frame with a woven mat and his worn brown cloak.
    c.add(ell(560, 984, 210, 12, "#000", op(0.35)));
    c.add(path(poly([[452, 912], [705, 912], [683, 975], [371, 975]]), day ? "#8a7350" : eve ? "#6e5638" : "#4a3a26"));
    c.add(line("M440 926L700 926M425 940L697 940M410 954L692 954", "#000", 2, op(0.18)));
    c.add(path("M540 914Q600 900 690 912L684 960Q610 972 520 962Q500 936 540 914Z", day ? "#6d4a32" : eve ? "#5a3a26" : "#3e2a1c"));
    c.add(path("M560 930Q610 922 660 932Q620 944 566 942Z", "#000", op(0.22)));
    c.add(path("M454 916Q470 904 500 912L494 950Q470 958 448 948Z", day ? "#b8a582" : eve ? "#8f7c5f" : "#5c4f3c"));
    c.add(path(poly([[352, 972], [700, 972], [698, 984], [348, 984]]), night ? "#2a1d12" : "#4e3824"));
    c.add(path(poly([[440, 908], [716, 908], [714, 916], [438, 916]]), night ? "#22180f" : "#3e2c1c"));

    // Basalt hand mill on the floor near the right wall (landscape).
    c.add(ell(1330, 960, 70, 18, "#1c1a19"));
    c.add(rect(1260, 930, 140, 30, "#2a2826"));
    c.add(ell(1330, 930, 70, 18, "#3b3835"));
    c.add(line("M1360 928L1384 896", "#4a3626", 6));

    // Light.
    if (day) {
      c.glow("door", 910, 745, 560, "#fff3da", 0.42, 520);
      c.add(path(poly([[DL, DT], [DR, DT], [700, 1600], [300, 1600]]),
        c.lin("shaft", 0, DT, 0, 1500, [[0, "#fff4dc", 0.14], [1, "#fff4dc", 0]])));
    } else {
      if (eve) c.glow("door", 910, 745, 440, "#f3a35a", 0.3, 400);
      c.glow("lamp", LX, LY - 10, night ? 620 : 520, "#ffbe6e", night ? 0.48 : 0.38, night ? 560 : 470, 0.3);
      c.glow("halo", LX, LY - 14, 46, "#fff0c8", 0.8, 0, 0.3);
      c.add(lamp.flame);
    }

    c.vignette("#000", night ? 0.82 : eve ? 0.66 : 0.55, 820, 740, 1250);
    c.grain(0.3, night ? 0.2 : 0.4);
    return c.svg();
  };

  // ---------------------------------------------------------------- carried and lying views

  function circ(x, y, r) {
    return "M" + ri(x - r) + " " + ri(y) + "a" + ri(r) + " " + ri(r) + " 0 1 0 " + ri(2 * r) + " 0a" + ri(r) + " " + ri(r) + " 0 1 0 " + -ri(2 * r) + " 0z";
  }
  // Soft cumulus: overlapping puffs with a cool shaded underside.
  function cloud(c, cx, cy, s, a) {
    var d = "", sh = "", parts = [[-1.6, 0.25, 0.85], [-0.75, -0.25, 1.2], [0.45, -0.5, 1.4], [1.55, 0.05, 1.0], [0.2, 0.35, 1.15]];
    for (var k = 0; k < parts.length; k++) {
      var px = cx + parts[k][0] * s * 62, py = cy + parts[k][1] * s * 62, r = parts[k][2] * s * 56;
      d += circ(px, py, r);
      sh += circ(px + 6, py + r * 0.28, r * 0.92);
    }
    c.add(path(sh, "#b3c8da", op(r2(a * 0.9))));
    c.add(path(d, "#ffffff", op(a)));
  }

  // A hand gripping a bed pole, seen from below. (x, y) sits on the pole axis; dir = -1 when the
  // arm comes from the left. The forearm leaves at a slant so pole and arm never form a cross.
  function grip(c, x, y, dir, skin, sleeve) {
    var g = '<g transform="translate(' + x + " " + y + ")scale(" + dir + ' 1)">';
    // Sleeve beyond the elbow, then a tapered forearm reaching down and away from the pole.
    g += path("M-200 250L-262 186L-446 330L-384 404Z", sleeve);
    g += path("M-16 2Q-118 58-252 184Q-250 236-178 262Q-80 150 14 34Z", skin);
    g += path("M-16 2Q-118 58-252 184L-240 196Q-110 74-6 14Z", "#fff", op(0.13));
    g += path("M-178 262Q-80 150 14 34L16 48Q-74 160-170 270Z", "#000", op(0.18));
    // Fist wrapped around the pole; the thumb stays hidden behind it.
    g += path("M-40 -36Q-2 -50 36 -38Q46 0 38 40Q0 54 -36 40Q-48 0 -40 -36Z", skin);
    g += line("M-36 -14Q0 -22 40 -12M-38 8Q0 0 42 10M-36 28Q0 22 40 30", "#000", 3, op(0.2));
    g += path("M-36 40Q0 54 38 40L36 46Q0 62 -34 48Z", "#000", op(0.2));
    return g + "</g>";
  }

  // Lying POV outdoors while being carried: open sky, the bed's poles and gripping hands at the
  // sides; landscape shows the carriers as dark shapes at the edges; a roof edge slides by.
  scenes.sky_carried = function (c) {
    var rnd = c.rnd;
    c.add(full(c.rad("sky", 800, 760, 1250, [[0, "#dce9ee"], [0.35, "#a6c7dd"], [1, "#4c81b1"]])));
    cloud(c, 650, 430, 1.4, 0.92);
    cloud(c, 1140, 240, 1.0, 0.85);
    cloud(c, 1010, 900, 0.75, 0.75);
    cloud(c, 250, 760, 1.1, 0.85);
    cloud(c, 1420, 610, 0.9, 0.8);
    c.add(line("M760 330q10-8 20 0q10-8 20 0M826 296q7-6 14 0q7-6 14 0", "#2a3340", 3, op(0.8)));

    // Roof edges sliding past: top-left for portrait, top-right for landscape.
    function roofEdge(pts, fringe, beams) {
      c.add(path(poly(pts), "#26282c"));
      c.add(line(fringe, "#6b5a40", 9, op(0.9)));
      c.add(path(beams, "#3a2a1c"));
    }
    roofEdge([[380, -20], [840, -20], [720, 150], [380, 270]], "M380 262L452 238L520 214L590 190L660 166L720 146", "M470 220l14 34l26-10l-14-34zM590 178l14 34l26-10l-14-34z");
    roofEdge([[1230, 300], [1620, 250], [1620, 470], [1360, 430]], "M1360 428L1430 440L1500 452L1570 462L1620 468", "M1420 430l-6 36l28 4l6-36zM1530 446l-6 36l28 4l6-36z");

    // The bed's two poles with lashed, rounded ends.
    var pole = c.lin("pole", 0, 0, 60, 0, [[0, "#3e2a1a"], [0.45, "#7a5634"], [1, "#4a321f"]]);
    c.add('<path d="M427 1650L477 1650L505 300L467 300Z" fill="' + pole + '"/>');
    c.add(path("M467 300Q486 270 505 300Z", "#5a3e26"));
    c.add('<path d="M1173 1650L1123 1650L1095 300L1133 300Z" fill="' + pole + '"/>');
    c.add(path("M1095 300Q1114 270 1133 300Z", "#5a3e26"));
    c.add(line("M466 340L506 336M466 352L506 348M1094 336L1134 340M1094 348L1134 352", "#2a1d12", 4));

    // Hands of the friends who carry him (two of them, never a count).
    c.add(grip(c, 490, 610, 1, "#a36c49", "#b6a383"));
    c.add(grip(c, 1110, 720, -1, "#8a5a3c", "#4a5872"));

    c.vignette("#1d3550", 0.35, MX, 760, 1300);
    c.grain(0.22, 0.6);
    return c.svg();
  };

  // Lying POV before Jesus: heads and shoulders lean in from the edges against a bright sky.
  // One side of the ring stays open and warm; nothing stands in that light.
  scenes.crowd_lying = function (c) {
    c.add(full(c.rad("sky", 820, 720, 1200, [[0, "#f2f5f1"], [0.4, "#bfd5e0"], [1, "#7ea8c7"]])));
    c.glow("warm", 1380, 720, 780, "#fff1d4", 0.85, 640, 0.35);
    var LX = 1380, LY = 720, CXc = 800, CYc = 760;
    // Templates seen from below: head at the origin (radius 1), top of the head toward the
    // center of view, shoulders toward the frame edge. Faces are plain backlit ovals.
    // Shoulders are short and rounded: seen from below, the rest of the body hides behind them.
    c.def('<g id="' + c.id("lc") + '"><path d="M0-1.32C1.38-1.32 1.44.3 1.22 1.16Q2.5 1.5 2.62 2.6Q2.52 3.75 1.5 4.35H-1.5Q-2.52 3.75-2.62 2.6Q-2.5 1.5-1.22 1.16C-1.44.3-1.38-1.32 0-1.32Z"/>' +
      '<ellipse cy=".18" rx=".64" ry=".82" fill="currentColor"/>' + path("M-.68.04Q0-.55.68.04Q.5-.4 0-.46Q-.5-.4-.68.04Z", "#000", op(0.4)) +
      path("M-.6.5Q-.5 1.02 0 1.08Q.5 1.02.6.5Q.3.78 0 .8Q-.3.78-.6.5Z", "#000", op(0.25)) + "</g>");
    var garments = ["#4a3f38", "#3d4150", "#57423a", "#3f4a3e", "#5c4c3d", "#4a3d4b"];
    var skins = ["#4c3427", "#422d22", "#56392b", "#3c291f"];
    // People stand on rings around the viewer (outer rows first so the inner row overlaps them).
    // The right side of every ring stays open: that is where the light is.
    var people = [], rows = [[780, 780, 52, [150, 180, 210, 238, 262]], [560, 600, 64, [88, 115, 142, 170, 198, 226, 254, 282, 308]],
      [360, 400, 80, [72, 102, 132, 162, 192, 222, 252, 282, 311]]];
    // Everyone wears a head covering against the noon sun, which also frames each face.
    var kinds = ["lc", "lc"], q = 0;
    for (var rw = 0; rw < rows.length; rw++) {
      for (var k = 0; k < rows[rw][3].length; k++, q++) {
        var a = (rows[rw][3][k] * Math.PI) / 180;
        people.push([ri(760 + rows[rw][0] * Math.cos(a)), ri(740 + rows[rw][1] * Math.sin(a)), rows[rw][2], kinds[(q * 7) % 3 === 0 ? 1 : q % 2], q % 6, (q * 5) % 4]);
      }
    }
    CXc = 760; CYc = 740;
    for (var i = 0; i < people.length; i++) {
      var p = people[i], x = p[0], y = p[1], r = p[2];
      var ang = ri((Math.atan2(CXc - x, -(CYc - y)) * 180) / Math.PI);
      var lx = LX - x, ly = LY - y, ln = Math.sqrt(lx * lx + ly * ly), off = r * 0.08;
      var warm = ln < 760;
      var haze = r < 60 ? 0.3 : r < 70 ? 0.12 : 0;
      var rim = warm ? "#ffd9a0" : "#e2edf2";
      c.add('<use href="#' + c.id(p[3]) + '" transform="translate(' + ri(x + (lx / ln) * off) + " " + ri(y + (ly / ln) * off) + ")rotate(" + ang + ")scale(" + r + ')" fill="' +
        rim + '" color="' + rim + '" opacity="' + (warm ? 0.9 : 0.6) + '"/>');
      c.add('<use href="#' + c.id(p[3]) + '" transform="translate(' + x + " " + y + ")rotate(" + ang + ")scale(" + r + ')" fill="' +
        mix(garments[p[4]], "#a9c0cf", haze) + '" color="' + mix(skins[p[5]], "#a9c0cf", haze) + '"/>');
    }
    c.vignette("#3a4a58", 0.25, MX, 760, 1300);
    c.grain(0.2, 0.6);
    return c.svg();
  };

  // ---------------------------------------------------------------- afternoon and dusk

  // The road home in warm afternoon light: olive trees cast long shadows across the dust,
  // the town of basalt houses waits at the end of the road.
  scenes.road_home = function (c) {
    var rnd = c.rnd, i, k;
    var F = 900, CY = 600, EYE = 1.6;
    function P(x, y, z) { return [MX + (F * x) / z, CY - (F * (y - EYE)) / z]; }
    function G(x, z) { return P(x, 0, z); }

    c.add(rect(0, 0, W, 612, c.lin("sky", 0, 0, 0, 600, [[0, "#84a7c1"], [0.55, "#cbd4cd"], [0.85, "#efd7a9"], [1, "#f4cd92"]])));
    c.glow("sun", 100, 470, 780, "#fff0c4", 0.62, 560);
    c.add(path(ridge(rnd, 520, 24, 7, 612), "#b9a87c"));
    c.add(path(ridge(rnd, 562, 16, 9, 612), "#a19566"));
    c.add(rect(0, 600, W, 1000, c.lin("field", 0, 600, 0, 1300, [[0, "#c9b27b"], [1, "#9a7f4e"]])));

    // The town at the end of the road: sunlit west faces, cooler south fronts.
    var houses = [[-1.2, 1.5, 38, 3.6], [-12, -8.2, 34, 3.4], [9.4, 13, 34, 3.2], [-3.4, -1.0, 33, 3.0], [4.8, 8.6, 31.5, 3.0], [-7.6, -3.8, 30, 3.2], [1.1, 4.4, 29, 3.3]];
    for (i = 0; i < houses.length; i++) {
      var hx0 = houses[i][0], hx1 = houses[i][1], hz = houses[i][2], hh = houses[i][3], dep = 5;
      if (hx0 > 0) c.add(path(poly([P(hx0, hh, hz), P(hx0, hh, hz + dep), G(hx0, hz + dep), G(hx0, hz)]), "#a48a6c"));
      else c.add(path(poly([P(hx1, hh, hz), P(hx1, hh, hz + dep), G(hx1, hz + dep), G(hx1, hz)]), "#4d4553"));
      c.add(path(poly([P(hx0, hh, hz), P(hx1, hh, hz), G(hx1, hz), G(hx0, hz)]), "#6f6159"));
      c.add(path(poly([P(hx0, hh + 0.12, hz), P(hx1, hh + 0.12, hz), P(hx1, hh, hz), P(hx0, hh, hz)]), "#d2b286"));
      var dx = lerp(hx0, hx1, 0.3 + rnd() * 0.3);
      c.add(path(poly([G(dx, hz), P(dx, 1.5, hz), P(dx + 0.7, 1.5, hz), G(dx + 0.7, hz)]), "#2c2522"));
    }

    // The road of packed dust narrowing toward the town, with worn tracks.
    c.add(path(poly([G(-2.2, 1.1), G(-1.5, 29), G(1.5, 29), G(2.2, 1.1)]), c.lin("road", 0, 640, 0, 1500, [[0, "#e6cb98"], [1, "#d1ae78"]])));
    c.add(path(poly([G(-0.75, 1.3), G(-0.62, 28), G(-0.5, 28), G(-0.55, 1.3)]) + poly([G(0.55, 1.3), G(0.5, 28), G(0.62, 28), G(0.75, 1.3)]), "#c29f6c", op(0.6)));

    // Olive trees: [x, z]. Long shadows fall to the right and away from the low western sun,
    // so the canopies of the left-hand trees lay bands of shade across the road.
    var trees = [[-3.9, 17], [4.6, 14], [-4.4, 10.5], [3.8, 7.5], [-3.6, 5.0]];
    var shade = "";
    for (i = 0; i < trees.length; i++) {
      var tx = trees[i][0], tz = trees[i][1], pts = [];
      for (k = 0; k < 14; k++) {
        var a = (k / 14) * Math.PI * 2, along = 5.6 + Math.cos(a) * 2.5, across = Math.sin(a) * 1.5;
        pts.push(G(tx + along * 0.92 - across * 0.38, tz + along * 0.38 + across * 0.92));
      }
      shade += poly(pts) + poly([G(tx - 0.1, tz), G(tx + 3.2 * 0.92 - 0.1, tz + 3.2 * 0.38 + 0.22), G(tx + 3.2 * 0.92 + 0.1, tz + 3.2 * 0.38 - 0.22), G(tx + 0.1, tz)]);
    }
    c.add(path(shade, "#6f5446", op(0.4)));

    // Stones and dry tufts along the roadside.
    var rs = "", tf = "";
    for (i = 0; i < 26; i++) {
      var sz = 3 + Math.pow(rnd(), 1.4) * 20, sx = (rnd() < 0.5 ? -1 : 1) * (2.3 + rnd() * 1.6), ss = 0.12 + rnd() * 0.18;
      var sp = G(sx, sz), sw = (F * ss) / sz;
      rs += "M" + ri(sp[0] - sw) + " " + ri(sp[1]) + "q" + ri(sw) + " " + ri(-sw * 0.9) + " " + ri(sw * 2) + " 0z";
      if (i % 2) tf += "M" + ri(sp[0] + sw * 2) + " " + ri(sp[1]) + "l" + ri(-sw * 0.4) + " " + ri(-sw * 1.6) + "M" + ri(sp[0] + sw * 2.2) + " " + ri(sp[1]) + "l" + ri(sw * 0.5) + " " + ri(-sw * 1.4);
    }
    c.add(path(rs, "#7d6b55"));
    c.add(line(tf, "#8f7c4c", 2.4, op(0.8)));

    // Olive trees: gnarled, forked trunks and wide, broken, silver-green crowns (local units = meters).
    var trunk = "M-.28 0C-.1-.6-.42-1-.16-1.6L-.82-2.3L-.66-2.42L-.04-1.86L.04-1.9L.72-2.56L.86-2.42L.24-1.55C.42-1 .14-.5.34 0Z";
    for (i = 0; i < trees.length; i++) {
      var bx = trees[i][0], bz = trees[i][1], s = r2(F / bz), base = G(bx, bz);
      var g = '<g transform="translate(' + ri(base[0]) + " " + ri(base[1]) + ")scale(" + s + ')">';
      g += path(trunk, "#4a3a2c") + path("M-.28 0C-.1-.6-.42-1-.16-1.6L-.82-2.3L-.74-2.36L-.08-1.62C-.3-1-.02-.6-.12 0Z", "#8a7458", op(0.6));
      var cd = "", cs = "", cl = "";
      for (k = 0; k < 13; k++) {
        // Clumps sit around a connected, flattened crown (outer ring) plus a few inside.
        var ca = (k / 9) * Math.PI * 2 + rnd() * 0.4, cr = k < 9 ? 0.85 + rnd() * 0.15 : rnd() * 0.5;
        var px = Math.cos(ca) * cr * 1.45, py = -2.95 + Math.sin(ca) * cr * 0.55, pr = 0.4 + rnd() * 0.22;
        var arc = "M" + r2(px - pr) + " " + r2(py) + "a" + r2(pr) + " " + r2(pr * 0.8) + " 0 1 0 " + r2(2 * pr) + " 0a" + r2(pr) + " " + r2(pr * 0.8) + " 0 1 0 " + r2(-2 * pr) + " 0z";
        cd += arc;
        cs += "M" + r2(px - pr) + " " + r2(py + 0.16) + "a" + r2(pr) + " " + r2(pr * 0.8) + " 0 1 0 " + r2(2 * pr) + " 0a" + r2(pr) + " " + r2(pr * 0.8) + " 0 1 0 " + r2(-2 * pr) + " 0z";
        if (px < 0.3) cl += "M" + r2(px - pr * 0.9) + " " + r2(py - 0.08) + "a" + r2(pr * 0.6) + " " + r2(pr * 0.45) + " 0 1 0 " + r2(pr * 1.2) + " 0a" + r2(pr * 0.6) + " " + r2(pr * 0.45) + " 0 1 0 " + r2(-pr * 1.2) + " 0z";
      }
      g += path(cs, "#545a3c") + path(cd, "#7c8462") + path(cl, "#b6b98e", op(0.85));
      c.add(g + "</g>");
    }

    c.glow("haze", MX, 610, 980, "#ffe9bf", 0.3, 420);
    c.vignette("#5a3a1e", 0.4, MX, 700, 1300);
    c.grain(0.25, 0.6);
    return c.svg();
  };

  // Asher's doorway at dusk: amber lamplight inside, the sky turning violet; landscape also sees
  // down the lane to the lake, where one other window is lit.
  scenes.doorway_evening = function (c) {
    var rnd = c.rnd, i;
    var DL = 728, DR = 872, DT = 612, DB = 902;
    c.add(rect(0, 0, W, 720, c.lin("sky", 0, 0, 0, 660, [[0, "#1f1a35"], [0.35, "#3b3157"], [0.62, "#77587a"], [0.82, "#c07e79"], [1, "#e5a473"]])));
    c.add(path("M520 120h3v3h-3zM980 210h3v3h-3zM1262 80h3v3h-3zM300 260h2v2h-2z", "#f4f1ea", op(0.85)));

    // View down the lane (left, landscape): dusk lake, far hills, rooftops with one lit window.
    c.add(path(ridge(rnd, 612, 8, 5, 650), "#3d3350"));
    c.add(rect(0, 642, 420, 70, c.lin("lake", 0, 642, 0, 712, [[0, "#c28a86"], [1, "#4c3d5b"]])));
    c.add(path("M-10 700L80 690V662H170V700L240 694V676H330V712L400 706V1000H-10Z", "#1b1622"));
    c.add(rect(120, 676, 12, 10, "#f2b45a"));
    c.add(rect(0, 820, 400, 780, "#221c24"));

    // House front of black basalt, warmed only near the doorway.
    c.add(rect(380, 430, 1220, 1170, "#1d1922"));
    var tones = ["#2d2833", "#36303c", "#403846", "#5a4434", "#7a5534"];
    c.add('<g clip-path="' + c.clip("front", "M380 430H1600V920H380Z") + '">');
    addStones(c, stones(rnd, flat, {
      u0: 380, u1: W, v0: 448, v1: 920, ch: [46, 68], sw: [74, 136], gap: 4, jit: 5, n: 5,
      keep: function (u, v) { return !(u > DL - 24 && u < DR + 24 && v > DT - 30); },
      tone: function (x, y, r) {
        var d = Math.sqrt((x - 800) * (x - 800) + (y - 760) * (y - 760) * 1.3);
        if (d < 300) return 3 + (r() < 0.5 && d < 200 ? 1 : 0);
        return Math.floor(r() * 3);
      }
    }), tones);
    // Corner stones at the left edge of the house.
    var q = "";
    for (i = 0; i < 7; i++) q += poly([[380, 452 + i * 66], [380 + (i % 2 ? 60 : 96), 452 + i * 66], [380 + (i % 2 ? 60 : 96), 512 + i * 66], [380, 512 + i * 66]]);
    c.add(path(q, "#3c3644"));
    c.add("</g>");
    // Roof edge of packed mud over reeds, with beam ends under it.
    c.add(path("M370 414L1600 406V446L370 452Z", "#2b232a"));
    var fr = "M370 418";
    for (var fx = 370; fx < W; fx += 22 + rnd() * 26) fr += "L" + ri(fx) + " " + ri(400 + rnd() * 12);
    c.add(path(fr + "L1600 404V414L370 418Z", "#4a3a2c"));
    var be = "";
    for (i = 0; i < 11; i++) be += "M" + (430 + i * 112) + " 448h22v18h-22z";
    c.add(path(be, "#2a1e15"));

    // Doorway: amber interior with a lit lamp niche, the door leaf swung inward.
    c.add(rect(DL, DT, DR - DL, DB - DT, c.rad("inside", 815, 770, 220, [[0, "#ffd284"], [0.45, "#d98a3a"], [1, "#6e3714"]], 260)));
    c.add(rect(790, 712, 46, 40, "#ffe3a8", op(0.7)));
    c.add(path("M802 744h22l-4-10h-14z", "#7a4a2a"));
    c.add(path(poly([[DL, DT], [DL + 34, DT + 14], [DL + 34, DB - 8], [DL, DB]]), "#3a2414"));
    c.add(path(poly([[DR, DT], [DR, DB], [DR - 14, DB - 10], [DR - 14, DT + 8]]), "#c98446"));
    c.add(path(poly([[706, 588], [894, 586], [894, 614], [706, 616]]), "#3a2a1d"));
    c.add(path(poly([[716, 902], [884, 902], [892, 920], [708, 920]]), "#5e4a40"));

    // Water jar by the door, lit on the door side.
    c.add(path("M612 912C590 868 596 822 620 806C616 798 620 792 628 790H660C668 792 672 798 668 806C692 822 698 868 676 912Z",
      c.lin("jar", 594, 0, 700, 0, [[0, "#1e1418"], [0.7, "#4a2c22"], [1, "#c27a3c"]])));

    // Ground in front of the house and the warm spill from the door.
    c.add(rect(380, 918, 1220, 682, c.lin("ground", 0, 918, 0, 1400, [[0, "#3b3037"], [1, "#1c171c"]])));
    c.add(path(poly([[DL, 920], [DR, 920], [1010, 1300], [590, 1300]]), c.lin("spill", 0, 920, 0, 1300, [[0, "#f3a24a", 0.5], [1, "#f3a24a", 0]])));
    c.glow("door", 800, 760, 420, "#f2a24c", 0.38, 380);

    c.vignette("#0e0b16", 0.6, MX, 720, 1300);
    c.grain(0.28, 0.35);
    return c.svg();
  };

  // Calm neutral gradient for unknown ids.
  function fallback(c) {
    c.add(full(c.lin("bg", 0, 0, 0, 1600, [[0, "#3b3e44"], [0.6, "#5a5751"], [1, "#2c2b29"]])));
    c.vignette("#000", 0.4);
    return c.svg();
  }

  // ---------------------------------------------------------------- public API

  // Point of view can swap a scene for its lying or eye-level counterpart, so a camera
  // change (fx "pov") can simply re-render the current background with the new pov.
  var LYING = { asher_home: "asher_ceiling", lane: "sky_carried", crowd: "crowd_lying" };
  var STANDING = { asher_ceiling: "asher_home", sky_carried: "lane", crowd_lying: "crowd" };
  var TIMES = { day: 1, evening: 1, night: 1 };

  function resolve(bgId, pov) {
    var id = typeof bgId === "string" ? bgId : "";
    if (pov === "lying" && LYING[id]) return LYING[id];
    if (pov === "standing" && STANDING[id]) return STANDING[id];
    return id;
  }

  BHS.art = {
    ids: IDS.slice(),
    // Canvas size of every scene (viewBox), rendered with preserveAspectRatio "xMidYMid slice".
    viewBox: [W, H],
    // Where the luminous space sits in each crowd scene, in canvas units, so the UI can
    // anchor its presence light there. Map to the screen with the slice math:
    // s = max(stageW / 1600, stageH / 1600); x = stageW / 2 + (cx - 800) * s; y = stageH / 2 + (cy - 800) * s.
    lightAt: { crowd: [800, 650], crowd_lying: [1380, 720] },
    // Returns the bg id that render() will actually draw for this pov.
    resolve: resolve,
    // opts: { pov?: "normal"|"lying"|"standing", time?: "day"|"evening"|"night", uid?: string }
    render: function (bgId, opts) {
      var o = opts || {};
      var id = resolve(bgId, o.pov);
      var known = Object.prototype.hasOwnProperty.call(scenes, id);
      var uid = typeof o.uid === "string" && /^[A-Za-z0-9_-]{1,24}$/.test(o.uid) ? o.uid : (++renderCount).toString(36);
      var so = { pov: o.pov, time: TIMES[o.time] ? o.time : "day" };
      try {
        return known ? scenes[id](new Ctx(id, uid), so) : fallback(new Ctx("unknown", uid));
      } catch (err) {
        try { return fallback(new Ctx("unknown", uid)); } catch (e2) {
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true"><rect width="1600" height="1600" fill="#3b3e44"/></svg>';
        }
      }
    }
  };
})();

</script>
<script>/* js/portraits.js */
/* Character portraits for "Before He Stood", drawn as inline SVG strings.
   Owner: portrait agent. See docs/SPEC.md §5.6 (look), §6.1 (fixed facts), §7 (guardrails).
   - Classic script, no modules, no fetch, no external assets, no SVG filters.
   - Each portrait is a half-body bust on a transparent background, viewBox 0 0 600 900,
     bottom edge cut by the frame. Faces sit above y ~560 because the text panel covers
     the lower part of the stage. The root <svg> uses preserveAspectRatio="xMidYMax meet",
     so a container of any size keeps the figure standing on its bottom edge.
   - FACING: every figure faces screen-LEFT (three-quarter view, gaze to the left).
     BHS.portraits.facing[id] says so too; the UI can mirror a portrait with CSS
     transform: scaleX(-1) when it stands on the left of the stage (the art has no text).
   - Style: cut-paper relief. Flat color planes in natural dyes, one warm shadow color and
     one warm light color laid over them as planes, no outlines. Light comes from the upper
     left (the side they face): a thin warm rim catches the upper-left edges and the figure
     casts a soft offset shadow, so it separates from dark interiors and bright noon scenes.
   - Jesus is never drawn: render("jesus") returns null. No crosses, halos or text.
   - Ids inside each SVG are prefixed with the character id plus a per-render counter. */
(function () {
  "use strict";
  var BHS = (window.BHS = window.BHS || {});

  var IDS = ["menahem", "hanan", "yonah", "asher", "mother", "brother", "neighbor", "passerby", "partners", "scribes"];
  var renderCount = 0;

    lang: "both",
    speed: "normal",
    size: 1,
    test: false,
    debug: false,
    reduced: false,
    artKey: null,
    artFlip: false,
    artSeq: 0,
    artTimer: 0,
    capKey: "",
    pinKey: "",
    pinItemsKey: "",
    replyTimer: 0,
    riseTimer: 0,
    handlers: {}
  };

  // ------------------------------------------------------------------ DOM helpers

  function $(id) {
    return doc.getElementById(id);
  }

  function append(node, kids) {
    if (kids == null) return node;
    if (!Array.isArray(kids)) kids = [kids];
    for (var i = 0; i < kids.length; i++) {
      var c = kids[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) append(node, c);
      else node.appendChild(typeof c === "string" ? doc.createTextNode(c) : c);
    }
    return node;
  }

  function h(tag, props, kids) {
    var n = doc.createElement(tag);
    if (props) {
      for (var k in props) {
        if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
        var v = props[k];
        if (v == null || v === false) continue;
        if (k === "class") n.className = v;
        else if (k === "text") n.textContent = v;
        else if (k === "on") {
          for (var ev in v) if (Object.prototype.hasOwnProperty.call(v, ev)) n.addEventListener(ev, v[ev]);
        } else if (k === "style") n.setAttribute("style", v);
        else n.setAttribute(k, v === true ? "" : String(v));
      }
    }
    return append(n, kids);
  }

  function clear(n) {
    while (n && n.firstChild) n.removeChild(n.firstChild);
    return n;
  }

  function svgIcon(paths) {
    var ns = "http://www.w3.org/2000/svg";
    var svg = doc.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.8");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    paths.forEach(function (p) {
      var el = doc.createElementNS(ns, p.tag || "path");
      Object.keys(p).forEach(function (k) {
        if (k !== "tag") el.setAttribute(k, p[k]);
      });
      svg.appendChild(el);
    });
    return svg;
  }

  // ------------------------------------------------------------------ language helpers

  function E() {
    return BHS.engine;
  }

  function langs() {
    return S.lang === "en" ? ["en"] : S.lang === "ko" ? ["ko"] : ["ko", "en"];
  }

  function pick(t, l) {
    if (E()) return E().pickLang(t, l);
    if (!t) return "";
    return typeof t === "string" ? t : t[l] || t.ko || "";
  }

  function u(key) {
    return (BHS.ui && BHS.ui[key]) || { ko: key, en: key };
  }

  // One string for attributes (aria-label, title). In "both" mode joins with a middle dot.
  function flat(t) {
    if (!t) return "";
    if (S.lang === "ko") return pick(t, "ko");
    if (S.lang === "en") return pick(t, "en");
    var ko = pick(t, "ko");
    var en = pick(t, "en");
    return ko === en ? ko : ko + " · " + en;
  }

  // Plain bilingual nodes: the second language goes in a span.en (styled per context).
  function bi(t) {
    var ls = langs();
    if (ls.length === 1) return [pick(t, ls[0])];
    var ko = pick(t, "ko");
    var en = pick(t, "en");
    if (ko === en) return [ko];
    return [h("span", { class: "ko", lang: "ko" }, ko), h("span", { class: "en", lang: "en" }, en)];
  }

  // Rich text into a host: tokens resolved, *emphasis* -> <em>, verse tokens in span.q.
  function richInto(host, t, l, state, chars) {
    var segs = E() ? E().resolveSegments(t, l, state) : [{ text: pick(t, l), em: false }];
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      var wrap = null;
      var target = host;
      if (s.em) {
        wrap = h("em");
        target = wrap;
      }
      if (s.kind === "v") {
        var q = h("span", { class: "q" });
        if (wrap) wrap.appendChild(q);
        else wrap = q;
        target = q;
      }
      if (chars) {
        var arr = Array.from(s.text);
        for (var j = 0; j < arr.length; j++) {
          var c = doc.createElement("span");
          c.className = "c";
          c.textContent = arr[j];
          target.appendChild(c);
          chars.push(c);
        }
      } else {
        target.appendChild(doc.createTextNode(s.text));
      }
      if (wrap) host.appendChild(wrap);
    }
    return host;
  }

  function biRich(t, state) {
    var ls = langs();
    if (ls.length === 1) return richInto(h("span", { lang: ls[0] }), t, ls[0], state, null);
    var frag = doc.createDocumentFragment();
    frag.appendChild(richInto(h("span", { class: "ko", lang: "ko" }), t, "ko", state, null));
    frag.appendChild(richInto(h("span", { class: "en", lang: "en" }), t, "en", state, null));
    return frag;
  }

  function verseOf(key, l) {
    var txt = E() && E().verseText(key, l);
    if (txt) return txt;
    return S.debug ? "[" + key + "]" : "…";
  }

  function refOf(key, l) {
    var r = E() && E().verseRef(key, l);
    return r || (S.debug ? "[" + key + "]" : "");
  }

  function refLine(key) {
    var ls = langs();
    var parts = [];
    ls.forEach(function (l) {
      var r = refOf(key, l);
      if (r && parts.indexOf(r) < 0) parts.push(r);
    });
    return parts.join(" · ");
  }

  function characterName(id, routeId) {
    var c = BHS.characters && BHS.characters[id];
    if (!c) return null;
    // SPEC 6.1: outside Asher's POV the mother is labelled "Asher's mother".
    if (id === "mother" && routeId !== "asher" && c.role) return c.role;
    return c.name;
  }

  // ------------------------------------------------------------------ typewriter

  var typer = { raf: 0, seq: null, i: 0, start: 0, done: true, onDone: null };

  function instantText() {
    return S.speed === "instant" || S.reduced || S.test;
  }

  function pauseAfter(ch) {
    if (".?!…。".indexOf(ch) >= 0) return 6;
    if (",;:、—―".indexOf(ch) >= 0) return 3;
    return 1;
  }

  // The typewriter timeline: [{ c, t }] sorted by t (ms from the start). Each group (one language) gets
  // its natural timeline (its rate, longer pauses after punctuation). In "both" mode the languages type
  // in parallel: every group starts at t = 0, and the shorter timelines are stretched (longest / own
  // duration) so that the last characters of all groups appear together.
  function typeTimeline(groups) {
    var lines = groups.map(function (g) {
      var t = 0;
      var times = g.chars.map(function (c) {
        var at = t;
        t += g.rate * pauseAfter(c.textContent);
        return at;
      });
      return { chars: g.chars, times: times, end: times.length ? times[times.length - 1] : 0 };
    });
    var longest = 0;
    lines.forEach(function (ln) {
      if (ln.end > longest) longest = ln.end;
    });
    var seq = [];
    lines.forEach(function (ln) {
      var k = ln.end > 0 ? longest / ln.end : 1;
      ln.chars.forEach(function (c, i) {
        // The last character lands exactly on `longest`, whatever rounding the stretch gives.
        seq.push({ c: c, t: ln.end > 0 && i === ln.chars.length - 1 ? longest : ln.times[i] * k });
      });
    });
    // Array sort is stable (ES2019), so at equal times the first language stays first.
    seq.sort(function (a, b) {
      return a.t - b.t;
    });
    return seq;
  }

  function typeStart(groups, onDone) {
    typeStop();
    var seq = typeTimeline(groups);
    typer.seq = seq;
    typer.i = 0;
    typer.done = false;
    typer.onDone = onDone || null;
    if (!seq.length) {
      typeFinish();
      return;
    }
    typer.start = performance.now();
    typer.raf = requestAnimationFrame(typeTick);
  }

  function typeTick(now) {
    var seq = typer.seq;
    if (!seq) return;
    var elapsed = now - typer.start;
    while (typer.i < seq.length && seq[typer.i].t <= elapsed) {
      seq[typer.i].c.className = "c on";
      typer.i++;
    }
    if (typer.i >= seq.length) typeFinish();
    else typer.raf = requestAnimationFrame(typeTick);
  }

  function typeFinish() {
    cancelAnimationFrame(typer.raf);
    var seq = typer.seq || [];
    for (var i = typer.i; i < seq.length; i++) seq[i].c.className = "c on";
    typer.i = seq.length;
    var wasDone = typer.done;
    typer.done = true;
    var cb = typer.onDone;
    typer.onDone = null;
    if (!wasDone && cb) cb();
  }

  function typeStop() {
    cancelAnimationFrame(typer.raf);
    typer.seq = null;
    typer.i = 0;
    typer.done = true;
    typer.onDone = null;
  }

  function completeTyping() {
    if (typer.done) return false;
    typeFinish();
    return true;
  }

  function isTyping() {
    return !typer.done;
  }

  // ------------------------------------------------------------------ stage

  var FALLBACK = {
    black: "linear-gradient(180deg,#131210,#1d1b18)",
    dawn_lamp: "radial-gradient(60% 40% at 50% 62%,#7a5326 0%,#3a2a1b 45%,#1c1712 100%)",
    shore_dawn: "linear-gradient(180deg,#8fa7b6 0%,#d9c7a2 55%,#4d5a5e 56%,#2b3236 100%)",
    asher_ceiling: "linear-gradient(180deg,#2d241c 0%,#5c4835 60%,#c9a46a 100%)",
    asher_home: "linear-gradient(180deg,#4d3e30 0%,#7e6850 70%,#3b3027 100%)",
    lane: "linear-gradient(90deg,#26231f 0 22%,#cfd6d6 22% 78%,#26231f 78%)",
    sky_carried: "linear-gradient(180deg,#78a9c9 0%,#cfe4ee 70%,#a88d6a 100%)",
    crowd: "radial-gradient(50% 35% at 50% 40%,#fff0c8 0%,#d9cdb0 40%,#5b5a52 100%)",
    crowd_lying: "radial-gradient(45% 30% at 50% 20%,#fff2cf 0%,#c5d3d8 45%,#3c3a36 100%)",
    road_home: "linear-gradient(180deg,#e4c58a 0%,#f0dcb3 55%,#8a7556 100%)",
    doorway_evening: "linear-gradient(180deg,#3d3247 0%,#a9744c 70%,#2d241f 100%)",
    lamp_night: "radial-gradient(45% 30% at 50% 60%,#8a5a22 0%,#2a1f15 50%,#100e0b 100%)"
  };

  function namespaceSvg(svg, prefix) {
    return svg
      .replace(/(\s)id=(["'])([^"']*)\2/g, function (m, sp, q, id) {
        return sp + "id=" + q + prefix + id + q;
      })
      .replace(/url\(\s*(["']?)#([^)"'\s]+)\1\s*\)/g, function (m, q, id) {
        return "url(#" + prefix + id + ")";
      })
      .replace(/(xlink:href|href)=(["'])#([^"']*)\2/g, function (m, attr, q, id) {
        return attr + "=" + q + "#" + prefix + id + q;
      });
  }

  function artNode(bg, pov, time) {
    var markup = null;
    var opts = { pov: pov };
    if (time) opts.time = time;
    try {
      if (BHS.art && typeof BHS.art.render === "function") markup = BHS.art.render(bg, opts);
    } catch (err) {
      if (window.console) console.warn("[BHS.view] art.render failed for " + bg, err);
      markup = null;
    }
    var holder = doc.createElement("div");
    holder.style.cssText = "position:absolute;inset:0";
    if (typeof markup === "string" && markup.indexOf("<svg") >= 0) {
      holder.innerHTML = namespaceSvg(markup, "a" + ++S.artSeq + "-");
      var svg = holder.querySelector("svg");
      if (svg) {
        svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
        svg.setAttribute("width", "100%");
        svg.setAttribute("height", "100%");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("focusable", "false");
        return svg;
      }
    }
    return h("div", { class: "art__fallback", style: "background:" + (FALLBACK[bg] || FALLBACK.black) });
  }

  function setArt(bg, pov, time) {
    bg = bg || "black";
    var key = bg + "|" + pov + "|" + (time || "");
    if (key === S.artKey) return;
    S.artKey = key;
    var a = $("artA");
    var b = $("artB");
    var incoming = S.artFlip ? a : b;
    var outgoing = S.artFlip ? b : a;
    S.artFlip = !S.artFlip;
    clear(incoming);
    incoming.appendChild(artNode(bg, pov, time));
    // Force a style flush so the fade runs even when both layers change in one frame.
    void incoming.offsetWidth;
    incoming.classList.add("is-on");
    outgoing.classList.remove("is-on");
    clearTimeout(S.artTimer);
    S.artTimer = setTimeout(
      function () {
        if (!outgoing.classList.contains("is-on")) clear(outgoing);
      },
      S.test ? 0 : 900
    );
  }

  function setPov(pov) {
    var stage = $("stage");
    var prev = stage.getAttribute("data-pov") || "normal";
    if (prev === pov) return;
    stage.setAttribute("data-pov", pov);
    if (prev === "lying" && pov !== "lying" && !S.reduced && !S.test) {
      stage.classList.remove("is-rising");
      void stage.offsetWidth;
      stage.classList.add("is-rising");
      clearTimeout(S.riseTimer);
      S.riseTimer = setTimeout(function () {
        stage.classList.remove("is-rising");
      }, 2800);
    }
  }

  function setLight(level) {
    $("light").setAttribute("data-level", level || "off");
  }

  // Anchor the light on the place the art reserves for it (BHS.art.lightAt, in canvas units),
  // mapping canvas -> screen through the SVG's xMidYMid slice transform. Falls back to CSS.
  function placeLight() {
    var light = $("light");
    var art = BHS.art;
    var key = S.artKey ? S.artKey.split("|") : null;
    var drawn = key ? (art && typeof art.resolve === "function" ? art.resolve(key[0], key[1]) : key[0]) : null;
    var pt = drawn && art && art.lightAt && art.lightAt[drawn];
    if (!pt) {
      light.style.removeProperty("--light-x");
      light.style.removeProperty("--light-y");
      return;
    }
    var stage = $("stage");
    var W = stage.clientWidth;
    var H = stage.clientHeight;
    var artEl = $("art");
    if (!W || !H || !artEl) return;
    var vbW = 1600;
    var vbH = 1600;
    var svg = artEl.querySelector(".art__layer.is-on svg");
    var vb = svg && svg.getAttribute("viewBox");
    if (vb) {
      var parts = vb.split(/[\s,]+/).map(Number);
      if (parts.length === 4 && parts[2] > 0 && parts[3] > 0) {
        vbW = parts[2];
        vbH = parts[3];
      }
    }
    // Layout box of the art (ignores the small pov tilt) relative to the stage.
    var ax = artEl.offsetLeft;
    var ay = artEl.offsetTop;
    var aw = artEl.offsetWidth;
    var ah = artEl.offsetHeight;
    var s = Math.max(aw / vbW, ah / vbH);
    var x = ax + (aw - vbW * s) / 2 + pt[0] * s;
    var y = ay + (ah - vbH * s) / 2 + pt[1] * s;
    var lx = light.offsetLeft;
    var ly = light.offsetTop;
    var lw = light.offsetWidth || W;
    var lh = light.offsetHeight || H;
    light.style.setProperty("--light-x", (((x - lx) / lw) * 100).toFixed(2) + "%");
    light.style.setProperty("--light-y", (((y - ly) / lh) * 100).toFixed(2) + "%");
  }

  function setCaption(t) {
    var c = $("caption");
    var key = t ? JSON.stringify(t) + "|" + S.lang : "";
    if (key === S.capKey) return;
    S.capKey = key;
    clear(c);
    if (!t) {
      c.hidden = true;
      return;
    }
    append(c, bi(t));
    c.hidden = false;
  }

  function markedNodes(text, marks) {
    if (marks === "*") return [h("mark", null, text)];
    var list = Array.isArray(marks) ? marks : [];
    var hits = [];
    list.forEach(function (m) {
      if (!m) return;
      var i = text.indexOf(m);
      if (i >= 0) hits.push({ i: i, j: i + m.length });
    });
    hits.sort(function (x, y) {
      return x.i - y.i;
    });
    var out = [];
    var pos = 0;
    hits.forEach(function (hit) {
      if (hit.i < pos) return;
      if (hit.i > pos) out.push(text.slice(pos, hit.i));
      out.push(h("mark", null, text.slice(hit.i, hit.j)));
      pos = hit.j;
    });
    if (pos < text.length) out.push(text.slice(pos));
    return out;
  }

  function setEcho(echo) {
    var e = $("echo");
    clear(e);
    if (!echo) {
      e.hidden = true;
      return;
    }
    var ls = langs();
    ls.forEach(function (l, idx) {
      var marks = echo.marks === "*" ? "*" : echo.marks ? echo.marks[l] : null;
      var span = h("span", { class: idx > 0 ? "en" : "ko", lang: l });
      append(span, markedNodes(verseOf(echo.key, l), marks));
      e.appendChild(span);
    });
    var ref = refLine(echo.key);
    if (ref) e.appendChild(h("span", { class: "echo__ref" }, ref));
    e.hidden = false;
  }

  function receiptText() {
    var t = u("readReceipt");
    if (S.lang === "ko") return t.ko;
    if (S.lang === "en") return t.en;
    return t.ko.replace(/\s*✓\s*$/, "") + " · " + t.en;
  }

  function setPinned(pinned, state) {
    var p = $("pin");
    var key = pinned ? JSON.stringify(pinned) + "|" + S.lang : "";
    if (key === S.pinKey) return;
    var itemsKey = pinned ? JSON.stringify(pinned.items) + "|" + S.lang : "";
    var onlyReadChanged = pinned && itemsKey === S.pinItemsKey && pinned.read && !p.querySelector(".receipt");
    S.pinKey = key;
    S.pinItemsKey = itemsKey;
    if (onlyReadChanged) {
      p.appendChild(h("span", { class: "receipt", "data-testid": "read-receipt" }, receiptText()));
      return;
    }
    clear(p);
    if (!pinned) {
      p.hidden = true;
      p.removeAttribute("data-testid");
      return;
    }
    p.setAttribute("data-testid", "thought-bubble");
    p.setAttribute("aria-label", flat(u("pinnedThought")));
    var ls = langs();
    pinned.items.forEach(function (it) {
      var row = h("div", { class: "pin__item" });
      if (it.type === "verse") {
        ls.forEach(function (l, idx) {
          var vt = verseOf(it.key, l);
          row.appendChild(h("span", { class: idx > 0 ? "en" : "ko", lang: l }, E() ? E().quoteVerse(vt) : "“" + vt + "”"));
        });
        var ref = refLine(it.key);
        if (ref) row.appendChild(h("span", { class: "pin__ref" }, ref));
      } else if (it.text) {
        row.appendChild(biRich(it.text, state));
      }
      p.appendChild(row);
    });
    if (pinned.read) p.appendChild(h("span", { class: "receipt", "data-testid": "read-receipt" }, receiptText()));
    p.hidden = false;
  }

  function setHush(on) {
    doc.body.classList.toggle("is-hush", !!on);
  }

  // ------------------------------------------------------------------ portraits (VN-style busts)

  var portraitCache = {};

  // Scene light washes for portraits so figures sit in lamp, dusk, or night light.
  function portraitLight(stage) {
    if (!stage) return "";
    var bg = stage.bg, time = stage.time;
    if (bg === "dawn_lamp") return "lamp";
    if (bg === "lamp_night") return "night";
    if (bg === "doorway_evening") return "dusk";
    if (bg === "asher_home" || bg === "asher_ceiling") {
      if (time === "night") return "night";
      if (time === "evening") return "dusk";
    }
    return "";
  }

  function portraitMarkup(id, pose, light) {
    var key = id + "|" + (pose || "") + "|" + (light || "");
    if (Object.prototype.hasOwnProperty.call(portraitCache, key)) return portraitCache[key];
    var m = null;
    try {
      var opts = {};
      if (pose) opts.pose = pose;
      if (light) opts.light = light;
      if (BHS.portraits && typeof BHS.portraits.render === "function") m = BHS.portraits.render(id, opts);
    } catch (err) {
      if (window.console) console.warn("[BHS.view] portraits.render failed for " + id, err);
      m = null;
    }
    if (typeof m !== "string" || m.indexOf("<svg") < 0) m = null;
    portraitCache[key] = m;
    return m;
  }

  function dropFigure(fig) {
    fig.removeAttribute("data-testid");
    fig.classList.add("is-out");
    fig.setAttribute("data-slot", "gone");
    setTimeout(
      function () {
        if (fig.parentNode) fig.parentNode.removeChild(fig);
      },
      S.test || S.reduced ? 0 : 260
    );
  }

  function makeFigure(entry, key, markup) {
    // Busts face inward: mirror the art when it faces away from the stage centre.
    var facing = BHS.portraits && BHS.portraits.facing && BHS.portraits.facing[entry.id];
    var mirror = (facing === "left" && entry.slot === 0) || (facing === "right" && entry.slot === 1);
    var fig = h("div", { class: "figure is-in" + (mirror ? " is-mirror" : ""), "data-slot": String(entry.slot), "data-key": key, "data-testid": "portrait-" + entry.id, "data-id": entry.id });
    fig.innerHTML = namespaceSvg(markup, "p" + ++S.artSeq + "-");
    var svg = fig.querySelector("svg");
    if (svg) {
      svg.setAttribute("preserveAspectRatio", "xMidYMax meet");
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");
      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("focusable", "false");
    }
    return fig;
  }

  function setCast(stage) {
    var layer = $("cast");
    if (!layer) return;
    var cast = (stage && stage.cast) || [];
    [0, 1].forEach(function (slot) {
      var entry = null;
      for (var i = 0; i < cast.length; i++) if (cast[i].slot === slot) entry = cast[i];
      var fig = layer.querySelector('.figure[data-slot="' + slot + '"]');
      var light = portraitLight(stage);
      var markup = entry ? portraitMarkup(entry.id, entry.pose, light) : null;
      var key = entry ? entry.id + "|" + (entry.pose || "") + "|" + light : "";
      if (!entry || !markup) {
        if (fig) dropFigure(fig);
        return;
      }
      if (!fig || fig.getAttribute("data-key") !== key) {
        if (fig) dropFigure(fig);
        fig = makeFigure(entry, key, markup);
        layer.appendChild(fig);
      }
      fig.classList.toggle("is-dim", stage.speaking !== entry.id);
    });
  }

  // Portraits stand on the top edge of the text panel; remember where that edge is.
  function anchorCast() {
    var panel = $("panel");
    var app = $("app");
    if (!panel || panel.hidden || $("play").hidden || $("play").classList.contains("play--sign") || $("play").classList.contains("play--last")) return;
    var pr = panel.getBoundingClientRect();
    var ar = app.getBoundingClientRect();
    if (!pr.height) return;
    app.style.setProperty("--panel-top", Math.max(0, Math.round(ar.bottom - pr.top)) + "px");
  }

  function updateStage(v, state) {
    var st = v.stage;
    setArt(st.bg, st.pov, st.time);
    setPov(st.pov);
    setLight(st.light);
    placeLight();
    setCaption(st.caption);
    setPinned(st.pinned, state);
    setEcho(v.now && v.now.echo);
    setHush(v.now && v.now.hush);
    setCast(st);
  }

  // A page screen keeps scene art behind it but clears all play overlays.
  function pageStage(bg) {
    setArt(bg || "black", "normal");
    setPov("normal");
    setLight("off");
    setCaption(null);
    setPinned(null);
    setEcho(null);
    setHush(false);
    setCast(null);
  }

  // ------------------------------------------------------------------ play layer

  function setPlate(speaker, routeId) {
    var plate = $("plate");
    clear(plate);
    plate.className = "plate";
    plate.removeAttribute("style");
    if (!speaker) {
      plate.hidden = true;
      plate.removeAttribute("data-testid");
      return;
    }
    var name = characterName(speaker, routeId);
    if (!name) {
      plate.hidden = true;
      plate.removeAttribute("data-testid");
      return;
    }
    var ls = langs();
    if (ls.length === 1) plate.appendChild(doc.createTextNode(pick(name, ls[0])));
    else {
      plate.appendChild(doc.createTextNode(pick(name, "ko")));
      plate.appendChild(h("span", { class: "plate__en", lang: "en" }, " · " + pick(name, "en")));
    }
    var c = BHS.characters[speaker];
    if (speaker === "jesus") plate.classList.add("plate--jesus");
    else if (c && c.color) plate.style.setProperty("--plate", c.color);
    plate.setAttribute("data-testid", "speaker");
    plate.hidden = false;
  }

  function rateFor(l, hush) {
    var base = RATES[S.speed] == null ? RATES.normal : RATES[S.speed];
    // Latin letters are narrower; in "both" mode the second language types faster still.
    var r = l === "en" ? base * (S.lang === "both" ? 0.4 : 0.5) : base;
    return hush ? r * 2.2 : r;
  }

  // Fill the text box with one or both languages; returns typewriter groups.
  function fillText(host, t, state, opts) {
    clear(host);
    var ls = langs();
    var groups = [];
    var typing = !opts.instant && !instantText();
    ls.forEach(function (l, idx) {
      var p = h("p", { class: ls.length > 1 && idx > 0 ? "en" : "ko", lang: l });
      var chars = typing ? [] : null;
      if (opts.verseKey) {
        var txt = verseOf(opts.verseKey, l);
        if (chars) {
          Array.from(txt).forEach(function (ch) {
            var c = doc.createElement("span");
            c.className = "c";
            c.textContent = ch;
            p.appendChild(c);
            chars.push(c);
          });
        } else p.textContent = txt;
      } else {
        richInto(p, t, l, state, chars);
      }
      host.appendChild(p);
      if (chars) groups.push({ chars: chars, rate: rateFor(l, opts.hush) });
    });
    return groups;
  }

  function resetPlay() {
    var play = $("play");
    play.className = "play";
    var panel = $("panel");
    panel.className = "panel";
    panel.removeAttribute("data-testid");
    panel.hidden = false;
    clear($("text"));
    $("ref").hidden = true;
    clear($("ref"));
    setPlate(null);
    var choices = $("choices");
    clear(choices);
    choices.hidden = true;
    var pressbox = $("pressbox");
    clear(pressbox);
    pressbox.hidden = true;
    var card = $("card");
    clear(card);
    card.hidden = true;
    card.className = "card";
    card.removeAttribute("data-testid");
    card.removeAttribute("data-cut");
    doc.body.classList.remove("is-last");
  }

  function renderPlay(v, ctx) {
    ctx = ctx || {};
    var step = v.step;
    var state = ctx.state || {};
    var hd = S.handlers;
    typeStop();
    updateStage(v, state);
    resetPlay();
    $("play").hidden = false;
    renderActions(v.actions || [], step);
    // Portraits step back while a choice is open; the engine keeps them for the next line.
    var castLayer = $("cast");
    if (castLayer) castLayer.classList.toggle("is-away", step.kind === "choice");
    var panel = $("panel");
    var text = $("text");
    var hush = !!(v.now && v.now.hush);
    var groups = [];

    switch (step.kind) {
      case "line": {
        var sp = step.speaker || "narrator";
        if (sp === "sign") $("play").classList.add("play--sign");
        else if (sp === "thought") panel.classList.add("panel--thought");
        else if (sp !== "narrator") setPlate(sp, ctx.routeId);
        if (step.mismatch) panel.classList.add("panel--mismatch");
        groups = fillText(text, step.text, state, { instant: ctx.instant, hush: hush });
        break;
      }
      case "verse": {
        panel.classList.add("panel--verse");
        panel.setAttribute("data-testid", "verse-card");
        var vs = step.speaker || "narrator";
        if (vs === "jesus") panel.classList.add("panel--jesus");
        if (vs === "jesus" || vs === "scribes") setPlate(vs, ctx.routeId);
        groups = fillText(text, null, state, { instant: ctx.instant, hush: hush, verseKey: step.key });
        var ref = $("ref");
        ref.textContent = refLine(step.key);
        ref.hidden = !ref.textContent;
        break;
      }
      case "choice":
        panel.hidden = true;
        renderChoice(step, state);
        break;
      case "press":
        panel.hidden = true;
        $("play").classList.add("play--press");
        renderPress(step);
        break;
      case "endingTitle":
        panel.hidden = true;
        renderCard(step);
        break;
      case "last":
        $("play").classList.add("play--last");
        doc.body.classList.add("is-last");
        groups = fillText(text, step.text, state, { instant: ctx.instant, hush: false });
        break;
      default:
        panel.hidden = true;
    }

    anchorCast();

    if (!panel.hidden) {
      panel.classList.remove("is-ready");
      typeStart(groups, function () {
        panel.classList.add("is-ready");
        if (hd.onTyped) hd.onTyped();
      });
    }
  }

  function renderChoice(step, state) {
    var box = $("choices");
    clear(box);
    var pid = "prompt-" + step.id;
    if (step.prompt) box.appendChild(h("p", { class: "choices__prompt", id: pid }, biRich(step.prompt, state)));
    var list = h("div", { class: "choices__list", role: "group", "aria-labelledby": step.prompt ? pid : null, "aria-label": step.prompt ? null : flat(u("choiceGroup")) });

      var b = h("button", { type: "button", class: "opt", "data-testid": "choice-" + o.id, "data-option": o.id, "aria-keyshortcuts": String(idx + 1) + " " + o.id.toUpperCase() }, [
        h("span", { class: "opt__num", "aria-hidden": "true" }, String(idx + 1)),

      ]);

  function renderPress(step) {
    var box = $("pressbox");

  function renderActions(actions, step) {
    var bar = $("actions");
    clear(bar);
    // While a choice is open the gray buttons step aside so the options have the room.
    if (!actions.length || (step && (step.kind === "endingTitle" || step.kind === "last" || step.kind === "choice"))) {

  function showReply(t, state) {

  var LENS_NUM = { 1: "①", 2: "②", 3: "③" };
  // The mark of a route that stopped midway (the cut column and the cut ending card).

  // Ending title card. A cut ending shows meta.cut.label over meta.endings[route].cut.
  function renderCard(step) {
    var card = $("card");

  // "#rrggbb" -> "rgba(r, g, b, a)" for the soft wash behind a route card's figure.
  function hexAlpha(hex, a) {
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || ""));
    if (!m) return null;
    var x = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
    var n = parseInt(x, 16);
    return "rgba(" + ((n >> 16) & 255) + ", " + ((n >> 8) & 255) + ", " + (n & 255) + ", " + a + ")";
  }

  // The protagonist on a route card: a cut-paper bust rising from the divider above the first line
  // (Menahem, Yonah), or Asher in his lying pose laid across the band; never Asher standing (that is
  // the ending). Decorative only (aria-hidden); without a portrait module the card stays text-only.
  function routeArt(rid, charId, color) {
    var lying = charId === "asher";
    var markup = charId ? portraitMarkup(charId, lying ? "lying" : null, "") : null;
    if (!markup) return null;
    var svgBox = h("span", { class: "routecard__svg" });
    svgBox.innerHTML = namespaceSvg(markup, "r" + ++S.artSeq + "-");
    var svg = svgBox.querySelector("svg");
    if (!svg) return null;
    svg.setAttribute("preserveAspectRatio", "xMidYMax meet");
    svg.setAttribute("width", "100%");
    svg.setAttribute("height", "100%");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    var wash = hexAlpha(color, 0.3);
    return h("span", { class: "routecard__art" + (lying ? " routecard__art--lying" : ""), "data-testid": "routecard-portrait-" + rid, "aria-hidden": "true", style: wash ? "--wash:" + wash : null }, [
      h("span", { class: "routecard__wash" }),
      h("span", { class: "routecard__fig" }, svgBox)
    ]);
  }

  // The busts on the route cards share one size, set by the smallest bust band (a bigger bust in a
  // smaller band would lose its head), so the cards read as a set; Asher lying sizes on his own band.
  // Band heights follow the text (language, text size, fonts loading, window size), hence the observer.
  var routeArtObserver = null;

  function equalizeRouteArt(list) {
    var min = Infinity;
    Array.prototype.forEach.call(list.querySelectorAll(".routecard__art:not(.routecard__art--lying)"), function (band) {
      var bh = band.clientHeight;
      if (bh > 0 && bh < min) min = bh;
    });
    if (min < Infinity) list.style.setProperty("--band-min", min + "px");
    else list.style.removeProperty("--band-min");
  }

  function watchRouteArt(list) {
    if (routeArtObserver) routeArtObserver.disconnect();
    routeArtObserver = null;
    equalizeRouteArt(list);
    if (typeof window.ResizeObserver !== "function") return;
    routeArtObserver = new window.ResizeObserver(function () {
      if (list.isConnected) equalizeRouteArt(list);
      else if (routeArtObserver) routeArtObserver.disconnect();
    });
    Array.prototype.forEach.call(list.querySelectorAll(".routecard__art"), function (band) {
      routeArtObserver.observe(band);
    });
  }

  // Endings gallery: rows = characters, columns = lenses 1-3 plus the "cut" column (SPEC 4.5).
  // A cut cell unlocks with "<route>-cut". A route without a cut ending (Asher) shows its cutNote
  // there once any of its endings has been seen: a note, not an ending (data-state="note").
  var GALLERY_COLS = [1, 2, 3, "cut"];

  function galleryCell(meta, rid, col, seen, current) {
    var titles = (meta.endings && meta.endings[rid]) || {};
    var id = rid + "-" + col;
    var state = "locked";
    var kids = null;
    if (col === "cut" && !titles.cut) {
      var seenAny = [1, 2, 3].some(function (l) {
        return seen.indexOf(rid + "-" + l) >= 0;
      });
      if (titles.cutNote && seenAny) {
        state = "note";
        kids = bi(titles.cutNote);
      } else if (!titles.cutNote) {
        state = "none";
        kids = ["—"];
      }
    } else if (seen.indexOf(id) >= 0 && titles[col]) {
      state = "seen";
      kids = bi(titles[col]);
    }
    var cell = h("div", {
      class: "cell" + (col === "cut" ? " cell--cut" : "") + (state === "note" ? " cell--note" : ""),
      role: "cell",
      "data-testid": "gallery-cell-" + id,
      "data-col": String(col),
      "data-state": state,
      "data-seen": state === "seen" ? "true" : "false",
      "data-current": state === "seen" && current === id ? "true" : null
    });
    if (kids) append(cell, kids);
    else append(cell, bi(u("galleryLocked")));
    if (state === "seen" && current === id) cell.appendChild(h("span", { class: "cell__yours" }, flat(u("galleryYours"))));
    return cell;
  }

  function renderGallery(o) {
    var meta = BHS.meta || {};
    var order = meta.routeOrder || ["scribe", "friend", "asher"];
    var seen = (o.seen || []).filter(function (x) {
      return typeof x === "string";
    });
    var grid = h("div", { class: "grid", role: "table", "aria-label": flat(u("galleryTitle")) });
    grid.appendChild(h("div", { class: "grid__corner", role: "presentation" }));
    GALLERY_COLS.forEach(function (col) {
      if (col === "cut") {
        var cm = meta.cut || { label: u("galleryCut"), desc: null };
        grid.appendChild(
          h("div", { class: "grid__lens grid__lens--cut", role: "columnheader", "data-testid": "gallery-col-cut" }, [
            h("span", { class: "grid__label" }, [h("span", { class: "grid__mark", "aria-hidden": "true" }, CUT_MARK + " "), bi(cm.label)]),
            cm.desc ? h("span", { class: "grid__desc" }, bi(cm.desc)) : null
          ])
        );

      }
      var lm = (meta.lenses && meta.lenses[col]) || { label: { ko: String(col), en: String(col) } };
      grid.appendChild(h("div", { class: "grid__lens", role: "columnheader", "data-testid": "gallery-col-" + col }, h("span", { class: "grid__label" }, [LENS_NUM[col] + " ", bi(lm.label)])));
    });
    order.forEach(function (rid) {
      var r = (meta.routes && meta.routes[rid]) || {};
      var c = (BHS.characters && BHS.characters[r.protagonist]) || {};
      var nm = c.name || r.name || { ko: rid, en: rid };
      grid.appendChild(h("div", { class: "grid__row", role: "rowheader", style: c.color ? "--plate:" + c.color : null }, [h("span", { class: "grid__swatch", "aria-hidden": "true" }), h("span", { class: "grid__name" }, bi(nm))]));
      GALLERY_COLS.forEach(function (col) {
        grid.appendChild(galleryCell(meta, rid, col, seen, o.current || null));
      });
    });
    var titleT = u("galleryTitle");
    var heading = h("h2", { class: "gallery-title" }, langs().length > 1 ? [titleT.ko, h("span", { class: "en", lang: "en" }, titleT.en)] : [pick(titleT, langs()[0])]);
    page("gallery-page", [
      h("div", { class: "gallery-head" }, [heading, h("p", { class: "gallery-intro" }, bi(u("galleryIntro")))]),
      h("div", { class: "grid-wrap" }, grid),
      h("div", { class: "gallery-actions" }, [btn("btn--primary", u("galleryReplay"), "gallery-replay", o.onReplay), btn("btn--ghost", u("galleryHome"), "gallery-home", o.onHome)])
    ]);
  }

  // ------------------------------------------------------------------ header, settings, confirm

  function renderHeader(o) {
    var bar = $("topbar");
    clear(bar);
    var home = h("button", { type: "button", class: "iconbtn", "data-testid": "home", "aria-label": flat(u("home")), title: flat(u("home")), on: { click: o.onHome } }, svgIcon([{ d: "M4 11.5 12 5l8 6.5" }, { d: "M6.5 10v9h11v-9" }, { d: "M10.5 19v-4.5h3V19" }]));
    var seg = h("div", { class: "seg", role: "group", "aria-label": flat(u("langGroup")) });
    [
      ["ko", "langShortKo", "hdr-lang-ko"],
      ["en", "langShortEn", "hdr-lang-en"],
      ["both", "langShortBoth", "hdr-lang-both"]
    ].forEach(function (d) {
      var t = u(d[1]);
      seg.appendChild(
        h(
          "button",
          {
            type: "button",
            class: "seg__btn",
            "data-testid": d[2],
            "aria-pressed": S.lang === d[0] ? "true" : "false",
            "aria-label": d[0] === "ko" ? u("langKo").ko : d[0] === "en" ? u("langEn").en : u("langBoth").ko + " · " + u("langBoth").en,
            on: {
              click: function () {
                o.onLang(d[0]);
              }
            }
          },
          S.lang === "en" ? t.en : t.ko
        )
      );
    });
    var gear = h(
      "button",
      { type: "button", class: "iconbtn", "data-testid": "settings-open", "aria-label": flat(u("settingsOpen")), title: flat(u("settingsOpen")), "aria-expanded": "false", "aria-controls": "settings", on: { click: o.onSettings } },
      svgIcon([{ d: "M4 7h9" }, { d: "M17 7h3" }, { tag: "circle", cx: "15", cy: "7", r: "2" }, { d: "M4 17h3" }, { d: "M11 17h9" }, { tag: "circle", cx: "9", cy: "17", r: "2" }])
    );
    var kids = [home, h("span", { class: "topbar__spacer" }), seg];
    if (o.canFullscreen) {
      var fs = !!o.isFullscreen;
      var label = flat(u(fs ? "fullscreenExit" : "fullscreenEnter"));
      kids.push(
        h(
          "button",
          { type: "button", class: "iconbtn", "data-testid": "fullscreen", "aria-pressed": fs ? "true" : "false", "aria-label": label, title: label + " (F)", on: { click: o.onFullscreen } },
          svgIcon(
            fs
              ? [{ d: "M9 4v5H4" }, { d: "M15 4v5h5" }, { d: "M9 20v-5H4" }, { d: "M15 20v-5h5" }]
              : [{ d: "M4 9V4h5" }, { d: "M20 9V4h-5" }, { d: "M4 15v5h5" }, { d: "M20 15v5h-5" }]
          )
        )
      );
    }
    kids.push(gear);
    append(bar, kids);
    // After a pointer click, give focus back so Space/Enter keep driving the story.
    Array.prototype.forEach.call(bar.querySelectorAll("button"), function (b) {
      b.addEventListener("click", function (ev) {
        if (ev.detail > 0 && typeof b.blur === "function") b.blur();

  }

  function renderSettings(o) {
    var box = $("settings");
    clear(box);
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-label", flat(u("settingsTitle")));
    var speeds = [
      ["slow", "speedSlow", "speed-slow"],
      ["normal", "speedNormal", "speed-normal"],
      ["instant", "speedInstant", "speed-instant"]
    ].map(function (d) {
      return h("button", { type: "button", class: "chip", "data-testid": d[2], "aria-pressed": S.speed === d[0] ? "true" : "false", on: { click: function () { o.onSpeed(d[0]); } } }, flat(u(d[1])));
    });
    var smaller = h("button", { type: "button", class: "chip", "data-testid": "size-down", "aria-label": flat(u("sizeSmaller")), disabled: S.size <= 0 ? true : null, on: { click: function () { o.onSize(-1); } } }, "A−");
    var larger = h("button", { type: "button", class: "chip", "data-testid": "size-up", "aria-label": flat(u("sizeLarger")), disabled: S.size >= SIZE_STEPS.length - 1 ? true : null, on: { click: function () { o.onSize(1); } } }, "A+");
    append(box, [
      h("p", { class: "settings__title" }, flat(u("settingsTitle"))),
      h("div", { class: "settings__group" }, [h("span", { class: "settings__label" }, flat(u("textSpeed"))), h("div", { class: "choicerow" }, speeds)]),
      h("div", { class: "settings__group" }, [h("span", { class: "settings__label" }, flat(u("textSize"))), h("div", { class: "choicerow" }, [smaller, larger])]),
      btn("btn--ghost settings__close", u("close"), "settings-close", o.onClose)
    ]);
  }

  function openSettings(o) {
    renderSettings(o);
    $("settings").hidden = false;
    var gear = doc.querySelector('[data-testid="settings-open"]');
    if (gear) gear.setAttribute("aria-expanded", "true");
  }

  function closeSettings() {
    $("settings").hidden = true;
    var gear = doc.querySelector('[data-testid="settings-open"]');
    if (gear) gear.setAttribute("aria-expanded", "false");
  }

  function askDialog(o) {
    var m = $("modal");
    clear(m);
    var titleId = "dlg-title";
    var no = btn("btn--ghost", o.no, "confirm-no", function () {
      closeModal();
      if (o.onNo) o.onNo();
    });
    var yes = btn("btn--primary", o.yes, "confirm-yes", function () {
      closeModal();
      if (o.onYes) o.onYes();
    });
    var dialog = h("div", { class: "dialog", role: "alertdialog", "aria-modal": "true", "aria-labelledby": titleId }, [
      h("h2", { class: "dialog__title", id: titleId }, bi(o.title)),
      o.body ? h("p", { class: "dialog__body" }, bi(o.body)) : null,
      h("div", { class: "dialog__actions" }, [yes, no])
    ]);
    m.appendChild(dialog);
    m.hidden = false;
    m.onclick = function (ev) {
      if (ev.target === m) {
        closeModal();
        if (o.onNo) o.onNo();
      }
    };
    no.focus({ preventScroll: true });
  }

  function closeModal() {
    var m = $("modal");
    m.hidden = true;
    clear(m);
  }

  function isModalOpen() {
    return !$("modal").hidden || !$("settings").hidden;
  }

  // ------------------------------------------------------------------ settings application

  function applySettings(o) {
    if (o.lang) S.lang = o.lang;
    if (o.speed) S.speed = o.speed;
    if (typeof o.size === "number") S.size = Math.max(0, Math.min(SIZE_STEPS.length - 1, o.size));
    doc.documentElement.style.setProperty("--text-scale", String(SIZE_STEPS[S.size]));
    doc.documentElement.setAttribute("lang", S.lang === "en" ? "en" : "ko");
    // Language-dependent caches must be rebuilt.
    S.capKey = "";
    S.pinKey = "";
    S.pinItemsKey = "";
  }

  function init(o) {
    o = o || {};
    S.test = !!o.test;
    S.debug = !!o.debug;
    S.handlers = o.handlers || {};
    try {
      var mq = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");

    }

    adv.addEventListener("click", function () {

    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        anchorCast();

    });
    try {
      if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(anchorCast);
    } catch (err) {
      /* font loading API unavailable */
    }
  }

  BHS.view = {
    init: init,
    h: h,
    clear: clear,
    bi: bi,
    flat: flat,
    applySettings: applySettings,
    sizeSteps: SIZE_STEPS,
    state: S,
    showLayer: showLayer,
    pageStage: pageStage,
    renderPlay: renderPlay,
    renderTitle: renderTitle,
    renderRouteSelect: renderRouteSelect,
    renderGallery: renderGallery,
    renderHeader: renderHeader,
    openSettings: openSettings,
    closeSettings: closeSettings,
    renderSettings: renderSettings,
    ask: askDialog,
    closeModal: closeModal,

    isTyping: isTyping,
    typeTimeline: typeTimeline

})();
