<script>/* js/ui.js */
/*
 * js/ui.js - DOM rendering for "Before He Stood" (BHS.view).
 * Draws the stage (art, light, POV, hush, caption, echo verse, pinned thought), the text box with a
 * typewriter, choices, press buttons, Asher's persistent actions, and the page screens (title, route
 * select, final, gallery), plus the header, settings, and in-page confirm dialog.
 * It never decides story flow; js/main.js drives it with views from BHS.engine.
 */
(function () {
  "use strict";

  var BHS = (window.BHS = window.BHS || {});
  var doc = document;

  var SIZE_STEPS = [0.9, 1, 1.12, 1.25, 1.4];
  var RATES = { slow: 56, normal: 28, instant: 0 };

  var S = {
    lang: "both",
    speed: "normal",
    size: 1,
    test: false,
    debug: false,
    reduced: false,
    artKey: null,
    artFlip: false,
    artSeq: 0,
    artTimer: 0,
    capKey: "",
    pinKey: "",
    pinItemsKey: "",
    replyTimer: 0,
    riseTimer: 0,
    handlers: {}
  };

  // ------------------------------------------------------------------ DOM helpers

  function $(id) {
    return doc.getElementById(id);
  }

  function append(node, kids) {
    if (kids == null) return node;
    if (!Array.isArray(kids)) kids = [kids];
    for (var i = 0; i < kids.length; i++) {
      var c = kids[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) append(node, c);
      else node.appendChild(typeof c === "string" ? doc.createTextNode(c) : c);
    }
    return node;
  }

  function h(tag, props, kids) {
    var n = doc.createElement(tag);
    if (props) {
      for (var k in props) {
        if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
        var v = props[k];
        if (v == null || v === false) continue;
        if (k === "class") n.className = v;
        else if (k === "text") n.textContent = v;
        else if (k === "on") {
          for (var ev in v) if (Object.prototype.hasOwnProperty.call(v, ev)) n.addEventListener(ev, v[ev]);
        } else if (k === "style") n.setAttribute("style", v);
        else n.setAttribute(k, v === true ? "" : String(v));
      }
    }
    return append(n, kids);
  }

  function clear(n) {
    while (n && n.firstChild) n.removeChild(n.firstChild);
    return n;
  }

  function svgIcon(paths) {
    var ns = "http://www.w3.org/2000/svg";
    var svg = doc.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.8");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    paths.forEach(function (p) {
      var el = doc.createElementNS(ns, p.tag || "path");
      Object.keys(p).forEach(function (k) {
        if (k !== "tag") el.setAttribute(k, p[k]);
      });
      svg.appendChild(el);
    });
    return svg;
  }

  // ------------------------------------------------------------------ language helpers

  function E() {
    return BHS.engine;
  }

  function langs() {
    return S.lang === "en" ? ["en"] : S.lang === "ko" ? ["ko"] : ["ko", "en"];
  }

  function pick(t, l) {
    if (E()) return E().pickLang(t, l);
    if (!t) return "";
    return typeof t === "string" ? t : t[l] || t.ko || "";
  }

  function u(key) {
    return (BHS.ui && BHS.ui[key]) || { ko: key, en: key };
  }

  // One string for attributes (aria-label, title). In "both" mode joins with a middle dot.
  function flat(t) {
    if (!t) return "";
    if (S.lang === "ko") return pick(t, "ko");
    if (S.lang === "en") return pick(t, "en");
    var ko = pick(t, "ko");
    var en = pick(t, "en");
    return ko === en ? ko : ko + " · " + en;
  }

  // Plain bilingual nodes: the second language goes in a span.en (styled per context).
  function bi(t) {
    var ls = langs();
    if (ls.length === 1) return [pick(t, ls[0])];
    var ko = pick(t, "ko");
    var en = pick(t, "en");
    if (ko === en) return [ko];
    return [h("span", { class: "ko", lang: "ko" }, ko), h("span", { class: "en", lang: "en" }, en)];
  }

  // Rich text into a host: tokens resolved, *emphasis* -> <em>, verse tokens in span.q.
  function richInto(host, t, l, state, chars) {
    var segs = E() ? E().resolveSegments(t, l, state) : [{ text: pick(t, l), em: false }];
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      var wrap = null;
      var target = host;
      if (s.em) {
        wrap = h("em");
        target = wrap;
      }
      if (s.kind === "v") {
        var q = h("span", { class: "q" });
        if (wrap) wrap.appendChild(q);
        else wrap = q;
        target = q;
      }
      if (chars) {
        var arr = Array.from(s.text);
        for (var j = 0; j < arr.length; j++) {
          var c = doc.createElement("span");
          c.className = "c";
          c.textContent = arr[j];
          target.appendChild(c);
          chars.push(c);
        }
      } else {
        target.appendChild(doc.createTextNode(s.text));
      }
      if (wrap) host.appendChild(wrap);
    }
    return host;
  }

  function biRich(t, state) {
    var ls = langs();
    if (ls.length === 1) return richInto(h("span", { lang: ls[0] }), t, ls[0], state, null);
    var frag = doc.createDocumentFragment();
    frag.appendChild(richInto(h("span", { class: "ko", lang: "ko" }), t, "ko", state, null));
    frag.appendChild(richInto(h("span", { class: "en", lang: "en" }), t, "en", state, null));
    return frag;
  }

  function verseOf(key, l) {
    var txt = E() && E().verseText(key, l);
    if (txt) return txt;
    return S.debug ? "[" + key + "]" : "…";
  }

  function refOf(key, l) {
    var r = E() && E().verseRef(key, l);
    return r || (S.debug ? "[" + key + "]" : "");
  }

  function refLine(key) {
    var ls = langs();
    var parts = [];
    ls.forEach(function (l) {
      var r = refOf(key, l);
      if (r && parts.indexOf(r) < 0) parts.push(r);
    });
    return parts.join(" · ");
  }

  function characterName(id, routeId) {
    var c = BHS.characters && BHS.characters[id];
    if (!c) return null;
    // SPEC 6.1: outside Asher's POV the mother is labelled "Asher's mother".
    if (id === "mother" && routeId !== "asher" && c.role) return c.role;
    return c.name;
  }

  // ------------------------------------------------------------------ typewriter

  var typer = { raf: 0, seq: null, i: 0, start: 0, done: true, onDone: null };

  function instantText() {
    return S.speed === "instant" || S.reduced || S.test;
  }

  function pauseAfter(ch) {
    if (".?!…。".indexOf(ch) >= 0) return 6;
    if (",;:、—―".indexOf(ch) >= 0) return 3;
    return 1;
  }

  function typeStart(groups, onDone) {
    typeStop();
    var seq = [];
    var t = 0;
    groups.forEach(function (g) {
      g.chars.forEach(function (c) {
        seq.push({ c: c, t: t });
        t += g.rate * pauseAfter(c.textContent);
      });
      t += g.rate * 4;
    });
    typer.seq = seq;
    typer.i = 0;
    typer.done = false;
    typer.onDone = onDone || null;
    if (!seq.length) {
      typeFinish();
      return;
    }
    typer.start = performance.now();
    typer.raf = requestAnimationFrame(typeTick);
  }

  function typeTick(now) {
    var seq = typer.seq;
    if (!seq) return;
    var elapsed = now - typer.start;
    while (typer.i < seq.length && seq[typer.i].t <= elapsed) {
      seq[typer.i].c.className = "c on";
      typer.i++;
    }
    if (typer.i >= seq.length) typeFinish();
    else typer.raf = requestAnimationFrame(typeTick);
  }

  function typeFinish() {
    cancelAnimationFrame(typer.raf);
    var seq = typer.seq || [];
    for (var i = typer.i; i < seq.length; i++) seq[i].c.className = "c on";
    typer.i = seq.length;
    var wasDone = typer.done;
    typer.done = true;
    var cb = typer.onDone;
    typer.onDone = null;
    if (!wasDone && cb) cb();
  }

  function typeStop() {
    cancelAnimationFrame(typer.raf);
    typer.seq = null;
    typer.i = 0;
    typer.done = true;
    typer.onDone = null;
  }

  function completeTyping() {
    if (typer.done) return false;
    typeFinish();
    return true;
  }

  function isTyping() {
    return !typer.done;
  }

  // ------------------------------------------------------------------ stage

  var FALLBACK = {
    black: "linear-gradient(180deg,#131210,#1d1b18)",
    dawn_lamp: "radial-gradient(60% 40% at 50% 62%,#7a5326 0%,#3a2a1b 45%,#1c1712 100%)",
    shore_dawn: "linear-gradient(180deg,#8fa7b6 0%,#d9c7a2 55%,#4d5a5e 56%,#2b3236 100%)",
    asher_ceiling: "linear-gradient(180deg,#2d241c 0%,#5c4835 60%,#c9a46a 100%)",
    asher_home: "linear-gradient(180deg,#4d3e30 0%,#7e6850 70%,#3b3027 100%)",
    lane: "linear-gradient(90deg,#26231f 0 22%,#cfd6d6 22% 78%,#26231f 78%)",
    sky_carried: "linear-gradient(180deg,#78a9c9 0%,#cfe4ee 70%,#a88d6a 100%)",
    crowd: "radial-gradient(50% 35% at 50% 40%,#fff0c8 0%,#d9cdb0 40%,#5b5a52 100%)",
    crowd_lying: "radial-gradient(45% 30% at 50% 20%,#fff2cf 0%,#c5d3d8 45%,#3c3a36 100%)",
    road_home: "linear-gradient(180deg,#e4c58a 0%,#f0dcb3 55%,#8a7556 100%)",
    doorway_evening: "linear-gradient(180deg,#3d3247 0%,#a9744c 70%,#2d241f 100%)",
    lamp_night: "radial-gradient(45% 30% at 50% 60%,#8a5a22 0%,#2a1f15 50%,#100e0b 100%)"
  };

  function namespaceSvg(svg, prefix) {
    return svg
      .replace(/(\s)id=(["'])([^"']*)\2/g, function (m, sp, q, id) {
        return sp + "id=" + q + prefix + id + q;
      })
      .replace(/url\(\s*(["']?)#([^)"'\s]+)\1\s*\)/g, function (m, q, id) {
        return "url(#" + prefix + id + ")";
      })
      .replace(/(xlink:href|href)=(["'])#([^"']*)\2/g, function (m, attr, q, id) {
        return attr + "=" + q + "#" + prefix + id + q;
      });
  }

  function artNode(bg, pov, time) {
    var markup = null;
    var opts = { pov: pov };
    if (time) opts.time = time;
    try {
      if (BHS.art && typeof BHS.art.render === "function") markup = BHS.art.render(bg, opts);
    } catch (err) {
      if (window.console) console.warn("[BHS.view] art.render failed for " + bg, err);
      markup = null;
    }
    var holder = doc.createElement("div");
    holder.style.cssText = "position:absolute;inset:0";
    if (typeof markup === "string" && markup.indexOf("<svg") >= 0) {
      holder.innerHTML = namespaceSvg(markup, "a" + ++S.artSeq + "-");
      var svg = holder.querySelector("svg");
      if (svg) {
        svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
        svg.setAttribute("width", "100%");
        svg.setAttribute("height", "100%");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("focusable", "false");
        return svg;
      }
    }
    return h("div", { class: "art__fallback", style: "background:" + (FALLBACK[bg] || FALLBACK.black) });
  }

  function setArt(bg, pov, time) {
    bg = bg || "black";
    var key = bg + "|" + pov + "|" + (time || "");
    if (key === S.artKey) return;
    S.artKey = key;
    var a = $("artA");
    var b = $("artB");
    var incoming = S.artFlip ? a : b;
    var outgoing = S.artFlip ? b : a;
    S.artFlip = !S.artFlip;
    clear(incoming);
    incoming.appendChild(artNode(bg, pov, time));
    // Force a style flush so the fade runs even when both layers change in one frame.
    void incoming.offsetWidth;
    incoming.classList.add("is-on");
    outgoing.classList.remove("is-on");
    clearTimeout(S.artTimer);
    S.artTimer = setTimeout(
      function () {
        if (!outgoing.classList.contains("is-on")) clear(outgoing);
      },
      S.test ? 0 : 900
    );
  }

  function setPov(pov) {
    var stage = $("stage");
    var prev = stage.getAttribute("data-pov") || "normal";
    if (prev === pov) return;
    stage.setAttribute("data-pov", pov);
    if (prev === "lying" && pov !== "lying" && !S.reduced && !S.test) {
      stage.classList.remove("is-rising");
      void stage.offsetWidth;
      stage.classList.add("is-rising");
      clearTimeout(S.riseTimer);
      S.riseTimer = setTimeout(function () {
        stage.classList.remove("is-rising");
      }, 2800);
    }
  }

  function setLight(level) {
    $("light").setAttribute("data-level", level || "off");
  }

  // Anchor the light on the place the art reserves for it (BHS.art.lightAt, in canvas units),
  // mapping canvas -> screen through the SVG's xMidYMid slice transform. Falls back to CSS.
  function placeLight() {
    var light = $("light");
    var art = BHS.art;
    var key = S.artKey ? S.artKey.split("|") : null;
    var drawn = key ? (art && typeof art.resolve === "function" ? art.resolve(key[0], key[1]) : key[0]) : null;
    var pt = drawn && art && art.lightAt && art.lightAt[drawn];
    if (!pt) {
      light.style.removeProperty("--light-x");
      light.style.removeProperty("--light-y");
      return;
    }
    var stage = $("stage");
    var W = stage.clientWidth;
    var H = stage.clientHeight;
    var artEl = $("art");
    if (!W || !H || !artEl) return;
    var vbW = 1600;
    var vbH = 1600;
    var svg = artEl.querySelector(".art__layer.is-on svg");
    var vb = svg && svg.getAttribute("viewBox");
    if (vb) {
      var parts = vb.split(/[\s,]+/).map(Number);
      if (parts.length === 4 && parts[2] > 0 && parts[3] > 0) {
        vbW = parts[2];
        vbH = parts[3];
      }
    }
    // Layout box of the art (ignores the small pov tilt) relative to the stage.
    var ax = artEl.offsetLeft;
    var ay = artEl.offsetTop;
    var aw = artEl.offsetWidth;
    var ah = artEl.offsetHeight;
    var s = Math.max(aw / vbW, ah / vbH);
    var x = ax + (aw - vbW * s) / 2 + pt[0] * s;
    var y = ay + (ah - vbH * s) / 2 + pt[1] * s;
    var lx = light.offsetLeft;
    var ly = light.offsetTop;
    var lw = light.offsetWidth || W;
    var lh = light.offsetHeight || H;
    light.style.setProperty("--light-x", (((x - lx) / lw) * 100).toFixed(2) + "%");
    light.style.setProperty("--light-y", (((y - ly) / lh) * 100).toFixed(2) + "%");
  }

  function setCaption(t) {
    var c = $("caption");
    var key = t ? JSON.stringify(t) + "|" + S.lang : "";
    if (key === S.capKey) return;
    S.capKey = key;
    clear(c);
    if (!t) {
      c.hidden = true;
      return;
    }
    append(c, bi(t));
    c.hidden = false;
  }

  function markedNodes(text, marks) {
    if (marks === "*") return [h("mark", null, text)];
    var list = Array.isArray(marks) ? marks : [];
    var hits = [];
    list.forEach(function (m) {
      if (!m) return;
      var i = text.indexOf(m);
      if (i >= 0) hits.push({ i: i, j: i + m.length });
    });
    hits.sort(function (x, y) {
      return x.i - y.i;
    });
    var out = [];
    var pos = 0;
    hits.forEach(function (hit) {
      if (hit.i < pos) return;
      if (hit.i > pos) out.push(text.slice(pos, hit.i));
      out.push(h("mark", null, text.slice(hit.i, hit.j)));
      pos = hit.j;
    });
    if (pos < text.length) out.push(text.slice(pos));
    return out;
  }

  function setEcho(echo) {
    var e = $("echo");
    clear(e);
    if (!echo) {
      e.hidden = true;
      return;
    }
    var ls = langs();
    ls.forEach(function (l, idx) {
      var marks = echo.marks === "*" ? "*" : echo.marks ? echo.marks[l] : null;
      var span = h("span", { class: idx > 0 ? "en" : "ko", lang: l });
      append(span, markedNodes(verseOf(echo.key, l), marks));
      e.appendChild(span);
    });
    var ref = refLine(echo.key);
    if (ref) e.appendChild(h("span", { class: "echo__ref" }, ref));
    e.hidden = false;
  }

  function receiptText() {
    var t = u("readReceipt");
    if (S.lang === "ko") return t.ko;
    if (S.lang === "en") return t.en;
    return t.ko.replace(/\s*✓\s*$/, "") + " · " + t.en;
  }

  function setPinned(pinned, state) {
    var p = $("pin");
    var key = pinned ? JSON.stringify(pinned) + "|" + S.lang : "";
    if (key === S.pinKey) return;
    var itemsKey = pinned ? JSON.stringify(pinned.items) + "|" + S.lang : "";
    var onlyReadChanged = pinned && itemsKey === S.pinItemsKey && pinned.read && !p.querySelector(".receipt");
    S.pinKey = key;
    S.pinItemsKey = itemsKey;
    if (onlyReadChanged) {
      p.appendChild(h("span", { class: "receipt", "data-testid": "read-receipt" }, receiptText()));
      return;
    }
    clear(p);
    if (!pinned) {
      p.hidden = true;
      p.removeAttribute("data-testid");
      return;
    }
    p.setAttribute("data-testid", "thought-bubble");
    p.setAttribute("aria-label", flat(u("pinnedThought")));
    var ls = langs();
    pinned.items.forEach(function (it) {
      var row = h("div", { class: "pin__item" });
      if (it.type === "verse") {
        ls.forEach(function (l, idx) {
          var vt = verseOf(it.key, l);
          row.appendChild(h("span", { class: idx > 0 ? "en" : "ko", lang: l }, E() ? E().quoteVerse(vt) : "“" + vt + "”"));
        });
        var ref = refLine(it.key);
        if (ref) row.appendChild(h("span", { class: "pin__ref" }, ref));
      } else if (it.text) {
        row.appendChild(biRich(it.text, state));
      }
      p.appendChild(row);
    });
    if (pinned.read) p.appendChild(h("span", { class: "receipt", "data-testid": "read-receipt" }, receiptText()));
    p.hidden = false;
  }

  function setHush(on) {
    doc.body.classList.toggle("is-hush", !!on);
  }

  // ------------------------------------------------------------------ portraits (VN-style busts)

  var portraitCache = {};

  function portraitMarkup(id, pose) {
    var key = id + "|" + (pose || "");
    if (Object.prototype.hasOwnProperty.call(portraitCache, key)) return portraitCache[key];
    var m = null;
    try {
      if (BHS.portraits && typeof BHS.portraits.render === "function") m = BHS.portraits.render(id, pose ? { pose: pose } : {});
    } catch (err) {
      if (window.console) console.warn("[BHS.view] portraits.render failed for " + id, err);
      m = null;
    }
    if (typeof m !== "string" || m.indexOf("<svg") < 0) m = null;
    portraitCache[key] = m;
    return m;
  }

  function dropFigure(fig) {
    fig.removeAttribute("data-testid");
    fig.classList.add("is-out");
    fig.setAttribute("data-slot", "gone");
    setTimeout(
      function () {
        if (fig.parentNode) fig.parentNode.removeChild(fig);
      },
      S.test || S.reduced ? 0 : 260
    );
  }

  function makeFigure(entry, key, markup) {
    // Busts face inward: mirror the art when it faces away from the stage centre.
    var facing = BHS.portraits && BHS.portraits.facing && BHS.portraits.facing[entry.id];
    var mirror = (facing === "left" && entry.slot === 0) || (facing === "right" && entry.slot === 1);
    var fig = h("div", { class: "figure is-in" + (mirror ? " is-mirror" : ""), "data-slot": String(entry.slot), "data-key": key, "data-testid": "portrait-" + entry.id, "data-id": entry.id });
    fig.innerHTML = namespaceSvg(markup, "p" + ++S.artSeq + "-");
    var svg = fig.querySelector("svg");
    if (svg) {
      svg.setAttribute("preserveAspectRatio", "xMidYMax meet");
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");
      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("focusable", "false");
    }
    return fig;
  }

  function setCast(stage) {
    var layer = $("cast");
    if (!layer) return;
    var cast = (stage && stage.cast) || [];
    [0, 1].forEach(function (slot) {
      var entry = null;
      for (var i = 0; i < cast.length; i++) if (cast[i].slot === slot) entry = cast[i];
      var fig = layer.querySelector('.figure[data-slot="' + slot + '"]');
      var markup = entry ? portraitMarkup(entry.id, entry.pose) : null;
      var key = entry ? entry.id + "|" + (entry.pose || "") : "";
      if (!entry || !markup) {
        if (fig) dropFigure(fig);
        return;
      }
      if (!fig || fig.getAttribute("data-key") !== key) {
        if (fig) dropFigure(fig);
        fig = makeFigure(entry, key, markup);
        layer.appendChild(fig);
      }
      fig.classList.toggle("is-dim", stage.speaking !== entry.id);
    });
  }

  // Portraits stand on the top edge of the text panel; remember where that edge is.
  function anchorCast() {
    var panel = $("panel");
    var app = $("app");
    if (!panel || panel.hidden || $("play").hidden || $("play").classList.contains("play--sign") || $("play").classList.contains("play--last")) return;
    var pr = panel.getBoundingClientRect();
    var ar = app.getBoundingClientRect();
    if (!pr.height) return;
    app.style.setProperty("--panel-top", Math.max(0, Math.round(ar.bottom - pr.top)) + "px");
  }

  function updateStage(v, state) {
    var st = v.stage;
    setArt(st.bg, st.pov, st.time);
    setPov(st.pov);
    setLight(st.light);
    placeLight();
    setCaption(st.caption);
    setPinned(st.pinned, state);
    setEcho(v.now && v.now.echo);
    setHush(v.now && v.now.hush);
    setCast(st);
  }

  // A page screen keeps scene art behind it but clears all play overlays.
  function pageStage(bg) {
    setArt(bg || "black", "normal");
    setPov("normal");
    setLight("off");
    setCaption(null);
    setPinned(null);
    setEcho(null);
    setHush(false);
    setCast(null);
  }

  // ------------------------------------------------------------------ play layer

  function setPlate(speaker, routeId) {
    var plate = $("plate");
    clear(plate);
    plate.className = "plate";
    plate.removeAttribute("style");
    if (!speaker) {
      plate.hidden = true;
      plate.removeAttribute("data-testid");
      return;
    }
    var name = characterName(speaker, routeId);
    if (!name) {
      plate.hidden = true;
      plate.removeAttribute("data-testid");
      return;
    }
    var ls = langs();
    if (ls.length === 1) plate.appendChild(doc.createTextNode(pick(name, ls[0])));
    else {
      plate.appendChild(doc.createTextNode(pick(name, "ko")));
      plate.appendChild(h("span", { class: "plate__en", lang: "en" }, " · " + pick(name, "en")));
    }
    var c = BHS.characters[speaker];
    if (speaker === "jesus") plate.classList.add("plate--jesus");
    else if (c && c.color) plate.style.setProperty("--plate", c.color);
    plate.setAttribute("data-testid", "speaker");
    plate.hidden = false;
  }

  function rateFor(l, hush) {
    var base = RATES[S.speed] == null ? RATES.normal : RATES[S.speed];
    // Latin letters are narrower; in "both" mode the second language types faster still.
    var r = l === "en" ? base * (S.lang === "both" ? 0.4 : 0.5) : base;
    return hush ? r * 2.2 : r;
  }

  // Fill the text box with one or both languages; returns typewriter groups.
  function fillText(host, t, state, opts) {
    clear(host);
    var ls = langs();
    var groups = [];
    var typing = !opts.instant && !instantText();
    ls.forEach(function (l, idx) {
      var p = h("p", { class: ls.length > 1 && idx > 0 ? "en" : "ko", lang: l });
      var chars = typing ? [] : null;
      if (opts.verseKey) {
        var txt = verseOf(opts.verseKey, l);
        if (chars) {
          Array.from(txt).forEach(function (ch) {
            var c = doc.createElement("span");
            c.className = "c";
            c.textContent = ch;
            p.appendChild(c);
            chars.push(c);
          });
        } else p.textContent = txt;
      } else {
        richInto(p, t, l, state, chars);
      }
      host.appendChild(p);
      if (chars) groups.push({ chars: chars, rate: rateFor(l, opts.hush) });
    });
    return groups;
  }

  function resetPlay() {
    var play = $("play");
    play.className = "play";
    var panel = $("panel");
    panel.className = "panel";
    panel.removeAttribute("data-testid");
    panel.hidden = false;
    clear($("text"));
    $("ref").hidden = true;
    clear($("ref"));
    setPlate(null);
    var choices = $("choices");
    clear(choices);
    choices.hidden = true;
    var pressbox = $("pressbox");
    clear(pressbox);
    pressbox.hidden = true;
    var card = $("card");
    clear(card);
    card.hidden = true;
    card.removeAttribute("data-testid");
    doc.body.classList.remove("is-last");
  }

  function renderPlay(v, ctx) {
    ctx = ctx || {};
    var step = v.step;
    var state = ctx.state || {};
    var hd = S.handlers;
    typeStop();
    updateStage(v, state);
    resetPlay();
    $("play").hidden = false;
    renderActions(v.actions || [], step);
    // Portraits step back while a choice is open; the engine keeps them for the next line.
    var castLayer = $("cast");
    if (castLayer) castLayer.classList.toggle("is-away", step.kind === "choice");
    var panel = $("panel");
    var text = $("text");
    var hush = !!(v.now && v.now.hush);
    var groups = [];

    switch (step.kind) {
      case "line": {
        var sp = step.speaker || "narrator";
        if (sp === "sign") $("play").classList.add("play--sign");
        else if (sp === "thought") panel.classList.add("panel--thought");
        else if (sp !== "narrator") setPlate(sp, ctx.routeId);
        if (step.mismatch) panel.classList.add("panel--mismatch");
        groups = fillText(text, step.text, state, { instant: ctx.instant, hush: hush });
        break;
      }
      case "verse": {
        panel.classList.add("panel--verse");
        panel.setAttribute("data-testid", "verse-card");
        var vs = step.speaker || "narrator";
        if (vs === "jesus") panel.classList.add("panel--jesus");
        if (vs === "jesus" || vs === "scribes") setPlate(vs, ctx.routeId);
        groups = fillText(text, null, state, { instant: ctx.instant, hush: hush, verseKey: step.key });
        var ref = $("ref");
        ref.textContent = refLine(step.key);
        ref.hidden = !ref.textContent;
        break;
      }
      case "choice":
        panel.hidden = true;
        renderChoice(step, state);
        break;
      case "press":
        panel.hidden = true;
        $("play").classList.add("play--press");
        renderPress(step);
        break;
      case "endingTitle":
        panel.hidden = true;
        renderCard(step);
        break;
      case "last":
        $("play").classList.add("play--last");
        doc.body.classList.add("is-last");
        groups = fillText(text, step.text, state, { instant: ctx.instant, hush: false });
        break;
      default:
        panel.hidden = true;
    }

    anchorCast();

    if (!panel.hidden) {
      panel.classList.remove("is-ready");
      typeStart(groups, function () {
        panel.classList.add("is-ready");
        if (hd.onTyped) hd.onTyped();
      });
    }
  }

  function renderChoice(step, state) {
    var box = $("choices");
    clear(box);
    var pid = "prompt-" + step.id;
    if (step.prompt) box.appendChild(h("p", { class: "choices__prompt", id: pid }, biRich(step.prompt, state)));
    var list = h("div", { class: "choices__list", role: "group", "aria-labelledby": step.prompt ? pid : null, "aria-label": step.prompt ? null : flat(u("choiceGroup")) });
    step.options.forEach(function (o, idx) {
      var b = h("button", { type: "button", class: "opt", "data-testid": "choice-" + o.id, "data-option": o.id, "aria-keyshortcuts": String(idx + 1) + " " + o.id.toUpperCase() }, [
        h("span", { class: "opt__num", "aria-hidden": "true" }, String(idx + 1)),
        h("span", { class: "opt__body" }, biRich(o.text, state))
      ]);
      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (S.handlers.onChoose) S.handlers.onChoose(o.id);
      });
      list.appendChild(b);
    });
    box.appendChild(list);
    box.hidden = false;
    box.scrollTop = 0;
    clear($("reply"));
    // Long options (verse texts) would overflow a 2x2 grid; full-width rows wrap far less.
    box.classList.remove("is-stacked");
    if (box.scrollHeight > box.clientHeight + 2) box.classList.add("is-stacked");
  }

  function renderPress(step) {
    var box = $("pressbox");
    clear(box);
    if (step.hint && !step.action) box.appendChild(h("p", { class: "pressbox__hint" }, bi(step.hint)));
    if (!step.action) {
      var b = h("button", { type: "button", class: "glow", "data-testid": "press" }, bi(step.label || u("pressDefault")));
      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (S.handlers.onPress) S.handlers.onPress();
      });
      box.appendChild(b);
    } else if (step.hint) {
      box.appendChild(h("p", { class: "pressbox__hint" }, bi(step.hint)));
    }
    box.hidden = !box.firstChild;
  }

  function renderActions(actions, step) {
    var bar = $("actions");
    clear(bar);
    // While a choice is open the gray buttons step aside so the options have the room.
    if (!actions.length || (step && (step.kind === "endingTitle" || step.kind === "last" || step.kind === "choice"))) {
      bar.hidden = true;
      return;
    }
    bar.setAttribute("role", "group");
    bar.setAttribute("aria-label", flat(u("actionsGroup")));
    actions.forEach(function (a) {

      } else {
        b = h("button", { type: "button", class: "act", "data-testid": "action-" + a.id, "data-action": a.id }, bi(a.label));
      }
      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (S.handlers.onAction) S.handlers.onAction(a.id, b);
      });
      bar.appendChild(b);
    });
    bar.hidden = false;
  }

  function showReply(t, state) {
    var r = $("reply");
    clear(r);
    if (!t) return;
    append(r, biRich(t, state));
    void r.offsetWidth;
    r.classList.add("is-on");
    clearTimeout(S.replyTimer);
    S.replyTimer = setTimeout(function () {
      r.classList.remove("is-on");
      S.replyTimer = setTimeout(function () {
        clear(r);
      }, 300);
    }, 2600);
  }

  function shake(btn) {

    void btn.offsetWidth;
    btn.classList.add("is-shake");
  }

  var LENS_NUM = { 1: "①", 2: "②", 3: "③" };

  function renderCard(step) {
    var card = $("card");

      ]),

          h("div", { class: "langpick__row", role: "group", "aria-labelledby": "langpick-label" }, [langBtn("ko", u("langKo"), "lang-ko"), langBtn("en", u("langEn"), "lang-en"), langBtn("both", u("langBoth"), "lang-both")])
        ]),

<script>/* js/main.js */
/*
 * js/main.js - app controller for "Before He Stood".
 * Owns screen flow (title -> prologue -> route select -> route -> ending card -> ending -> final ->
 * gallery), persistence (SPEC 5.3), keyboard input, deep links (#scribe/#friend/#asher), the
 * ?debug=1 panel, and the automated-test hooks:
 *   document.body.dataset.screen, window.BHS_DEBUG.state(), BHS.ui.debugState(), ?test=1.
 */
(function () {
  "use strict";

  var BHS = (window.BHS = window.BHS || {});
  var doc = document;
  var V = BHS.view;
  var E = BHS.engine;

  var KEYS = {
    settings: "bhs.v1.settings",
    save: "bhs.v1.save",
    gallery: "bhs.v1.gallery",
    blanks: "bhs.v1.blanks"
  };
  var SAVE_VERSION = 1;
  var PLAY_SCREENS = { prologue: true, play: true, endingCard: true, ending: true };

  // ------------------------------------------------------------------ storage (never throws)

  var store = {
    get: function (k) {
      try {
        var s = window.localStorage.getItem(k);
        return s ? JSON.parse(s) : null;
      } catch (err) {
        return null;
      }
    },
    set: function (k, v) {
      try {
        window.localStorage.setItem(k, JSON.stringify(v));
        return true;
      } catch (err) {
        return false;
      }
    },
    del: function (k) {
      try {
        window.localStorage.removeItem(k);
      } catch (err) {
        /* storage unavailable */
      }
    },
    probe: function () {
      try {
        var k = "bhs.v1.probe";
        window.localStorage.setItem(k, "1");
        window.localStorage.removeItem(k);
        return true;
      } catch (err) {
        return false;
      }
    }
  };

  // ------------------------------------------------------------------ app state

  function readParams() {
    var out = {};
    try {
      var q = (window.location.search || "").replace(/^\?/, "").split("&");
      q.forEach(function (pair) {
        if (!pair) return;
        var kv = pair.split("=");
        out[decodeURIComponent(kv[0])] = kv.length > 1 ? decodeURIComponent(kv[1]) : "1";
      });
    } catch (err) {
      /* ignore malformed query */
    }
    return out;
  }

  var params = readParams();

  var app = {
    screen: null,
    game: null,
    settings: { lang: "both", speed: "normal", size: 1 },
    storageOK: false,
    debug: params.debug === "1" || params.debug === "true",
    test: params.test === "1" || params.test === "true",
    lastEnding: null,
    guardUntil: 0,
    notice: null,
    debugMin: false
  };

  function now() {
    return window.performance && performance.now ? performance.now() : Date.now();
  }

  function routeExists(id) {
    return !!(BHS.routes && BHS.routes[id] && Array.isArray(BHS.routes[id].beats));
  }

  // ------------------------------------------------------------------ settings

  function loadSettings() {
    var s = store.get(KEYS.settings);
    if (s && typeof s === "object") {
      if (s.lang === "ko" || s.lang === "en" || s.lang === "both") app.settings.lang = s.lang;
      if (s.speed === "slow" || s.speed === "normal" || s.speed === "instant") app.settings.speed = s.speed;
      if (typeof s.size === "number" && isFinite(s.size)) app.settings.size = s.size;
    }
  }

  function saveSettings() {
    store.set(KEYS.settings, app.settings);
  }

  function applySettings() {
    V.applySettings({ lang: app.settings.lang, speed: app.settings.speed, size: app.settings.size });
    app.settings.size = V.state.size;
  }

  // ------------------------------------------------------------------ save / gallery / blanks

  function persist() {
    if (!app.game) return;
    store.set(KEYS.save, {
      v: SAVE_VERSION,
      at: Date.now(),
      screen: app.screen,
      routeId: app.game.state.routeId,
      state: app.game.serialize()
    });
  }

  function persistRouteSelect() {
    store.set(KEYS.save, { v: SAVE_VERSION, at: Date.now(), screen: "routeSelect", routeId: null, state: null });
  }

  function loadSave() {
    var s = store.get(KEYS.save);
    if (!s || s.v !== SAVE_VERSION) return null;
    if (s.screen === "routeSelect") return s;
    if (!s.state || !s.routeId) return null;
    if (s.routeId !== "prologue" && !routeExists(s.routeId)) return null;
    return s;
  }

  function clearSave() {
    store.del(KEYS.save);
  }

  function loadGallery() {
    var g = store.get(KEYS.gallery);
    return Array.isArray(g) ? g.filter(function (x) { return typeof x === "string"; }) : app.memGallery || [];
  }

  function markSeen(id) {
    if (!id) return;
    var g = loadGallery();
    if (g.indexOf(id) < 0) g.push(id);
    app.memGallery = g;
    store.set(KEYS.gallery, g);
  }

  function loadBlanks() {
    var b = store.get(KEYS.blanks);
    return b && typeof b === "object" ? b : app.memBlanks || {};
  }

  function saveBlank(routeId, value) {
    var b = loadBlanks();
    b[routeId] = String(value || "").slice(0, 40);
    app.memBlanks = b;
    store.set(KEYS.blanks, b);
  }

  // ------------------------------------------------------------------ screens

  function setScreen(name) {
    var changed = app.screen !== name;
    app.screen = name;
    doc.body.setAttribute("data-screen", name);
    V.showLayer(name);
    // Re-rendering the same screen (for example after A+/A-) keeps the settings panel open.
    if (changed) V.closeSettings();
    if (!PLAY_SCREENS[name]) doc.body.classList.remove("is-idle");
  }

  function headerHandlers() {
    return {
      onHome: askHome,
      onLang: setLang,
      onSettings: toggleSettings,
      onFullscreen: toggleFullscreen,
      canFullscreen: canFullscreen(),
      isFullscreen: !!fullscreenElement()
    };
  }

  function renderHeader() {
    V.renderHeader(headerHandlers());
  }

  function showTitle() {
    V.closeModal();
    app.game = null;
    setScreen("title");
    V.pageStage("shore_dawn");
    var save = loadSave();
    var saveLabel = null;
    if (save && save.routeId && save.routeId !== "prologue" && BHS.meta && BHS.meta.routes && BHS.meta.routes[save.routeId]) {
      saveLabel = V.flat(BHS.meta.routes[save.routeId].name);
    }
    var notice = app.notice ? BHS.ui[app.notice] : !app.storageOK ? BHS.ui.storageOff : null;
    app.notice = null;
    V.renderTitle({
      hasSave: !!save,
      saveLabel: saveLabel,
      notice: notice,
      onStart: startPrologue,
      onContinue: continueGame,
      onGallery: function () {
        showGallery({});
      },
      onLang: function (mode) {
        setLang(mode);
      }
    });
    refreshDebug();
  }

  function startPrologue() {
    app.lastEnding = null;
    try {
      app.game = E.createGame("prologue", { debug: app.debug });
    } catch (err) {
      showRouteSelect();
      return;
    }
    renderGame();
  }

  function showRouteSelect(opts) {
    app.game = null;
    setScreen("routeSelect");
    V.pageStage("shore_dawn");
    persistRouteSelect();
    V.renderRouteSelect({
      notice: opts && opts.notice ? BHS.ui[opts.notice] : null,
      onPick: function (id) {
        if (!routeExists(id)) {
          showRouteSelect({ notice: "routeMissing" });
          return;
        }
        startRoute(id);
      }
    });
    refreshDebug();
  }

  function startRoute(id) {
    if (!routeExists(id)) {
      app.notice = "routeMissing";
      showTitle();
      return;
    }
    app.lastEnding = null;
    app.game = E.createGame(id, { debug: app.debug });
    renderGame();
  }

  function screenForGame(g) {
    var st = g.state;
    if (st.routeId === "prologue") return "prologue";
    if (st.step && st.step.kind === "endingTitle") return "endingCard";
    var t = st.segs.indexOf("@title");
    if (t >= 0 && st.seg > t) return "ending";
    return "play";
  }

  function tokenState(g) {
    return { vars: g.state.vars, debug: app.debug };
  }

  function playHandlers() {
    return {
      onAdvance: onAdvance,
      onChoose: onChoose,
      onPress: onPress,
      onAction: onAction
    };
  }

  function renderGame(opts) {
    var g = app.game;
    if (!g) return showTitle();
    var v = g.view();
    var kind = v.step && v.step.kind;
    if (kind === "routeSelect") {
      showRouteSelect();
      return;
    }
    if (kind === "final") {
      showFinal();
      persist();
      return;
    }
    if (kind === "end") {
      finishRoute();
      return;
    }
    if (kind === "endingTitle" && v.ending) {
      markSeen(v.ending.id);
      app.lastEnding = v.ending.id;
    }
    setScreen(screenForGame(g));
    V.renderPlay(v, { routeId: g.state.routeId, state: tokenState(g), instant: !!(opts && opts.instant) });
    app.guardUntil = app.test ? 0 : now() + 220;
    persist();
    refreshDebug();
  }

  function showFinal() {
    var g = app.game;
    var routeId = g.state.routeId;
    if (g.state.ending) app.lastEnding = g.state.ending.id;
    setScreen("final");
    V.renderFinal({
      routeId: routeId,
      blanks: loadBlanks(),
      storageOK: app.storageOK,
      onBlank: function (val) {
        saveBlank(routeId, val);
      },
      onNext: function () {
        if (app.game && app.game.step && app.game.step.kind === "final") app.game.next();
        finishRoute();
      }
    });
    refreshDebug();
  }

  function finishRoute() {
    clearSave();
    var current = app.lastEnding;
    app.game = null;
    showGallery({ current: current });
  }

  function showGallery(opts) {
    opts = opts || {};
    app.game = null;
    setScreen("gallery");
    V.pageStage("black");
    V.renderGallery({
      seen: loadGallery(),
      current: opts.current || null,
      onReplay: function () {
        showRouteSelect();
      },
      onHome: showTitle
    });
    refreshDebug();
  }

  function continueGame() {
    var s = loadSave();
    if (!s) {
      showTitle();
      return;
    }
    if (s.screen === "routeSelect") {
      showRouteSelect();
      return;
    }
    try {
      app.game = E.restoreGame(s.state, { debug: app.debug });
      renderGame({ instant: true });
    } catch (err) {
      clearSave();
      app.notice = "resumeFailed";
      showTitle();
    }
  }

  // ------------------------------------------------------------------ input

  function onAdvance() {
    var g = app.game;
    if (!g || !PLAY_SCREENS[app.screen] || V.isModalOpen()) return;
    if (V.completeTyping()) return;
    var kind = g.step && g.step.kind;
    if (kind === "line" || kind === "verse" || kind === "endingTitle" || kind === "last") {
      if (now() < app.guardUntil) return;
      g.next();
      renderGame();
    }
  }

  // After a pick the chosen button disappears; hand focus back to the page so the
  // story keys (Space, Enter, arrows, PageDown) keep working without a stray ring.
  function focusAdvance() {
    var el = doc.activeElement;
    if (el && el !== doc.body && typeof el.blur === "function" && !doc.getElementById("play").contains(el)) return;
    if (el && el !== doc.body && typeof el.blur === "function") el.blur();
  }

  function onChoose(optId) {
    var g = app.game;
    if (!g || !g.step || g.step.kind !== "choice") return;
    if (!g.choose(optId)) return;
    renderGame();
    focusAdvance();
  }

  function onPress() {
    var g = app.game;
    if (!g || !g.step || g.step.kind !== "press") return;
    g.press();
    renderGame();
    focusAdvance();
  }

  function onAction(id, btn) {
    var g = app.game;
    if (!g) return;
    var res = g.tapAction(id);
    if (!res) return;
    if (res.pressed) {
      renderGame();
      focusAdvance();
      return;
    }
    V.showReply(res.text, tokenState(g));
    V.shake(btn);
    persist();
    refreshDebug();
  }

  // Keyboard and presentation-clicker control (SPEC 5.6, TV display).
  var ADVANCE_KEYS = { " ": true, Spacebar: true, Enter: true, ArrowRight: true, ArrowDown: true, PageDown: true };
  var INERT_KEYS = { ArrowLeft: true, ArrowUp: true, PageUp: true };

  function choiceIndexForKey(key) {
    if (/^[1-4]$/.test(key)) return Number(key) - 1;
    var i = "abcd".indexOf(String(key).toLowerCase());
    return key && key.length === 1 && i >= 0 ? i : -1;
  }

  function moveChoiceFocus(dir) {
    var opts = Array.prototype.slice.call(doc.querySelectorAll("#choices .opt"));
    if (!opts.length) return;
    var cur = opts.indexOf(doc.activeElement);
    var next = cur < 0 ? (dir < 0 ? opts.length - 1 : 0) : dir === 0 ? cur : (cur + dir + opts.length) % opts.length;
    try {
      opts[next].focus({ preventScroll: false });
    } catch (err) {
      opts[next].focus();
    }
  }

  function handleEscape(ev) {
    if (!doc.getElementById("settings").hidden) {
      ev.preventDefault();
      V.closeSettings();
      return;
    }
    if (!doc.getElementById("modal").hidden) {
      ev.preventDefault();
      V.closeModal();
      return;
    }
    if (PLAY_SCREENS[app.screen] || app.screen === "final") {
      ev.preventDefault();
      askHome();
    }
  }

  function onKey(ev) {
    if (ev.defaultPrevented || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var key = ev.key;
    var target = ev.target || {};
    var tag = target.tagName || "";
    var typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || !!target.isContentEditable;
    if (key === "Escape" || key === "Esc") {
      handleEscape(ev);
      return;
    }
    if (typing) return;
    if ((key === "f" || key === "F") && !ev.repeat) {
      ev.preventDefault();
      toggleFullscreen();
      return;
    }
    if (V.isModalOpen()) return;
    // Space/Enter on a focused button or link keep their native meaning.
    var nativeActivate = (key === " " || key === "Enter" || key === "Spacebar") && (tag === "BUTTON" || tag === "A");

    if (app.screen === "title") {
      if (ADVANCE_KEYS[key] && !nativeActivate && !ev.repeat) {
        ev.preventDefault();
        startPrologue();
      }
      return;
    }
    if (!PLAY_SCREENS[app.screen] || !app.game) return;
    var step = app.game.step;
    var kind = step && step.kind;

    if (kind === "choice") {
      var idx = choiceIndexForKey(key);
      if (idx >= 0 && step.options[idx]) {
        ev.preventDefault();
        if (!ev.repeat) onChoose(step.options[idx].id);
        return;
      }
      if (key === "ArrowDown" || key === "ArrowRight" || key === "ArrowUp" || key === "ArrowLeft") {
        ev.preventDefault();
        moveChoiceFocus(key === "ArrowDown" || key === "ArrowRight" ? 1 : -1);
        return;
      }
      if (nativeActivate) return;
      if (ADVANCE_KEYS[key] || INERT_KEYS[key]) {
        // Never pick an option by accident: an advance key only shows where focus is.
        ev.preventDefault();
        if (ADVANCE_KEYS[key]) moveChoiceFocus(0);
      }
      return;
    }

    if (ADVANCE_KEYS[key]) {
      if (nativeActivate) return;
      ev.preventDefault();
      if (ev.repeat) return;
      if (kind === "press") onPress();
      else onAdvance();
      return;
    }
    if (INERT_KEYS[key]) ev.preventDefault();
  }

  // ------------------------------------------------------------------ fullscreen + idle cursor

  function fullscreenElement() {
    return doc.fullscreenElement || doc.webkitFullscreenElement || null;
  }

  function canFullscreen() {
    var el = doc.documentElement;
    var api = el.requestFullscreen || el.webkitRequestFullscreen;
    var enabled = doc.fullscreenEnabled !== undefined ? doc.fullscreenEnabled : doc.webkitFullscreenEnabled;
    return !!api && enabled !== false;
  }

  function toggleFullscreen() {
    function quiet(p) {
      if (p && typeof p.catch === "function") p.catch(function () {});
    }
    try {
      if (fullscreenElement()) {
        var exit = doc.exitFullscreen || doc.webkitExitFullscreen;
        if (exit) quiet(exit.call(doc));
      } else if (canFullscreen()) {
        var el = doc.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        quiet(req.call(el));
      }
    } catch (err) {
      /* fullscreen refused (for example inside a sandboxed frame) */
    }
  }

  var idleTimer = 0;

  function wakeCursor() {
    doc.body.classList.remove("is-idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      if (PLAY_SCREENS[app.screen]) doc.body.classList.add("is-idle");
    }, 3000);
  }

  // ------------------------------------------------------------------ header actions

  function askHome() {
    V.closeSettings();
    if (app.screen === "title") return;
    // Nothing to lose outside the story itself.
    if (!PLAY_SCREENS[app.screen] && app.screen !== "final") {
      showTitle();
      return;
    }
    persist();
    V.ask({
      title: BHS.ui.confirmHomeTitle,
      body: BHS.ui.confirmHomeBody,
      yes: BHS.ui.confirmHomeYes,
      no: BHS.ui.confirmNo,
      onYes: showTitle,
      onNo: focusAdvance
    });
  }

  function rerender() {
    renderHeader();
    switch (app.screen) {
      case "title":
        showTitle();
        break;
      case "routeSelect":
        showRouteSelect();
        break;
      case "final":
        showFinal();
        break;
      case "gallery":
        showGallery({ current: app.lastEnding });
        break;
      default:
        if (app.game) renderGame({ instant: true });
    }
  }

  function setLang(mode) {
    if (mode !== "ko" && mode !== "en" && mode !== "both") return;
    app.settings.lang = mode;
    saveSettings();
    applySettings();
    rerender();
  }

  function settingsHandlers() {
    return {
      onSpeed: function (speed) {
        app.settings.speed = speed;
        saveSettings();
        applySettings();
        V.renderSettings(settingsHandlers());
      },
      onSize: function (delta) {
        app.settings.size = V.state.size + delta;
        applySettings();
        saveSettings();
        V.renderSettings(settingsHandlers());
        if (PLAY_SCREENS[app.screen] && app.game) renderGame({ instant: true });
      },
      onClose: function () {
        V.closeSettings();
        var gear = doc.querySelector('[data-testid="settings-open"]');
        if (gear) gear.focus({ preventScroll: true });
      }
    };
  }

  function toggleSettings() {
    if (!doc.getElementById("settings").hidden) {
      V.closeSettings();
      return;
    }
    V.openSettings(settingsHandlers());
  }

  // ------------------------------------------------------------------ debug + test hooks

  function debugState() {
    var g = app.game;
    var st = g ? g.state : null;
    var rid = st && st.routeId !== "prologue" ? st.routeId : null;
    var lensNow = rid && routeExists(rid) ? E.computeLens(rid, st.choices) : null;
    return JSON.parse(
      JSON.stringify({
        screen: app.screen,
        routeId: rid,
        beatIndex: st ? st.at.index : null,
        list: st ? st.at.list : null,
        step: st && st.step ? st.step.kind : null,
        stepId: st && st.step ? st.step.id || null : null,
        choices: st ? st.choices : {},
        scores: lensNow ? lensNow.scores : null,
        projectedLens: lensNow ? lensNow.lens : null,
        flags: st ? st.flags : {},
        vars: st ? st.vars : {},
        lens: st && st.ending ? st.ending.lens : null,
        ending: st && st.ending ? st.ending.id : app.lastEnding,
        mismatch: st && st.ending ? st.ending.mismatch : null,
        light: st ? st.stage.light : null,
        pov: st ? st.stage.pov : null,
        lang: app.settings.lang,
        typing: V.isTyping()
      })
    );
  }

  function exposeHooks() {
    window.BHS_DEBUG = {
      state: debugState,
      game: function () {
        return app.game;
      },
      startRoute: startRoute,
      showTitle: showTitle,
      jump: jumpTo
    };
    if (BHS.ui) {
      try {
        Object.defineProperty(BHS.ui, "debugState", { value: debugState, enumerable: false, configurable: true, writable: true });
      } catch (err) {
        /* ui strings object frozen; window.BHS_DEBUG still works */
      }
    }
  }

  function currentRouteId() {
    var st = app.game && app.game.state;
    if (st && st.routeId !== "prologue") return st.routeId;
    return (BHS.meta && BHS.meta.routeOrder && BHS.meta.routeOrder[0]) || "scribe";
  }

  function jumpTo(cid, routeId) {
    var rid = routeId || currentRouteId();
    if (!routeExists(rid)) return;
    var prev = app.game && app.game.state.routeId === rid ? JSON.parse(JSON.stringify(app.game.state.choices)) : {};
    var g = E.createGame(rid, { debug: app.debug });
    g.fastForward({
      until: function (s) {
        return s.kind === "choice" && s.id === cid;
      },
      pick: function (s) {
        return prev[s.id] || s.options[0].id;
      }
    });
    app.game = g;
    renderGame({ instant: true });
  }

  function randomPick(step) {
    return step.options[Math.floor(Math.random() * step.options.length)].id;
  }

  function autoPick() {
    var g = app.game;
    if (!g || !PLAY_SCREENS[app.screen]) return;
    if (g.step.kind === "choice") g.choose(randomPick(g.step));
    else {
      g.fastForward({
        until: function (s) {
          return s.kind === "choice";
        }
      });
    }
    renderGame({ instant: true });
  }

  function autoPlay() {
    var g = app.game;
    if (!g || !PLAY_SCREENS[app.screen]) return;
    g.fastForward({
      until: function (s) {
        return s.kind === "final";
      },
      pick: randomPick
    });
    renderGame({ instant: true });
  }

  // The debug panel is a developer tool, so it always uses the English labels.
  function dbg(key) {
    return (BHS.ui && BHS.ui[key] && BHS.ui[key].en) || key;
  }

  function refreshDebug() {
    if (!app.debug) return;
    var h = V.h;
    var box = doc.getElementById("debug");
    box.hidden = false;
    V.clear(box);
    box.className = "debug" + (app.debugMin ? " is-min" : "");
    var toggle = h(
      "button",
      {
        type: "button",
        on: {
          click: function () {
            app.debugMin = !app.debugMin;
            refreshDebug();
          }
        }
      },
      app.debugMin ? dbg("debugTitle") : dbg("debugHide")
    );
    box.appendChild(toggle);
    if (app.debugMin) return;
    var s = debugState();
    var info = [
      "screen " + s.screen + "  route " + (s.routeId || "-") + "  " + (s.list || "-") + "#" + (s.beatIndex == null ? "-" : s.beatIndex) + "  step " + (s.step || "-") + (s.stepId ? " " + s.stepId : ""),
      "choices " + JSON.stringify(s.choices),
      "scores " + JSON.stringify(s.scores) + "  projected " + (s.projectedLens || "-") + "  lens " + (s.lens || "-"),
      "flags " + JSON.stringify(s.flags) + "  vars " + JSON.stringify(s.vars),
      "light " + s.light + "  pov " + s.pov,
      E.warnings.length ? "warnings: " + E.warnings.slice(-3).join(" | ") : ""
    ].join("\n");
    box.appendChild(h("pre", null, info));
    var routes = (BHS.meta && BHS.meta.routeOrder) || ["scribe", "friend", "asher"];
    routes.forEach(function (rid) {
      box.appendChild(h("button", { type: "button", disabled: routeExists(rid) ? null : true, on: { click: function () { startRoute(rid); } } }, rid));
    });
    var sel = h("select", { "aria-label": dbg("debugJump"), "data-testid": "debug-select" });
    for (var i = 1; i <= 10; i++) sel.appendChild(h("option", { value: "c" + i }, "c" + i));
    box.appendChild(sel);
    box.appendChild(h("button", { type: "button", "data-testid": "debug-jump", on: { click: function () { jumpTo(sel.value); } } }, dbg("debugJump")));
    box.appendChild(h("button", { type: "button", "data-testid": "debug-autopick", on: { click: autoPick } }, dbg("debugAutoPick")));
    box.appendChild(h("button", { type: "button", "data-testid": "debug-autoplay", on: { click: autoPlay } }, dbg("debugAutoPlay")));
  }

  // ------------------------------------------------------------------ boot

  function routeFromHash() {
    var hash = (window.location.hash || "").replace(/^#/, "");
    return /^(scribe|friend|asher)$/.test(hash) ? hash : null;
  }

  function boot() {
    if (!V || !E) {
      if (window.console) console.error("[BHS] engine or view missing");
      return;
    }
    if (app.test) doc.documentElement.classList.add("is-test");
    E.debug = app.debug;
    app.storageOK = store.probe();
    loadSettings();
    applySettings();
    V.init({ test: app.test, debug: app.debug, handlers: playHandlers() });
    renderHeader();
    exposeHooks();
    doc.addEventListener("keydown", onKey);
    doc.addEventListener("mousemove", wakeCursor, { passive: true });
    doc.addEventListener("mousedown", wakeCursor, { passive: true });
    doc.addEventListener("fullscreenchange", renderHeader);
    doc.addEventListener("webkitfullscreenchange", renderHeader);
    window.addEventListener("hashchange", function () {
      var rid = routeFromHash();
      if (rid) startRoute(rid);
    });
    var rid = routeFromHash();
    if (rid) startRoute(rid);
    else showTitle();
  }

  if (doc.readyState === "loading") doc.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
</html>
