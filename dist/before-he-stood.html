              en: "“He couldn't walk—now look at him! And we brought him!”"
            },
            lens: 3
          },
          {
            id: "d",
            text: {
              ko: "“본인한테 물어봐. 그 자리에 누워 있던 사람이잖아.”",
              en: "“Ask him. He's the one who was lying there.”"
            },
            lens: 3
          }
        ]
      },
      // The moment is over; the light of his presence fades before the ending (SPEC 4.5).
      { type: "fx", fx: "light", level: "off" }
    ],

    // Titles come from data/meta.js (BHS.meta.endings.friend, including "cut").
    // Ending 2's beat states that Jesus gave no reason for the illness (SPEC 7.2); its last line
    // echoes the ending title and the game title ("before he stood").
    endings: {
      "1": {
        beats: [
          {
            type: "line",
            id: "e1-default",
            when: { not: { choice: "c1", is: "a" } },
            text: {
              ko: "요나는 한 번도 물어본 적이 없었다. 누가 죄를 사할 수 있는지. 오늘 전까지는.",
              en: "Yonah had never once asked who can forgive sins. Not until today."
            }
          },
          {
            type: "line",
            id: "e1-callback-c1a",
            when: { choice: "c1", is: "a" },
            text: {
              ko: "아침에 아셀이 물었다. “네가 그걸 어떻게 알아?” 그 질문에 답하실 수 있는 분이, 오늘 거기 계셨다.",
              en: "This morning Asher asked, “How would you know?” Today, the one who could answer that was there."
            }
          }
        ],
        last: {
          ko: "우리는 걷게 해 달라고 했다. 그분은 그보다 깊은 데서 시작하셨다.",
          en: "We asked for him to walk. He began somewhere deeper."
        }
      },

      "2": {
        beats: [
          {
            type: "line",
            id: "e2-first-words",
            text: {
              ko: "그분은 아셀이 왜 아팠는지 한마디도 하지 않으셨다. 다리 이야기보다 먼저, 아셀에게 말을 거셨다.",
              en: "Jesus never said a word about why Asher had been sick. Before anything about his legs, he spoke to Asher himself."
            }
          }
        ],
        last: {
          ko: "다들 아셀이 걸은 것을 기억한다. 나는 그가 일어나기 전의 첫마디도 기억한다.",
          en: "Everyone remembers that Asher walked. I remember the first words too, the ones before he stood."
        }
      },

      "3": {
        beats: [
          {
            type: "line",
            id: "e3-beside",
            text: {
              ko: "요나는 처음으로 빈손으로 아셀 옆을 걷는다. 어릴 적처럼, 나란히.",
              en: "For the first time, Yonah walks beside Asher with empty hands. Side by side, like when they were boys."
            }
          }
        ],
        last: {
          ko: "너는 그를 여기까지 들고 왔다. 집까지는 그가 침상을 들고 갔다.",
          en: "You carried him this far. The rest of the way home, he carried the bed."
        }
      },

      // Cut ending (c2 d). The event itself is unchanged: the others carry Asher on, and he
      // comes back up the lane on his own feet.
      cut: {
        beats: [
          {
            type: "line",
            id: "cut-alone",
            text: {
              ko: "요나는 골목에 그대로 서 있다. 침상이 무리 속으로 사라진다.",
              en: "Yonah stays where he is in the lane. The bed disappears into the crowd."
            }
          },
          // The event happens without him. This path never reached the crowd, so the verse the
          // last line turns on ("their faith") is shown here; it breaks off before the words to Asher.
          { type: "verse", id: "cut-9-2a", key: "MT_9_2A" },
          {
            type: "line",
            id: "cut-walks-up",
            text: {
              ko: "함성이 잦아들고 한참 뒤, 누군가 골목을 걸어 올라온다. 자기 침상을 든 아셀이다.",
              en: "Long after the shout from below dies down, someone comes walking up the lane. It's Asher, carrying his own bed."
            }
          },
          {
            type: "line",
            id: "cut-smile",
            text: { ko: "아셀이 요나를 지나며 웃는다.", en: "As he passes Yonah, Asher smiles at him." }
          }
        ],
        last: {
          ko: "그분은 *그들의* 믿음을 보셨다. 그날 침상을 든 손들 가운데 네 손은 없었다.",
          en: "He saw *their* faith. That day, your hands weren't among the ones carrying the bed."
        }
      }
    }
  };
})();

<script>/* data/routes/asher.js */
/* Asher route, short version: "What Did He Call Me?" Owner: asher writer.
 * Schema: docs/SPEC.md §4.5. Shape, scoring and screen budget: docs/SPEC-v3-short.md (4 choices, c4 counts double).
 * By design this route has NO cut option: Asher cannot walk away (meta.endings.asher.cutNote).
 * Budget: 30 screens on every path, 31 when the mismatch line plays (hard max 32).
 */
(function () {
  var BHS = (window.BHS = window.BHS || {});
  BHS.routes = BHS.routes || {};

  // Tiny builders. They only return plain objects in the SPEC §4.5 shape.
  function t(ko, en) {
    return { ko: ko, en: en };
  }
  function line(ko, en) {
    return { type: "line", text: t(ko, en) };
  }
  function thought(ko, en) {
    return { type: "line", speaker: "thought", text: t(ko, en) };
  }
  function sign(ko, en) {
    return { type: "line", speaker: "sign", text: t(ko, en) };
  }
  function verse(key, id) {
    var b = { type: "verse", key: key };
    if (id) b.id = id;
    return b;
  }
  function scene(bg, pov, ko, en, time) {
    var b = { type: "scene", bg: bg, pov: pov };
    if (ko) b.caption = t(ko, en);
    if (time) b.time = time;
    return b;
  }
  function fx(name, params) {
    var b = { type: "fx", fx: name };
    if (params) {
      for (var k in params) {
        if (Object.prototype.hasOwnProperty.call(params, k)) b[k] = params[k];
      }
    }
    return b;
  }
  function when(cond, beat) {
    beat.when = cond;
    return beat;
  }
  function opt(id, ko, en, lens, reaction) {
    return { id: id, text: t(ko, en), lens: lens, reaction: reaction || [] };
  }

  BHS.routes.asher = {
    id: "asher",

    // Gray buttons under the text box from the first beat (SPEC §4.5).
    actions: [
      {
        id: "getup",
        label: t("일어나기", "Get up"),
        replies: [
          t("다리가 대답하지 않는다.", "My legs don't answer."),
          t("여전히.", "Still nothing."),
          t("포기한 줄 알았는데. 아닌가 보다.", "I thought I'd given up. Guess not.")
        ],
        counter: "getup_count"
      },
      {
        id: "goout",
        label: t("밖으로", "Go outside"),
        replies: [t("그러려면 다리가 필요하다.", "That would take legs.")],
        counter: "goout_count"
      }
    ],

    beats: [
      // ---------- 1. Dawn at home (lying POV) ----------
      scene("asher_ceiling", "lying", "새벽 · 아셀의 집", "Dawn · Asher's house"),
      // Explicit for robustness; a no-op if the engine already shows them from the first beat.
      fx("actionsShow"),
      line(
        "들보와 갈대 지붕. 네 해째, 아셀이 아침마다 가장 먼저 보는 풍경이다.",
        "Wooden beams and a reed roof. For four years now, it's the first thing Asher sees every morning."
      ),

      // c1: the morning prayer. Options are the psalms themselves (tokens only).
      {
        type: "choice",
        id: "c1",
        prompt: t("아침 기도로 드릴 시편. 어느 것이 내 마음에 가장 가까울까?", "A psalm for my morning prayer. Which one sounds most like me?"),
        options: [
          opt("a", "{{v:PS_38_3B}}", "{{v:PS_38_3B}}", 2, [
            thought("이 기도는 내 마음을 너무 잘 안다. 그래서 가끔 무섭다.", "This prayer knows me a little too well. That's what scares me sometimes.")
          ]),
          opt("b", "{{v:PS_41_4Q}}", "{{v:PS_41_4Q}}", 3, [
            thought("고쳐 달라는 대목에서, 눈이 자꾸 문 쪽으로 간다.", "When I get to the part about healing, my eyes keep drifting to the door.")
          ]),
          opt("c", "{{v:PS_22_1A}}", "{{v:PS_22_1A}}", 1, [
            thought("원망도 결국 하나님을 향해 하는 말이다.", "Even a complaint is still something you say to God.")
          ]),
          opt("d", "{{v:PS_103_3}}", "{{v:PS_103_3}}", 1, [
            thought("용서하시는 분과 고치시는 분. 같은 분이다.", "The one who forgives and the one who heals. The same one.")
          ])
        ]
      },

      // ---------- 2. Morning: Yonah bursts in (the boat is still on its way) ----------
      scene("asher_ceiling", "lying", "아침 · 아셀의 집", "Morning · Asher's house"),
      // c2: whatever he answers, the bed is lifted (the sign below answers a, b, d; c has its own reaction).
      {
        type: "choice",
        id: "c2",
        // Same words as Yonah's arrival line in the friend route, so the shared moment registers.
        prompt: t("요나가 뛰어 들어온다. “아셀! 그분이 배로 돌아오신대. 같이 가자!” 뭐라고 하지?", "Yonah bursts in. “Asher! Jesus is coming back by boat. Come with me!” What do I say?"),
        options: [
          opt("a", "“가고 싶어. 근데 겁나.”", "“I want to go. But I'm scared.”", 2),
          opt("b", "“그분이 어떤 분인데?”", "“Who is he, anyway?”", 1),
          // A refusal is answered by waiting, not by lifting him anyway: he consents before the lane.
          opt("c", "“싫어. 이 꼴로 사람들 앞에 나가기 싫어.”", "“No. I'm not going out in front of people like this.”", 2, [
            thought("요나는 따지지 않는다. 그냥 기다린다. 한참 뒤, 결국 내가 고개를 끄덕인다.", "Yonah doesn't argue. He just waits. After a long while, I nod.")
          ]),
          opt("d", "“내 겉옷 좀 줘. 그리고 가자.”", "“Hand me my cloak. Then let's go.”", 3)
        ]
      },

      // ---------- 3. THE LANE (SPEC §6.3), carried POV ----------
      scene("sky_carried", "lying", "늦은 아침 · 골목", "Late morning · The lane"),
      fx("actionReply", { action: "goout", text: t("나왔다. 내 발로 나온 건 아니지만.", "I'm out. Not on my own feet, but I'm out.") }),
      // One sign per answer: a and b hesitate; d asked to go; c is skipped (its reaction shows the wait and his nod).
      when({ any: [{ choice: "c2", is: "a" }, { choice: "c2", is: "b" }] }, sign("네가 망설여도, 사람들이 너를 든다.", "Even if you hesitate, people lift you.")),
      when({ choice: "c2", is: "d" }, sign("사람들이 너를 든다. 오늘은 네가 먼저 가자고 했다.", "People lift you. Today, you were the first to say, let's go.")),
      {
        type: "line",
        id: "lane-passerby",
        speaker: "passerby",
        text: t(
          "고통 뒤에 무슨 사연이 있는지 누가 알겠어. 저 사람은 무슨 잘못을 했기에 저렇게 됐을까.",
          "Who knows what's behind suffering like that. What did he do to end up like that?"
        )
      },
      line(
        "회당에서 보던 서기관 므나헴이 제자와 함께 비켜선다. 잠깐, 그와 아셀의 눈이 마주친다. 서로 아무 말이 없다.",
        "Menahem, a scribe from the synagogue, steps aside with his student. For a moment, his eyes meet Asher's. Neither says a word."
      ),

      // ---------- 4. THE CROWD (SPEC §6.4), lying POV before Jesus ----------
      // The scene itself sets the bed down before him (faces above, light); MT_9_2A narrates it.
      scene("crowd_lying", "lying", "정오 무렵 · 그분 앞", "Around noon · Before Jesus"),
      fx("light", { level: "soft" }),
      verse("MT_9_2A"),
      fx("light", { level: "bright" }),
      verse("MT_9_2B1", "first-words-1"),
      // Route title moment. The word means "child"; paraphrased, never quoted.
      thought("나를 뭐라고 부르셨지? 꼭 아이를 부르듯이.", "What did he just call me? Son—the way you'd call a child."),
      fx("hush"),
      verse("MT_9_2B2", "first-words-2"),
      fx("light", { level: "soft" }),
      // Neutral observation: nothing suggests forgiveness is unlocking his body (SPEC §7.2; lead decision).
      fx("actionReply", { action: "getup", text: t("다리는 그대로다.", "My legs haven't changed.") }),

      // c3: no option carries any "right answer" feel.
      {
        type: "choice",
        id: "c3",
        prompt: t("내 죄가 사함을 받았다고 하셨다. 가장 먼저 든 생각은?", "He said my sins are forgiven. What's my first thought?"),
        options: [
          opt("a", "그럼 병이 내 잘못이었다는 뜻인가?", "So does that mean my illness was my fault?", 2, [
            // Asher's own noticing, not a narrator ruling (SPEC §7.2). Variant recalls the c1 psalm.
            when(
              { choice: "c1", is: "a" },
              thought("아침 기도와 같은 두려움이다. 그런데 그 말 어디에도 ‘그래서’는 없었다.", "The same fear as my morning prayer. But there was no “because” anywhere in what he said.")
            ),
            when({ not: { choice: "c1", is: "a" } }, thought("그 말 어디에도 ‘그래서’는 없었다.", "There was no “because” anywhere in what he said."))
          ]),
          opt("b", "정말 나에게 하시는 말씀인가.", "Is he really saying this to me?", 2, [
            thought("다른 누구도 아니라, 침상에 누운 사람에게. 그게 나다.", "Not to anyone else. To the man lying on the bed. That's me.")
          ]),
          opt("c", "하지만 나는 아직 누워 있는데.", "But I'm still lying here.", 3, [
            thought("다리는 아침과 똑같다.", "My legs are the same as this morning.")
          ]),
          opt("d", "누가 이렇게 확실하게 말할 수 있지? 성전도 제물도 없이.", "Who can say that so surely? No temple, no sacrifice.", 1, [
            thought("용서받을 거라는 말이 아니었다. 이미 받았다는 말이었다.", "He didn't say I would be forgiven. He said I am.")
          ])
        ]
      },

      // Fixed sequence. The scribes' thought text is never shown in this route.
      line(
        "앞쪽에 선 서기관 몇 사람의 얼굴이 굳는다. 골목에서 마주친 그 얼굴도 있다. 아무도 입을 열지 않는다.",
        "Near the front, a few scribes' faces go still. The face from the lane is one of them. None of them says a word."
      ),
      verse("MT_9_4N"),
      verse("MT_9_4Q"),
      thought("누구한테 하시는 말씀이지? 누워 있는 내 귀엔 아무 말도 안 들렸는데.", "Who's he talking to? Lying here, I didn't hear anyone say a thing."),
      verse("MT_9_5"),
      verse("MT_9_6A"),
      verse("MT_9_6N"),
      fx("light", { level: "bright" }),
      verse("MT_9_6B", "rise"),

      // The gray "Get up" lights for the first time. Then eye level, for the first time.
      { type: "press", id: "press-getup", action: "getup" },
      fx("actionsHide"),
      fx("pov", { pov: "standing" }),
      scene("crowd", "standing"),
      fx("light", { level: "soft" }),
      { type: "press", id: "press-bed", label: t("침상을 들어", "Pick up your bed") },
      { type: "press", id: "press-home", label: t("집으로", "Go home") },
      verse("MT_9_7"),
      verse("MT_9_8"),

      // c4 (counts double): his first words standing.
      {
        type: "choice",
        id: "c4",
        prompt: t("집으로 가는 길, 네 해 만에 사람들과 같은 높이에 서 있다. 내 첫마디는?", "Heading home, eye to eye with people for the first time in four years. What do I say first?"),
        options: [
          opt("a", "“그분이 나한테 먼저 말을 거셨어. 일어나기도 전에.”", "“He spoke to me first. Before I even stood up.”", 2),
          opt("b", "“요나, 그분이 누구신지 알아야겠어.”", "“Yonah, I need to find out who he is.”", 1),
          opt("c", "“요나, 집까지 달리기 시합이다. 안 봐준다.”", "“Yonah, race you home. I'm not going easy on you.”", 3),
          opt("d", "“이 침상, 생각보다 가볍네.”", "“This bed's lighter than I thought.”", 3)
        ]
      }
    ],

    // He has gone home (MT_9_7): the light leaves before any ending's title card (SPEC §4.5).
    endingPreface: [fx("light", { level: "off" })],

    // Titles come from data/meta.js (BHS.meta.endings.asher). One beat each, then the last line.
    endings: {
      // Lens 1: who is he?
      "1": {
        beats: [
          when(
            { choice: "c2", is: "b" },
            thought("아침엔 그분이 어떤 분이냐고 물었다. 나를 걷게 하신 분이, 하나님만 하실 수 있는 말을 하셨다.", "This morning I asked who he was. The one who raised me to my feet said what only God can say.")
          ),
          when(
            { not: { choice: "c2", is: "b" } },
            thought("나를 걷게 하신 분이, 하나님만 하실 수 있는 말을 하셨다.", "The one who raised me to my feet said what only God can say.")
          )
        ],
        last: t("다리를 고칠 분을 만나러 갔다. 죄를 사하는 분을 만나고 왔다.", "I went to find someone who could heal my legs. I came home having met the one who forgives sins.")
      },

      // Lens 2: why these words first?
      "2": {
        beats: [
          thought(
            "오늘 일을 말할 때 ‘걸었다’로 시작하지 않겠다. 누워 있던 나에게 그분이 먼저 말을 거신 순간부터다.",
            "When I tell people about today, I won't start with “I walked.” I'll start with him speaking to me while I was still lying down."
          )
        ],
        last: t("왜 병들었는지는 모른다. 오늘 그분이 나에게 하신 말씀은 안다.", "I don't know why I got sick. I do know what he said to me today.")
      },

      // Lens 3: where to? Home, people, a life starting again. Back up the same lane, at eye level, to the door.
      // Exactly one of the four variants plays (c4 first, then the c1 and c2 callbacks).
      "3": {
        beats: [
          scene("lane", "standing", "오후 · 골목", "Afternoon · The lane"),
          when(
            { choice: "c4", is: "c" },
            line("요나가 웃음을 터뜨린다. 아침에 실려 내려온 골목을, 이번엔 둘이 나란히 걸어 올라간다.", "Yonah bursts out laughing. Side by side, they walk back up the lane Asher was carried down this morning.")
          ),
          when(
            { all: [{ not: { choice: "c4", is: "c" } }, { choice: "c1", is: "b" }] },
            line("아침 기도 내내 눈이 가던 그 문을 향해, 아셀이 골목을 걸어 올라간다.", "Asher walks up the lane toward the door his eyes kept drifting to during his morning prayer.")
          ),
          when(
            { all: [{ not: { choice: "c4", is: "c" } }, { not: { choice: "c1", is: "b" } }, { choice: "c2", is: "d" }] },
            line("갈색 겉옷을 어깨에 걸치고, 아침에 실려 내려온 골목을 걸어 올라간다.", "The brown cloak over his shoulders, he walks back up the lane he was carried down this morning.")
          ),
          when(
            { all: [{ not: { choice: "c4", is: "c" } }, { not: { choice: "c1", is: "b" } }, { not: { choice: "c2", is: "d" } }] },
            line("아침에 실려 내려온 골목을, 이번엔 걸어서 올라간다.", "He walks back up the lane he was carried down this morning.")
          )
        ],
        last: t("너를 들고 다니던 침상을, 이제 네가 들고 문을 연다.", "Now you carry the bed that used to carry you, and you open the door.")
      }
    },

    // Shared record line after any ending.
    endingCoda: [
      sign("일어나기 시도 {{var:getup_count}}번 · 걸린 문장 1개", "Attempts to get up: {{var:getup_count}} · Sentences it took: 1")
    ]
  };
})();

</script>
<script>/* js/engine.js */
/*
 * js/engine.js - pure game logic for "Before He Stood".
 * No DOM access anywhere in this file. Loadable in Node with `globalThis.window = globalThis`.
 *
 * Public API (BHS.engine):
 *   computeLens(routeOrId, choices)      -> { lens, scores: {1,2,3}, lastLens, c10Lens, mismatch, cut }   (SPEC 5.1)
 *                                           c10Lens is an alias of lastLens (older callers); a picked cut
 *                                           option gives { lens: null, lastLens: null, mismatch: false, cut: true }
 *   lastChoiceId(routeOrId)              -> id of the double-weight choice (the highest cN in the route), or null
 *   evalCond(cond, state)                -> boolean                                         (SPEC 4.5)
 *   resolveText(t, lang, state)          -> string, tokens resolved, *emphasis* markers kept
 *   plainText(t, lang, state)            -> string, tokens resolved, emphasis markers removed
 *   resolveSegments(t, lang, state)      -> [{ text, em, kind?, key? }] for renderers
 *   quoteVerse(text)                     -> “text” with inner double quotes turned into ‘ ’
 *   verseText(key, lang) / verseRef(key, lang) / verseSpeaker(key)
 *   fingerprint(routeOrId)               -> short structural hash of a route ("prologue" = common.prologue)
 *   canRestore(savedState)               -> true when a snapshot fits the current data (state version + fingerprint)
 *   createGame(routeId, opts)            -> Game   (routeId may be "prologue")
 *   createSequence(beats, opts)          -> Game   (plays an arbitrary beat list, for tests)
 *   restoreGame(savedState)              -> Game   (throws when canRestore(savedState) is false)
 *
 * Game (driven by the UI):
 *   game.step                 current blocking step (see STEP KINDS below)
 *   game.view()               { step, now: {hush, echo}, stage, actions, ending, routeId }
 *   game.next()               advance from line / verse / endingTitle / last
 *   game.choose(optionId)     answer the current choice
 *   game.press()              answer the current press beat
 *   game.tapAction(actionId)  tap a persistent action (Asher); returns { id, text, count } or null
 *   game.serialize()          JSON-safe snapshot; restore with restoreGame(snapshot)
 *   game.lens()               computeLens on the choices so far
 *   game.fastForward(opts)    debug helper: auto-play until a predicate holds
 *
 * STEP KINDS: line {speaker, text} | verse {key, speaker} | choice {id, prompt, options:[{id,text}]}
 *   | press {action?, label?, hint?} | endingTitle {lens, cut, lensLabel, title} | last {text}
 *   | routeSelect {} | end {}
 * A route ends: [mismatch line] -> endingPreface -> ending card -> ending beats -> last -> endingCoda -> end.
 * A cut option (option.cut === true) plays its reaction, skips the rest of the route's beats, then runs
 * ending card (meta.cut.label + meta.endings[route].cut) -> endings.cut.beats -> last -> endingCoda -> end,
 * with no mismatch line and no endingPreface; at the cut the pinned thought is cleared, the light goes off
 * and persistent actions hide. Ending ids: "<route>-1|2|3" and "<route>-cut".
 * Choice steps never expose lens tags or cut flags, so the UI cannot leak them (SPEC 7.2-7.3).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var BHS = (root.BHS = root.BHS || {});

  var LENSES = [1, 2, 3];
  var LIGHT_LEVELS = { off: true, soft: true, bright: true };
  var POVS = { normal: true, lying: true, standing: true };
  var TIMES = { day: true, evening: true, night: true };
  // Speakers that may appear as portraits (never Jesus; the protagonist is excluded per route).
  var PORTRAIT_IDS = { menahem: true, hanan: true, yonah: true, asher: true, mother: true, brother: true, neighbor: true, passerby: true, partners: true, scribes: true };
  var MAX_CAST = 2;
  // 2 = short routes (version 3): last-choice weighting, cut endings, route fingerprints.
  // Snapshots of version 1 (10-choice routes) are never restored.
  var STATE_VERSION = 2;

  var warnings = [];

  function warn(msg) {
    if (warnings.length < 200) warnings.push(String(msg));
    if (api.debug && root.console && root.console.warn) root.console.warn("[BHS.engine] " + msg);
  }

  function own(o, k) {
    return o != null && Object.prototype.hasOwnProperty.call(o, k);
  }

  function clone(x) {
    return x == null ? x : JSON.parse(JSON.stringify(x));
  }

  function normLens(v) {
    var n = typeof v === "string" ? parseInt(v, 10) : v;
    return n === 1 || n === 2 || n === 3 ? n : null;
  }

  function isCutOption(opt) {
    return !!opt && opt.cut === true;
  }

  // ---------------------------------------------------------------------------
  // Data access
  // ---------------------------------------------------------------------------

  function getRoute(routeOrId) {
    if (routeOrId && typeof routeOrId === "object") return routeOrId;
    return (BHS.routes && BHS.routes[routeOrId]) || null;
  }

  function choiceBeats(route) {
    var out = [];
    var seen = {};
    if (!route || !route.beats) return out;
    for (var i = 0; i < route.beats.length; i++) {
      var b = route.beats[i];
      if (b && b.type === "choice") {
        if (seen[b.id]) {
          warn("duplicate choice id " + b.id + " in route " + route.id + "; only the first counts for scoring");
          continue;
        }
        seen[b.id] = true;
        out.push(b);
      }
    }
    return out;
  }

  function choiceNumber(id) {
    var m = /^c(\d+)$/.exec(String(id));
    return m ? parseInt(m[1], 10) : -1;
  }

  // The double-weight choice: the highest cN in the route (c4 in the short routes). Falls back to the
  // last choice in beat order when no id has the cN form.
  function lastChoiceId(routeOrId) {
    var list = choiceBeats(getRoute(routeOrId));
    var best = null;
    var bestN = -1;
    for (var i = 0; i < list.length; i++) {
      var n = choiceNumber(list[i].id);
      if (n > bestN) {
        bestN = n;
        best = list[i].id;
      }
    }
    if (best === null && list.length) best = list[list.length - 1].id;
    return best;
  }

  function findChoice(route, id) {
    var list = choiceBeats(route);
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function findOption(choiceBeat, optId) {
    if (!choiceBeat || !choiceBeat.options) return null;
    for (var i = 0; i < choiceBeat.options.length; i++) {
      if (choiceBeat.options[i] && choiceBeat.options[i].id === optId) return choiceBeat.options[i];
    }
    return null;
  }

  function scriptureEntry(key) {
    return (BHS.scripture && own(BHS.scripture, key) && BHS.scripture[key]) || null;
  }

  function verseText(key, lang) {
    var s = scriptureEntry(key);
    if (!s || s.refOnly) return null;
    var txt = s[lang === "en" ? "en" : "ko"];
    return typeof txt === "string" && txt.length ? txt : null;
  }

  function verseRef(key, lang) {
    var s = scriptureEntry(key);
    if (!s || !s.ref) return null;
    var r = s.ref[lang === "en" ? "en" : "ko"];
    return typeof r === "string" && r.length ? r : null;
  }

  function verseSpeaker(key) {
    var s = scriptureEntry(key);
    return (s && s.speaker) || "narrator";
  }

  // ---------------------------------------------------------------------------
  // Lens scoring (SPEC 5.1)
  // ---------------------------------------------------------------------------

  // Each pick adds its weight (1; 2 for the last choice) to its lens. Ending lens = highest score; a tie
  // goes to the last choice's lens when it is among the tied lenses, otherwise to the smallest tied lens.
  // Picks for choice ids the route does not have (for example c5-c10 from an old save) are ignored.
  function computeLens(routeOrId, choices) {
    var route = getRoute(routeOrId);
    var lastId = lastChoiceId(route);
    var scores = { 1: 0, 2: 0, 3: 0 };
    var lastLens = null;
    var cut = false;
    choices = choices || {};
    var list = choiceBeats(route);
    for (var i = 0; i < list.length; i++) {
      var cb = list[i];
      var pick = choices[cb.id];
      if (pick == null) continue;
      var opt = findOption(cb, pick);
      if (!opt) continue;
      if (isCutOption(opt)) cut = true;
      var lens = normLens(opt.lens);
      if (cb.id === lastId) lastLens = lens;
      if (lens === null) continue;
      scores[lens] += cb.id === lastId ? 2 : 1;
    }
    if (cut) return { lens: null, scores: scores, lastLens: null, c10Lens: null, mismatch: false, cut: true };
    var max = Math.max(scores[1], scores[2], scores[3]);
    var tied = LENSES.filter(function (l) {
      return scores[l] === max;
    });
    var lensOut = lastLens !== null && tied.indexOf(lastLens) >= 0 ? lastLens : tied[0];
    return {
      lens: lensOut,
      scores: scores,
      lastLens: lastLens,
      c10Lens: lastLens,
      mismatch: lastLens !== null && lensOut !== lastLens,
      cut: false
    };
  }

  // ---------------------------------------------------------------------------
  // Conditions (SPEC 4.5)
  // ---------------------------------------------------------------------------

  function looseEq(v, x) {
    if (v === undefined) v = null;
    // An unset flag or choice counts as `false` so `{ flag: "far", is: false }` reads naturally.
    if (x === false && v === null) return true;
    if (x === null) return v === null;
    return v === x;
  }

  function matchValue(v, cond) {
    if (own(cond, "is")) return looseEq(v, cond.is);
    if (own(cond, "in")) {
      var arr = Array.isArray(cond["in"]) ? cond["in"] : [];
      for (var i = 0; i < arr.length; i++) if (looseEq(v, arr[i])) return true;
      return false;
    }
    // A bare `{ flag: "x" }` tests truthiness.
    return v !== undefined && v !== null && v !== false;
  }

  // Lens of the option picked at the last (double-weight) choice: from the state when known,
  // otherwise looked up in the route. Accepts `c10Lens` from older callers.
  function lastLensOf(state) {
    if (!state) return null;
    if (state.lastLens !== undefined && state.lastLens !== null) return state.lastLens;
    if (state.c10Lens !== undefined && state.c10Lens !== null) return state.c10Lens;
    if (state.routeId && state.choices) {
      var route = getRoute(state.routeId);
      var id = lastChoiceId(route);
      if (id && state.choices[id] != null) {
        var opt = findOption(findChoice(route, id), state.choices[id]);
        return opt ? normLens(opt.lens) : null;
      }
    }
    return null;
  }

  function evalCond(cond, state) {
    if (cond == null) return true;
    state = state || {};
    if (Array.isArray(cond)) {
      for (var i = 0; i < cond.length; i++) if (!evalCond(cond[i], state)) return false;
      return true;
    }
    if (typeof cond !== "object") return !!cond;
    if (own(cond, "all")) {
      var all = cond.all || [];
      for (var a = 0; a < all.length; a++) if (!evalCond(all[a], state)) return false;
      return true;
    }
    if (own(cond, "any")) {
      var any = cond.any || [];
      for (var b = 0; b < any.length; b++) if (evalCond(any[b], state)) return true;
      return false;
    }
    if (own(cond, "not")) return !evalCond(cond.not, state);
    if (own(cond, "choice")) return matchValue((state.choices || {})[cond.choice], cond);
    if (own(cond, "flag")) return matchValue((state.flags || {})[cond.flag], cond);
    if (own(cond, "lastLens")) return lastLensOf(state) === normLens(cond.lastLens);
    // Alias kept from the 10-choice routes, where the last choice was c10.
    if (own(cond, "c10lens")) return lastLensOf(state) === normLens(cond.c10lens);
    if (own(cond, "var")) {
      // Extension (not in SPEC 4.5): numeric test on a runtime variable.
      var n = Number((state.vars || {})[cond["var"]] || 0);
      if (own(cond, "is")) return n === Number(cond.is);
      if (own(cond, "gte")) return n >= Number(cond.gte);
      if (own(cond, "gt")) return n > Number(cond.gt);
      if (own(cond, "lte")) return n <= Number(cond.lte);
      if (own(cond, "lt")) return n < Number(cond.lt);
      return n !== 0;
    }
    warn("unknown condition " + JSON.stringify(cond));
    return false;
  }

  // ---------------------------------------------------------------------------
  // Text and tokens (SPEC 3.1-3.2)
  // ---------------------------------------------------------------------------

  var TOKEN_SRC = "\\{\\{\\s*(v|r|var)\\s*:\\s*([A-Za-z0-9_]+)\\s*\\}\\}";
  var OPEN_Q = "“";
  var CLOSE_Q = "”";

  function isDebug(state) {
    return !!((state && state.debug) || api.debug);
  }

  function pickLang(t, lang) {
    if (t == null) return "";
    if (typeof t === "string") return t;
    var l = lang === "en" ? "en" : "ko";
    if (typeof t[l] === "string") return t[l];
    var other = l === "en" ? "ko" : "en";
    return typeof t[other] === "string" ? t[other] : "";
  }

  // Inside our curly double quotes, any double quote in the verse becomes a single curly quote,
  // so quotes never nest double-in-double. Straight quotes open after whitespace or an opening
  // bracket/dash, and close otherwise.
  function nestQuotes(text) {
    var out = "";
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (ch === "“") out += "‘";
      else if (ch === "”") out += "’";
      else if (ch === '"') {
        var prev = i > 0 ? text.charAt(i - 1) : "";
        out += prev === "" || /[\s(\[{—–]/.test(prev) ? "‘" : "’";
      } else out += ch;
    }
    return out;
  }

  function quoteVerse(text) {
    return OPEN_Q + nestQuotes(String(text)) + CLOSE_Q;
  }

  function tokenValue(kind, key, lang, state) {
    if (kind === "v") {
      var v = verseText(key, lang);
      if (v == null) {
        warn("missing verse text for " + key);
        return isDebug(state) ? "[" + key + "]" : OPEN_Q + "…" + CLOSE_Q;
      }
      return quoteVerse(v);
    }
    if (kind === "r") {
      var r = verseRef(key, lang);
      if (r == null) {
        warn("missing verse reference for " + key);
        return isDebug(state) ? "[" + key + "]" : "…";
      }
      return r;
    }
    if (kind === "var") {
      var vars = (state && state.vars) || {};
      var n = Number(vars[key]);
      return String(isFinite(n) ? Math.round(n) : 0);
    }
    return "";
  }

  function resolveText(t, lang, state) {
    var str = pickLang(t, lang);
    return str.replace(new RegExp(TOKEN_SRC, "g"), function (m, kind, key) {
      return tokenValue(kind, key, lang, state);
    });
  }

  function resolveSegments(t, lang, state) {
    var str = pickLang(t, lang);
    var re = new RegExp(TOKEN_SRC, "g");
    var out = [];
    var em = false;
    var last = 0;
    var m;

    function pushLiteral(s) {
      var parts = s.split("*");
      for (var i = 0; i < parts.length; i++) {
        if (i > 0) em = !em;
        if (parts[i]) out.push({ text: parts[i], em: em });
      }
    }

    while ((m = re.exec(str))) {
      pushLiteral(str.slice(last, m.index));
      out.push({ text: tokenValue(m[1], m[2], lang, state), em: em, kind: m[1], key: m[2] });
      last = re.lastIndex;
    }
    pushLiteral(str.slice(last));
    return out;
  }

  function plainText(t, lang, state) {
    return resolveSegments(t, lang, state)
      .map(function (s) {
        return s.text;
      })
      .join("");
  }

  // ---------------------------------------------------------------------------
  // Route fingerprints (save compatibility)
  // ---------------------------------------------------------------------------

  // A snapshot stores list names and beat indexes, so it only fits the route data it was made from.
  // The fingerprint hashes the route's skeleton: the beat types of every list in order, choice ids,
  // option ids and cut flags, reaction lengths, ending keys, and action ids. Text edits keep it;
  // added, removed or reordered beats change it.
  function skeletonOf(list) {
    if (!Array.isArray(list)) return "-";
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (!b || typeof b !== "object") {
        out.push("?");
        continue;
      }
      if (b.type === "choice") {
        var opts = (Array.isArray(b.options) ? b.options : []).map(function (o) {
          return o ? String(o.id) + (isCutOption(o) ? "!" : "") + "[" + skeletonOf(o.reaction) + "]" : "?";
        });
        out.push("choice:" + b.id + "(" + opts.join(",") + ")");
      } else out.push(String(b.type));
    }
    return out.join(".");
  }

  function hashString(s) {
    // FNV-1a, 32 bit.
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0).toString(36);
  }

  function fingerprint(routeOrId) {
    if (routeOrId === "prologue") return "p" + hashString(skeletonOf((BHS.common && BHS.common.prologue) || []));
    var route = getRoute(routeOrId);
    if (!route) return null;
    var parts = ["beats:" + skeletonOf(route.beats), "preface:" + skeletonOf(route.endingPreface)];
    var ends = route.endings && typeof route.endings === "object" ? Object.keys(route.endings).sort() : [];
    ends.forEach(function (k) {
      var e = route.endings[k];
      parts.push("ending " + k + ":" + skeletonOf(e && e.beats) + (e && e.last ? "+last" : ""));
    });
    parts.push("coda:" + skeletonOf(route.endingCoda));
    parts.push(
      "actions:" +
        routeActions(route)
          .map(function (a) {
            return a && a.id;
          })
          .join(",")
    );
    return "r" + hashString(parts.join("|"));
  }

  // True when a snapshot can be resumed against the data loaded now. Anything else (version 1 saves
  // from the 10-choice routes, saves from before a route edit, damaged objects) is refused.
  function canRestore(saved) {
    if (!saved || typeof saved !== "object" || saved.v !== STATE_VERSION) return false;
    if (typeof saved.routeId !== "string" || !saved.routeId) return false;
    if (saved.routeId !== "prologue" && !getRoute(saved.routeId)) return false;
    if (!Array.isArray(saved.segs) || !Array.isArray(saved.stack) || typeof saved.seg !== "number") return false;
    if (!saved.stage || typeof saved.stage !== "object" || !saved.step || typeof saved.step.kind !== "string") return false;
    if (!saved.choices || typeof saved.choices !== "object") return false;
    var fp = fingerprint(saved.routeId);
    return !!fp && saved.fp === fp;
  }

  // ---------------------------------------------------------------------------
  // Game state machine
  // ---------------------------------------------------------------------------

  function routeActions(route) {
    return (route && Array.isArray(route.actions) && route.actions) || [];
  }

  function initialState(routeId, route, custom) {
    var segs;
    if (custom) segs = ["custom", "@end"];
    else if (routeId === "prologue") segs = ["prologue", "@routeSelect"];
    else segs = ["beats", "@ending"];
    return {
      v: STATE_VERSION,
      routeId: routeId,
      fp: custom ? "custom" : fingerprint(routeId === "prologue" ? "prologue" : route),
      segs: segs,
      seg: 0,
      stack: [{ list: segs[0], i: 0 }],
      choices: {},
      flags: {},
      vars: {},
      picks: [],
      lastLens: null,
      cutAt: null,
      stage: {
        bg: null,
        caption: null,
        time: "day",
        pov: "normal",
        light: "off",
        pinned: null,
        actionsVisible: routeActions(route).length > 0,
        actionReplies: {},
        actionCounts: {},
        sceneSeq: 0,
        cast: [],
        speaking: null,
        castSeq: 0,
        risen: false
      },
      pending: { hush: false, echo: null },
      now: { hush: false, echo: null },
      step: null,
      at: { list: segs[0], index: -1 },
      ending: null,
      steps: 0,
      done: false
    };
  }

  function Game(routeId, opts) {
    opts = opts || {};
    this.routeId = routeId;
    this.custom = Array.isArray(opts.beats) ? opts.beats : null;
    this.route = routeId === "prologue" || this.custom ? opts.route || null : getRoute(routeId);
    if (!this.route && routeId !== "prologue" && !this.custom) throw new Error("Unknown route: " + routeId);
    this.debug = !!opts.debug;
    if (opts.state) {
      if (!canRestore(opts.state) || opts.state.routeId !== routeId) throw new Error("Incompatible saved state");
      this.state = clone(opts.state);
    } else {
      this.state = initialState(routeId, this.route, !!this.custom);
      this._run();
    }
  }

  Object.defineProperty(Game.prototype, "step", {
    get: function () {
      return this.state.step;
    }
  });

  Game.prototype.condState = function () {
    var st = this.state;
    return {
      routeId: this.route ? st.routeId : null,
      choices: st.choices,
      flags: st.flags,
      vars: st.vars,
      lastLens: st.lastLens,
      c10Lens: st.lastLens,
      debug: this.debug
    };
  };

  Game.prototype._list = function (name) {
    var route = this.route;
    if (name === "custom") return this.custom || [];
    if (name === "prologue") return (BHS.common && BHS.common.prologue) || [];
    if (!route) return [];
    if (name === "beats") return route.beats || [];
    if (name === "endingPreface") return route.endingPreface || [];
    if (name === "endingCoda") return route.endingCoda || [];
    if (name.indexOf("ending:") === 0) {
      var e = route.endings && route.endings[name.slice(7)];
      return (e && e.beats) || [];
    }
    if (name.indexOf("react:") === 0) {
      var parts = name.split(":");
      var opt = findOption(findChoice(route, parts[1]), parts[2]);
      return (opt && opt.reaction) || [];
    }
    return [];
  };

  Game.prototype._run = function () {
    var st = this.state;
    var guard = 0;
    for (;;) {
      if (++guard > 20000) throw new Error("engine loop guard tripped");
      var frame = st.stack[st.stack.length - 1];
      if (!frame) {
        st.seg++;
        if (st.seg >= st.segs.length) {
          this._setStep({ kind: "end" });
          st.done = true;
          return;
        }
        var seg = st.segs[st.seg];
        if (seg.charAt(0) === "@") {
          if (this._synthetic(seg)) return;
          continue;
        }
        st.stack.push({ list: seg, i: 0 });
        continue;
      }
      var list = this._list(frame.list);
      if (frame.i >= list.length) {
        st.stack.pop();
        continue;
      }
      var index = frame.i;
      var beat = list[index];
      frame.i++;
      if (!beat || typeof beat !== "object") continue;
      if (beat.when && !evalCond(beat.when, this.condState())) continue;
      st.at = { list: frame.list, index: index };
      if (this._apply(beat)) return;
    }
  };

  // Inserts the ending sequence right after the current segment.
  Game.prototype._queue = function (tail) {
    var st = this.state;
    Array.prototype.splice.apply(st.segs, [st.seg + 1, 0].concat(tail));
  };

  Game.prototype._synthetic = function (seg) {
    var st = this.state;
    var route = this.route;
    var meta = BHS.meta || {};
    switch (seg) {
      case "@routeSelect":
        this._setStep({ kind: "routeSelect" });
        return true;
      case "@ending": {
        var res = computeLens(route, st.choices);
        // A cut pick always ends through the cut path (choose() normally queues it already).
        if (res.cut) return this._synthetic("@cut");
        st.ending = {
          routeId: st.routeId,
          id: st.routeId + "-" + res.lens,
          lens: res.lens,
          cut: false,
          scores: res.scores,
          lastLens: res.lastLens,
          c10Lens: res.lastLens,
          mismatch: res.mismatch
        };
        var tail = [];
        var hasEnding = !!(route && route.endings && route.endings[String(res.lens)]);
        if (res.mismatch && BHS.common && BHS.common.mismatchLine) tail.push("@mismatch");
        tail.push("endingPreface", "@title");
        if (hasEnding) tail.push("ending:" + res.lens, "@last");
        tail.push("endingCoda", "@end");
        this._queue(tail);
        return false;
      }
      case "@cut": {
        // The route was cut short: no lens scoring, no mismatch line, no endingPreface. The beats that
        // would have closed the scene were skipped, so the protagonist leaves it here: the pinned
        // thought goes, the light goes off, persistent actions hide. endings.cut beats may set them again.
        st.stage.pinned = null;
        st.stage.light = "off";
        st.stage.actionsVisible = false;
        var scored = computeLens(route, st.choices);
        st.ending = {
          routeId: st.routeId,
          id: st.routeId + "-cut",
          lens: null,
          cut: true,
          scores: scored.scores,
          lastLens: null,
          c10Lens: null,
          mismatch: false,
          cutAt: st.cutAt || null
        };
        var cutTail = ["@title"];
        if (route && route.endings && route.endings.cut) cutTail.push("ending:cut", "@last");
        cutTail.push("endingCoda", "@end");
        this._queue(cutTail);
        return false;
      }
      case "@mismatch":
        st.at = { list: "@mismatch", index: 0 };
        st.stage.speaking = null;
        this._setStep({ kind: "line", speaker: "narrator", text: BHS.common.mismatchLine, mismatch: true });
        return true;
      case "@title": {
        var ending = st.ending || {};
        this._castClear();
        var titles = (meta.endings && meta.endings[st.routeId]) || {};
        st.at = { list: "@title", index: 0 };
        if (ending.cut) {
          var cutMeta = meta.cut || {};
          this._setStep({
            kind: "endingTitle",
            routeId: st.routeId,
            lens: null,
            cut: true,
            lensLabel: cutMeta.label || { ko: "", en: "" },
            lensDesc: cutMeta.desc || null,
            title: titles.cut || { ko: "", en: "" }
          });
          return true;
        }
        var lens = ending.lens;
        var lensMeta = (meta.lenses && meta.lenses[lens]) || {};
        this._setStep({
          kind: "endingTitle",
          routeId: st.routeId,
          lens: lens,
          cut: false,
          lensLabel: lensMeta.label || { ko: String(lens), en: String(lens) },
          lensDesc: lensMeta.desc || null,
          title: titles[lens] || { ko: "", en: "" }
        });
        return true;
      }
      case "@last": {
        var key = st.ending && st.ending.cut ? "cut" : String(st.ending && st.ending.lens);
        var e = route && route.endings && route.endings[key];
        if (!e || !e.last) return false;
        st.at = { list: "@last", index: 0 };
        this._castClear();
        this._setStep({ kind: "last", text: e.last });
        return true;
      }
      case "@end":
        this._setStep({ kind: "end" });
        st.done = true;
        return true;
      default:
        warn("unknown synthetic segment " + seg);
        return false;
    }
  };

  // ---- portrait cast (who stands on stage)

  Game.prototype._protagonist = function () {
    var meta = BHS.meta || {};
    var r = meta.routes && meta.routes[this.state.routeId];
    return (r && r.protagonist) || null;
  };

  Game.prototype._castClear = function () {
    this.state.stage.cast = [];
    this.state.stage.speaking = null;
  };

  // A character line puts the speaker on stage (most recent two, stable left/right slots).
  Game.prototype._castLine = function (speaker) {
    var stage = this.state.stage;
    if (!stage.cast) stage.cast = [];
    if (!PORTRAIT_IDS[speaker] || speaker === this._protagonist()) {
      stage.speaking = null;
      return;
    }
    var pose = speaker === "asher" ? (stage.risen ? "standing" : "lying") : null;
    var t = (stage.castSeq = (stage.castSeq || 0) + 1);
    var cast = stage.cast;
    var found = null;
    for (var i = 0; i < cast.length; i++) if (cast[i].id === speaker) found = cast[i];
    if (found) {
      found.t = t;
      found.pose = pose;
    } else if (cast.length < MAX_CAST) {
      var used = cast.length ? cast[0].slot : 1;
      cast.push({ id: speaker, slot: cast.length ? 1 - used : 0, pose: pose, t: t });
    } else {
      var oldest = cast[0];
      for (var j = 1; j < cast.length; j++) if (cast[j].t < oldest.t) oldest = cast[j];
      oldest.id = speaker;
      oldest.pose = pose;
      oldest.t = t;
    }
    stage.speaking = speaker;
  };

  Game.prototype._apply = function (beat) {
    var st = this.state;
    switch (beat.type) {
      case "scene":
        // A scene never touches the light level, and changes pov only when it sets one.
        st.stage.bg = beat.bg || null;
        st.stage.caption = beat.caption || null;
        st.stage.time = TIMES[beat.time] ? beat.time : "day";
        if (beat.pov && POVS[beat.pov]) st.stage.pov = beat.pov;
        st.stage.sceneSeq++;
        this._castClear();
        return false;
      case "line":
        this._castLine(beat.speaker || "narrator");
        this._setStep({ kind: "line", speaker: beat.speaker || "narrator", text: beat.text, id: beat.id || null });
        return true;
      case "verse": {
        var vsp = beat.speaker || verseSpeaker(beat.key);
        // When Jesus speaks, the light takes the stage.
        if (vsp === "jesus") this._castClear();
        st.stage.speaking = null;
        if (beat.key === "MT_9_6B") st.stage.risen = true;
        this._setStep({
          kind: "verse",
          key: beat.key,
          speaker: vsp,
          id: beat.id || null
        });
        return true;
      }
      case "choice":
        st.stage.speaking = null;
        this._setStep({
          kind: "choice",
          id: beat.id,
          prompt: beat.prompt || null,
          options: (beat.options || []).map(function (o) {
            return { id: o.id, text: o.text };
          })
        });
        return true;
      case "press":
        st.stage.speaking = null;
        this._setStep({
          kind: "press",
          action: beat.action || null,
          label: beat.label || null,
          hint: beat.hint || null,
          id: beat.id || null
        });
        return true;
      case "fx":
        this._fx(beat);
        return false;
      default:
        warn("unknown beat type " + beat.type);
        return false;
    }
  };

  Game.prototype._fx = function (beat) {
    var st = this.state;
    var stage = st.stage;
    switch (beat.fx) {
      case "light":
        stage.light = LIGHT_LEVELS[beat.level] ? beat.level : "off";
        break;
      case "hush":
        st.pending.hush = true;
        break;
      case "echoVerse":
        st.pending.echo = { key: beat.key, highlight: beat.highlight || null };
        break;
      case "pinThought":
        stage.pinned = { items: this._pinItems(beat.items || []), read: false };
        break;
      case "readReceipt":
        if (stage.pinned) stage.pinned.read = true;
        else warn("readReceipt without a pinned thought");
        break;
      case "unpinThought":
        stage.pinned = null;
        break;
      case "pov":
        if (POVS[beat.pov]) stage.pov = beat.pov;
        break;
      case "actionReply":
        if (beat.action) stage.actionReplies[beat.action] = beat.text || null;
        break;
      case "actionsHide":
        stage.actionsVisible = false;
        break;
      case "actionsShow":
        stage.actionsVisible = routeActions(this.route).length > 0;
        break;
      default:
        warn("unknown fx " + beat.fx);
    }
  };

  Game.prototype._pinItems = function (items) {
    var st = this.state;
    var route = this.route;
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var raw = String(items[i]);
      var cut = raw.indexOf(":");
      var kind = raw.slice(0, cut);
      var ref = raw.slice(cut + 1);
      if (kind === "verse") {
        out.push({ type: "verse", key: ref });
      } else if (kind === "choice") {
        var optId = st.choices[ref];
        var opt = findOption(findChoice(route, ref), optId);
        if (opt) out.push({ type: "choice", id: ref, option: optId, text: opt.text });
        else warn("pinThought: no pick for " + ref);
      } else {
        warn("pinThought: unknown item " + raw);
      }
    }
    return out;
  };

  Game.prototype._resolveEcho = function (echo) {
    if (!echo) return null;
    var st = this.state;
    var marks = null;
    var hl = echo.highlight;
    if (hl && hl.map) {
      var val;
      if (own(hl, "flag")) val = st.flags[hl.flag];
      else if (own(hl, "choice")) val = st.choices[hl.choice];
      var mapKey = val === undefined || val === null ? "null" : String(val);
      var m = own(hl.map, mapKey) ? hl.map[mapKey] : null;
      if (m === "*") marks = "*";
      else if (m && typeof m === "object") marks = { ko: m.ko || [], en: m.en || [] };
    }
    return { key: echo.key, marks: marks };
  };

  Game.prototype._setStep = function (step) {
    var st = this.state;
    st.now = { hush: !!st.pending.hush, echo: this._resolveEcho(st.pending.echo) };
    st.pending = { hush: false, echo: null };
    st.step = step;
    st.steps++;
  };

  Game.prototype._clearNow = function () {
    this.state.now = { hush: false, echo: null };
  };

  Game.prototype.next = function () {
    var k = this.state.step && this.state.step.kind;
    if (!k || k === "choice" || k === "press" || k === "end" || k === "routeSelect") return false;
    this._clearNow();
    this._run();
    return true;
  };

  // A cut option ends the route early: every list still open (the route's main beats) is exhausted,
  // and the coming "@ending" segment becomes "@cut". The option's reaction is pushed afterwards, so it
  // still plays. All of this lives in the state, so saving and resuming work across a cut.
  Game.prototype._cutFrom = function (choiceId, optId) {
    var st = this.state;
    st.cutAt = { choice: choiceId, option: optId };
    for (var i = 0; i < st.stack.length; i++) st.stack[i].i = this._list(st.stack[i].list).length;
    var at = st.segs.indexOf("@ending", st.seg);
    if (at >= 0) st.segs[at] = "@cut";
    else st.segs.splice(st.seg + 1, 0, "@cut");
  };

  Game.prototype.choose = function (optId) {
    var st = this.state;
    var step = st.step;
    if (!step || step.kind !== "choice") return false;
    var cb = findChoice(this.route, step.id);
    var opt = findOption(cb, optId);
    if (!opt) return false;
    st.choices[step.id] = optId;
    st.picks.push(step.id);
    if (step.id === lastChoiceId(this.route)) st.lastLens = normLens(opt.lens);
    if (opt.set && typeof opt.set === "object") {
      Object.keys(opt.set).forEach(function (k) {
        st.flags[k] = opt.set[k];
      });
    }
    if (isCutOption(opt)) this._cutFrom(step.id, optId);
    if (Array.isArray(opt.reaction) && opt.reaction.length) {
      st.stack.push({ list: "react:" + step.id + ":" + optId, i: 0 });
    }
    this._clearNow();
    this._run();
    return true;
  };

  Game.prototype.press = function () {
    var st = this.state;
    var step = st.step;
    if (!step || step.kind !== "press") return false;
    // The persistent buttons stay until actionsHide or the press on an action (SPEC 4.5).
    if (step.action) st.stage.actionsVisible = false;
    this._clearNow();
    this._run();
    return true;
  };

  Game.prototype._action = function (id) {
    var acts = routeActions(this.route);
    for (var i = 0; i < acts.length; i++) if (acts[i].id === id) return acts[i];
    return null;
  };

  Game.prototype.tapAction = function (id) {
    var st = this.state;
    var step = st.step;
    if (step && step.kind === "press" && step.action === id) {
      this.press();
      return { id: id, pressed: true, text: null, count: st.stage.actionCounts[id] || 0 };
    }
    var act = this._action(id);
    if (!act || !st.stage.actionsVisible || !step || step.kind === "end") return null;
    var n = (st.stage.actionCounts[id] || 0) + 1;
    st.stage.actionCounts[id] = n;
    if (act.counter) st.vars[act.counter] = (Number(st.vars[act.counter]) || 0) + 1;
    var replies = Array.isArray(act.replies) ? act.replies : [];
    var override = st.stage.actionReplies[id];
    var text = override || (replies.length ? replies[Math.min(n - 1, replies.length - 1)] : null);
    return { id: id, pressed: false, text: text, count: n };
  };

  Game.prototype.actions = function () {
    var st = this.state;
    var step = st.step;
    var litId = step && step.kind === "press" ? step.action : null;
    return routeActions(this.route)
      .map(function (a) {
        var lit = a.id === litId;
        return {
          id: a.id,
          label: a.label,
          lit: lit,
          visible: lit || (st.stage.actionsVisible && !(litId && !st.stage.actionsVisible))
        };
      })
      .filter(function (a) {
        return a.visible;
      });
  };

  Game.prototype.view = function () {
    var st = this.state;
    return {
      routeId: st.routeId,
      step: st.step,
      now: st.now,
      stage: st.stage,
      actions: this.actions(),
      ending: st.ending,
      vars: st.vars,
      done: st.done
    };
  };

  Game.prototype.lens = function () {
    return computeLens(this.route, this.state.choices);
  };

  Game.prototype.position = function () {
    var st = this.state;
    return { seg: st.segs[st.seg], list: st.at.list, index: st.at.index, steps: st.steps };
  };

  Game.prototype.serialize = function () {
    return clone(this.state);
  };

  // Auto-play for debug and tests. `until(step, game)` stops the run; `pick(step, game)` picks an option id.
  Game.prototype.fastForward = function (opts) {
    opts = opts || {};
    var until =
      opts.until ||
      function () {
        return false;
      };
    var pick =
      opts.pick ||
      function (step) {
        return step.options[0].id;
      };
    var max = opts.maxSteps || 5000;
    for (var i = 0; i < max; i++) {
      var step = this.state.step;
      if (!step || step.kind === "end" || step.kind === "routeSelect") return step;
      if (until(step, this)) return step;
      if (step.kind === "choice") this.choose(pick(step, this));
      else if (step.kind === "press") this.press();
      else this.next();
    }
    return this.state.step;
  };

  // ---------------------------------------------------------------------------
  // Factories
  // ---------------------------------------------------------------------------

  function createGame(routeId, opts) {
    return new Game(routeId, opts);
  }

  function createSequence(beats, opts) {
    opts = opts || {};
    return new Game(opts.routeId || "custom", { beats: beats, route: opts.route || null, debug: opts.debug });
  }

  function restoreGame(saved, opts) {
    if (!saved || !saved.routeId) throw new Error("No saved state");
    opts = opts || {};
    return new Game(saved.routeId, { state: saved, debug: opts.debug });
  }

  var api = {
    version: "3.0.0",
    STATE_VERSION: STATE_VERSION,
    debug: false,
    warnings: warnings,
    LENSES: LENSES,
    PORTRAIT_IDS: PORTRAIT_IDS,
    getRoute: getRoute,
    choiceBeats: choiceBeats,
    lastChoiceId: lastChoiceId,
    findChoice: findChoice,
    findOption: findOption,
    computeLens: computeLens,
    evalCond: evalCond,
    resolveText: resolveText,
    resolveSegments: resolveSegments,
    plainText: plainText,
    pickLang: pickLang,
    quoteVerse: quoteVerse,
    nestQuotes: nestQuotes,
    verseText: verseText,
    verseRef: verseRef,
    verseSpeaker: verseSpeaker,
    fingerprint: fingerprint,
    canRestore: canRestore,
    createGame: createGame,
    createSequence: createSequence,
    restoreGame: restoreGame,
    Game: Game
  };

  BHS.engine = api;
})();

</script>
<script>/* js/art.js */
/* Scene backgrounds for "Before He Stood", drawn as inline SVG strings.
   Owner: art agent. See docs/SPEC.md §5.6 (look), §6.6 (BG ids), §7 (guardrails).
   - Classic script, no modules, no fetch, no external assets, no SVG filters.
   - Square canvas (viewBox 0 0 1600 1600) with preserveAspectRatio "xMidYMid slice":
       16:9 screens (TV, laptop) see the band y 350..1250 at full width (text panel covers ~y 980+);
       portrait phones see the band x ~430..1170 at full height (text panel covers ~y 1040+).
     Every scene keeps its focal point in the shared area x 430..1170, y 450..950 and extends
     scenery sideways for landscape and upward for portrait.
   - Jesus is never drawn: crowd scenes only leave an empty, luminous space.
   - No cross-like silhouettes: boats have no masts or yards; poles carry draped nets only.
   - Ids inside each SVG are prefixed with the bg id plus a per-render counter, so any
     number of SVGs (even the same scene twice) can live in one page. */
(function () {
  "use strict";
  var BHS = (window.BHS = window.BHS || {});

  var W = 1600;
  var H = 1600;
  var MX = 800; // horizontal center of the canvas
  var IDS = ["black", "dawn_lamp", "shore_dawn", "asher_ceiling", "asher_home", "lane",
    "sky_carried", "crowd", "crowd_lying", "road_home", "doorway_evening", "lamp_night"];
  var renderCount = 0;

  // ---------------------------------------------------------------- utilities

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ri(v) { return Math.round(v); }
  function r1(v) { return Math.round(v * 10) / 10; }
  function r2(v) { return Math.round(v * 100) / 100; }

  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;

  // Small deterministic PRNG (mulberry32) so every scene draws the same way each time.
  function prng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;

  function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgbHex(c) {
    return "#" + ((1 << 24) | (clamp(ri(c[0]), 0, 255) << 16) | (clamp(ri(c[1]), 0, 255) << 8) | clamp(ri(c[2]), 0, 255)).toString(16).slice(1);
  }
  function mix(a, b, t) {
    var x = hexRgb(a), y = hexRgb(b);
    return rgbHex([lerp(x[0], y[0], t), lerp(x[1], y[1], t), lerp(x[2], y[2], t)]);
  }

  // Joins numbers for path data; a negative number needs no separator.
  function nums(arr) {
    var s = "";
    for (var i = 0; i < arr.length; i++) s += (i === 0 || arr[i] < 0 ? "" : " ") + arr[i];
    return s;
  }

  // Closed polygon with integer coordinates, written as relative moves to keep strings short.
  function poly(pts) {
    var x0 = ri(pts[0][0]), y0 = ri(pts[0][1]), px = x0, py = y0, out = [];
    for (var i = 1; i < pts.length; i++) {
      var x = ri(pts[i][0]), y = ri(pts[i][1]);
      out.push(x - px, y - py);
      px = x; py = y;
    }
    return "M" + nums([x0, y0]) + "l" + nums(out) + "z";
  }

  // Smooth curve through points (Catmull-Rom converted to cubic Beziers).
  function smooth(pts, closed) {
    var n = pts.length, d = "M" + nums([ri(pts[0][0]), ri(pts[0][1])]);
    var last = closed ? n : n - 1;

      var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      if (!closed) { if (i === 0) p0 = p1; if (i + 2 >= n) p3 = p2; }
      d += "C" + nums([ri(p1[0] + (p2[0] - p0[0]) / 6), ri(p1[1] + (p2[1] - p0[1]) / 6),
        ri(p2[0] - (p3[0] - p1[0]) / 6), ri(p2[1] - (p3[1] - p1[1]) / 6), ri(p2[0]), ri(p2[1])]);
    }
    return d + (closed ? "z" : "");
  }

  // Ridge line across the whole canvas closed down to yBottom (hills, far shores).
  function ridge(rnd, y, amp, steps, yBottom) {
    var pts = [];
    for (var i = 0; i <= steps; i++) pts.push([-30 + ((W + 60) * i) / steps, y + (rnd() - 0.5) * 2 * amp]);
    return smooth(pts, false) + "L" + (W + 30) + " " + yBottom + "L-30 " + yBottom + "z";
  }

  // Element helpers.
  function path(d, fill, extra) { return '<path d="' + d + '" fill="' + fill + '"' + (extra || "") + "/>"; }
  function rect(x, y, w, h, fill, extra) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + fill + '"' + (extra || "") + "/>";
  }
  function full(fill, extra) { return '<rect width="1600" height="1600" fill="' + fill + '"' + (extra || "") + "/>"; }
  function ell(cx, cy, rx, ry, fill, extra) {
    return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + fill + '"' + (extra || "") + "/>";
  }
  function op(v) { return ' opacity="' + v + '"'; }
  function line(d, color, width, extra) {
    return '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + width + '" stroke-linecap="round"' + (extra || "") + "/>";
  }

  function stops(list) {
    var s = "";
    for (var i = 0; i < list.length; i++) {
      var st = list[i];
      s += '<stop offset="' + st[0] + '" stop-color="' + st[1] + '"' +
        (st[2] !== undefined && st[2] !== 1 ? ' stop-opacity="' + st[2] + '"' : "") + "/>";
    }
    return s;
  }

  // ---------------------------------------------------------------- render context

  function Ctx(bg, uid) {
    this.bg = bg;
    this.pre = bg + "-" + uid + "-";
    this.rnd = prng(hash(bg));
    this.defs = [];
    this.body = [];
    this.names = {};
  }
  Ctx.prototype.id = function (name) { return this.pre + name; };
  Ctx.prototype.url = function (name) { return "url(#" + this.pre + name + ")"; };
  Ctx.prototype.def = function (s) { this.defs.push(s); };
  Ctx.prototype.add = function (s) { this.body.push(s); };
  // Gradient names are made unique within a scene, so two gradients can never collide.
  Ctx.prototype.fresh = function (name) {
    var n = this.names[name] = (this.names[name] || 0) + 1;
    return n === 1 ? name : name + n;
  };
  Ctx.prototype.lin = function (name, x1, y1, x2, y2, list) {

  function meshDef(c, color) {

      '<path d="M0 .5H10M.5 0V10" fill="none" stroke="' + color + '" stroke-width="1.1" opacity=".38"/></pattern>');

  // Sea of Galilee at dawn: beached boats, nets drying, pale light over the eastern hills.
  scenes.shore_dawn = function (c) {
    var rnd = c.rnd, i, s = "";
    var HY = 620;

    c.add(path("M1018 902Q1030 860 1072 866Q1100 846 1132 872Q1160 878 1158 904Z", "#2e2a28"));

    c.add(path("M404 864Q402 900 434 904Q466 900 464 864Z", "#5e4831"));

  // ---------------------------------------------------------------- Asher's house

  // Reeds laid across the beams: a pattern tile is far cheaper than hundreds of strokes.
  function reedDef(c, colors) {
    var g = prng(55), s = "";
    for (var i = 0; i < 22; i++) {
      var x = r1(i * 7.3 + g() * 4), x2 = r1(x + (g() - 0.5) * 6);
      s += '<path d="M' + x + " 0L" + x2 + ' 320" stroke="' + colors[Math.floor(g() * colors.length)] + '" stroke-width="' + r1(1.6 + g() * 2.6) + '"/>';
    }
    c.def('<pattern id="' + c.id("reed") + '" width="160" height="320" patternUnits="userSpaceOnUse">' + s + "</pattern>");
  }

  // Lying POV inside Asher's house, looking straight up at the beams, reeds and mud.
  // time: day (morning shaft from the doorway), evening (amber doorway, lamp below), night (lamp below).
  scenes.asher_ceiling = function (c, o) {
    var rnd = c.rnd, t = o.time, i;
    var day = t === "day", eve = t === "evening";
    var night = !day && !eve;
    c.add(full(night ? "#0d0a08" : "#1e1711"));
    reedDef(c, night ? ["#21180f", "#271d14", "#1b140e"] : ["#3f3326", "#4a3c2c", "#382d22", "#524230"]);
    c.add(rect(150, 0, 1150, H, c.url("reed")));
    // Patches of packed mud showing between the reeds.
    var mud = "";
    for (i = 0; i < 14; i++) {
      var mx = 180 + rnd() * 1080, my = rnd() * H, mw = 40 + rnd() * 90, mh = 14 + rnd() * 22;
      mud += "M" + ri(mx) + " " + ri(my) + "q" + ri(mw / 2) + " " + ri(-mh) + " " + ri(mw) + " 0q" + ri(-mw / 2) + " " + ri(mh) + " " + ri(-mw) + " 0z";
    }
    c.add(path(mud, night ? "#140f0b" : "#2a2119", op(0.8)));
    c.add(full(night ? "#000" : "#140d08", op(night ? 0.4 : 0.32)));

    // Heavy round beams spanning wall to wall, lit from the doorway side.
    var beamFill = c.lin("beam", 150, 0, 1300, 0, day
      ? [[0, "#2a1f17"], [0.6, "#4a3726"], [1, "#7a5a3c"]]
      : eve ? [[0, "#3a2819"], [0.6, "#4a3424"], [1, "#6a4630"]] : [[0, "#4a321e"], [0.5, "#2a1d14"], [1, "#1a130e"]]);
    var bd = "", bk = "", rnd2 = prng(17);
    for (i = 0; i < 4; i++) {
      var cy = 140 + i * 330, top = [], bot = [];
      for (var k = 0; k <= 6; k++) {
        var x = 150 + (1150 * k) / 6;
        top.push([x, cy - 48 + (rnd() - 0.5) * 12]);
        bot.unshift([x, cy + 48 + (rnd() - 0.5) * 12]);
      }
      bd += smooth(top, false) + "L" + bot.map(function (p) { return ri(p[0]) + " " + ri(p[1]); }).join("L") + "Z";
      for (k = 0; k < 7; k++) {
        var kx = 180 + rnd2() * 1080, ky = cy + (rnd2() - 0.5) * 60;
        bk += "M" + ri(kx) + " " + ri(ky) + "h" + ri(60 + rnd2() * 140);
      }
    }
    c.add(path(bd, beamFill));
    // Round shading: dark top and bottom edges, a soft highlight along the middle, bark streaks.
    var roundG = [];
    for (i = 0; i < 4; i++) {
      var b0 = (140 + i * 330 - 54) / H, b1 = (140 + i * 330 + 54) / H;
      roundG.push([r2(b0), "#000", 0.5], [r2((b0 * 2 + b1) / 3), "#000", 0], [r2((b0 + b1 * 2) / 3), "#000", 0.08], [r2(b1), "#000", 0.6]);
    }
    c.add(path(bd, c.lin("round", 0, 0, 0, H, roundG)));
    c.add(line(bk, "#000", 3, op(0.22)));

    // Walls at the edges (landscape): the right wall holds the doorway.
    c.add(rect(0, 0, 150, H, c.lin("lw", 0, 0, 150, 0, [[0, "#0c0a08"], [1, "#1c1712"]])));
    c.add(rect(1300, 0, 300, H, c.lin("rw", 1300, 0, 1600, 0, [[0, "#211a14"], [1, "#0e0b09"]])));
    var door = [[1360, 640], [1600, 576], [1600, 1024], [1360, 960]];
    c.add(path(poly(door), c.lin("door", 1360, 0, 1600, 0, day
      ? [[0, "#fff4dc"], [1, "#ffe7bd"]] : eve ? [[0, "#f2b066"], [1, "#c9705a"]] : [[0, "#0c1120"], [1, "#070a13"]])));
    if (night) c.add(ell(1500, 700, 2, 2, "#e8eef8", op(0.8)));

    if (day) {
      // Morning shaft of light through dusty air, slanting across the beams.
      c.add(path(poly([[1360, 640], [1360, 960], [260, 820], [260, 250]]),
        c.lin("shaft", 1360, 0, 260, 0, [[0, "#fff3d6", 0.5], [0.55, "#fff0cc", 0.18], [1, "#ffeec8", 0]])));
      var dm = "";
      for (i = 0; i < 16; i++) {
        var u = rnd(), dx = lerp(1300, 380, u), dy = lerp(lerp(660, 300, u), lerp(940, 800, u), rnd());
        dm += "M" + ri(dx) + " " + ri(dy) + "a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0z";
      }
      c.add(path(dm, "#fffaf0", op(0.7)));
      c.glow("door", 1360, 800, 700, "#ffe9c4", 0.3, 520);

      // Lamplight from below (the lamp sits in a niche near the bed).
      c.glow("lamp", 560, 1300, 900, "#f2a452", eve ? 0.3 : 0.42, 760, 0.3);

    }

    c.vignette("#000", night ? 0.8 : 0.6, 760, 760, 1250);
    c.grain(0.3, 0.3);
