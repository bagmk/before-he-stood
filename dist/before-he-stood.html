<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1d1a">
<meta name="color-scheme" content="dark">
<meta name="description" content="마태복음 9:1–8을 세 인물의 눈으로 보는 한영 비주얼노벨 · A bilingual visual novel on Matthew 9:1–8">
<title>그가 일어나기 전 · Before He Stood</title>
<style>
/*
 * css/style.css - one committed look for "Before He Stood".
 * Scene art fills the stage; story text sits on an opaque papyrus panel in iron-gall ink.
 * Palette from Capernaum: black basalt, limestone, Galilee blue, olive, lamp amber.
 * Jesus' presence is warm white light only (never a figure), and it never covers text.
 *
 * Two first-class displays (SPEC 5.6):
 *   - phone portrait (default rules below, px-based sizes);
 *   - TV / laptop landscape (the "TV" media query near the end swaps the size tokens to vh units:
 *     story text >= 3.6vh, names/options >= 3vh, nothing below 2.2vh).
 */

:root {
  color-scheme: dark;

  /* Place */
  --basalt: #1f1d1a;
  --basalt-2: #2b2824;
  --basalt-3: #3a3631;
  --limestone: #ebe3cf;
  --limestone-dim: #b8ae98;
  --galilee: #2c6a86;
  --galilee-hi: #4b93b4;
  --olive: #5f6d33;
  --amber: #c98a1f;
  --amber-soft: #e3b25c;

  /* Papyrus panel and ink */
  --papyrus-hi: #f6efdc;
  --papyrus: #ede2c5;
  --papyrus-lo: #dfd0ac;
  --vellum: #fbf7ec;
  --ink: #261d15;
  --ink-soft: #54463a;
  --ink-faint: #7a6a55;
  --rule: rgba(42, 33, 25, 0.22);

  /* Presence */
  --light: #fff3d3;
  --light-core: #fffaf0;
  --light-glow: rgba(255, 232, 172, 0.55);

  /* Interaction */
  --focus: #2f7fa6;
  --focus-light: #fff3d3;

  /* Type families */
  --serif: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", "Batang", "Noto Serif KR", "Noto Serif CJK KR", "Source Han Serif K", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --text-scale: 1;

  /* Size tokens (phone portrait). The TV query below redefines them in vh. */
  --fs-story: 17px;
  --fs-story-en: 15.3px;
  --fs-verse: 18.5px;
  --fs-verse-en: 16.2px;
  --fs-name: 13.5px;
  --fs-prompt: 16px;
  --fs-prompt-en: 14px;
  --fs-option: 16px;
  --fs-option-en: 14px;
  --fs-small: 12.5px;
  --fs-small-en: 11.5px;
  --fs-ui: 16px;
  --fs-ui-en: 12.8px;
  --fs-reply: 14.5px;
  --fs-pin: 15px;
  --fs-echo: 18px;
  --fs-last: 24px;
  --fs-card-num: 54px;
  --fs-card-lens: 15px;
  --fs-card-title: 30px;
  --fs-action: 14.5px;
  --fs-press: 17px;

  --lh-story: 1.72;
  --panel-w: 100%;
  --panel-min-h: 132px;
  --panel-pad: 20px 18px 24px;
  --panel-radius: 6px;
  --dock-gap: 10px;
  --badge: 26px;
  --hdr-btn: 44px;
  --fs-hdr: 13px;
  --focus-w: 3px;

  /* Layout */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --header-h: 60px;
  --ease-out: cubic-bezier(0.2, 0.7, 0.1, 1);
  --fade: 450ms;

  --paper-grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.36  0 0 0 0 0.27  0 0 0 0 0.15  0 0 0 0.10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ------------------------------------------------------------------ base */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  background: var(--basalt);
  background-image: radial-gradient(120% 80% at 50% 0%, #2a2723 0%, var(--basalt) 60%);
  color: var(--limestone);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}

button,
input {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
  touch-action: manipulation;
}

[hidden] {
  display: none !important;
}

:focus {
  outline: none;
}

:focus-visible {
  outline: var(--focus-w) solid var(--focus);
  outline-offset: 2px;
}

/* The second language of a bilingual pair always sits on its own line. */
span.en {
  display: block;
}

/* Hide the pointer while a class watches the TV (set by main.js after 3 s without movement). */
body.is-idle,
body.is-idle * {
  cursor: none !important;
}

/* ------------------------------------------------------------------ app frame */

.app {
  position: relative;
  height: 100%;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  overflow: hidden;
  isolation: isolate;
  background: var(--basalt);
}

/* ------------------------------------------------------------------ stage */

.stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--basalt);
}

.art {
  position: absolute;
  inset: -5%;
  transform-origin: 50% 60%;
  transition: transform 2.4s var(--ease-out), filter 0.8s ease;
}

.art__sway {
  position: absolute;
  inset: 0;
}

.art__layer {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity var(--fade) ease;
}

.art__layer.is-on {
  opacity: 1;
}

.art__layer svg {
  display: block;
  width: 100%;
  height: 100%;
}

.art__fallback {
  position: absolute;
  inset: 0;
}

/* POV: lying feels tilted and close; standing levels the world. */
.stage[data-pov="lying"] .art {
  transform: rotate(-2deg) scale(1.07) translateY(1.5%);
}

.stage[data-pov="lying"] .art__sway {
  animation: sway 11s ease-in-out infinite;
}

.stage.is-rising .art {
  animation: rise 2.6s var(--ease-out) both;
}

@keyframes sway {
  0%,
  100% {
    transform: rotate(0deg) translateY(0);
  }
  50% {
    transform: rotate(0.6deg) translateY(-0.6%);
  }
}

@keyframes rise {
  0% {
    transform: rotate(-2deg) scale(1.12) translateY(9%);
  }
  100% {
    transform: none;
  }
}

/* Veil: a constant vignette for legibility; the hush deepens it (the light stays above it). */
.veil {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(14, 13, 11, 0.42) 0%, rgba(14, 13, 11, 0) 18%, rgba(14, 13, 11, 0) 52%, rgba(14, 13, 11, 0.5) 100%),
    radial-gradient(140% 100% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(8, 7, 6, 0.45) 100%);
  transition: background-color 0.9s ease;
}

body.is-hush .veil {
  background-color: rgba(8, 7, 6, 0.5);
}

body.is-hush .art {
  filter: saturate(0.3) brightness(0.72);
}

body.is-hush .topbar,
body.is-hush .caption {
  opacity: 0.25;
}

body[data-screen="title"] .veil,
body[data-screen="routeSelect"] .veil {
  background-color: rgba(10, 9, 8, 0.25);
}

body[data-screen="endingCard"] .veil,
body.is-last .veil {
  background-color: rgba(10, 9, 8, 0.6);
}

/* The light of Jesus' presence: a warm bloom inside the stage, never a figure, never over text. */
.light {
  position: absolute;
  inset: -10%;
  pointer-events: none;
  opacity: 0;
  mix-blend-mode: screen;
  transition: opacity 1.8s ease, transform 2.2s var(--ease-out);
  /* main.js/ui.js anchor the bloom to BHS.art.lightAt for the drawn scene via --light-x/--light-y. */
  background: radial-gradient(48% 36% at var(--light-x, 50%) var(--light-y, 38%), rgba(255, 251, 238, 0.95) 0%, rgba(255, 239, 200, 0.62) 28%, rgba(255, 224, 160, 0.22) 55%, rgba(255, 224, 160, 0) 78%);
}

.light::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 238, 200, 0.2);
  opacity: 0;
  transition: opacity 1.8s ease;
}

.stage[data-pov="lying"] .light {
  --light-y: 16%;
}

.light[data-level="soft"] {
  opacity: 0.6;
}

.light[data-level="bright"] {
  opacity: 1;
  transform: scale(1.18);
  animation: breathe 7s ease-in-out infinite;
}

.light[data-level="bright"]::after {
  opacity: 1;
}

@keyframes breathe {
  0%,
  100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.08);
  }
}

/* ------------------------------------------------------------------ portraits
   Busts stand on the top edge of the text panel (main.js measures it into --panel-top) and sink a
   little behind it. They sit under captions, overlays and the whole play layer, so they never
   cover text or choices. Slots 0/1 are the left and right thirds, clear of the central light. */

.cast {
  position: absolute;
  inset: 0;
  z-index: 15;
  pointer-events: none;
  overflow: hidden;
  transition: opacity 0.2s ease;
  --cast-h: 26vh;
  --cast-x: 1.5vw;
  --cast-sink: 9vh;
}

.cast.is-away {
  opacity: 0;
}

.figure {
  position: absolute;
  bottom: calc(var(--panel-top, 30vh) - var(--cast-sink));
  height: var(--cast-h);
  aspect-ratio: 2 / 3;
  transition: opacity 0.22s ease, transform 0.22s ease, filter 0.22s ease;
}

.figure svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0.6vh 1.2vh rgba(0, 0, 0, 0.45));
  /* The bust's cut edge fades out instead of ending in a hard line beside the panel. */
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 80%, transparent 100%);
  mask-image: linear-gradient(180deg, #000 0%, #000 80%, transparent 100%);
}

.figure.is-mirror svg {
  transform: scaleX(-1);
}

.figure[data-slot="0"] {
  left: var(--cast-x);
}

.figure[data-slot="1"] {
  right: var(--cast-x);
}

.figure.is-dim {
  filter: brightness(0.55) saturate(0.85);
}

.figure.is-in {
  animation: figure-in 0.22s ease-out both;
}

.figure[data-slot="1"].is-in {
  animation-name: figure-in-right;
}

.figure.is-out {
  opacity: 0;
  transform: translateY(1.5vh);
}

@keyframes figure-in {
  from {
    opacity: 0;
    transform: translateX(-2vh);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes figure-in-right {
  from {
    opacity: 0;
    transform: translateX(2vh);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ------------------------------------------------------------------ top bar */

.topbar {
  position: absolute;
  z-index: 50;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(var(--safe-top) + 8px) var(--gutter-r) 8px var(--gutter-l);
  pointer-events: none;
  transition: opacity 0.6s ease;
}

.topbar > * {
  pointer-events: auto;
}

.topbar__spacer {
  flex: 1;
  pointer-events: none;
}

.iconbtn {
  display: inline-grid;
  place-items: center;
  width: var(--hdr-btn);
  height: var(--hdr-btn);
  border-radius: 50%;
  color: var(--limestone);
  background: rgba(24, 22, 19, 0.6);
  border: 1px solid rgba(235, 227, 207, 0.16);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.iconbtn svg {
  width: 45%;
  height: 45%;
}

.seg {
  display: inline-flex;
  border-radius: 999px;
  background: rgba(24, 22, 19, 0.6);
  border: 1px solid rgba(235, 227, 207, 0.16);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.seg__btn {
  position: relative;
  min-width: calc(var(--hdr-btn) + 2px);
  height: var(--hdr-btn);
  padding: 0 0.8em;
  border-radius: 999px;
  font: 600 var(--fs-hdr) / 1 var(--sans);
  color: var(--limestone-dim);
  z-index: 0;
}

.seg__btn::before {
  content: "";
  position: absolute;
  inset: 11% 6%;
  border-radius: 999px;
  z-index: -1;
  transition: background-color 0.2s ease;
}

.seg__btn[aria-pressed="true"] {
  color: var(--ink);
}

.seg__btn[aria-pressed="true"]::before {
  background: var(--limestone);
}

/* ------------------------------------------------------------------ caption chip */

.caption {
  position: absolute;
  z-index: 20;
  top: calc(var(--safe-top) + var(--header-h) + 4px);
  left: var(--gutter-l);
  max-width: calc(100% - var(--gutter-l) - var(--gutter-r));
  padding: 0.45em 0.85em 0.5em;
  border-radius: 6px;
  background: rgba(22, 20, 17, 0.72);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  color: var(--limestone);
  font: 500 var(--fs-small) / 1.35 var(--sans);
  letter-spacing: 0.01em;
  pointer-events: none;
  animation: fade-in 0.6s ease both;
  transition: opacity 0.6s ease;
}

.caption .en {
  color: var(--limestone-dim);
  font-size: var(--fs-small-en);
}

/* ------------------------------------------------------------------ echo verse overlay */

.echo {
  position: absolute;
  z-index: 16;
  left: var(--gutter-l);
  right: var(--gutter-r);
  top: calc(var(--safe-top) + var(--header-h) + 48px);
  padding: 1em 1.1em 0.8em;
  border-radius: 8px;
  background: rgba(18, 16, 14, 0.74);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  color: var(--limestone);
  text-align: center;
  font: 400 calc(var(--fs-echo) * var(--text-scale)) / 1.7 var(--serif);
  pointer-events: none;
  animation: echo-in 1.1s ease both;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.echo .en {
  margin-top: 0.3em;
  font-size: 0.86em;
  color: var(--limestone-dim);
}

.echo__ref {
  display: block;
  margin-top: 0.5em;
  font: 500 var(--fs-small) / 1.2 var(--sans);
  color: var(--limestone-dim);
}

.echo mark {
  color: var(--light-core);
  background: linear-gradient(180deg, transparent 58%, rgba(227, 178, 92, 0.75) 58%) no-repeat 0 0 / 0% 100%;
  animation: bleed 1.4s 0.5s ease-out forwards;
  padding: 0 1px;
}

@keyframes echo-in {
  from {
    opacity: 0;
    filter: blur(6px);
  }
  to {
    opacity: 1;
    filter: blur(0);
  }
}

@keyframes bleed {
  to {
    background-size: 100% 100%;
  }
}

/* ------------------------------------------------------------------ pinned thought bubble */

.pin {
  position: absolute;
  z-index: 18;
  top: calc(var(--safe-top) + var(--header-h) + 68px);
  right: var(--gutter-r);
  width: min(78%, 330px);
  padding: 0.8em 1.05em 0.85em;
  border-radius: 1.3em;
  background: rgba(251, 247, 236, 0.96);
  color: var(--ink);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  font: italic 400 calc(var(--fs-pin) * var(--text-scale)) / 1.55 var(--serif);
  pointer-events: none;
  animation: pop-in 0.45s var(--ease-out) both;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.pin::before,
.pin::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: rgba(251, 247, 236, 0.96);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

.pin::before {
  width: 0.95em;
  height: 0.95em;
  left: 1.7em;
  bottom: -1.2em;
}

.pin::after {
  width: 0.55em;
  height: 0.55em;
  left: 1.05em;
  bottom: -2em;
}

.pin__item + .pin__item {
  margin-top: 0.5em;
  padding-top: 0.5em;
  border-top: 1px dashed var(--rule);
}

.pin__item .en {
  font-size: 0.88em;
  color: var(--ink-soft);
}

.pin__ref {
  display: block;
  font: normal 500 var(--fs-small-en) / 1.3 var(--sans);
  color: var(--ink-faint);
}

.receipt {
  position: absolute;
  right: 0.8em;
  bottom: -1.9em;
  padding: 0.2em 0.65em 0.25em;
  border-radius: 999px;
  background: rgba(18, 16, 14, 0.8);
  color: #a8d8ee;
  font: normal 600 var(--fs-small) / 1.2 var(--sans);
  letter-spacing: 0.02em;
  animation: stamp 0.5s var(--ease-out) both;
}

@keyframes stamp {
  0% {
    opacity: 0;
    transform: scale(1.6) rotate(-6deg);
  }
  60% {
    opacity: 1;
    transform: scale(0.95) rotate(1deg);
  }
  100% {
    opacity: 1;
    transform: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: translateY(6px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* ------------------------------------------------------------------ play layer */

.play {
  position: absolute;
  inset: 0;
  z-index: 30;
}

.advance {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  cursor: pointer;
}

.advance:focus-visible {
  outline-offset: -8px;
}

.dock {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  margin: 0 auto;
  width: 100%;
  max-width: calc(var(--panel-w) + var(--gutter-l) + var(--gutter-r));
  padding: 0 var(--gutter-r) calc(var(--safe-bottom) + 14px) var(--gutter-l);
  display: flex;
  flex-direction: column;
  gap: var(--dock-gap);
  pointer-events: none;
  max-height: calc(100% - var(--safe-top) - var(--header-h) - 8px);
}

.dock > * {
  pointer-events: auto;
  flex-shrink: 0;
}

.dock > .panel,
.dock > .reply {
  pointer-events: none;
}

.dock > .choices {
  flex: 0 1 auto;
  min-height: 0;
}

/* ------------------------------------------------------------------ text panel */

.panel {
  position: relative;
  min-height: var(--panel-min-h);
  padding: var(--panel-pad);
  border-radius: var(--panel-radius);
  color: var(--ink);
  background-color: var(--papyrus);
  background-image: var(--paper-grain), radial-gradient(130% 120% at 30% 0%, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0) 60%), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus) 45%, var(--papyrus-lo));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -2px 0 rgba(120, 90, 50, 0.12), 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
  animation: panel-in 0.35s ease both;
  transition: box-shadow 0.8s ease, background-color 0.8s ease;
}

/* A darker rolled edge along the top, like the lip of a scroll. */
.panel::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 6px;
  border-radius: var(--panel-radius) var(--panel-radius) 0 0;
  background: linear-gradient(180deg, rgba(110, 80, 44, 0.3), rgba(110, 80, 44, 0));
  pointer-events: none;
}

@keyframes panel-in {
  from {
    opacity: 0.4;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.plate {
  position: absolute;
  left: 0.9em;
  top: 0;
  transform: translateY(-58%);
  max-width: calc(100% - 1.8em);
  padding: 0.35em 0.9em 0.42em;
  border-radius: 0.3em;
  background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), var(--plate, var(--basalt-3));
  color: #fbf5e6;
  font: 600 var(--fs-name) / 1.25 var(--sans);
  letter-spacing: 0.01em;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.plate__en {
  font-weight: 500;
  opacity: 0.9;
}

.plate__en--stack::before {
  content: " \00B7  ";
}

.plate--jesus {
  background: var(--light);
  color: #6f4b0c;
  box-shadow: 0 0 0 1px rgba(201, 138, 31, 0.35), 0 0 22px rgba(255, 236, 190, 0.95);
}

.text {
  font-family: var(--serif);
  font-size: calc(var(--fs-story) * var(--text-scale));
  line-height: var(--lh-story);
  word-break: keep-all;
  overflow-wrap: anywhere;
  min-height: 1.5em;
}

.text p {
  margin: 0;
}

.text .en {
  margin-top: 0.35em;
  font-size: calc(var(--fs-story-en) * var(--text-scale));
  line-height: 1.5;
  color: var(--ink-soft);
}

.text em {
  font-style: normal;
  font-weight: 700;
}

.text .q {
  color: #44300f;
}

.c {
  opacity: 0;
}

.c.on {
  opacity: 1;
}

.more {
  position: absolute;
  right: 1em;
  bottom: 0.6em;
  width: 0;
  height: 0;
  border-left: 0.4em solid transparent;
  border-right: 0.4em solid transparent;
  border-top: 0.55em solid var(--ink-soft);
  font-size: var(--fs-story);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.panel.is-ready .more {
  opacity: 0.75;
  animation: nudge 1.4s ease-in-out infinite;
}

@keyframes nudge {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(3px);
  }
}

/* Inner voice: italic, no name plate. */
.panel--thought .text {
  font-style: italic;
  color: #382c20;
}

/* Scripture card. */
.panel--verse {
  background-color: var(--vellum);
  background-image: var(--paper-grain), linear-gradient(180deg, #fdfaf1, #f4ecd9);
  box-shadow: inset 0 0 0 5px var(--vellum), inset 0 0 0 6px rgba(138, 98, 42, 0.32), 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
}

.panel--verse::before {
  display: none;
}

.panel--verse .text {
  font-size: calc(var(--fs-verse) * var(--text-scale));
  color: #241a10;
}

.panel--verse .text .en {
  font-size: calc(var(--fs-verse-en) * var(--text-scale));
}

.panel--jesus {
  box-shadow: inset 0 0 0 5px var(--light-core), inset 0 0 0 6px rgba(201, 138, 31, 0.5), 0 0 0 1px rgba(255, 240, 205, 0.85), 0 0 48px 12px var(--light-glow), 0 12px 32px rgba(0, 0, 0, 0.32);
}

.ref {
  margin-top: 0.6em;
  text-align: right;
  font: 500 var(--fs-small) / 1.3 var(--sans);
  letter-spacing: 0.02em;
  color: var(--ink-faint);
}

/* Sign lines (story captions, sound cues, time skips): centered on the stage at body size. */
.play--sign .dock {
  top: calc(var(--safe-top) + var(--header-h));
  justify-content: center;
}

.play--sign .panel {
  align-self: center;
  min-height: 0;
  max-width: 100%;
  padding: 0.8em 1.4em;
  border-radius: 10px;
  background: rgba(14, 13, 11, 0.72);
  background-image: none;
  box-shadow: none;
  color: var(--limestone);
  text-align: center;
}

.play--sign .panel::before,
.play--sign .more {
  display: none;
}

.play--sign .text {
  letter-spacing: 0.01em;
}

.play--sign .text .en {
  color: var(--limestone-dim);
}

/* The last line of an ending: large, centered, lit. */
.play--last .dock {
  top: calc(var(--safe-top) + var(--header-h));
  justify-content: center;
}

.play--last .panel {
  background: none;
  box-shadow: none;
  min-height: 0;
  padding: 8px 6px;
  text-align: center;
  color: var(--light-core);
  animation: last-in 1.6s ease both;
}

.play--last .panel::before,
.play--last .more {
  display: none;
}

.play--last .text {
  font-size: calc(var(--fs-last) * var(--text-scale));
  line-height: 1.55;
  text-shadow: 0 2px 22px rgba(0, 0, 0, 0.85);
}

.play--last .text .en {
  margin-top: 0.6em;
  font-size: calc(var(--fs-last) * 0.74 * var(--text-scale));
  color: var(--limestone);
}

@keyframes last-in {
  from {
    opacity: 0;
    letter-spacing: 0.06em;
  }
  to {
    opacity: 1;
    letter-spacing: 0;
  }
}

/* ------------------------------------------------------------------ transient action reply */

.reply {
  align-self: flex-start;
  max-width: 92%;
  padding: 0.45em 0.8em 0.5em;
  border-radius: 8px;
  background: rgba(18, 16, 14, 0.82);
  color: var(--limestone);
  font: italic 400 calc(var(--fs-reply) * var(--text-scale)) / 1.45 var(--serif);
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.reply:empty {
  display: none;
}

.reply.is-on {
  opacity: 1;
  transform: none;
}

.reply .en {
  font-size: 0.9em;
  color: var(--limestone-dim);
}

/* ------------------------------------------------------------------ choices */

.choices {
  padding: 16px 14px 14px;
  border-radius: var(--panel-radius);
  color: var(--ink);
  background-color: var(--papyrus);
  background-image: var(--paper-grain), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus) 50%, var(--papyrus-lo));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
  overflow-y: auto;
  overscroll-behavior: contain;
  animation: panel-in 0.35s ease both;
}

.choices__prompt {
  margin: 0 2px 0.75em;
  font: 700 calc(var(--fs-prompt) * var(--text-scale)) / 1.45 var(--serif);
  word-break: keep-all;
}

.choices__prompt .en {
  font-weight: 400;
  font-size: calc(var(--fs-prompt-en) * var(--text-scale));
  color: var(--ink-soft);
}

.choices__list {
  display: grid;
  gap: 9px;
}

.opt {
  display: grid;
  grid-template-columns: var(--badge) minmax(0, 1fr);
  align-items: start;
  gap: 0.7em;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px 13px 12px;
  border-radius: 8px;
  border: 1px solid rgba(42, 33, 25, 0.26);
  background: rgba(255, 252, 244, 0.78);
  color: var(--ink);
  text-align: left;
  font: 400 calc(var(--fs-option) * var(--text-scale)) / 1.45 var(--serif);
  word-break: keep-all;
  overflow-wrap: anywhere;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 1px 2px rgba(42, 33, 25, 0.08);
  transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  animation: opt-in 0.4s ease both;
}

.opt:nth-child(2) {
  animation-delay: 0.05s;
}

.opt:nth-child(3) {
  animation-delay: 0.1s;
}

.opt:nth-child(4) {
  animation-delay: 0.15s;
}

@keyframes opt-in {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.opt:hover {
  background: #fffaf0;
  border-color: rgba(42, 33, 25, 0.5);
}

.opt:active {
  transform: translateY(1px);
  background: #f3e9d2;
}

.opt__num {
  display: grid;
  place-items: center;
  width: var(--badge);
  height: var(--badge);
  margin-top: 0.1em;
  border-radius: 50%;
  background: var(--basalt-2);
  color: var(--limestone);
  font: 600 calc(var(--badge) * 0.52) / 1 var(--sans);
}

.opt__body {
  min-width: 0;
}

.opt .en {
  margin-top: 0.2em;
  font-size: calc(var(--fs-option-en) * var(--text-scale));
  color: var(--ink-soft);
}

.opt em {
  font-style: normal;
  font-weight: 700;
}

/* ------------------------------------------------------------------ press + persistent actions */

.pressbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding-bottom: 6px;
}

.pressbox__hint {
  margin: 0;
  padding: 0.35em 0.9em;
  border-radius: 999px;
  background: rgba(14, 13, 11, 0.7);
  color: var(--limestone);
  font: 500 var(--fs-small) / 1.4 var(--sans);
  text-align: center;
}

.glow {
  min-width: 13em;
  min-height: 56px;
  padding: 0.7em 1.8em;
  border-radius: 999px;
  background: radial-gradient(120% 140% at 50% 0%, var(--light-core), var(--light) 60%, #f6dfa6);
  color: #4d340a;
  font: 700 calc(var(--fs-press) * var(--text-scale)) / 1.3 var(--serif);
  box-shadow: 0 0 0 1px rgba(201, 138, 31, 0.55), 0 0 26px 6px rgba(255, 230, 165, 0.65), 0 6px 18px rgba(0, 0, 0, 0.35);
  animation: glow-pulse 2.4s ease-in-out infinite;
}

.glow .en {
  font: 500 0.78em/1.3 var(--sans);
  color: #6e501d;
}

@keyframes glow-pulse {
  0%,
  100% {
    box-shadow: 0 0 0 1px rgba(201, 138, 31, 0.55), 0 0 22px 4px rgba(255, 230, 165, 0.55), 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  50% {
    box-shadow: 0 0 0 1px rgba(201, 138, 31, 0.7), 0 0 38px 12px rgba(255, 234, 175, 0.85), 0 6px 18px rgba(0, 0, 0, 0.35);
  }
}

.actions {
  display: flex;
  gap: 10px;
}

.act {
  flex: 1;
  min-height: 48px;
  padding: 0.5em 0.8em;
  border-radius: 10px;
  background: rgba(60, 57, 52, 0.85);
  border: 1px solid rgba(235, 227, 207, 0.14);
  color: #c4beb3;
  font: 600 var(--fs-action) / 1.25 var(--sans);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: transform 0.1s ease, background-color 0.2s ease;
}

.act:active {
  transform: translateY(1px) scale(0.99);
  background: rgba(70, 66, 60, 0.9);
}

.act .en {
  font-weight: 500;
  font-size: 0.85em;
  color: #a39d92;
}

.act.is-shake {
  animation: refuse 0.36s ease;
}

@keyframes refuse {
  0%,
  100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-4px);
  }
  50% {
    transform: translateX(3px);
  }
  75% {
    transform: translateX(-2px);
  }
}

.act.glow {
  min-width: 0;
  border: 0;
  color: #4d340a;
  font-size: var(--fs-press);
  background: radial-gradient(120% 140% at 50% 0%, var(--light-core), var(--light) 60%, #f6dfa6);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.act.glow .en {
  color: #6e501d;
}

/* ------------------------------------------------------------------ ending title card */

.card {
  position: absolute;
  inset: calc(var(--safe-top) + var(--header-h)) var(--gutter-r) calc(var(--safe-bottom) + 40px) var(--gutter-l);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  pointer-events: none;
  color: var(--limestone);
  animation: fade-in 1.2s ease both;
}

.card__num {
  display: block;
  font: 400 var(--fs-card-num) / 1 var(--serif);
  color: var(--light);
  margin-bottom: 0.25em;
  text-shadow: 0 0 30px rgba(255, 232, 172, 0.6);
}

.card__lens {
  margin: 0;
  font: 500 var(--fs-card-lens) / 1.4 var(--sans);
  color: var(--amber-soft);
  letter-spacing: 0.03em;
}

.card__title {
  margin: 0.3em 0 0;
  font: 700 calc(var(--fs-card-title) * var(--text-scale)) / 1.3 var(--serif);
  color: var(--light-core);
  word-break: keep-all;
}

.card__title .en {
  margin-top: 0.25em;
  font-weight: 400;
  font-size: 0.6em;
  color: var(--limestone);
}

.card__hint {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  margin: 0;
  font: 500 var(--fs-small) / 1.4 var(--sans);
  color: var(--limestone-dim);
  animation: fade-in 1s 1.4s ease both;
}

/* ------------------------------------------------------------------ page screens */

.screen {
  position: absolute;
  inset: 0;
  z-index: 35;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.screen:empty {
  display: none;
}

.page {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding: calc(var(--safe-top) + 28px) var(--gutter-r) calc(var(--safe-bottom) + 28px) var(--gutter-l);
}

.btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 52px;
  padding: 0.6em 1.1em;
  border-radius: 10px;
  font: 600 var(--fs-ui) / 1.3 var(--sans);
  text-align: center;
  transition: background-color 0.15s ease, transform 0.1s ease;
}

.btn:active {
  transform: translateY(1px);
}

.btn .en {
  font-weight: 500;
  font-size: var(--fs-ui-en);
  opacity: 0.85;
}

.btn--primary {
  background: var(--limestone);
  color: var(--ink);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
}

.btn--primary:hover {
  background: #f4eedd;
}

.btn--ghost {
  border: 1px solid rgba(235, 227, 207, 0.45);
  color: var(--limestone);
  background: rgba(20, 18, 16, 0.4);
}

.btn--ghost:hover {
  background: rgba(20, 18, 16, 0.6);
}

.btn--text {
  min-height: 44px;
  color: var(--limestone);
  text-decoration: underline;
  text-decoration-color: rgba(235, 227, 207, 0.4);
  text-underline-offset: 4px;
}

.btn__sub {
  display: block;
  margin-top: 2px;
  font: 500 var(--fs-small) / 1.3 var(--sans);
  opacity: 0.75;
}

/* Title */

.title-page {
  justify-content: flex-end;
  gap: 22px;
  background: linear-gradient(180deg, rgba(16, 15, 13, 0) 0%, rgba(16, 15, 13, 0.25) 30%, rgba(16, 15, 13, 0.82) 62%, rgba(16, 15, 13, 0.94) 100%);
}

.title-head {
  margin-top: auto;
  padding-top: 16vh;
}

.title-side {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.title-sub {
  margin: 0 0 14px;
  font: 500 13px/1.5 var(--sans);
  color: var(--limestone);
  opacity: 0.92;
}

.title-sub .en {
  color: var(--limestone-dim);
  font-size: 12px;
}

.title-main {
  margin: 0;
  font: 700 clamp(46px, 14vw, 64px) / 1.06 var(--serif);
  letter-spacing: -0.015em;
  color: var(--light-core);
  text-shadow: 0 2px 30px rgba(0, 0, 0, 0.5);
  word-break: keep-all;
}

.title-main__line {
  display: block;
}

.title-main__line + .title-main__line {
  padding-left: 0.9em;
}

.title-en {
  margin: 0.45em 0 0;
  font: italic 400 clamp(20px, 6vw, 26px) / 1.2 var(--serif);
  color: var(--limestone);
  letter-spacing: 0.01em;
}

.title-disclaimer {
  margin: 0;
  font: 400 13px/1.6 var(--sans);
  color: var(--limestone-dim);
  word-break: keep-all;
}

.title-disclaimer .en {
  margin-top: 2px;
  font-size: 12px;
}

.langpick__label {
  margin: 0 0 8px;
  font: 500 13px/1.4 var(--sans);
  color: var(--limestone-dim);
}

.langpick__row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.langbtn {
  min-height: 52px;
  padding: 6px 8px;
  border-radius: 10px;
  border: 1px solid rgba(235, 227, 207, 0.3);
  background: rgba(20, 18, 16, 0.5);
  color: var(--limestone);
  font: 600 15px/1.25 var(--sans);
}

.langbtn .en {
  font-weight: 500;
  font-size: 11.5px;
  color: var(--limestone-dim);
}

.langbtn[aria-pressed="true"] {
  background: var(--limestone);
  color: var(--ink);
  border-color: var(--limestone);
}

.langbtn[aria-pressed="true"] .en {
  color: var(--ink-soft);
}

.title-actions {
  display: grid;
  gap: 10px;
}

.title-foot {
  display: grid;
  gap: 10px;
  justify-items: start;
}

.teacher-link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  color: var(--limestone);
  font: 500 13.5px/1.3 var(--sans);
  text-decoration: underline;
  text-decoration-color: rgba(235, 227, 207, 0.4);
  text-underline-offset: 4px;
}

.fineprint {
  margin: 0;
  font: 400 11px/1.55 var(--sans);
  color: #978f7e;
  word-break: keep-all;
}

.notice {
  margin: 0;
  padding: 0.6em 0.8em;
  border-radius: 8px;
  background: rgba(201, 138, 31, 0.18);
  border: 1px solid rgba(201, 138, 31, 0.45);
  color: var(--limestone);
  font: 500 var(--fs-small) / 1.5 var(--sans);
}

/* Route select */

.routes-page {
  gap: 14px;
  padding-top: calc(var(--safe-top) + var(--header-h) + 12px);
  background: linear-gradient(180deg, rgba(16, 15, 13, 0.35), rgba(16, 15, 13, 0.75) 40%, rgba(16, 15, 13, 0.9));
}

.routes-prompt {
  margin: 4px 0 2px;
  font: 700 calc(23px * var(--text-scale)) / 1.4 var(--serif);
  color: var(--light-core);
  word-break: keep-all;
}

.routes-prompt .en {
  font-weight: 400;
  font-size: 0.68em;
  color: var(--limestone);
}

.routes-list {
  display: grid;
  gap: 14px;
}

.routecard {
  position: relative;
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 26px 18px 18px;
  border-radius: 8px;
  text-align: left;
  color: var(--ink);
  background-color: var(--papyrus);
  background-image: var(--paper-grain), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus) 55%, var(--papyrus-lo));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 10px 26px rgba(0, 0, 0, 0.45);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.routecard:hover {
  transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 14px 30px rgba(0, 0, 0, 0.5);
}

.routecard:active {
  transform: translateY(1px);
}

.routecard .plate {
  transform: translateY(-50%);
}

.routecard__title {
  display: block;
  font: 700 calc(19px * var(--text-scale)) / 1.4 var(--serif);
  word-break: keep-all;
}

.routecard__title .en {
  font-weight: 400;
  font-size: 0.82em;
  color: var(--ink-soft);
}

.routecard__tag {
  display: block;
  margin-top: 6px;
  font: 500 13.5px/1.45 var(--sans);
  color: var(--ink-soft);
}

.routecard__tag .en {
  font-weight: 400;
  font-size: 0.92em;
}

.routecard__first {
  display: block;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--rule);
  font: italic 400 calc(15px * var(--text-scale)) / 1.6 var(--serif);
  color: #382c20;
  word-break: keep-all;
}

.routecard__first .en {
  font-size: 0.9em;
  color: var(--ink-soft);
}

.routecard--missing {
  opacity: 0.55;
}

/* Final screen: a quiet page of papyrus. */

.final-page {
  gap: 22px;
  color: var(--ink);
  background-color: var(--papyrus);
  background-image: var(--paper-grain), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus) 40%, var(--papyrus-lo));
  padding-top: calc(var(--safe-top) + var(--header-h) + 14px);
}

.final-top {
  display: grid;
  gap: 8px;
}

.final-kicker {
  margin: 0;
  font: 500 13px/1.4 var(--sans);
  color: var(--ink-faint);
}

.final-verse {
  margin: 0;
  font: 700 calc(32px * var(--text-scale)) / 1.35 var(--serif);
  color: #20160d;
  word-break: keep-all;
}

.final-verse .en {
  margin-top: 0.2em;
  font-weight: 400;
  font-size: 0.6em;
  color: var(--ink-soft);
}

.final-verse__ref {
  display: block;
  margin-top: 8px;
  font: 500 12.5px/1.3 var(--sans);
  color: var(--ink-faint);
}

.blanks {
  display: grid;
  gap: 14px;
  margin: 0;
  padding: 16px 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  list-style: none;
}

.blank {
  font: 400 calc(16.5px * var(--text-scale)) / 1.8 var(--serif);
  word-break: keep-all;
}

.blank .en {
  font-size: 0.88em;
  line-height: 1.6;
  color: var(--ink-soft);
}

.blank--mine {
  padding: 12px 14px;
  margin: 0 -14px;
  border-radius: 8px;
  background: rgba(255, 252, 244, 0.75);
  box-shadow: inset 0 0 0 1px rgba(42, 33, 25, 0.2);
}

.blank__line {
  display: inline-block;
  min-width: 5.5em;
  border-bottom: 1.5px solid rgba(42, 33, 25, 0.5);
  transform: translateY(-0.2em);
  margin: 0 3px;
}

.blank__input {
  display: inline-block;
  width: 9em;
  max-width: 62%;
  min-height: 44px;
  margin: 0 4px;
  padding: 4px 8px;
  border: 0;
  border-bottom: 2px solid var(--galilee);
  border-radius: 6px 6px 0 0;
  background: rgba(44, 106, 134, 0.1);
  color: var(--ink);
  font: 700 1em/1.4 var(--serif);
  color-scheme: light;
}

.blank__input::placeholder {
  color: var(--ink-faint);
  font-weight: 400;
}

.blank__mirror {
  font-weight: 700;
  color: var(--ink);
}

.blank__saved {
  display: block;
  margin-top: 4px;
  font: 500 12px/1.3 var(--sans);
  color: var(--olive);
  min-height: 1.3em;
}

.final-mid {
  display: grid;
  gap: 10px;
}

.final-hint {
  margin: 0;
  font: 500 13px/1.5 var(--sans);
  color: var(--ink-soft);
}

.final-q {
  margin: 0;
  font: 700 calc(18px * var(--text-scale)) / 1.55 var(--serif);
  word-break: keep-all;
}

.final-q .en {
  font-weight: 400;
  font-size: 0.86em;
  color: var(--ink-soft);
}

.closing {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 16px 16px 12px;
  border-radius: 6px;
  background: var(--vellum);
  box-shadow: inset 0 0 0 4px var(--vellum), inset 0 0 0 5px rgba(138, 98, 42, 0.3);
  font: 400 calc(15.5px * var(--text-scale)) / 1.7 var(--serif);
  word-break: keep-all;
}

.closing__v {
  margin: 0;
}

.closing__v .en {
  font-size: 0.9em;
  color: var(--ink-soft);
}

.closing__ref {
  display: block;
  font: 500 11.5px/1.4 var(--sans);
  color: var(--ink-faint);
}

.final-page .btn--primary {
  background: var(--basalt-2);
  color: var(--limestone);
}

.final-page .btn--primary:hover {
  background: var(--basalt-3);
}

/* Header controls sit on papyrus here, so give them a solid ground. */
body[data-screen="final"] .iconbtn,
body[data-screen="final"] .seg {
  background: rgba(43, 40, 36, 0.9);
}

/* Gallery */

.gallery-page {
  gap: 16px;
  padding-top: calc(var(--safe-top) + var(--header-h) + 12px);
  background: rgba(22, 20, 17, 0.94);
}

.gallery-title {
  margin: 0;
  font: 700 calc(26px * var(--text-scale)) / 1.3 var(--serif);
  color: var(--light-core);
}

.gallery-title .en {
  display: inline;
  font-weight: 400;
  font-size: 0.62em;
  color: var(--limestone-dim);
  margin-left: 0.5em;
}

.gallery-intro {
  margin: 0;
  font: 400 13px/1.55 var(--sans);
  color: var(--limestone-dim);
  word-break: keep-all;
}

.grid {
  display: grid;
  grid-template-columns: 58px repeat(3, minmax(0, 1fr));
  gap: 6px;
}

.grid__corner {
  min-height: 1px;
}

.grid__lens {
  padding: 6px 2px 4px;
  text-align: center;
  font: 600 13px/1.3 var(--sans);
  color: var(--amber-soft);
}

.grid__lens .en {
  font-weight: 500;
  font-size: 11px;
  color: var(--limestone-dim);
}

.grid__row {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 4px 0;
  font: 600 13px/1.3 var(--sans);
  color: var(--limestone);
  word-break: keep-all;
}

.grid__row .en {
  font-weight: 500;
  font-size: 11px;
  color: var(--limestone-dim);
}

.grid__swatch {
  display: block;
  width: 18px;
  height: 4px;
  border-radius: 2px;
  margin-bottom: 6px;
  background: var(--plate, var(--basalt-3));
}

.cell {
  position: relative;
  min-height: 92px;
  padding: 10px 8px;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  font: 700 calc(13.5px * var(--text-scale)) / 1.45 var(--serif);
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.cell .en {
  margin-top: 4px;
  font-weight: 400;
  font-size: 0.82em;
  line-height: 1.35;
}

.cell[data-seen="true"] {
  color: var(--ink);
  background-color: var(--papyrus);
  background-image: var(--paper-grain), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus-lo));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

.cell[data-seen="true"] .en {
  color: var(--ink-soft);
}

.cell[data-seen="false"] {
  color: #8a8376;
  background: rgba(58, 54, 49, 0.45);
  border: 1px dashed rgba(235, 227, 207, 0.2);
  font: 500 12.5px/1.3 var(--sans);
}

.cell[data-current="true"] {
  box-shadow: 0 0 0 2px var(--light), 0 0 22px rgba(255, 232, 172, 0.45);
}

.cell__yours {
  display: block;
  margin-top: 6px;
  font: 600 10.5px/1.2 var(--sans);
  color: #6f4b0c;
}

.gallery-actions {
  display: grid;
  gap: 10px;
  margin-top: 6px;
}

/* ------------------------------------------------------------------ settings + modal */

.settings {
  position: absolute;
  z-index: 60;
  top: calc(var(--safe-top) + var(--header-h) + 4px);
  right: var(--gutter-r);
  width: min(300px, calc(100% - var(--gutter-l) - var(--gutter-r)));
  padding: 16px;
  border-radius: 10px;
  color: var(--ink);
  background-color: var(--papyrus-hi);
  background-image: var(--paper-grain);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
  animation: pop-in 0.25s var(--ease-out) both;
  color-scheme: light;
  font-size: 13.5px;
}

.settings__title {
  margin: 0 0 0.9em;
  font: 700 1.1em/1.3 var(--sans);
}

.settings__group + .settings__group {
  margin-top: 1em;
}

.settings__label {
  display: block;
  margin-bottom: 0.45em;
  font: 500 0.93em/1.3 var(--sans);
  color: var(--ink-soft);
}

.choicerow {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 6px;
}

.chip {
  min-height: 44px;
  padding: 4px 8px;
  border-radius: 8px;
  border: 1px solid rgba(42, 33, 25, 0.25);
  background: rgba(255, 252, 244, 0.6);
  color: var(--ink);
  font: 600 1em/1.2 var(--sans);
}

.chip[aria-pressed="true"] {
  background: var(--basalt-2);
  border-color: var(--basalt-2);
  color: var(--limestone);
}

.chip:disabled {
  opacity: 0.4;
  cursor: default;
}

.settings__close {
  margin-top: 1em;
  width: 100%;
}

.settings .btn--ghost {
  color: var(--ink);
  border-color: rgba(42, 33, 25, 0.3);
  background: transparent;
  font-size: 1em;
}

.modal {
  position: absolute;
  inset: 0;
  z-index: 70;
  display: grid;
  place-items: center;
  padding: 24px var(--gutter-r) 24px var(--gutter-l);
  background: rgba(10, 9, 8, 0.66);
  animation: fade-in 0.2s ease both;
}

.dialog {
  width: min(360px, 100%);
  padding: 22px 20px 18px;
  border-radius: 12px;
  color: var(--ink);
  background-color: var(--papyrus-hi);
  background-image: var(--paper-grain);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  color-scheme: light;
  font-size: 14px;
}

.dialog__title {
  margin: 0 0 0.45em;
  font: 700 1.3em/1.4 var(--serif);
  word-break: keep-all;
}

.dialog__title .en,
.dialog__body .en {
  font-weight: 400;
  font-size: 0.86em;
  color: var(--ink-soft);
}

.dialog__body {
  margin: 0 0 1.1em;
  font: 400 1em/1.6 var(--sans);
  color: var(--ink-soft);
  word-break: keep-all;
}

.dialog__actions {
  display: grid;
  gap: 8px;
}

.dialog .btn {
  font-size: 1.1em;
}

.dialog .btn--primary {
  background: var(--basalt-2);
  color: var(--limestone);
  box-shadow: none;
}

.dialog .btn--ghost {
  color: var(--ink);
  border-color: rgba(42, 33, 25, 0.3);
  background: transparent;
}

/* ------------------------------------------------------------------ debug (developer only) */

.debug {
  position: absolute;
  z-index: 80;
  left: 6px;
  bottom: calc(var(--safe-bottom) + 6px);
  max-width: min(calc(100% - 12px), 720px);
  max-height: 55%;
  overflow: auto;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.84);
  color: #d8f0d0;
  font: 11px/1.45 var(--mono);
}

.debug.is-min {
  max-height: none;
  padding: 0;
  background: none;
}

.debug button,
.debug select {
  font: 11px var(--mono);
  min-height: 30px;
  padding: 2px 8px;
  margin: 2px 2px 2px 0;
  border-radius: 4px;
  border: 1px solid #4b6b45;
  background: #142212;
  color: #d8f0d0;
}

.debug pre {
  margin: 4px 0;
  white-space: pre-wrap;
  word-break: break-all;
}

.noscript {
  position: absolute;
  inset: auto 16px 40% 16px;
  text-align: center;
  color: var(--limestone);
}

/* ------------------------------------------------------------------ tablets in portrait */

@media (min-width: 700px) and (orientation: portrait) {
  .app {
    max-width: 760px;
  }
  :root {
    --fs-story: 21px;
    --fs-story-en: 18.5px;
    --fs-verse: 22px;
    --fs-verse-en: 19px;
    --fs-name: 16px;
    --fs-prompt: 19px;
    --fs-prompt-en: 16.5px;
    --fs-option: 19px;
    --fs-option-en: 16.5px;
    --fs-small: 15px;
    --fs-small-en: 14px;
    --fs-pin: 17px;
    --fs-echo: 21px;
    --fs-last: 30px;
    --fs-card-title: 38px;
    --panel-pad: 26px 28px 30px;
    --badge: 32px;
  }
}

@media (min-width: 600px) {
  .app {
    box-shadow: 0 0 0 1px rgba(235, 227, 207, 0.06), 0 30px 80px rgba(0, 0, 0, 0.55);
  }
}

/* ------------------------------------------------------------------ TV and laptop landscape (16:9 first)
   Sized in vh so 720p, 1080p and 4K read the same from 3-5 m away. Reference values at 1080p:
   story 40px, names 32px, options 35px, smallest text 24px. */

@media (min-aspect-ratio: 5/4) and (min-width: 960px) and (min-height: 540px) {
  :root {
    --fs-story: 3.7vh;
    --fs-story-en: 3.2vh;
    --fs-verse: 3.9vh;
    --fs-verse-en: 3.3vh;
    --fs-name: 3vh;
    --fs-prompt: 3.4vh;
    --fs-prompt-en: 3vh;
    --fs-option: 3.2vh;
    --fs-option-en: 3vh;
    --fs-small: 2.4vh;
    --fs-small-en: 2.25vh;
    --fs-ui: 3vh;
    --fs-ui-en: 2.3vh;
    --fs-reply: 3vh;
    --fs-pin: 2.9vh;
    --fs-echo: 3.6vh;
    --fs-last: 5.6vh;
    --fs-card-num: 10vh;
    --fs-card-lens: 3.4vh;
    --fs-card-title: 7.4vh;
    --fs-action: 3vh;
    --fs-press: 3.6vh;
    --fs-hdr: 2.3vh;

    --lh-story: 1.5;
    --panel-w: min(130vh, 92vw);
    --panel-min-h: 25vh;
    --panel-pad: 3.8vh 4.6vh 4vh;
    --panel-radius: 1vh;
    --dock-gap: 1.6vh;
    --badge: 4.6vh;
    --hdr-btn: max(44px, 5.6vh);
    --header-h: 8vh;
    --focus-w: 0.55vh;
    --gutter-l: max(3vw, env(safe-area-inset-left, 0px));
    --gutter-r: max(3vw, env(safe-area-inset-right, 0px));
  }

  .app {
    max-width: none;
    box-shadow: none;
  }

  /* Busts stand over the outer ends of the centred panel (left and right thirds),
     leaving the middle of the stage to the light. */
  .cast {
    --cast-h: 58vh;
    --cast-x: max(1vw, calc((100vw - var(--panel-w)) / 2 - 1vw));
    --cast-sink: 6vh;
  }

  /* A focus ring that reads from across the room: light ring with a dark halo. */
  :focus-visible {
    outline: var(--focus-w) solid var(--focus-light);
    outline-offset: 0.35vh;
    box-shadow: 0 0 0 1.1vh rgba(16, 15, 13, 0.75);
  }

  .topbar {
    gap: 1vh;
    padding: calc(var(--safe-top) + 2vh) var(--gutter-r) 1vh var(--gutter-l);
    opacity: 0.6;
  }

  .topbar:hover,
  .topbar:focus-within {
    opacity: 1;
  }

  body.is-idle .topbar {
    opacity: 0.18;
  }

  .caption {
    top: calc(var(--safe-top) + 2vh + var(--hdr-btn) + 1.6vh);
    border-radius: 0.8vh;
  }

  .echo {
    top: calc(var(--safe-top) + 22vh);
    left: 50%;
    right: auto;
    width: min(76vw, 130vh);
    transform: translateX(-50%);
    border-radius: 1vh;
  }

  .pin {
    top: calc(var(--safe-top) + 12vh);
    right: var(--gutter-r);
    width: min(36vw, 64vh);
  }

  .dock {
    padding-bottom: calc(var(--safe-bottom) + 4vh);
  }

  .plate {
    left: 1.2em;
  }

  .more {
    right: 1.2em;
  }

  .text .en {
    margin-top: 0.45em;
  }

  .play--sign .panel {
    max-width: min(110vh, 80vw);
    padding: 2.4vh 4vh;
    border-radius: 1.2vh;
  }

  .play--last .panel {
    max-width: min(150vh, 86vw);
    align-self: center;
  }

  /* Choices: a compact 2x2 grid of large numbered buttons that leaves the top of the scene
     visible (about half the screen at 1080p for typical options); long options that would
     overflow stack in full-width rows. */
  .choices {
    width: min(168vh, 95vw);
    max-height: 66vh;
    align-self: center;
    padding: 1.8vh 2.4vh 2vh;
    border-radius: 1vh;
  }

  .choices__prompt {
    margin: 0 0.3vh 1.1vh;
    line-height: 1.3;
  }

  .choices__prompt .en {
    display: inline;
  }

  .choices__prompt .en::before {
    content: "  \00B7  ";
    color: var(--ink-faint);
  }

  .choices__list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.1vh;
  }

  .choices.is-stacked .choices__list {
    grid-template-columns: minmax(0, 1fr);
    gap: 1.2vh;
  }

  .choices.is-stacked .opt {
    min-height: 0;
    padding-top: 1.5vh;
    padding-bottom: 1.6vh;
  }

  .opt {
    min-height: 0;
    padding: 1.3vh 2vh 1.4vh 1.4vh;
    border-radius: 1vh;
    gap: 1.4vh;
    line-height: 1.32;
  }

  .opt .en {
    margin-top: 0.1em;
  }

  .opt__num {
    margin-top: 0;
    align-self: start;
  }

  .pressbox {
    gap: 1.6vh;
  }

  .glow {
    min-height: 9vh;
    padding: 1.6vh 6vh;
  }

  /* Asher's gray actions hang from the panel's bottom-left edge, out of the flow, so the
     panel keeps its usual place. During the lit press they return as a large centred row. */
  .actions {
    position: absolute;
    left: calc(var(--gutter-l) + 2.6vh);
    bottom: calc(var(--safe-bottom) + 4vh - max(22px, 3vh));
    z-index: 2;
    gap: 1.2vh;
  }

  .act {
    flex: 0 0 auto;
    min-width: 17vh;
    min-height: max(44px, 6vh);
    padding: 0.5vh 2vh;
    border-radius: 0.9vh;
    font-size: 2.6vh;
    background: rgba(46, 43, 39, 0.94);
    box-shadow: 0 0.6vh 1.6vh rgba(0, 0, 0, 0.35);
  }

  .act .en {
    display: inline;
    margin-left: 0.5em;
    font-size: 0.86em;
  }

  .play--press .actions {
    position: static;
    width: var(--panel-w);
    align-self: center;
    gap: 1.6vh;
  }

  .play--press .act {
    flex: 1 1 0;
    min-height: 9vh;
    font-size: 3vh;
  }

  .play--press .act .en {
    display: block;
    margin-left: 0;
  }

  .play--press .act.glow {
    font-size: var(--fs-press);
  }

  .reply {
    align-self: center;
    max-width: min(110vh, 80vw);
    padding: 1vh 2vh;
    border-radius: 1vh;
  }

  .card {
    inset: 10vh 6vw 8vh;
  }

  /* Page screens fill 16:9 instead of stacking like a phone. */
  .page {
    padding: calc(var(--safe-top) + 6vh) 6vw calc(var(--safe-bottom) + 5vh);
  }

  .btn {
    min-height: 8.5vh;
    border-radius: 1.2vh;
  }

  .btn__sub {
    font-size: var(--fs-small-en);
  }

  .btn--text {
    min-height: max(44px, 6vh);
  }

  .title-page {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    column-gap: 6vw;
    align-items: end;
    background: linear-gradient(90deg, rgba(16, 15, 13, 0.82) 0%, rgba(16, 15, 13, 0.45) 45%, rgba(16, 15, 13, 0.82) 100%), linear-gradient(180deg, rgba(16, 15, 13, 0) 40%, rgba(16, 15, 13, 0.6) 100%);
  }

  .title-head {
    margin: 0;
    padding: 0 0 4vh;
    align-self: center;
  }

  .title-side {
    gap: 3vh;
    align-self: center;
  }

  .title-sub {
    margin-bottom: 3vh;
    font-size: 2.8vh;
  }

  .title-sub .en {
    font-size: 2.4vh;
  }

  .title-main {
    font-size: 13.5vh;
  }

  .title-en {
    font-size: 5vh;
  }

  .title-disclaimer {
    font-size: 2.4vh;
  }

  .title-disclaimer .en {
    font-size: 2.25vh;
  }

  .langpick__label {
    font-size: 2.4vh;
    margin-bottom: 1.2vh;
  }

  .langpick__row {
    gap: 1.2vh;
  }

  .langbtn {
    min-height: 8.5vh;
    border-radius: 1.2vh;
    font-size: 2.9vh;
  }

  .langbtn .en {
    font-size: 2.25vh;
  }

  .title-actions {
    gap: 1.4vh;
  }

  .title-foot {
    gap: 1.2vh;
  }

  .teacher-link {
    min-height: max(44px, 5vh);
    font-size: 2.4vh;
  }

  .fineprint {
    font-size: 2.2vh;
    line-height: 1.45;
  }

  .notice {
    border-radius: 1vh;
  }

  .routes-page {
    gap: 3vh;
    padding-top: calc(var(--safe-top) + 12vh);
    background: linear-gradient(180deg, rgba(16, 15, 13, 0.55), rgba(16, 15, 13, 0.82) 45%, rgba(16, 15, 13, 0.92));
  }

  .routes-prompt {
    margin: 0;
    font-size: calc(4.8vh * var(--text-scale));
  }

  .routes-list {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 2.4vw;
    flex: 1;
    align-items: stretch;
  }

  .routecard {
    margin-top: 2vh;
    padding: 6vh 2.4vw 3.4vh;
    border-radius: 1.2vh;
    display: flex;
    flex-direction: column;
  }

  .routecard .plate {
    left: 2.4vw;
    max-width: calc(100% - 4.8vw);
    white-space: normal;
    line-height: 1.2;
  }

  .routecard .plate__en--stack {
    display: block;
    font-size: 0.82em;
  }

  .routecard .plate__en--stack::before {
    content: none;
  }

  .routecard__title {
    font-size: calc(3.6vh * var(--text-scale));
  }

  .routecard__tag {
    margin-top: 1.4vh;
    font-size: 2.6vh;
  }

  .routecard__first {
    margin-top: auto;
    padding-top: 2.4vh;
    font-size: calc(3vh * var(--text-scale));
  }

  /* Final screen on 16:9: the verse on top, the three blanks in a row, the question beside
     the hint and the button, the closing verses in three columns. Fits 1080p without scrolling. */
  .final-page {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "top top"
      "blanks blanks"
      "hint hint"
      "q next"
      "closing closing";
    align-content: center;
    column-gap: 4vw;
    row-gap: 1.6vh;
    padding-top: calc(var(--safe-top) + 8vh);
    padding-bottom: calc(var(--safe-bottom) + 3vh);
  }

  .final-top {
    grid-area: top;
    text-align: center;
    gap: 0.6vh;
  }

  .final-kicker {
    font-size: 2.4vh;
  }

  .final-verse {
    font-size: calc(6vh * var(--text-scale));
    line-height: 1.25;
  }

  .final-verse .en {
    font-size: 0.56em;
  }

  .final-verse__ref {
    margin-top: 0.6vh;
    font-size: 2.3vh;
  }

  .blanks {
    grid-area: blanks;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.6vw;
    padding: 1.4vh 0;
  }

  .blank {
    font-size: calc(2.8vh * var(--text-scale));
    line-height: 1.55;
    padding: 1vh 1.2vw;
  }

  .blank--mine {
    margin: 0;
    border-radius: 1vh;
  }

  .blank .en {
    font-size: calc(2.4vh * var(--text-scale));
    line-height: 1.5;
  }

  .blank__input {
    width: 7.5em;
    max-width: 72%;
    min-height: 5.6vh;
    margin: 0 0.3vw;
    padding: 0.4vh 1vh;
    border-bottom-width: 0.4vh;
    border-radius: 0.8vh 0.8vh 0 0;
  }

  .blank__line {
    min-width: 4em;
  }

  /* While typing, a slim ring is enough; the room-scale halo would cover the sentence. */
  .blank__input:focus-visible {
    outline: 0.4vh solid var(--galilee);
    outline-offset: 0.2vh;
    box-shadow: none;
  }

  .blank__saved {
    font-size: 2.2vh;
  }

  .final-hint {
    grid-area: hint;
    margin: 0;
    font-size: 2.4vh;
  }

  .final-hint .en {
    display: inline;
  }

  .final-hint .en::before {
    content: " \00B7  ";
  }

  .final-q {
    grid-area: q;
    align-self: center;
    font-size: calc(3.1vh * var(--text-scale));
  }

  .final-q .en {
    font-size: 0.87em;
  }

  .final-page .final-next {
    grid-area: next;
    justify-self: end;
    align-self: center;
    width: auto;
    min-width: 40vh;
    min-height: 7.5vh;
  }

  .closing {
    grid-area: closing;
    grid-template-columns: 1.3fr 1fr 1fr;
    gap: 2vw;
    padding: 1.6vh 2vw;
    border-radius: 1vh;
    font-size: calc(2.4vh * var(--text-scale));
    line-height: 1.45;
  }

  .closing__ref {
    display: inline;
    margin-left: 0.6em;
    font-size: 2.2vh;
    white-space: nowrap;
  }

  .gallery-page {
    gap: 2vh;
    padding-top: calc(var(--safe-top) + 9vh);
    padding-bottom: calc(var(--safe-bottom) + 4vh);
  }

  .gallery-title {
    font-size: calc(5vh * var(--text-scale));
  }

  .gallery-intro {
    font-size: 2.4vh;
  }

  .grid {
    grid-template-columns: 13vw repeat(3, minmax(0, 1fr));
    gap: 1.2vh;
  }

  .grid__lens {
    font-size: 3vh;
    padding: 0.6vh 0.5vw;
  }

  .grid__lens .en {
    font-size: 2.3vh;
  }

  .grid__row {
    font-size: 3vh;
    padding: 0 0.6vw;
  }

  .grid__row .en {
    font-size: 2.3vh;
  }

  .grid__swatch {
    width: 4vh;
    height: 0.6vh;
    margin-bottom: 1.2vh;
  }

  .cell {
    min-height: 13.5vh;
    padding: 1.4vh 1.2vw;
    border-radius: 1vh;
    font-size: calc(3.1vh * var(--text-scale));
  }

  .cell .en {
    font-size: calc(2.4vh * var(--text-scale));
  }

  .cell[data-seen="false"] {
    font-size: 2.4vh;
  }

  .cell__yours {
    font-size: 2.2vh;
    margin-top: 0.8vh;
  }

  .gallery-actions {
    grid-template-columns: repeat(2, minmax(0, 30vw));
    justify-content: end;
    gap: 1.6vw;
    margin-top: 0;
  }

  .gallery-actions .btn {
    min-height: 7.5vh;
  }

  .settings {
    top: calc(var(--safe-top) + 2vh + var(--hdr-btn) + 1.4vh);
    width: min(46vh, 60vw);
    padding: 2.6vh;
    border-radius: 1.2vh;
    font-size: 2.4vh;
  }

  .chip {
    min-height: 6.5vh;
    border-radius: 1vh;
  }

  .dialog {
    width: min(76vh, 90vw);
    padding: 4vh 4vh 3.4vh;
    border-radius: 1.6vh;
    font-size: 2.6vh;
  }

  .dialog__actions {
    grid-template-columns: 1fr 1fr;
    gap: 1.6vh;
  }

  .debug {
    font-size: 12px;
  }
}

/* Short landscape phones and small windows: keep the phone layout readable. */
@media (max-height: 640px) and (orientation: portrait) {
  .title-head {
    padding-top: 6vh;
  }
  .title-main {
    font-size: clamp(38px, 11vw, 52px);
  }
  :root {
    --panel-min-h: 112px;
  }
}

/* ------------------------------------------------------------------ motion preferences */

/* Reduced motion: no typewriter (main.js), no shake, no sway or pulse; only short opacity
   fades remain. Transitions are switched off everywhere first, so no property (such as
   font-style) ever animates by accident, then the few intended fades are restored. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0s !important;
    animation-iteration-count: 1 !important;
    animation-delay: 0s !important;
    transition: none !important;
  }
  .art__layer,
  .reply,
  .cast,
  .figure,
  .light,
  .light::after,
  .caption,
  .topbar {
    transition: opacity 150ms ease !important;
  }
  .stage[data-pov="lying"] .art__sway,
  .light[data-level="bright"],
  .stage.is-rising .art {
    animation: none !important;
  }
  .echo mark {
    background-size: 100% 100%;
  }
}

/* ?test=1: no transitions and no animation time at all, so every screen settles at once. */
html.is-test *,
html.is-test *::before,
html.is-test *::after {
  transition: none !important;
  animation-duration: 0s !important;
  animation-delay: 0s !important;
  animation-iteration-count: 1 !important;
}

html.is-test .echo mark {
  background-size: 100% 100%;
}

<script>/* data/routes/scribe.js */
/* Scribe route: Menahem, "The Line I Read This Morning". Owner: scribe writer.
   Schema: docs/SPEC.md section 4.5. Story: docs/scenario-v2.md (scribe route).
   Every player-facing string is a T object { ko, en }. Scripture appears only as
   verse beats or {{v:KEY}} / {{r:KEY}} tokens. Jesus speaks only through verse beats. */
(function () {
  var BHS = (window.BHS = window.BHS || {});
  BHS.routes = BHS.routes || {};

  // Highlight map for the Psalm 103:3 echo, keyed by the flag set at c1.
  // Returns a fresh object each time so no two beats share a reference.
  function underlineHighlight() {
    return {
      flag: "underline",
      map: {
        subject: { ko: ["그가"], en: ["who"] },
        order: { ko: ["사하시며", "고치시며"], en: ["forgives", "heals"] },
        sick: { ko: ["병"], en: ["diseases"] },
        whole: "*"
      }
    };
  }

  BHS.routes.scribe = {
    id: "scribe",
    actions: [],

    beats: [
      // ---------------------------------------------------------------
      // DAWN: Menahem's room, Psalm 103 with Hanan (c1, c2)
      // ---------------------------------------------------------------
      { id: "dawn", type: "scene", bg: "dawn_lamp", caption: { ko: "새벽 · 므나헴의 방", en: "Dawn · Menahem's room" } },
      // His notes sit by the lamp from the start: he writes there, never on the sacred scroll (lead decision).
      { type: "line", text: { ko: "등잔불이 흔들린다. 므나헴이 잉크 묻은 손가락으로 두루마리를 편다. 곁에는 기록장이 펼쳐져 있다.", en: "The oil lamp flickers. Menahem unrolls the scroll with ink-stained fingers. His notes lie open beside it." } },
      { type: "line", text: { ko: "새벽마다 그는 같은 고백으로 하루를 연다. {{v:DT_6_4}}", en: "Every dawn he begins the day with the same words: {{v:DT_6_4}}" } },
      { type: "line", text: { ko: "맞은편에서 제자 하난이 두루마리를 들여다본다. 오늘 읽을 곳은 시편 103편이다.", en: "Across from him, his student Hanan leans over the scroll. Today's reading is Psalm 103." } },
      { type: "verse", key: "PS_103_3" },
      { type: "line", speaker: "hanan", text: { ko: "선생님, 누가 용서하시고, 누가 고치시는 거예요?", en: "Teacher, who forgives? And who heals?" } },
      {
        type: "choice",
        id: "c1",
        prompt: { ko: "무엇부터 짚어 줄까?", en: "Where to begin?" },
        options: [
          {
            id: "a",
            lens: 1,
            set: { underline: "subject" },
            text: { ko: "“주님이시다. 주어를 분명히 해라.”", en: "“The Lord. Be clear about the subject.”" },
            reaction: [
              { type: "line", text: { ko: "므나헴은 첫 낱말 *그가*를 기록장에 옮겨 적는다.", en: "Menahem copies the first word, *who*, into his notes." } },
              { type: "line", speaker: "hanan", text: { ko: "다 주님이 하시는 일이군요.", en: "So it's all the Lord's doing." } }
            ]
          },
          {
            id: "b",
            lens: 2,
            set: { underline: "order" },
            text: { ko: "“용서가 먼저, 치유가 그다음에 나오는구나.”", en: "“So forgiving is named first, and healing after.”" },
            reaction: [
              { type: "line", text: { ko: "므나헴은 기록장에 *사하시며*와 *고치시며*를 나란히 적고, 그 사이에 작은 점을 찍는다.", en: "In his notes, Menahem writes *forgives* and *heals* side by side, with a small dot between them." } },
              { type: "line", speaker: "hanan", text: { ko: "그렇게 읽으니 새롭네요.", en: "I've never read it that way." } }
            ]
          },
          {
            id: "c",
            lens: 3,
            set: { underline: "sick" },
            text: { ko: "“아픈 사람에게 이 구절은 어떻게 들릴까.”", en: "“I wonder how this line sounds to someone who is sick.”" },
            reaction: [
              { type: "line", text: { ko: "므나헴은 *병*이라는 말을 기록장에 적는다.", en: "Menahem writes the word *diseases* in his notes." } },
              { type: "line", speaker: "hanan", text: { ko: "위로가 되겠죠. 아니면 더 아프거나요.", en: "It might comfort them. Or hurt even more." } }
            ]
          },
          {
            id: "d",
            lens: 2,
            set: { underline: "whole" },
            text: { ko: "“설명하기 전에 시 전체를 읽자.”", en: "“Before I explain, let's read the whole psalm.”" },
            reaction: [
              { type: "line", text: { ko: "므나헴은 아무것도 적지 않고, 두루마리를 시편의 첫 절로 되감는다.", en: "Menahem writes nothing down. He rolls the scroll back to the psalm's first verse." } },
              { type: "line", speaker: "hanan", text: { ko: "처음부터요?", en: "From the very top?" } }
            ]
          }
        ]
      },
      { type: "line", speaker: "hanan", text: { ko: "하나 더 여쭤볼게요. 선지자도 죄를 사할 수 있나요? 나단은 다윗에게 이렇게 말했잖아요.", en: "May I ask one more thing? Can a prophet forgive sins? Nathan told David this:" } },
      { type: "verse", key: "SA2_12_13B" },
      {
        type: "choice",
        id: "c2",
        prompt: { ko: "하난에게 어떻게 답할까?", en: "How to answer Hanan?" },
        options: [
          {
            id: "a",
            lens: 1,
            text: { ko: "“나단은 하나님의 용서를 전했을 뿐이다. 스스로 사하지 않았다.”", en: "“Nathan delivered God's forgiveness. He didn't forgive on his own.”" },
            reaction: [
              { type: "line", speaker: "hanan", text: { ko: "전하는 것과 사하는 것은 다르군요.", en: "So passing it on isn't the same as forgiving." } }
            ]
          },
          {
            id: "b",
            lens: 1,
            text: { ko: "“그 선을 넘어 하나님의 이름을 모독하면 돌로 치라고 했다.”", en: "“Cross that line—blaspheme God's name—and the Law calls for stoning.”" },
            reaction: [
              { type: "line", text: { ko: "하난이 침을 삼킨다.", en: "Hanan swallows." } },
              // Reference kept here, not on the option button (lead note: no bare refs in options).
              { type: "line", speaker: "thought", text: { ko: "무거운 율법이다({{r:LV_24_16A}}). 그러니 더 조심해야 한다.", en: "A heavy law ({{r:LV_24_16A}}). All the more reason to be careful." } }
            ]
          },
          {
            id: "c",
            lens: 2,
            text: { ko: "“다윗은 그 한마디를 듣고 어떤 마음이었을까.”", en: "“I wonder what David felt when he heard those words.”" },
            reaction: [
              { type: "line", speaker: "hanan", text: { ko: "살았다 싶었겠죠. 아니면 울었거나요.", en: "I bet he felt he could breathe again. Or maybe he wept." } }
            ]
          },
          {
            id: "d",
            lens: 3,
            text: { ko: "“속죄는 성전에서 받는데, 못 걷는 사람은 거기까지 어떻게 가지?”", en: "“Atonement happens at the temple. How does a man who can't walk get there?”" },
            reaction: [
              { type: "line", speaker: "hanan", text: { ko: "…그건 생각해 본 적이 없어요.", en: "…I've never thought about that." } }
            ]
          }
        ]
      },

      // ---------------------------------------------------------------
      // MORNING: the neighbor at the door with the rumor (c3)
      // ---------------------------------------------------------------
      // Same background; only the time chip moves on to morning (SPEC 6.2 timeline).
      { type: "scene", bg: "dawn_lamp", caption: { ko: "아침 · 므나헴의 방", en: "Morning · Menahem's room" } },
      { id: "knock", type: "line", speaker: "sign", text: { ko: "― 문 두드리는 소리 ―", en: "— a knock at the door —" } },
      { type: "line", speaker: "neighbor", text: { ko: "서기관님, 들으셨어요? 예수라는 사람이 배 타고 돌아온대요!", en: "Have you heard, sir? That man Jesus is coming back by boat!" } },
      { type: "line", speaker: "neighbor", text: { ko: "바다에서 폭풍이 그 사람 말 한마디에 잠잠해졌대요. 건너편에선 귀신들이 쫓겨났고요.", en: "They say a storm on the sea went still at one word from him. And across the lake, demons were driven out." } },
      { type: "line", speaker: "neighbor", text: { ko: "그런데 그 동네 사람들은 떠나 달라고 빌었대요.", en: "But the people over there begged him to leave." } },
      // The exact words of Matt 8:20 via token, so c8 c ("the Son of Man… nowhere to lay his head") has its setup.
      { type: "line", speaker: "neighbor", text: { ko: "따라가겠다던 서기관한테는 이렇게 말했다더라고요. {{v:MT_8_20Q}}", en: "He told a scribe who offered to follow him: {{v:MT_8_20Q}}" } },
      {
        type: "choice",
        id: "c3",
        prompt: { ko: "소문에 뭐라고 답할까?", en: "How to answer the rumor?" },
        options: [
          {
            id: "a",
            lens: 1,
            text: { ko: "“이적만으로는 알 수 없다. 무엇을 가르치는지 봐야 한다.”", en: "“Signs alone don't settle it. We have to see what he teaches.”" },
            reaction: [
              { type: "line", speaker: "neighbor", text: { ko: "역시 서기관님이세요. 그래도 보러는 가실 거죠?", en: "Spoken like a scribe. But you're still going to go look, right?" } }
            ]
          },
          {
            id: "b",
            lens: 2,
            text: { ko: "“바람과 바다를 말로? 시편은 그 일을 하나님께 돌리는데.”", en: "“Wind and sea, with a word? The psalm credits that to God.”" },
            reaction: [
              { type: "line", speaker: "thought", text: { ko: "{{v:PS_107_29}} 그 일을 사람이 했다고?", en: "{{v:PS_107_29}} And a man did that?" } }
            ]
          },
          {
            id: "c",
            lens: 3,
            text: { ko: "“그 동네는 왜 그를 내보냈을까.”", en: "“Why would that town send him away?”" },
            reaction: [
              { type: "line", speaker: "neighbor", text: { ko: "돼지 떼를 잃었대요. 귀신 들렸던 두 사람이 놓여났는데도요.", en: "They lost a whole herd of pigs, I hear. Even though the two men with demons were set free." } }
            ]
          },
          {
            id: "d",
            lens: 3,
            text: { ko: "“직접 가서 보겠다. 그가 사람들을 어떻게 대하는지.”", en: "“I'll go and see for myself how he treats people.”" },
            reaction: [
              { type: "line", speaker: "hanan", text: { ko: "저도 따라가겠습니다, 선생님.", en: "I'm coming with you, Teacher." } }
            ]
          }
        ]
      },
      { type: "line", text: { ko: "므나헴은 기록장을 챙겨 집을 나선다. 하난이 뒤를 따른다.", en: "Menahem takes his notes and heads out. Hanan follows." } },

      // ---------------------------------------------------------------
      // LATE MORNING: walking down with Hanan, then THE LANE (c4)
      // SPEC 6.3: they step aside, eyes meet, nobody speaks to anybody.
      // ---------------------------------------------------------------
      { id: "lane", type: "scene", bg: "lane", caption: { ko: "늦은 아침 · 골목", en: "Late morning · The lane" } },
      { type: "line", text: { ko: "검은 현무암 집들 사이로, 골목이 바닷가를 향해 내려간다.", en: "Between black basalt houses, the lane slopes down toward the shore." } },
      { type: "line", text: { ko: "골목 끝으로 바다가 보인다. 배 한 척이 물가에 닿는다.", en: "At the bottom of the lane the sea opens up. A boat is coming in to shore." } },
      { type: "verse", key: "MT_9_1" },
      { type: "line", speaker: "hanan", text: { ko: "선생님, 그 사람이 정말 폭풍을 잠잠하게 했을까요?", en: "Teacher, do you think he really calmed a storm?" } },
      { type: "line", speaker: "menahem", text: { ko: "보면 알겠지. 눈으로 보고, 말씀으로 달아 보자.", en: "We'll see. Watch with your eyes, and weigh it by the Word." } },
      { type: "line", text: { ko: "그때 위쪽에서 발소리가 내려온다. 사람들이 침상에 누운 사람을 들고 온다.", en: "Then footsteps come down from above. Some men are carrying a man on a bed." } },
      // Same order as the friend and asher routes: passerby, step aside, glance, eyes meet.
      { type: "line", speaker: "passerby", text: { ko: "고통 뒤에 무슨 사연이 있는지 누가 알겠어. 저 사람은 무슨 잘못을 했기에 저렇게 됐을까.", en: "Who knows what's behind suffering like that. What did he do to end up like that?" } },
      { type: "line", text: { ko: "므나헴과 하난은 벽 쪽으로 비켜선다. 침상이 지나갈 만큼만.", en: "Menahem and Hanan step back against the wall, just enough for the bed to pass." } },
      { type: "line", text: { ko: "므나헴은 침상을 힐끗 본다. 누운 사람은 아셀이다. 잠깐, 두 사람의 눈이 마주친다.", en: "Menahem glances at the bed. The man lying there is Asher. For a moment, their eyes meet." } },
      { type: "line", text: { ko: "누구도 므나헴에게 말을 걸지 않고, 므나헴도 말이 없다.", en: "No one says a word to Menahem, and he says nothing either." } },
      {
        type: "choice",
        id: "c4",
        prompt: { ko: "침상이 곁을 지나간다. 그 짧은 순간에…", en: "The bed goes right past him. In that moment…" },
        options: [
          {
            id: "a",
            lens: 1,
            text: { ko: "저 사람을 고친다면, 오늘 저 선생이 누구인지 드러나겠군.", en: "If he heals that man, we'll know today who this teacher really is." },
            reaction: [
              { type: "line", text: { ko: "그의 눈은 침상 위의 사람을 지나, 길 아래쪽을 향한다.", en: "His eyes pass over the man on the bed and go on down the lane." } }
            ]
          },
          {
            id: "b",
            lens: 2,
            text: { ko: "혹시 죄의 징계일까. 시편의 미련한 자들처럼.", en: "Could it be discipline for sin, like the fools in the psalm?" },
            reaction: [
              { type: "line", speaker: "thought", text: { ko: "시편 한 구절이 떠오른다. {{v:PS_107_17}}", en: "A line from the psalms comes to mind. {{v:PS_107_17}}" } }
            ]
          },
          {
            id: "c",
            lens: 2,
            text: { ko: "병의 이유를 우리가 알 수 있나. 욥의 친구들도 틀렸다.", en: "Can we even know why a man is sick? Job's friends got it wrong." },
            reaction: [
              // Reference moved off the option; anchored to God's rebuke, which is what Job 42:7 says.
              { type: "line", speaker: "thought", text: { ko: "그들은 친구를 위로하러 와서, 친구를 정죄했다. 하나님은 그들을 책망하셨다({{r:JB_42_7}}).", en: "They came to comfort their friend and ended up condemning him. Then God rebuked them ({{r:JB_42_7}})." } }
            ]
          },
          {
            id: "d",
            lens: 3,
            text: { ko: "길을 비켜 주고, 손짓으로 옆 사람들도 비켜서게 한다.", en: "He makes room, and with a wave of his hand gets the people beside him to step back too." },
            reaction: [
              { type: "line", text: { ko: "좁은 골목에, 침상이 지나갈 자리가 조금 넓어진다.", en: "In the narrow lane, there's a little more room for the bed." } }
            ]
          }
        ]
      },
      // Callback: c2 d asked how a man who cannot walk reaches the temple.
      { when: { choice: "c2", is: "d" }, type: "line", speaker: "thought", text: { ko: "못 걷는 사람이 성전까지 어떻게 가느냐고 아침에 물었지. 저렇게, 남의 손에 들려서 가는구나.", en: "This morning I asked how a man who can't walk gets to the temple. Like that: carried by other people's hands." } },
      { type: "line", text: { ko: "침상은 골목 아래 무리 속으로 사라진다. 두 사람도 그 뒤를 따라 내려간다.", en: "The bed disappears into the crowd below. The two of them follow it down." } },

      // ---------------------------------------------------------------
      // AROUND NOON: THE CROWD, fixed sequence of SPEC 6.4 (c5, c6)
      // Menahem says nothing aloud from here until he leaves.
      // ---------------------------------------------------------------
      { id: "crowd", type: "scene", bg: "crowd", caption: { ko: "정오 무렵 · 바닷가 공터", en: "Around noon · Open ground by the shore" } },
      { type: "fx", fx: "light", level: "soft" },
      { type: "line", text: { ko: "바닷가 공터가 사람들로 가득하다. 므나헴은 서기관 몇 사람과 함께 앞쪽에 선다.", en: "The open ground by the shore is packed. Menahem stands near the front with a few other scribes." } },
      { type: "line", text: { ko: "무리 한가운데에 예수라는 사람이 있다.", en: "At the center of the crowd is this Jesus." } },
      { type: "line", text: { ko: "골목에서 본 그 침상이 무리 사이를 지나온다. 사람들이 침상을 그 앞에 내려놓는다.", en: "The bed from the lane comes through the crowd. The men set it down in front of him." } },
      { type: "verse", key: "MT_9_2A" },

      // The first words: the world goes quiet, the light rises, the morning's psalm returns.
      { id: "first-words", type: "fx", fx: "light", level: "bright" },

          line("아셀은 ‘걸었다’로 이야기를 시작하지 않는다.", "Asher doesn't start the story with “I walked.”"),
          line("누워 있던 자기에게, 그분이 먼저 말을 거신 순간부터 시작한다.", "He starts from the moment Jesus spoke to him first, while he was still lying on his bed."),
          // The c3 memory returns; variant when he resolved this morning to speak first.
          when(
            { not: { choice: "c3", is: "d" } },
            thought("그날 동생에게 한 말이 떠오른다. 내일은 동생에게 먼저 말을 걸어야겠다.", "I think of what I said to my brother that day. Tomorrow, I'll talk to him first.")
          ),
          when(
            { choice: "c3", is: "d" },
            thought("아침의 다짐은 내일까지 미룰 필요가 없다. 동생이 문 앞에 있다.", "No need to put off this morning's promise until tomorrow. My brother is right there by the door.")
          )
        ],
        last: t("왜 병들었는지는 모른다. 오늘 그분이 나에게 하신 말씀은 안다.", "I don't know why I got sick. I do know what he said to me today.")
      },

      // Lens 3: where to? Home, people, a life starting again.
      "3": {
        beats: [
          line("아침에 누워서 듣던 그 소리를, 지금은 서서 듣는다.", "The sound he heard lying down this morning, he now hears standing up."),
          line("아셀은 자기를 싣고 다니던 침상을 들고 문을 넘는다.", "Asher carries the bed that used to carry him, and steps through the door."),
          // The c2 sound returns as tomorrow's first plan.
          when({ flag: "sound", is: "water" }, thought("내일 아침엔, 내가 물을 길어 와야지.", "Tomorrow morning, I'll be the one bringing the water.")),
          when(
            { flag: "sound", is: "prayer" },
            thought("내일 아침엔, 문 앞에 서서 할아버지 기도를 따라 해야지.", "Tomorrow morning, I'll stand in the doorway and pray along with the old man.")
          ),
          when(
            { flag: "sound", is: "brother" },
            thought("내일 아침엔, 동생이랑 문 앞에서 같이 놀아야지. 숫자도 고쳐 주고.", "Tomorrow morning, I'll play with my brother by the door. And fix his counting.")
          ),
          when({ flag: "sound", is: "whisper" }, thought("내일 아침엔, 우물까지 내 발로 걸어가 봐야지.", "Tomorrow morning, I'll walk to the well on my own.")),
          when({ choice: "c4", is: "d" }, line("갈색 겉옷은 문 옆에 걸어 둔다. 내일 입고 나갈 것이다.", "He hangs the brown cloak by the door. He'll wear it out tomorrow."))
        ],
        last: t("너를 들고 다니던 침상을, 이제 네가 들고 문을 연다.", "Now you carry the bed that used to carry you, and you open the door.")
      }
    },

    // Shared record line after any ending.
    endingCoda: [
      sign(
        "일어나기 시도 {{var:getup_count}}번 · 걸린 문장 1개",
        "Attempts to get up: {{var:getup_count}} · Sentences it took: 1"
      )
    ]
  };
})();
