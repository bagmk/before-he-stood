<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1d1a">
<meta name="color-scheme" content="dark">
<meta name="description" content="마태복음 9:1–8을 세 인물의 눈으로 보는 한영 비주얼노벨 · A bilingual visual novel on Matthew 9:1–8">
<title>그가 일어나기 전 · Before He Stood</title>
<style>
/*
 * css/style.css - one committed look for "Before He Stood".
 * Scene art fills the stage; story text sits on an opaque papyrus panel in iron-gall ink.
 * Palette from Capernaum: black basalt, limestone, Galilee blue, olive, lamp amber.
 * Jesus' presence is warm white light only (never a figure), and it never covers text.
 *
 * Two first-class displays (SPEC 5.6):
 *   - phone portrait (default rules below, px-based sizes);
 *   - TV / laptop landscape (the "TV" media query near the end swaps the size tokens to vh units:
 *     story text >= 3.6vh, names/options >= 3vh, nothing below 2.2vh).
 */

:root {
  color-scheme: dark;

  /* Place */
  --basalt: #1f1d1a;
  --basalt-2: #2b2824;
  --basalt-3: #3a3631;
  --limestone: #ebe3cf;
  --limestone-dim: #b8ae98;
  --galilee: #2c6a86;
  --galilee-hi: #4b93b4;
  --olive: #5f6d33;
  --amber: #c98a1f;
  --amber-soft: #e3b25c;

  /* Papyrus panel and ink */
  --papyrus-hi: #f6efdc;
  --papyrus: #ede2c5;
  --papyrus-lo: #dfd0ac;
  --vellum: #fbf7ec;
  --ink: #261d15;
  --ink-soft: #54463a;
  --ink-faint: #7a6a55;
  --rule: rgba(42, 33, 25, 0.22);

  /* Presence */
  --light: #fff3d3;
  --light-core: #fffaf0;
  --light-glow: rgba(255, 232, 172, 0.55);

  /* Interaction */
  --focus: #2f7fa6;
  --focus-light: #fff3d3;

  /* Type families */
  --serif: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", "Batang", "Noto Serif KR", "Noto Serif CJK KR", "Source Han Serif K", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --text-scale: 1;

  /* Size tokens (phone portrait). The TV query below redefines them in vh. */
  --fs-story: 17px;
  --fs-story-en: 15.3px;
  --fs-verse: 18.5px;
  --fs-verse-en: 16.2px;
  --fs-name: 13.5px;
  --fs-prompt: 16px;
  --fs-prompt-en: 14px;
  --fs-option: 16px;
  --fs-option-en: 14px;
  --fs-small: 12.5px;
  --fs-small-en: 11.5px;
  --fs-ui: 16px;
  --fs-ui-en: 12.8px;
  --fs-reply: 14.5px;
  --fs-pin: 15px;
  --fs-echo: 18px;
  --fs-last: 24px;
  --fs-card-num: 54px;
  --fs-card-lens: 15px;
  --fs-card-title: 30px;
  --fs-action: 14.5px;
  --fs-press: 17px;

  --lh-story: 1.72;
  --panel-w: 100%;
  --panel-min-h: 132px;
  --panel-pad: 20px 18px 24px;
  --panel-radius: 6px;
  --dock-gap: 10px;
  --badge: 26px;
  --hdr-btn: 44px;
  --fs-hdr: 13px;
  --focus-w: 3px;

  /* Layout */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --header-h: 60px;
  --ease-out: cubic-bezier(0.2, 0.7, 0.1, 1);
  --fade: 450ms;

  --paper-grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.36  0 0 0 0 0.27  0 0 0 0 0.15  0 0 0 0.10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ------------------------------------------------------------------ base */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  background: var(--basalt);
  background-image: radial-gradient(120% 80% at 50% 0%, #2a2723 0%, var(--basalt) 60%);
  color: var(--limestone);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}

button,
input {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
  touch-action: manipulation;
}

[hidden] {
  display: none !important;
}

:focus {
  outline: none;
}

:focus-visible {
  outline: var(--focus-w) solid var(--focus);
  outline-offset: 2px;
}

/* The second language of a bilingual pair always sits on its own line. */
span.en {
  display: block;
}

/* Hide the pointer while a class watches the TV (set by main.js after 3 s without movement). */
body.is-idle,
body.is-idle * {
  cursor: none !important;
}

/* ------------------------------------------------------------------ app frame */

.app {
  position: relative;
  height: 100%;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  overflow: hidden;
  isolation: isolate;
  background: var(--basalt);
}

/* ------------------------------------------------------------------ stage */

.stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--basalt);
}

.art {
  position: absolute;
  inset: -5%;
  transform-origin: 50% 60%;
  transition: transform 2.4s var(--ease-out), filter 0.8s ease;
}

.art__sway {
  position: absolute;
  inset: 0;
}

.art__layer {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity var(--fade) ease;
}

.art__layer.is-on {
  opacity: 1;
}

.art__layer svg {
  display: block;
  width: 100%;
  height: 100%;
}

.art__fallback {
  position: absolute;
  inset: 0;
}

/* POV: lying feels tilted and close; standing levels the world. */
.stage[data-pov="lying"] .art {
  transform: rotate(-2deg) scale(1.07) translateY(1.5%);
}

.stage[data-pov="lying"] .art__sway {
  animation: sway 11s ease-in-out infinite;
}

.stage.is-rising .art {
  animation: rise 2.6s var(--ease-out) both;
}

@keyframes sway {
  0%,
  100% {
    transform: rotate(0deg) translateY(0);
  }
  50% {
    transform: rotate(0.6deg) translateY(-0.6%);
  }
}

@keyframes rise {
  0% {
    transform: rotate(-2deg) scale(1.12) translateY(9%);
  }
  100% {
    transform: none;
  }
}

/* Veil: a constant vignette for legibility; the hush deepens it (the light stays above it). */
.veil {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(14, 13, 11, 0.42) 0%, rgba(14, 13, 11, 0) 18%, rgba(14, 13, 11, 0) 52%, rgba(14, 13, 11, 0.5) 100%),
    radial-gradient(140% 100% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(8, 7, 6, 0.45) 100%);
  transition: background-color 0.9s ease;
}

body.is-hush .veil {
  background-color: rgba(8, 7, 6, 0.5);
}

body.is-hush .art {
  filter: saturate(0.3) brightness(0.72);
}

body.is-hush .topbar,
body.is-hush .caption {
  opacity: 0.25;
}

body[data-screen="title"] .veil,
body[data-screen="routeSelect"] .veil {
  background-color: rgba(10, 9, 8, 0.25);
}

body[data-screen="endingCard"] .veil,
body.is-last .veil {
  background-color: rgba(10, 9, 8, 0.6);
}

/* The light of Jesus' presence: a warm bloom inside the stage, never a figure, never over text. */
.light {
  position: absolute;
  inset: -10%;
  pointer-events: none;
  opacity: 0;
  mix-blend-mode: screen;
  transition: opacity 1.8s ease, transform 2.2s var(--ease-out);
  /* main.js/ui.js anchor the bloom to BHS.art.lightAt for the drawn scene via --light-x/--light-y. */
  background: radial-gradient(48% 36% at var(--light-x, 50%) var(--light-y, 38%), rgba(255, 251, 238, 0.95) 0%, rgba(255, 239, 200, 0.62) 28%, rgba(255, 224, 160, 0.22) 55%, rgba(255, 224, 160, 0) 78%);
}

.light::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 238, 200, 0.2);
  opacity: 0;
  transition: opacity 1.8s ease;
}

.stage[data-pov="lying"] .light {
  --light-y: 16%;
}

.light[data-level="soft"] {
  opacity: 0.6;
}

.light[data-level="bright"] {
  opacity: 1;
  transform: scale(1.18);
  animation: breathe 7s ease-in-out infinite;
}

.light[data-level="bright"]::after {
  opacity: 1;
}

@keyframes breathe {
  0%,
  100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.08);
  }
}

/* ------------------------------------------------------------------ portraits
   Busts stand on the top edge of the text panel (main.js measures it into --panel-top) and sink a
   little behind it. They sit under captions, overlays and the whole play layer, so they never
   cover text or choices. Slots 0/1 are the left and right thirds, clear of the central light. */

.cast {
  position: absolute;
  inset: 0;
  z-index: 15;
  pointer-events: none;
  overflow: hidden;
  transition: opacity 0.2s ease;
  --cast-h: 26vh;
  --cast-x: 1.5vw;
  --cast-sink: 9vh;
}

.cast.is-away {
  opacity: 0;
}

.figure {
  position: absolute;
  bottom: calc(var(--panel-top, 30vh) - var(--cast-sink));
  height: var(--cast-h);
  aspect-ratio: 2 / 3;
  transition: opacity 0.22s ease, transform 0.22s ease, filter 0.22s ease;
}

.figure svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0.6vh 1.2vh rgba(0, 0, 0, 0.45));
  /* The bust's cut edge fades out instead of ending in a hard line beside the panel. */
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 80%, transparent 100%);
  mask-image: linear-gradient(180deg, #000 0%, #000 80%, transparent 100%);
}

.figure.is-mirror svg {
  transform: scaleX(-1);
}

.figure[data-slot="0"] {
  left: var(--cast-x);
}

.figure[data-slot="1"] {
  right: var(--cast-x);
}

.figure.is-dim {
  filter: brightness(0.55) saturate(0.85);
}

.figure.is-in {
  animation: figure-in 0.22s ease-out both;
}

.figure[data-slot="1"].is-in {
  animation-name: figure-in-right;
}

.figure.is-out {
  opacity: 0;
  transform: translateY(1.5vh);
}

@keyframes figure-in {
  from {
    opacity: 0;
    transform: translateX(-2vh);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes figure-in-right {
  from {
    opacity: 0;
    transform: translateX(2vh);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ------------------------------------------------------------------ top bar */

.topbar {
  position: absolute;
  z-index: 50;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(var(--safe-top) + 8px) var(--gutter-r) 8px var(--gutter-l);
  pointer-events: none;
  transition: opacity 0.6s ease;
}

.topbar > * {
  pointer-events: auto;
}

.topbar__spacer {
  flex: 1;
  pointer-events: none;
}

.iconbtn {
  display: inline-grid;
  place-items: center;
  width: var(--hdr-btn);
  height: var(--hdr-btn);
  border-radius: 50%;
  color: var(--limestone);
  background: rgba(24, 22, 19, 0.6);
  border: 1px solid rgba(235, 227, 207, 0.16);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.iconbtn svg {
  width: 45%;
  height: 45%;
}

.seg {
  display: inline-flex;
  border-radius: 999px;
  background: rgba(24, 22, 19, 0.6);
  border: 1px solid rgba(235, 227, 207, 0.16);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.seg__btn {
  position: relative;
  min-width: calc(var(--hdr-btn) + 2px);
  height: var(--hdr-btn);
  padding: 0 0.8em;
  border-radius: 999px;
  font: 600 var(--fs-hdr) / 1 var(--sans);
  color: var(--limestone-dim);
  z-index: 0;
}

.seg__btn::before {
  content: "";
  position: absolute;
  inset: 11% 6%;
  border-radius: 999px;
  z-index: -1;
  transition: background-color 0.2s ease;
}

.seg__btn[aria-pressed="true"] {
  color: var(--ink);
}

.seg__btn[aria-pressed="true"]::before {
  background: var(--limestone);
}

/* ------------------------------------------------------------------ caption chip */

.caption {
  position: absolute;
  z-index: 20;
  top: calc(var(--safe-top) + var(--header-h) + 4px);
  left: var(--gutter-l);
  max-width: calc(100% - var(--gutter-l) - var(--gutter-r));
  padding: 0.45em 0.85em 0.5em;
  border-radius: 6px;
  background: rgba(22, 20, 17, 0.72);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  color: var(--limestone);
  font: 500 var(--fs-small) / 1.35 var(--sans);
  letter-spacing: 0.01em;
  pointer-events: none;
  animation: fade-in 0.6s ease both;
  transition: opacity 0.6s ease;
}

.caption .en {
  color: var(--limestone-dim);
  font-size: var(--fs-small-en);
}

/* ------------------------------------------------------------------ echo verse overlay */

.echo {
  position: absolute;
  z-index: 16;
  left: var(--gutter-l);
  right: var(--gutter-r);
  top: calc(var(--safe-top) + var(--header-h) + 48px);
  padding: 1em 1.1em 0.8em;
  border-radius: 8px;
  background: rgba(18, 16, 14, 0.74);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  color: var(--limestone);
  text-align: center;
  font: 400 calc(var(--fs-echo) * var(--text-scale)) / 1.7 var(--serif);
  pointer-events: none;
  animation: echo-in 1.1s ease both;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.echo .en {
  margin-top: 0.3em;
  font-size: 0.86em;
  color: var(--limestone-dim);
}

.echo__ref {
  display: block;
  margin-top: 0.5em;
  font: 500 var(--fs-small) / 1.2 var(--sans);
  color: var(--limestone-dim);
}

.echo mark {
  color: var(--light-core);
  background: linear-gradient(180deg, transparent 58%, rgba(227, 178, 92, 0.75) 58%) no-repeat 0 0 / 0% 100%;
  animation: bleed 1.4s 0.5s ease-out forwards;
  padding: 0 1px;
}

@keyframes echo-in {
  from {
    opacity: 0;
    filter: blur(6px);
  }
  to {
    opacity: 1;
    filter: blur(0);
  }
}

@keyframes bleed {
  to {
    background-size: 100% 100%;
  }
}

/* ------------------------------------------------------------------ pinned thought bubble */

.pin {
  position: absolute;
  z-index: 18;
  top: calc(var(--safe-top) + var(--header-h) + 68px);
  right: var(--gutter-r);
  width: min(78%, 330px);
  padding: 0.8em 1.05em 0.85em;
  border-radius: 1.3em;
  background: rgba(251, 247, 236, 0.96);
  color: var(--ink);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  font: italic 400 calc(var(--fs-pin) * var(--text-scale)) / 1.55 var(--serif);
  pointer-events: none;
  animation: pop-in 0.45s var(--ease-out) both;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.pin::before,
.pin::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: rgba(251, 247, 236, 0.96);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

.pin::before {
  width: 0.95em;
  height: 0.95em;
  left: 1.7em;
  bottom: -1.2em;
}

.pin::after {
  width: 0.55em;
  height: 0.55em;
  left: 1.05em;
  bottom: -2em;
}

.pin__item + .pin__item {
  margin-top: 0.5em;
  padding-top: 0.5em;
  border-top: 1px dashed var(--rule);
}

.pin__item .en {
  font-size: 0.88em;
  color: var(--ink-soft);
}

.pin__ref {
  display: block;
  font: normal 500 var(--fs-small-en) / 1.3 var(--sans);
  color: var(--ink-faint);
}

.receipt {
  position: absolute;
  right: 0.8em;
  bottom: -1.9em;
  padding: 0.2em 0.65em 0.25em;
  border-radius: 999px;
  background: rgba(18, 16, 14, 0.8);
  color: #a8d8ee;
  font: normal 600 var(--fs-small) / 1.2 var(--sans);
  letter-spacing: 0.02em;
  animation: stamp 0.5s var(--ease-out) both;
}

@keyframes stamp {
  0% {
    opacity: 0;
    transform: scale(1.6) rotate(-6deg);
  }
  60% {
    opacity: 1;
    transform: scale(0.95) rotate(1deg);
  }
  100% {
    opacity: 1;
    transform: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: translateY(6px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* ------------------------------------------------------------------ play layer */

.play {
  position: absolute;
  inset: 0;
  z-index: 30;
}

.advance {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  cursor: pointer;
}

.advance:focus-visible {
  outline-offset: -8px;
}

.dock {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  margin: 0 auto;
  width: 100%;
  max-width: calc(var(--panel-w) + var(--gutter-l) + var(--gutter-r));
  padding: 0 var(--gutter-r) calc(var(--safe-bottom) + 14px) var(--gutter-l);
  display: flex;
  flex-direction: column;
  gap: var(--dock-gap);
  pointer-events: none;
  max-height: calc(100% - var(--safe-top) - var(--header-h) - 8px);
}

.dock > * {
  pointer-events: auto;
  flex-shrink: 0;
}

.dock > .panel,
.dock > .reply {
  pointer-events: none;
}

.dock > .choices {
  flex: 0 1 auto;
  min-height: 0;
}

/* ------------------------------------------------------------------ text panel */

.panel {
  position: relative;
  min-height: var(--panel-min-h);
  padding: var(--panel-pad);
  border-radius: var(--panel-radius);
  color: var(--ink);
  background-color: var(--papyrus);
  background-image: var(--paper-grain), radial-gradient(130% 120% at 30% 0%, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0) 60%), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus) 45%, var(--papyrus-lo));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -2px 0 rgba(120, 90, 50, 0.12), 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
  animation: panel-in 0.35s ease both;
  transition: box-shadow 0.8s ease, background-color 0.8s ease;
}

/* A darker rolled edge along the top, like the lip of a scroll. */
.panel::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 6px;
  border-radius: var(--panel-radius) var(--panel-radius) 0 0;
  background: linear-gradient(180deg, rgba(110, 80, 44, 0.3), rgba(110, 80, 44, 0));
  pointer-events: none;
}

@keyframes panel-in {
  from {
    opacity: 0.4;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.plate {
  position: absolute;
  left: 0.9em;
  top: 0;
  transform: translateY(-58%);
  max-width: calc(100% - 1.8em);
  padding: 0.35em 0.9em 0.42em;
  border-radius: 0.3em;
  background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), var(--plate, var(--basalt-3));
  color: #fbf5e6;
  font: 600 var(--fs-name) / 1.25 var(--sans);
  letter-spacing: 0.01em;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.plate__en {
  font-weight: 500;
  opacity: 0.9;
}

.plate__en--stack::before {
  content: " \00B7  ";
}

.plate--jesus {
  background: var(--light);
  color: #6f4b0c;
  box-shadow: 0 0 0 1px rgba(201, 138, 31, 0.35), 0 0 22px rgba(255, 236, 190, 0.95);
}

.text {
  font-family: var(--serif);
  font-size: calc(var(--fs-story) * var(--text-scale));
  line-height: var(--lh-story);
  word-break: keep-all;
  overflow-wrap: anywhere;
  min-height: 1.5em;
}

.text p {
  margin: 0;
}

.text .en {
  margin-top: 0.35em;
  font-size: calc(var(--fs-story-en) * var(--text-scale));
  line-height: 1.5;
  color: var(--ink-soft);
}

.text em {
  font-style: normal;
  font-weight: 700;
}

.text .q {
  color: #44300f;
}

.c {
  opacity: 0;
}

.c.on {
  opacity: 1;
}

.more {
  position: absolute;
  right: 1em;
  bottom: 0.6em;
  width: 0;
  height: 0;
  border-left: 0.4em solid transparent;
  border-right: 0.4em solid transparent;
  border-top: 0.55em solid var(--ink-soft);
  font-size: var(--fs-story);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.panel.is-ready .more {
  opacity: 0.75;
  animation: nudge 1.4s ease-in-out infinite;
}

@keyframes nudge {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(3px);
  }
}

/* Inner voice: italic, no name plate. */
.panel--thought .text {
  font-style: italic;
  color: #382c20;
}

/* Scripture card. */
.panel--verse {
  background-color: var(--vellum);
  background-image: var(--paper-grain), linear-gradient(180deg, #fdfaf1, #f4ecd9);
  box-shadow: inset 0 0 0 5px var(--vellum), inset 0 0 0 6px rgba(138, 98, 42, 0.32), 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
}

.panel--verse::before {
  display: none;
}

.panel--verse .text {
  font-size: calc(var(--fs-verse) * var(--text-scale));
  color: #241a10;
}

.panel--verse .text .en {
  font-size: calc(var(--fs-verse-en) * var(--text-scale));
}

.panel--jesus {
  box-shadow: inset 0 0 0 5px var(--light-core), inset 0 0 0 6px rgba(201, 138, 31, 0.5), 0 0 0 1px rgba(255, 240, 205, 0.85), 0 0 48px 12px var(--light-glow), 0 12px 32px rgba(0, 0, 0, 0.32);
}

.ref {
  margin-top: 0.6em;
  text-align: right;
  font: 500 var(--fs-small) / 1.3 var(--sans);
  letter-spacing: 0.02em;
  color: var(--ink-faint);
}

/* Sign lines (story captions, sound cues, time skips): centered on the stage at body size. */
.play--sign .dock {
  top: calc(var(--safe-top) + var(--header-h));
  justify-content: center;
}

.play--sign .panel {
  align-self: center;
  min-height: 0;
  max-width: 100%;
  padding: 0.8em 1.4em;
  border-radius: 10px;
  background: rgba(14, 13, 11, 0.72);
  background-image: none;
  box-shadow: none;
  color: var(--limestone);
  text-align: center;
}

.play--sign .panel::before,
.play--sign .more {
  display: none;
}

.play--sign .text {
  letter-spacing: 0.01em;
}

.play--sign .text .en {
  color: var(--limestone-dim);
}

/* The last line of an ending: large, centered, lit. */
.play--last .dock {
  top: calc(var(--safe-top) + var(--header-h));
  justify-content: center;
}

.play--last .panel {
  background: none;
  box-shadow: none;
  min-height: 0;
  padding: 8px 6px;
  text-align: center;
  color: var(--light-core);
  animation: last-in 1.6s ease both;
}

.play--last .panel::before,
.play--last .more {
  display: none;
}

.play--last .text {
  font-size: calc(var(--fs-last) * var(--text-scale));
  line-height: 1.55;
  text-shadow: 0 2px 22px rgba(0, 0, 0, 0.85);
}

.play--last .text .en {
  margin-top: 0.6em;
  font-size: calc(var(--fs-last) * 0.74 * var(--text-scale));
  color: var(--limestone);
}

@keyframes last-in {
  from {
    opacity: 0;
    letter-spacing: 0.06em;
  }
  to {
    opacity: 1;
    letter-spacing: 0;
  }
}

/* ------------------------------------------------------------------ transient action reply */

.reply {
  align-self: flex-start;
  max-width: 92%;
  padding: 0.45em 0.8em 0.5em;
  border-radius: 8px;
  background: rgba(18, 16, 14, 0.82);
  color: var(--limestone);
  font: italic 400 calc(var(--fs-reply) * var(--text-scale)) / 1.45 var(--serif);
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.reply:empty {
  display: none;
}

.reply.is-on {
  opacity: 1;
  transform: none;
}

.reply .en {
  font-size: 0.9em;
  color: var(--limestone-dim);
}

/* ------------------------------------------------------------------ choices */

.choices {
  padding: 16px 14px 14px;
  border-radius: var(--panel-radius);
  color: var(--ink);
  background-color: var(--papyrus);
  background-image: var(--paper-grain), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus) 50%, var(--papyrus-lo));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
  overflow-y: auto;
  overscroll-behavior: contain;
  animation: panel-in 0.35s ease both;
}

.choices__prompt {
  margin: 0 2px 0.75em;
  font: 700 calc(var(--fs-prompt) * var(--text-scale)) / 1.45 var(--serif);
  word-break: keep-all;
}

.choices__prompt .en {
  font-weight: 400;
  font-size: calc(var(--fs-prompt-en) * var(--text-scale));
  color: var(--ink-soft);
}

.choices__list {
  display: grid;
  gap: 9px;
}

.opt {
  display: grid;
  grid-template-columns: var(--badge) minmax(0, 1fr);
  align-items: start;
  gap: 0.7em;
  width: 100%;
  min-height: 52px;
  padding: 12px 14px 13px 12px;
  border-radius: 8px;
  border: 1px solid rgba(42, 33, 25, 0.26);
  background: rgba(255, 252, 244, 0.78);
  color: var(--ink);
  text-align: left;
  font: 400 calc(var(--fs-option) * var(--text-scale)) / 1.45 var(--serif);
  word-break: keep-all;
  overflow-wrap: anywhere;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 1px 2px rgba(42, 33, 25, 0.08);
  transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  animation: opt-in 0.4s ease both;
}

.opt:nth-child(2) {
  animation-delay: 0.05s;
}

.opt:nth-child(3) {
  animation-delay: 0.1s;
}

.opt:nth-child(4) {
  animation-delay: 0.15s;
}

@keyframes opt-in {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.opt:hover {
  background: #fffaf0;
  border-color: rgba(42, 33, 25, 0.5);
}

.opt:active {
  transform: translateY(1px);
  background: #f3e9d2;
}

.opt__num {
  display: grid;
  place-items: center;
  width: var(--badge);
  height: var(--badge);
  margin-top: 0.1em;
  border-radius: 50%;
  background: var(--basalt-2);
  color: var(--limestone);
  font: 600 calc(var(--badge) * 0.52) / 1 var(--sans);
}

.opt__body {
  min-width: 0;
}

.opt .en {
  margin-top: 0.2em;
  font-size: calc(var(--fs-option-en) * var(--text-scale));
  color: var(--ink-soft);
}

.opt em {
  font-style: normal;
  font-weight: 700;
}

/* ------------------------------------------------------------------ press + persistent actions */

.pressbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding-bottom: 6px;
}

.pressbox__hint {
  margin: 0;
  padding: 0.35em 0.9em;
  border-radius: 999px;
  background: rgba(14, 13, 11, 0.7);
  color: var(--limestone);
  font: 500 var(--fs-small) / 1.4 var(--sans);
  text-align: center;
}

.glow {
  min-width: 13em;
  min-height: 56px;
  padding: 0.7em 1.8em;
  border-radius: 999px;
  background: radial-gradient(120% 140% at 50% 0%, var(--light-core), var(--light) 60%, #f6dfa6);
  color: #4d340a;
  font: 700 calc(var(--fs-press) * var(--text-scale)) / 1.3 var(--serif);
  box-shadow: 0 0 0 1px rgba(201, 138, 31, 0.55), 0 0 26px 6px rgba(255, 230, 165, 0.65), 0 6px 18px rgba(0, 0, 0, 0.35);
  animation: glow-pulse 2.4s ease-in-out infinite;
}

.glow .en {
  font: 500 0.78em/1.3 var(--sans);
  color: #6e501d;
}

@keyframes glow-pulse {
  0%,
  100% {
    box-shadow: 0 0 0 1px rgba(201, 138, 31, 0.55), 0 0 22px 4px rgba(255, 230, 165, 0.55), 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  50% {
    box-shadow: 0 0 0 1px rgba(201, 138, 31, 0.7), 0 0 38px 12px rgba(255, 234, 175, 0.85), 0 6px 18px rgba(0, 0, 0, 0.35);
  }
}

.actions {
  display: flex;
  gap: 10px;
}

.act {
  flex: 1;
  min-height: 48px;
  padding: 0.5em 0.8em;
  border-radius: 10px;
  background: rgba(60, 57, 52, 0.85);
  border: 1px solid rgba(235, 227, 207, 0.14);
  color: #c4beb3;
  font: 600 var(--fs-action) / 1.25 var(--sans);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: transform 0.1s ease, background-color 0.2s ease;
}

.act:active {
  transform: translateY(1px) scale(0.99);
  background: rgba(70, 66, 60, 0.9);
}

.act .en {
  font-weight: 500;
  font-size: 0.85em;
  color: #a39d92;
}

.act.is-shake {
  animation: refuse 0.36s ease;
}

@keyframes refuse {
  0%,
  100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-4px);
  }
  50% {
    transform: translateX(3px);
  }
  75% {
    transform: translateX(-2px);
  }
}

.act.glow {
  min-width: 0;
  border: 0;
  color: #4d340a;
  font-size: var(--fs-press);
  background: radial-gradient(120% 140% at 50% 0%, var(--light-core), var(--light) 60%, #f6dfa6);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.act.glow .en {
  color: #6e501d;
}

/* ------------------------------------------------------------------ ending title card */

.card {
  position: absolute;
  inset: calc(var(--safe-top) + var(--header-h)) var(--gutter-r) calc(var(--safe-bottom) + 40px) var(--gutter-l);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  pointer-events: none;
  color: var(--limestone);
  animation: fade-in 1.2s ease both;
}

.card__num {
  display: block;
  font: 400 var(--fs-card-num) / 1 var(--serif);
  color: var(--light);
  margin-bottom: 0.25em;
  text-shadow: 0 0 30px rgba(255, 232, 172, 0.6);
}

.card__lens {
  margin: 0;
  font: 500 var(--fs-card-lens) / 1.4 var(--sans);
  color: var(--amber-soft);
  letter-spacing: 0.03em;
}

.card__title {
  margin: 0.3em 0 0;
  font: 700 calc(var(--fs-card-title) * var(--text-scale)) / 1.3 var(--serif);
  color: var(--light-core);
  word-break: keep-all;
}

.card__title .en {
  margin-top: 0.25em;
  font-weight: 400;
  font-size: 0.6em;
  color: var(--limestone);
}

.card__hint {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  margin: 0;
  font: 500 var(--fs-small) / 1.4 var(--sans);
  color: var(--limestone-dim);
  animation: fade-in 1s 1.4s ease both;
}

/* A cut ending (the route stopped midway): the same card, quieter. No glowing numeral; the mark is
   an ellipsis in limestone and the label is muted, so it never reads as a failure or a fourth lens. */
.card--cut .card__num {
  color: var(--limestone-dim);
  text-shadow: none;
  letter-spacing: 0.12em;
}

.card--cut .card__lens {
  color: var(--limestone);
}

/* ------------------------------------------------------------------ page screens */

.screen {
  position: absolute;
  inset: 0;
  z-index: 35;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.screen:empty {
  display: none;
}

.page {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding: calc(var(--safe-top) + 28px) var(--gutter-r) calc(var(--safe-bottom) + 28px) var(--gutter-l);
}

.btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 52px;
  padding: 0.6em 1.1em;
  border-radius: 10px;
  font: 600 var(--fs-ui) / 1.3 var(--sans);
  text-align: center;
  transition: background-color 0.15s ease, transform 0.1s ease;
}

.btn:active {
  transform: translateY(1px);
}

.btn .en {
  font-weight: 500;
  font-size: var(--fs-ui-en);
  opacity: 0.85;
}

.btn--primary {
  background: var(--limestone);
  color: var(--ink);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
}

.btn--primary:hover {
  background: #f4eedd;
}

.btn--ghost {
  border: 1px solid rgba(235, 227, 207, 0.45);
  color: var(--limestone);
  background: rgba(20, 18, 16, 0.4);
}

.btn--ghost:hover {
  background: rgba(20, 18, 16, 0.6);
}

.btn--text {
  min-height: 44px;
  color: var(--limestone);
  text-decoration: underline;
  text-decoration-color: rgba(235, 227, 207, 0.4);
  text-underline-offset: 4px;
}

.btn__sub {
  display: block;
  margin-top: 2px;
  font: 500 var(--fs-small) / 1.3 var(--sans);
  opacity: 0.75;
}

/* Title */

.title-page {
  justify-content: flex-end;
  gap: 22px;
  background: linear-gradient(180deg, rgba(16, 15, 13, 0) 0%, rgba(16, 15, 13, 0.25) 30%, rgba(16, 15, 13, 0.82) 62%, rgba(16, 15, 13, 0.94) 100%);
}

.title-head {
  margin-top: auto;
  padding-top: 16vh;
}

.title-side {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.title-sub {
  margin: 0 0 14px;
  font: 500 13px/1.5 var(--sans);
  color: var(--limestone);
  opacity: 0.92;
}

.title-sub .en {
  color: var(--limestone-dim);
  font-size: 12px;
}

.title-main {
  margin: 0;
  font: 700 clamp(46px, 14vw, 64px) / 1.06 var(--serif);
  letter-spacing: -0.015em;
  color: var(--light-core);
  text-shadow: 0 2px 30px rgba(0, 0, 0, 0.5);
  word-break: keep-all;
}

.title-main__line {
  display: block;
}

.title-main__line + .title-main__line {
  padding-left: 0.9em;
}

.title-en {
  margin: 0.45em 0 0;
  font: italic 400 clamp(20px, 6vw, 26px) / 1.2 var(--serif);
  color: var(--limestone);
  letter-spacing: 0.01em;
}

.title-disclaimer {
  margin: 0;
  font: 400 13px/1.6 var(--sans);
  color: var(--limestone-dim);
  word-break: keep-all;
}

.title-disclaimer .en {
  margin-top: 2px;
  font-size: 12px;
}

.langpick__label {
  margin: 0 0 8px;
  font: 500 13px/1.4 var(--sans);
  color: var(--limestone-dim);
}

.langpick__row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.langbtn {
  min-height: 52px;
  padding: 6px 8px;
  border-radius: 10px;
  border: 1px solid rgba(235, 227, 207, 0.3);
  background: rgba(20, 18, 16, 0.5);
  color: var(--limestone);
  font: 600 15px/1.25 var(--sans);
}

.langbtn .en {
  font-weight: 500;
  font-size: 11.5px;
  color: var(--limestone-dim);
}

.langbtn[aria-pressed="true"] {
  background: var(--limestone);
  color: var(--ink);
  border-color: var(--limestone);
}

.langbtn[aria-pressed="true"] .en {
  color: var(--ink-soft);
}

.title-actions {
  display: grid;
  gap: 10px;
}

.title-foot {
  display: grid;
  gap: 10px;
  justify-items: start;
}

.fineprint {
  margin: 0;
  font: 400 11px/1.55 var(--sans);
  color: #978f7e;
  word-break: keep-all;
}

.notice {
  margin: 0;
  padding: 0.6em 0.8em;
  border-radius: 8px;
  background: rgba(201, 138, 31, 0.18);
  border: 1px solid rgba(201, 138, 31, 0.45);
  color: var(--limestone);
  font: 500 var(--fs-small) / 1.5 var(--sans);
}

/* Route select */

.routes-page {
  gap: 14px;
  padding-top: calc(var(--safe-top) + var(--header-h) + 12px);
  background: linear-gradient(180deg, rgba(16, 15, 13, 0.35), rgba(16, 15, 13, 0.75) 40%, rgba(16, 15, 13, 0.9));
}

.routes-prompt {
  margin: 4px 0 2px;
  font: 700 calc(23px * var(--text-scale)) / 1.4 var(--serif);
  color: var(--light-core);
  word-break: keep-all;
}

.routes-prompt .en {
  font-weight: 400;
  font-size: 0.68em;
  color: var(--limestone);
}

.routes-list {
  display: grid;
  gap: 14px;
}

.routecard {
  position: relative;
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 26px 18px 18px;
  border-radius: 8px;
  text-align: left;
  color: var(--ink);
  background-color: var(--papyrus);
  background-image: var(--paper-grain), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus) 55%, var(--papyrus-lo));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 10px 26px rgba(0, 0, 0, 0.45);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.routecard:hover {
  transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 14px 30px rgba(0, 0, 0, 0.5);
}

.routecard:active {
  transform: translateY(1px);
}

.routecard .plate {
  transform: translateY(-50%);
}

.routecard__title {
  display: block;
  font: 700 calc(19px * var(--text-scale)) / 1.4 var(--serif);
  word-break: keep-all;
}

.routecard__title .en {
  font-weight: 400;
  font-size: 0.82em;
  color: var(--ink-soft);
}

.routecard__tag {
  display: block;
  margin-top: 6px;
  font: 500 13.5px/1.45 var(--sans);
  color: var(--ink-soft);
}

.routecard__tag .en {
  font-weight: 400;
  font-size: 0.92em;
}

.routecard__first {
  display: block;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--rule);
  font: italic 400 calc(15px * var(--text-scale)) / 1.6 var(--serif);
  color: #382c20;
  word-break: keep-all;
}

.routecard__first .en {
  font-size: 0.9em;
  color: var(--ink-soft);
}

.routecard--missing {
  opacity: 0.55;
}

/* The protagonist on the card: a band between the tagline and the divider above the first line,
   as wide as the text and the divider. A bust stands on the divider toward the right, its lower part
   cropped by the divider (the top 60% shows: head, shoulders and what he carries); a soft wash in the
   character's color sits behind it. Asher lies across the band and rests on the divider. The band
   never overlaps the text. ui.js sets --band-min (the smallest bust band) so the busts match in size. */
.routecard__art {
  position: relative;
  display: block;
  height: 96px;
  margin: 8px 0 0;
  overflow: hidden;
  pointer-events: none;
  /* Figures size against the band itself (cqw/cqh), so a tall band never makes them wider than it. */
  container-type: size;
}

.routecard__art + .routecard__first {
  margin-top: 0;
}

.routecard__wash {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 32% 95% at 72% 100%, var(--wash, transparent), transparent 75%);
  opacity: 0.8;
  transition: opacity 0.3s ease;
}

.routecard__fig {
  position: absolute;
  right: 9%;
  bottom: 0;
  height: 166.7%;
  aspect-ratio: 2 / 3;
  transform: translateY(40%);
  transition: transform 0.3s var(--ease-out);
}

@supports (height: 1cqh) {
  .routecard__fig {
    height: min(calc(var(--band-min, 100cqh) * 1.667), 90cqw);
  }
}

.routecard__svg {
  position: absolute;
  inset: 0;
}

.routecard__svg svg {
  display: block;
  width: 100%;
  height: 100%;
}

/* Asher lies across the band, seen from above: his lying bust turned a quarter to the right inside a
   wide box, head on the pillow toward the right, the body along the divider, the blanket resting on it.
   The drawing fills the box from about 11% below its top to its bottom edge, and the pillow ends about
   13% short of the box's right edge, so a box of 110% of the band fits it whole. The bust's straight
   bottom cut (now at the left end) fades out. */
.routecard__art--lying .routecard__wash {
  background: radial-gradient(ellipse 40% 95% at 62% 100%, var(--wash, transparent), transparent 75%);
}

.routecard__art--lying .routecard__fig {
  right: 8%;
  height: 110%;
  aspect-ratio: 3 / 2;
  transform: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 6%, #000 34%);
  mask-image: linear-gradient(90deg, transparent 6%, #000 34%);
}

@supports (height: 1cqh) {
  .routecard__art--lying .routecard__fig {
    height: min(110cqh, 44cqw);
  }
}

.routecard__art--lying .routecard__svg {
  inset: auto;
  left: 50%;
  top: 50%;
  width: 66.667%;
  height: 150%;
  transform: translate(-50%, -50%) rotate(100deg);
}

.routecard:hover .routecard__wash,
.routecard:focus-visible .routecard__wash {
  opacity: 1;
}

.routecard:hover .routecard__fig,
.routecard:focus-visible .routecard__fig {
  transform: translateY(calc(40% - 6px));
}

.routecard:hover .routecard__art--lying .routecard__fig,
.routecard:focus-visible .routecard__art--lying .routecard__fig {
  transform: translateY(-6px);
}

/* No lift without motion: reduced motion and the ?test=1 mode keep the figure still. */
@media (prefers-reduced-motion: reduce) {
  .routecard:hover .routecard__fig,
  .routecard:focus-visible .routecard__fig {
    transform: translateY(40%);
  }
  .routecard:hover .routecard__art--lying .routecard__fig,
  .routecard:focus-visible .routecard__art--lying .routecard__fig {
    transform: none;
  }
}

html.is-test .routecard:hover .routecard__fig,
html.is-test .routecard:focus-visible .routecard__fig {
  transform: translateY(40%);
}

html.is-test .routecard:hover .routecard__art--lying .routecard__fig,
html.is-test .routecard:focus-visible .routecard__art--lying .routecard__fig {
  transform: none;
}

/* Gallery: rows = characters, columns = the three lenses plus the "cut" column (SPEC 4.5).
   Phone: four equal columns; each character's name runs across the row above its four cells.
   Wider layouts (tablet portrait, TV) add a name column on the left. */

.gallery-page {
  gap: 16px;
  padding-top: calc(var(--safe-top) + var(--header-h) + 12px);
  background: rgba(22, 20, 17, 0.94);
}

.gallery-head {
  display: grid;
  gap: 10px;
}

.gallery-title {
  margin: 0;
  font: 700 calc(26px * var(--text-scale)) / 1.3 var(--serif);
  color: var(--light-core);
}

.gallery-title .en {
  display: inline;
  font-weight: 400;
  font-size: 0.62em;
  color: var(--limestone-dim);
  margin-left: 0.5em;
}

.gallery-intro {
  margin: 0;
  font: 400 13px/1.55 var(--sans);
  color: var(--limestone-dim);
  word-break: keep-all;
}

.grid-wrap {
  min-width: 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
}

.grid__corner {
  display: none;
}

.grid__lens {
  align-self: end;
  padding: 4px 2px 2px;
  text-align: center;
  font: 600 13px/1.3 var(--sans);
  color: var(--amber-soft);
  word-break: keep-all;
}

.grid__lens .en {
  font-weight: 500;
  font-size: 11px;
  color: var(--limestone-dim);
}

.grid__label {
  display: block;
}

/* Narrow columns: balanced lines instead of a lone last word. */
.grid__lens,
.grid__desc,
.cell {
  text-wrap: balance;
}

/* The cut column reads as a different kind of column: muted heading, a short note under it. */
.grid__lens--cut {
  color: var(--limestone);
}

.grid__mark {
  color: var(--limestone-dim);
}

.grid__desc {
  display: block;
  margin-top: 3px;
  font: 400 11px/1.35 var(--sans);
  color: var(--limestone-dim);
}

.grid__desc .en {
  font-size: 10.5px;
  opacity: 0.9;
}

.grid__row {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  padding: 0 2px;
  font: 600 13px/1.3 var(--sans);
  color: var(--limestone);
  word-break: keep-all;
}

.grid__name .en {
  display: inline;
  margin-left: 0.5em;
  font-weight: 500;
  font-size: 11px;
  color: var(--limestone-dim);
}

.grid__swatch {
  flex: none;
  display: block;
  width: 18px;
  height: 4px;
  border-radius: 2px;
  background: var(--plate, var(--basalt-3));
}

.cell {
  position: relative;
  min-height: 84px;
  padding: 9px 5px;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  font: 700 calc(13px * var(--text-scale)) / 1.4 var(--serif);
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.cell .en {
  margin-top: 4px;
  font-weight: 400;
  font-size: 0.82em;
  line-height: 1.35;
}

.cell[data-state="seen"] {
  color: var(--ink);
  background-color: var(--papyrus);
  background-image: var(--paper-grain), linear-gradient(180deg, var(--papyrus-hi), var(--papyrus-lo));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

.cell[data-state="seen"] .en {
  color: var(--ink-soft);
}

.cell[data-state="locked"],
.cell[data-state="none"] {
  color: #8a8376;
  background: rgba(58, 54, 49, 0.45);
  border: 1px dashed rgba(235, 227, 207, 0.2);
  font: 500 12.5px/1.3 var(--sans);
}

/* Asher's cut cell: a note, not an ending. No paper, no frame of an ending; an italic remark. */
.cell[data-state="note"] {
  color: var(--limestone);
  background: transparent;
  border: 1px dotted rgba(235, 227, 207, 0.38);
  font: italic 400 calc(12.5px * var(--text-scale)) / 1.45 var(--serif);
}

.cell[data-state="note"] .en {
  color: var(--limestone-dim);
  font-style: italic;
}

.cell[data-current="true"] {
  box-shadow: 0 0 0 2px var(--light), 0 0 22px rgba(255, 232, 172, 0.45);
}

.cell__yours {
  display: block;
  margin-top: 6px;
  font: 600 10.5px/1.2 var(--sans);
  color: #6f4b0c;
}

.gallery-actions {
  display: grid;
  gap: 10px;
  margin-top: 6px;
}

/* ------------------------------------------------------------------ settings + modal */

.settings {
  position: absolute;
  z-index: 60;
  top: calc(var(--safe-top) + var(--header-h) + 4px);
  right: var(--gutter-r);
  width: min(300px, calc(100% - var(--gutter-l) - var(--gutter-r)));
  padding: 16px;
  border-radius: 10px;
  color: var(--ink);
  background-color: var(--papyrus-hi);
  background-image: var(--paper-grain);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
  animation: pop-in 0.25s var(--ease-out) both;
  color-scheme: light;
  font-size: 13.5px;
}

.settings__title {
  margin: 0 0 0.9em;
  font: 700 1.1em/1.3 var(--sans);
}

.settings__group + .settings__group {
  margin-top: 1em;
}

.settings__label {
  display: block;
  margin-bottom: 0.45em;
  font: 500 0.93em/1.3 var(--sans);
  color: var(--ink-soft);
}

.choicerow {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 6px;
}

.chip {
  min-height: 44px;
  padding: 4px 8px;
  border-radius: 8px;
  border: 1px solid rgba(42, 33, 25, 0.25);
  background: rgba(255, 252, 244, 0.6);
  color: var(--ink);
  font: 600 1em/1.2 var(--sans);
}

.chip[aria-pressed="true"] {
  background: var(--basalt-2);
  border-color: var(--basalt-2);
  color: var(--limestone);
}

.chip:disabled {
  opacity: 0.4;
  cursor: default;
}

.settings__close {
  margin-top: 1em;
  width: 100%;
}

.settings .btn--ghost {
  color: var(--ink);
  border-color: rgba(42, 33, 25, 0.3);
  background: transparent;
  font-size: 1em;
}

.modal {
  position: absolute;
  inset: 0;
  z-index: 70;
  display: grid;
  place-items: center;
  padding: 24px var(--gutter-r) 24px var(--gutter-l);
  background: rgba(10, 9, 8, 0.66);
  animation: fade-in 0.2s ease both;
}

.dialog {
  width: min(360px, 100%);
  padding: 22px 20px 18px;
  border-radius: 12px;
  color: var(--ink);
  background-color: var(--papyrus-hi);
  background-image: var(--paper-grain);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  color-scheme: light;
  font-size: 14px;
}

.dialog__title {
  margin: 0 0 0.45em;
  font: 700 1.3em/1.4 var(--serif);
  word-break: keep-all;
}

.dialog__title .en,
.dialog__body .en {
  font-weight: 400;
  font-size: 0.86em;
  color: var(--ink-soft);
}

.dialog__body {
  margin: 0 0 1.1em;
  font: 400 1em/1.6 var(--sans);
  color: var(--ink-soft);
  word-break: keep-all;
}

.dialog__actions {
  display: grid;
  gap: 8px;
}

.dialog .btn {
  font-size: 1.1em;
}

.dialog .btn--primary {
  background: var(--basalt-2);
  color: var(--limestone);
  box-shadow: none;
}

.dialog .btn--ghost {
  color: var(--ink);
  border-color: rgba(42, 33, 25, 0.3);
  background: transparent;
}

/* ------------------------------------------------------------------ debug (developer only) */

.debug {
  position: absolute;
  z-index: 80;
  left: 6px;
  bottom: calc(var(--safe-bottom) + 6px);
  max-width: min(calc(100% - 12px), 720px);
  max-height: 55%;
  overflow: auto;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.84);
  color: #d8f0d0;
  font: 11px/1.45 var(--mono);
}

.debug.is-min {
  max-height: none;
  padding: 0;
  background: none;
}

.debug button,
.debug select {
  font: 11px var(--mono);
  min-height: 30px;
  padding: 2px 8px;
  margin: 2px 2px 2px 0;
  border-radius: 4px;
  border: 1px solid #4b6b45;
  background: #142212;
  color: #d8f0d0;
}

.debug pre {
  margin: 4px 0;
  white-space: pre-wrap;
  word-break: break-all;
}

.noscript {
  position: absolute;
  inset: auto 16px 40% 16px;
  text-align: center;
  color: var(--limestone);
}

/* ------------------------------------------------------------------ tablets in portrait */

@media (min-width: 700px) and (orientation: portrait) {
  .app {
    max-width: 760px;
  }
  .grid {
    grid-template-columns: 112px repeat(4, minmax(0, 1fr));
    gap: 8px;
  }
  .grid__corner {
    display: block;
  }
  .grid__row {
    grid-column: auto;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    margin-top: 0;
    font-size: 15px;
  }
  .grid__name .en {
    display: block;
    margin-left: 0;
    font-size: 12.5px;
  }
  .cell {
    min-height: 104px;
    font-size: calc(15px * var(--text-scale));
  }
  :root {
    --fs-story: 21px;
    --fs-story-en: 18.5px;
    --fs-verse: 22px;
    --fs-verse-en: 19px;
    --fs-name: 16px;
    --fs-prompt: 19px;
    --fs-prompt-en: 16.5px;
    --fs-option: 19px;
    --fs-option-en: 16.5px;
    --fs-small: 15px;
    --fs-small-en: 14px;
    --fs-pin: 17px;
    --fs-echo: 21px;
    --fs-last: 30px;
    --fs-card-title: 38px;
    --panel-pad: 26px 28px 30px;
    --badge: 32px;
  }
}

@media (min-width: 600px) {
  .app {
    box-shadow: 0 0 0 1px rgba(235, 227, 207, 0.06), 0 30px 80px rgba(0, 0, 0, 0.55);
  }
}

/* ------------------------------------------------------------------ TV and laptop landscape (16:9 first)
   Sized in vh so 720p, 1080p and 4K read the same from 3-5 m away. Reference values at 1080p:
   story 40px, names 32px, options 35px, smallest text 24px. */

@media (min-aspect-ratio: 5/4) and (min-width: 960px) and (min-height: 540px) {
  :root {
    --fs-story: 3.7vh;
    --fs-story-en: 3.2vh;
    --fs-verse: 3.9vh;
    --fs-verse-en: 3.3vh;
    --fs-name: 3vh;
    --fs-prompt: 3.4vh;
    --fs-prompt-en: 3vh;
    --fs-option: 3.2vh;
    --fs-option-en: 3vh;
    --fs-small: 2.4vh;
    --fs-small-en: 2.25vh;
    --fs-ui: 3vh;
    --fs-ui-en: 2.3vh;
    --fs-reply: 3vh;
    --fs-pin: 2.9vh;
    --fs-echo: 3.6vh;
    --fs-last: 5.6vh;
    --fs-card-num: 10vh;
    --fs-card-lens: 3.4vh;
    --fs-card-title: 7.4vh;
    --fs-action: 3vh;
    --fs-press: 3.6vh;
    --fs-hdr: 2.3vh;

    --lh-story: 1.5;
    --panel-w: min(130vh, 92vw);
    --panel-min-h: 25vh;
    --panel-pad: 3.8vh 4.6vh 4vh;
    --panel-radius: 1vh;
    --dock-gap: 1.6vh;
    --badge: 4.6vh;
    --hdr-btn: max(44px, 5.6vh);
    --header-h: 8vh;
    --focus-w: 0.55vh;
    --gutter-l: max(3vw, env(safe-area-inset-left, 0px));
    --gutter-r: max(3vw, env(safe-area-inset-right, 0px));
  }

  .app {
    max-width: none;
    box-shadow: none;
  }

  /* Busts stand over the outer ends of the centred panel (left and right thirds),
     leaving the middle of the stage to the light. */
  .cast {
    --cast-h: 58vh;
    --cast-x: max(1vw, calc((100vw - var(--panel-w)) / 2 - 1vw));
    --cast-sink: 6vh;
  }

  /* A focus ring that reads from across the room: light ring with a dark halo. */
  :focus-visible {
    outline: var(--focus-w) solid var(--focus-light);
    outline-offset: 0.35vh;
    box-shadow: 0 0 0 1.1vh rgba(16, 15, 13, 0.75);
  }

  .topbar {
    gap: 1vh;
    padding: calc(var(--safe-top) + 2vh) var(--gutter-r) 1vh var(--gutter-l);
    opacity: 0.6;
  }

  .topbar:hover,
  .topbar:focus-within {
    opacity: 1;
  }

  body.is-idle .topbar {
    opacity: 0.18;
  }

  .caption {
    top: calc(var(--safe-top) + 2vh + var(--hdr-btn) + 1.6vh);
    border-radius: 0.8vh;
  }

  .echo {
    top: calc(var(--safe-top) + 22vh);
    left: 50%;
    right: auto;
    width: min(76vw, 130vh);
    transform: translateX(-50%);
    border-radius: 1vh;
  }

  .pin {
    top: calc(var(--safe-top) + 12vh);
    right: var(--gutter-r);
    width: min(36vw, 64vh);
  }

  .dock {
    padding-bottom: calc(var(--safe-bottom) + 4vh);
  }

  .plate {
    left: 1.2em;
  }

  .more {
    right: 1.2em;
  }

  .text .en {
    margin-top: 0.45em;
  }

  .play--sign .panel {
    max-width: min(110vh, 80vw);
    padding: 2.4vh 4vh;
    border-radius: 1.2vh;
  }

  .play--last .panel {
    max-width: min(150vh, 86vw);
    align-self: center;
  }

  /* Choices: a compact 2x2 grid of large numbered buttons that leaves the top of the scene
     visible (about half the screen at 1080p for typical options); long options that would
     overflow stack in full-width rows. */
  .choices {
    width: min(168vh, 95vw);
    max-height: 66vh;
    align-self: center;
    padding: 1.8vh 2.4vh 2vh;
    border-radius: 1vh;
  }

  .choices__prompt {
    margin: 0 0.3vh 1.1vh;
    line-height: 1.3;
  }

  .choices__prompt .en {
    display: inline;
  }

  .choices__prompt .en::before {
    content: "  \00B7  ";
    color: var(--ink-faint);
  }

  .choices__list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.1vh;
  }

  .choices.is-stacked .choices__list {
    grid-template-columns: minmax(0, 1fr);
    gap: 1.2vh;
  }

  .choices.is-stacked .opt {
    min-height: 0;
    padding-top: 1.5vh;
    padding-bottom: 1.6vh;
  }

  .opt {
    min-height: 0;
    padding: 1.3vh 2vh 1.4vh 1.4vh;
    border-radius: 1vh;
    gap: 1.4vh;
    line-height: 1.32;
  }

  .opt .en {
    margin-top: 0.1em;
  }

  .opt__num {
    margin-top: 0;
    align-self: start;
  }

  .pressbox {
    gap: 1.6vh;
  }

  .glow {
    min-height: 9vh;
    padding: 1.6vh 6vh;
  }

  /* Asher's gray actions hang from the panel's bottom-left edge, out of the flow, so the
     panel keeps its usual place. During the lit press they return as a large centred row. */
  .actions {
    position: absolute;
    left: calc(var(--gutter-l) + 2.6vh);
    bottom: calc(var(--safe-bottom) + 4vh - max(22px, 3vh));
    z-index: 2;
    gap: 1.2vh;
  }

  .act {
    flex: 0 0 auto;
    min-width: 17vh;
    min-height: max(44px, 6vh);
    padding: 0.5vh 2vh;
    border-radius: 0.9vh;
    font-size: 2.6vh;
    background: rgba(46, 43, 39, 0.94);
    box-shadow: 0 0.6vh 1.6vh rgba(0, 0, 0, 0.35);
  }

  .act .en {
    display: inline;
    margin-left: 0.5em;
    font-size: 0.86em;
  }

  .play--press .actions {
    position: static;
    width: var(--panel-w);
    align-self: center;
    gap: 1.6vh;
  }

  .play--press .act {
    flex: 1 1 0;
    min-height: 9vh;
    font-size: 3vh;
  }

  .play--press .act .en {
    display: block;
    margin-left: 0;
  }

  .play--press .act.glow {
    font-size: var(--fs-press);
  }

  .reply {
    align-self: center;
    max-width: min(110vh, 80vw);
    padding: 1vh 2vh;
    border-radius: 1vh;
  }

  .card {
    inset: 10vh 6vw 8vh;
  }

  /* Page screens fill 16:9 instead of stacking like a phone. */
  .page {
    padding: calc(var(--safe-top) + 6vh) 6vw calc(var(--safe-bottom) + 5vh);
  }

  .btn {
    min-height: 8.5vh;
    border-radius: 1.2vh;
  }

  .btn__sub {
    font-size: var(--fs-small-en);
  }

  .btn--text {
    min-height: max(44px, 6vh);
  }

  .title-page {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    column-gap: 6vw;
    align-items: end;
    background: linear-gradient(90deg, rgba(16, 15, 13, 0.82) 0%, rgba(16, 15, 13, 0.45) 45%, rgba(16, 15, 13, 0.82) 100%), linear-gradient(180deg, rgba(16, 15, 13, 0) 40%, rgba(16, 15, 13, 0.6) 100%);
  }

  .title-head {
    margin: 0;
    padding: 0 0 4vh;
    align-self: center;
  }

  .title-side {
    gap: 3vh;
    align-self: center;
  }

  .title-sub {
    margin-bottom: 3vh;
    font-size: 2.8vh;
  }

  .title-sub .en {
    font-size: 2.4vh;
  }

  .title-main {
    font-size: 13.5vh;
  }

  .title-en {
    font-size: 5vh;
  }

  .title-disclaimer {
    font-size: 2.4vh;
  }

  .title-disclaimer .en {
    font-size: 2.25vh;
  }

  .langpick__label {
    font-size: 2.4vh;
    margin-bottom: 1.2vh;
  }

  .langpick__row {
    gap: 1.2vh;
  }

  .langbtn {
    min-height: 8.5vh;
    border-radius: 1.2vh;
    font-size: 2.9vh;
  }

  .langbtn .en {
    font-size: 2.25vh;
  }

  .title-actions {
    gap: 1.4vh;
  }

  .title-foot {
    gap: 1.2vh;
  }

  .fineprint {
    font-size: 2.2vh;
    line-height: 1.45;
  }

  .notice {
    border-radius: 1vh;
  }

  .routes-page {
    gap: 3vh;
    padding-top: calc(var(--safe-top) + 12vh);
    background: linear-gradient(180deg, rgba(16, 15, 13, 0.55), rgba(16, 15, 13, 0.82) 45%, rgba(16, 15, 13, 0.92));
  }

  .routes-prompt {
    margin: 0;
    font-size: calc(4.8vh * var(--text-scale));
  }

  .routes-list {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 2.4vw;
    flex: 1;
    align-items: stretch;
  }

  .routecard {
    margin-top: 2vh;
    padding: 6vh 2.4vw 3.4vh;
    border-radius: 1.2vh;
    display: flex;
    flex-direction: column;
  }

  .routecard .plate {
    left: 2.4vw;
    max-width: calc(100% - 4.8vw);
    white-space: normal;
    line-height: 1.2;
  }

  .routecard .plate__en--stack {
    display: block;
    font-size: 0.82em;
  }

  .routecard .plate__en--stack::before {
    content: none;
  }

  .routecard__title {
    font-size: calc(3.6vh * var(--text-scale));
  }

  .routecard__tag {
    margin-top: 1.4vh;
    font-size: 2.6vh;
  }

  .routecard__first {
    margin-top: auto;
    padding-top: 2.2vh;
    font-size: calc(2.75vh * var(--text-scale));
    line-height: 1.5;
  }

  /* The portrait band takes the free height between the tagline and the first line. */
  .routecard__art {
    flex: 1 1 0;
    height: auto;
    min-height: 9vh;
    margin: 1.4vh 0 0;
  }

  .routecard__fig {
    height: min(166.7%, 42vh);
  }

  .routecard__art--lying .routecard__fig {
    height: min(110%, 26vh);
  }

  @supports (height: 1cqh) {

  .gallery-page {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "head actions"
      "grid grid";
    align-content: start;
    column-gap: 3vw;
    row-gap: 2.6vh;
    padding: calc(var(--safe-top) + 9vh) 4vw calc(var(--safe-bottom) + 3vh);
  }

  .gallery-head {
    grid-area: head;
    gap: 1vh;
    align-self: center;
  }

  .gallery-title {
    font-size: calc(4.4vh * var(--text-scale));
  }

  .gallery-intro {
    font-size: 2.3vh;
    line-height: 1.45;
  }

  .grid-wrap {
    grid-area: grid;
  }

  .grid {
    grid-template-columns: 10vw repeat(4, minmax(0, 1fr));
    gap: 1.2vh;
  }

  .grid__corner {
    display: block;
  }

  .grid__lens {
    font-size: 2.8vh;
    padding: 0.4vh 0.5vw 0.6vh;
  }

  .grid__lens .en {
    font-size: 2.25vh;
  }

  .grid__desc {
    margin-top: 0.5vh;
    font-size: 2.2vh;
  }

  .grid__desc .en {
    font-size: 2.2vh;
  }

  .grid__row {
    grid-column: auto;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 1vh;
    margin-top: 0;
    padding: 0 0.4vw;
    font-size: 2.8vh;
  }

  .grid__name .en {
    display: block;
    margin-left: 0;
    font-size: 2.25vh;
  }

  .grid__swatch {
    width: 4vh;
    height: 0.6vh;
  }

  .cell {
    min-height: 11vh;
    padding: 1.2vh 1vw;
    border-radius: 1vh;
    font-size: calc(2.7vh * var(--text-scale));
  }

  .cell .en {
    font-size: calc(2.25vh * var(--text-scale));
  }

  .cell[data-state="locked"],
  .cell[data-state="none"] {
    font-size: 2.4vh;
  }

  .cell[data-state="note"] {
    font-size: calc(2.45vh * var(--text-scale));
  }

  .cell[data-state="note"] .en {
    font-size: calc(2.2vh * var(--text-scale));
  }

  .cell__yours {
    font-size: 2.2vh;
    margin-top: 0.6vh;
  }

  .gallery-actions {
    grid-area: actions;
    align-self: center;
    grid-template-columns: repeat(2, minmax(0, 24vw));
    gap: 1.4vw;
    margin-top: 0;
  }

  .gallery-actions .btn {
    min-height: 7vh;
  }

  .settings {
    top: calc(var(--safe-top) + 2vh + var(--hdr-btn) + 1.4vh);
    width: min(46vh, 60vw);
    padding: 2.6vh;
    border-radius: 1.2vh;
    font-size: 2.4vh;
  }

  .chip {
    min-height: 6.5vh;
    border-radius: 1vh;
  }

  .dialog {
    width: min(76vh, 90vw);
    padding: 4vh 4vh 3.4vh;
    border-radius: 1.6vh;
    font-size: 2.6vh;
  }

  .dialog__actions {
    grid-template-columns: 1fr 1fr;
    gap: 1.6vh;
  }

  .debug {
    font-size: 12px;
  }
}

/* Short landscape phones and small windows: keep the phone layout readable. */
@media (max-height: 640px) and (orientation: portrait) {
  .title-head {
    padding-top: 6vh;
  }
  .title-main {
    font-size: clamp(38px, 11vw, 52px);
  }
  :root {
    --panel-min-h: 112px;
  }
}

/* ------------------------------------------------------------------ motion preferences */

/* Reduced motion: no typewriter (main.js), no shake, no sway or pulse; only short opacity
   fades remain. Transitions are switched off everywhere first, so no property (such as
   font-style) ever animates by accident, then the few intended fades are restored. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0s !important;
    animation-iteration-count: 1 !important;
    animation-delay: 0s !important;
    transition: none !important;
  }
  .art__layer,
  .reply,
  .cast,
  .figure,
  .light,
  .light::after,
  .caption,
  .topbar {
    transition: opacity 150ms ease !important;
  }
  .stage[data-pov="lying"] .art__sway,
  .light[data-level="bright"],
  .stage.is-rising .art {
    animation: none !important;
  }
  .echo mark {
    background-size: 100% 100%;
  }
}

/* ?test=1: no transitions and no animation time at all, so every screen settles at once. */
html.is-test *,
html.is-test *::before,
html.is-test *::after {
  transition: none !important;
  animation-duration: 0s !important;
  animation-delay: 0s !important;
  animation-iteration-count: 1 !important;
}

html.is-test .echo mark {
  background-size: 100% 100%;
}

    confirmHomeYes: T("처음 화면으로", "Go to title"),
    confirmNo: T("계속하기", "Keep playing"),

    // Play
    advance: T("다음", "Next"),
    tapHint: T("화면을 누르면 넘어가요", "Tap to continue"),
    readReceipt: T("읽음 ✓", "Read ✓"),
    pressDefault: T("누르기", "Tap"),
    choiceGroup: T("선택", "Choice"),
    actionsGroup: T("할 수 있는 일", "Things you can try"),
    pinnedThought: T("속생각", "Unspoken thought"),

    // Ending
    endingCardHint: T("눌러서 계속", "Tap to continue"),

    // Gallery
    galleryTitle: T("엔딩 모음", "Endings"),
    galleryIntro: T("세로는 인물, 가로는 세 가지 눈과 중간에 끝난 길이에요. 이 기기에서 본 엔딩만 보여요.", "Rows are characters; columns are the three lenses and the path cut short. Only endings seen on this device appear."),
    galleryLocked: T("아직", "Not yet"),
    galleryCut: T("중간에 끝남", "Cut short"),
    galleryYours: T("방금 본 엔딩", "Just now"),
    galleryReplay: T("다른 인물로 하기", "Play another character"),
    galleryHome: T("처음 화면", "Title screen"),

    // Route select
    routeSelectHint: T("인물을 누르면 시작해요", "Tap a character to begin"),

    // Errors and notices
    storageOff: T("이 기기에서는 저장이 꺼져 있어요. 그래도 끝까지 할 수 있어요.", "Saving is off on this device. You can still play to the end."),
    resumeFailed: T("저장된 곳을 불러오지 못했어요. 처음부터 시작해 주세요.", "Your saved place couldn't be loaded. Please start again."),
    routeMissing: T("이 인물의 이야기는 아직 준비 중이에요.", "This character's story isn't ready yet."),
    noscript: T("이 게임은 자바스크립트가 필요해요.", "This game needs JavaScript."),

    // Debug panel (?debug=1)
    debugTitle: T("디버그", "Debug"),
    debugJump: T("이동", "Jump"),
    debugAutoPick: T("자동 선택", "Auto-pick"),
    debugAutoPlay: T("끝까지 자동", "Auto-play to end"),
    debugRoute: T("루트", "Route"),
    debugBeat: T("위치", "Beat"),
    debugChoices: T("선택", "Choices"),
    debugScores: T("점수", "Scores"),
    debugFlags: T("플래그", "Flags"),
    debugVars: T("변수", "Vars"),
    debugHide: T("숨기기", "Hide")
  };
})();

</script>
<script>/* data/routes/scribe.js */
/* Scribe route: Menahem, "The Line I Read This Morning". Owner: scribe writer.
   Short version (docs/SPEC-v3-short.md, which overrides docs/SPEC.md on choice counts,
   endings, balance and screen budget). Schema: docs/SPEC.md section 4.5.
   Shape: dawn (c1) -> the lane -> the crowd, fixed sequence of SPEC 6.4 (c2, c3) -> c4 (double).
   c2 option d is the cut option: Menahem leaves before the answer and endings.cut plays.
   Every player-facing string is a T object { ko, en }. Scripture appears only as verse beats
   or {{v:KEY}} / {{r:KEY}} tokens. Jesus speaks only through scripture keys. */
(function () {
  var BHS = (window.BHS = window.BHS || {});
  BHS.routes = BHS.routes || {};

  // Highlight map for the Psalm 103:3 echo, keyed by the flag set at c1.
  // Returns a fresh object each time so no two beats share a reference.
  function underlineHighlight() {
    return {
      flag: "underline",
      map: {
        subject: { ko: ["그가"], en: ["who"] },
        order: { ko: ["사하시며", "고치시며"], en: ["forgives", "heals"] },
        sick: { ko: ["병"], en: ["diseases"] },
        whole: "*"
      }
    };
  }

  // Pins his unspoken thought (Matt 9:3) and his c2 pick. Placed first in each non-cut c2
  // reaction so the bubble is seen unread for one screen before the read receipt at 9:4.
  function pinThought() {
    return { type: "fx", fx: "pinThought", items: ["verse:MT_9_3Q", "choice:c2"] };
  }

  BHS.routes.scribe = {
    id: "scribe",
    actions: [],

    beats: [
      // ---------------------------------------------------------------
      // DAWN: Menahem's room, Psalm 103:3 with Hanan (c1 sets the noted word)
      // ---------------------------------------------------------------
      { id: "dawn", type: "scene", bg: "dawn_lamp", caption: { ko: "새벽 · 므나헴의 방", en: "Dawn · Menahem's room" } },
      // He writes in his notes, never on the scroll (lead decision).
      { type: "line", text: { ko: "등잔불 아래, 므나헴이 잉크 묻은 손으로 시편 두루마리를 편다. 맞은편엔 제자 하난, 곁에는 기록장.", en: "By lamplight, Menahem unrolls the Psalms with ink-stained fingers. Across from him, his student Hanan. Beside him, his notes." } },
      { type: "verse", key: "PS_103_3" },
      { type: "line", speaker: "hanan", text: { ko: "선생님, 누가 용서하시고, 누가 고치시는 거예요?", en: "Teacher, who forgives? And who heals?" } },
      {
        type: "choice",
        id: "c1",
        prompt: { ko: "무엇부터 짚어 줄까?", en: "Where to begin?" },
        options: [
          {
            id: "a",
            lens: 1,
            set: { underline: "subject" },
            text: { ko: "“주님이시다. 주어를 분명히 해라.”", en: "“The Lord. Be clear about the subject.”" },
            reaction: [
              { type: "line", text: { ko: "므나헴은 ‘그가’라는 첫 낱말을 기록장에 옮겨 적는다.", en: "Menahem copies the first word, *who*, into his notes." } }
            ]
          },
          {
            id: "b",
            lens: 2,
            set: { underline: "order" },
            text: { ko: "“용서가 먼저, 치유가 그다음에 나오는구나.”", en: "“So forgiving is named first, and healing after.”" },
            reaction: [
              { type: "line", text: { ko: "므나헴은 기록장에 ‘사하시며’와 ‘고치시며’를 나란히 적고, 그 사이에 작은 점을 찍는다.", en: "In his notes, Menahem writes *forgives* and *heals* side by side, with a small dot between them." } }
            ]
          },
          {
            id: "c",
            lens: 3,
            set: { underline: "sick" },
            text: { ko: "“아픈 사람에게 이 구절은 어떻게 들릴까.”", en: "“I wonder how this line sounds to someone who is sick.”" },
            reaction: [
              { type: "line", text: { ko: "므나헴은 ‘병’이라는 말을 기록장에 적는다.", en: "Menahem writes the word *diseases* in his notes." } }
            ]
          },
          {
            id: "d",
            lens: 2,
            set: { underline: "whole" },
            text: { ko: "“설명하기 전에 시 전체를 읽자.”", en: "“Before I explain, let's read the whole psalm.”" },
            reaction: [
              { type: "line", text: { ko: "므나헴은 아무것도 적지 않고, 두루마리를 시편의 첫 절로 되감는다.", en: "Menahem writes nothing down. He rolls the scroll back to the psalm's first verse." } }
            ]
          }
        ]
      },

      // ---------------------------------------------------------------
      // LATE MORNING: the rumor, the walk down, THE LANE (SPEC 6.3, no choice)
      // They step aside, his eyes meet Asher's, nobody speaks to anybody.
      // ---------------------------------------------------------------
      { id: "lane", type: "scene", bg: "lane", caption: { ko: "늦은 아침 · 골목", en: "Late morning · The lane" } },
      { type: "line", text: { ko: "예수라는 사람의 배가 돌아온다는 소문에, 므나헴과 하난도 골목을 내려간다. 뒤에서 사람들이 침상 하나를 들고 온다.", en: "Word comes that this Jesus is back by boat. Menahem and Hanan head down the lane. Behind them, some men are carrying a man on a bed." } },
      { type: "line", speaker: "passerby", text: { ko: "고통 뒤에 무슨 사연이 있는지 누가 알겠어. 저 사람은 무슨 잘못을 했기에 저렇게 됐을까.", en: "Who knows what's behind suffering like that. What did he do to end up like that?" } },
      { type: "line", text: { ko: "두 사람은 벽 쪽으로 비켜선다. 므나헴은 침상을 힐끗 보다가, 침상 위의 아셀과 눈이 마주친다. 서로 아무 말이 없다.", en: "They step back against the wall. Menahem glances at the bed, and for a moment his eyes meet Asher's. Neither says a word to the other." } },

      // ---------------------------------------------------------------
      // AROUND NOON: THE CROWD, fixed sequence of SPEC 6.4 (c2 after 9:3, c3 after 9:5, c4 after 9:8)
      // Menahem says nothing aloud the whole time.
      // ---------------------------------------------------------------
      { id: "crowd", type: "scene", bg: "crowd", caption: { ko: "정오 무렵 · 바닷가 공터", en: "Around noon · Open ground by the shore" } },
      { type: "fx", fx: "light", level: "soft" },
      { type: "verse", key: "MT_9_1" },
      { type: "line", text: { ko: "므나헴은 서기관 몇 사람과 함께 맨 앞에 선다. 골목의 그 침상이 무리 사이로 들어온다.", en: "Menahem stands at the front with a few other scribes. The bed from the lane comes through the crowd." } },
      { type: "verse", key: "MT_9_2A" },

      // The first words: the light rises, the world goes quiet, the morning's psalm returns.
      { id: "first-words", type: "fx", fx: "light", level: "bright" },
      { type: "fx", fx: "hush" },
      { type: "verse", key: "MT_9_2B" },
      // One echo per noted word, so each thought line below is always shown with its echo.
      { when: { flag: "underline", is: "subject" }, type: "fx", fx: "echoVerse", key: "PS_103_3", highlight: underlineHighlight() },
      { when: { flag: "underline", is: "subject" }, type: "line", speaker: "thought", text: { ko: "아침에 기록장에 적은 낱말, ‘그가’. 사하시는 분은 주님이시다.", en: "The word in my notes from this morning: *who*. The one who forgives is the Lord." } },
      { when: { flag: "underline", is: "order" }, type: "fx", fx: "echoVerse", key: "PS_103_3", highlight: underlineHighlight() },
      { when: { flag: "underline", is: "order" }, type: "line", speaker: "thought", text: { ko: "아침에 기록장에 찍어 둔 작은 점. 용서가 먼저, 치유는 그다음.", en: "The little dot in my notes from this morning. Forgiving first, healing after." } },
      { when: { flag: "underline", is: "sick" }, type: "fx", fx: "echoVerse", key: "PS_103_3", highlight: underlineHighlight() },
      { when: { flag: "underline", is: "sick" }, type: "line", speaker: "thought", text: { ko: "아침에 기록장에 적은 ‘병’이라는 말이, 저 침상 위의 사람에게로 번진다.", en: "The word I wrote in my notes this morning, *diseases*, spreads toward the man on the bed." } },
      { when: { flag: "underline", is: "whole" }, type: "fx", fx: "echoVerse", key: "PS_103_3", highlight: underlineHighlight() },
      { when: { flag: "underline", is: "whole" }, type: "line", speaker: "thought", text: { ko: "아침에 처음부터 다시 읽은 시 한 편이, 통째로 겹쳐 온다.", en: "The whole psalm I read from the top this morning comes flooding back." } },
      { type: "fx", fx: "light", level: "soft" },

      // Matt 9:3, shown as Menahem's own unspoken thought.
      { id: "thought-9-3", type: "verse", key: "MT_9_3Q", speaker: "scribes" },
      {
        type: "choice",
        id: "c2",
        prompt: { ko: "므나헴은 속으로만 생각했다. 아무도 듣지 못했다. 그다음엔?", en: "Menahem only thought it. No one heard. What next?" },
        options: [
          {
            id: "a",
            lens: 1,
            text: { ko: "하나님의 용서를 전하는 건가, 자기 권한으로 말하는 건가?", en: "Is he passing on God's forgiveness, or speaking on his own authority?" },
            reaction: [
              pinThought(),
              { type: "line", speaker: "thought", text: { ko: "말만 들어서는 모른다. 말한 사람이 누구냐에 달렸다.", en: "The words alone can't tell me. It depends on who is speaking." } }
            ]
          },
          {
            id: "b",
            lens: 2,
            text: { ko: "왜 고치기 전에 용서부터? 아침의 그 순서처럼.", en: "Why forgiveness before healing? Like the order this morning." },
            reaction: [
              pinThought(),
              // Callback to the dot placed at c1 b.
              { when: { flag: "underline", is: "order" }, type: "line", speaker: "thought", text: { ko: "아침에 두 낱말 사이에 찍은 점. 바로 그 자리다.", en: "The dot I put between those two words this morning. Right there." } },
              { when: { not: { flag: "underline", is: "order" } }, type: "line", speaker: "thought", text: { ko: "아침의 시편도 같은 순서로 말했다.", en: "This morning's psalm said it in the same order." } }
            ]
          },
          {
            id: "c",
            lens: 3,
            text: { ko: "저 사람에게 직접 말하는구나. 아이를 부르듯이.", en: "He's speaking to the man himself—calling him son." },
            reaction: [
              pinThought(),
              // Callback to the lane, where he only looked.
              { type: "line", speaker: "thought", text: { ko: "골목에서 나는 저 사람을 보며 생각만 했다. 예수라는 이 사람은 그에게 직접 말을 건다.", en: "In the lane, all I did was look at that man and think. This Jesus speaks to him directly." } }
            ]
          },
          {
            // CUT (SPEC v3 section 3): after this reaction the engine skips the rest of the
            // beats and plays endings.cut. No lens, no scoring, no mismatch line.
            id: "d",
            lens: null,
            cut: true,
            // A sincere reason, not a quit button: staying to hear blasphemy would feel like taking part in it.
            text: { ko: "신성모독을 듣고 서 있을 수는 없다. 자리를 뜨자.", en: "I can't stand here and listen to blasphemy. I'm leaving." },
            reaction: [
              { type: "line", text: { ko: "므나헴은 몸을 돌려 무리를 빠져나간다. 하난은 머뭇거리다, 그 자리에 남는다.", en: "Menahem turns and makes his way out of the crowd. Hanan hesitates, then stays where he is." } },
              { type: "fx", fx: "light", level: "off" }
            ]
          }
        ]
      },

      // Matt 9:4: the thought no one heard is answered. Read receipt on the pinned bubble.
      { id: "read-receipt", type: "fx", fx: "readReceipt" },
      { type: "verse", key: "MT_9_4N" },
      { type: "verse", key: "MT_9_4Q" },
      { type: "fx", fx: "unpinThought" },

      // Matt 9:5: the question (c3).
      { type: "verse", key: "MT_9_5" },
      {
        type: "choice",
        id: "c3",
        prompt: { ko: "어느 쪽이 쉬울까?", en: "Which is easier?" },
        options: [
          {
            id: "a",
            lens: 1,
            text: { ko: "죄 사함은 증거 없이도 말할 수 있다.", en: "Forgiveness of sins can be announced without any proof." },
            reaction: [
              { type: "line", speaker: "thought", text: { ko: "확인할 길이 없으니까. 말하기는 그쪽이 쉽다.", en: "No one can check it. That one is easier to say." } }
            ]
          },
          {
            id: "b",
            lens: 3,
            text: { ko: "걸으라고 했는데 거짓이면, 침상 위 저 사람이 제일 먼저 다친다.", en: "If he tells him to walk and it isn't true, the man on the bed gets hurt first." },
            reaction: [
              { type: "line", speaker: "thought", text: { ko: "또 한 번의 헛된 기대. 그 무게는 저 사람이 진다.", en: "One more false hope, and he's the one who has to carry it." } }
            ]
          },
          {
            id: "c",
            lens: 2,
            text: { ko: "왜 둘을 묶지? 시편 103편도 둘을 묶었는데.", en: "Why tie the two together? Psalm 103 ties them too." },
            reaction: [
              // Callback: the psalm returns with the word he noted at dawn highlighted.
              { type: "fx", fx: "echoVerse", key: "PS_103_3", highlight: underlineHighlight() },
              { type: "line", speaker: "thought", text: { ko: "아침의 그 한 문장 안에, 둘이 다 들어 있다.", en: "Both are right there, in the one line I read this morning." } }
            ]
          },
          {
            id: "d",
            lens: 3,
            text: { ko: "어느 쪽이든, 침상 위 저 사람에겐 둘 다 필요하다.", en: "Either way, the man on the bed needs both." },
            reaction: [
              { type: "line", speaker: "thought", text: { ko: "다리만 낫거나, 마음만 놓이거나. 어느 쪽도 반쪽이다.", en: "Healed legs and a heavy heart, or the other way around. Either would be half." } }
            ]
          }
        ]
      },

      // Matt 9:6-9:8: the claim, the command, he rises, the crowd.
      { type: "verse", key: "MT_9_6A" },
      { type: "verse", key: "MT_9_6N" },
      { type: "fx", fx: "light", level: "bright" },
      { type: "verse", key: "MT_9_6B" },
      { type: "fx", fx: "light", level: "soft" },
      { type: "verse", key: "MT_9_7" },
      { type: "verse", key: "MT_9_8" },

      // c4 (double weight): the last line of his notes tonight.
      {
        type: "choice",
        id: "c4",
        prompt: { ko: "오늘 밤, 기록장의 마지막 줄에 무엇을 적을까?", en: "Tonight, what goes on the last line of his notes?" },
        options: [
          {
            id: "a",
            lens: 1,
            text: { ko: "“그 주장은 받아들일 수 없다. 신성모독.”", en: "“That claim cannot be accepted. Blasphemy.”" }
          },
          {
            id: "b",
            lens: 2,
            text: { ko: "“말씀은 그대로다. 다만 오늘은 그 말씀을 한 사람이 했다.”", en: "“The Word hasn't changed. Today, a man spoke it.”" }
          },
          {
            id: "c",
            lens: 3,
            text: { ko: "“그는 권한으로 한 사람을 집에 보냈다. 내 권한으로 나는 무엇을 했나.”", en: "“He used his authority to send a man home. What did I do with mine?”" }
          },
          {
            id: "d",
            lens: 1,
            text: { ko: "“결론은 비워 둔다. 내일 다시 가겠다.”", en: "“Conclusion left blank. I will go again tomorrow.”" }
          }
        ]
      },
      // The crowd breaks up; the light leaves with the moment.
      { type: "fx", fx: "light", level: "off" }
    ],

    endingPreface: [],

    // Titles come from data/meta.js (BHS.meta.endings.scribe, including "cut"); none are defined here.
    // Each lens ending: 1-2 short beats + last. The word he noted at dawn returns in every ending.
    endings: {
      // (1) Who? "Who Spoke"
      "1": {
        beats: [
          // Narration names Menahem so that "he" in the last line can only mean Jesus.
          { when: { flag: "underline", is: "subject" }, type: "line", text: { ko: "아침에 적은 ‘그가’는 주님이셨다. 그런데 오늘, 주님만 하실 말을 한 사람이 했다.", en: "This morning, *who* in his notes meant the Lord. Today a man said what only the Lord can say." } },
          { when: { flag: "underline", is: "order" }, type: "line", text: { ko: "아침에 므나헴은 용서와 치유 사이에 점을 찍었다. 오늘은 두 일이 한 사람의 입에서 나왔다.", en: "This morning Menahem put a dot between forgiving and healing. Today both came from one man's mouth." } },
          { when: { flag: "underline", is: "sick" }, type: "line", text: { ko: "아침에 므나헴은 ‘병’이라고 적었다. 오늘 한 사람이 죄를 사하는 권한을 말하고, 병까지 고쳤다.", en: "This morning Menahem wrote *diseases*. Today a man claimed the authority to forgive sins, and healed the disease too." } },
          { when: { flag: "underline", is: "whole" }, type: "line", text: { ko: "아침에 므나헴은 시 전체를 처음부터 읽었다. 그 시가 주님께 돌린 일을, 오늘 한 사람이 했다.", en: "This morning Menahem read the whole psalm from the top. What that psalm credits to the Lord, a man did today." } },
